<style>
:root {
  --bg-deep: #0a0f1a;
  --bg-card: #111827;
  --bg-card-hover: #1a2332;
  --bg-input: #0d1520;
  --border: #1e2a3a;
  --border-focus: #2563eb;
  --text-primary: #e8edf5;
  --text-secondary: #8893a7;
  --text-muted: #4a5568;
  --accent: #2563eb;
  --accent-hover: #3b82f6;
  --accent-subtle: rgba(37, 99, 235, 0.12);
  --success: #10b981;
  --success-bg: rgba(16, 185, 129, 0.12);
  --warning: #f59e0b;
  --warning-bg: rgba(245, 158, 11, 0.12);
  --danger: #ef4444;
  --danger-bg: rgba(239, 68, 68, 0.12);
  --info: #06b6d4;
  --info-bg: rgba(6, 182, 212, 0.12);
  --radius: 10px;
  --radius-sm: 6px;

}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* Layout */
.app-layout { display: flex; min-height: 100vh; }
.sidebar {
  width: 260px; background: var(--bg-card); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0;
  z-index: 50; transition: width 0.25s ease, transform 0.25s ease; overflow: hidden;
}
.sidebar.collapsed { width: 56px; }
.sidebar.collapsed .sidebar-role,
.sidebar.collapsed .nav-label,
.sidebar.collapsed .nav-section,
.sidebar.collapsed .user-details,
.sidebar.collapsed .btn-logout { display: none; }
.sidebar.collapsed .sidebar-logo { font-size: 16px; }
.sidebar.collapsed .nav-item { justify-content: center; padding: 10px 0; }
.sidebar.collapsed .nav-icon { margin: 0; font-size: 19px; }
.sidebar.collapsed .sidebar-header { padding: 14px 8px; align-items: center; justify-content: center; flex-direction: column; gap: 8px; }
.sidebar.collapsed .sidebar-footer { padding: 10px 8px; }
.sidebar.collapsed .user-info { justify-content: center; }
.sidebar-header {
  padding: 20px 20px 16px; border-bottom: 1px solid var(--border);
}
.sidebar-logo {
  font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--accent) 0%, #06b6d4 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.sidebar-role {
  font-size: 11px; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 1.5px; margin-top: 4px;
}
.sidebar-nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
.nav-section {
  font-size: 10px; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 1.5px; padding: 12px 12px 6px; margin-top: 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-radius: var(--radius-sm); color: var(--text-secondary); cursor: pointer;
  font-size: 14px; font-weight: 400; transition: all 0.15s;
  border: 1px solid transparent;
}
.nav-item:hover { background: var(--bg-card-hover); color: var(--text-primary); }
.nav-item.active {

}
.nav-icon { width: 18px; text-align: center; font-size: 15px; flex-shrink: 0; }
.sidebar-footer {
  padding: 16px; border-top: 1px solid var(--border);
}
.user-info { display: flex; align-items: center; gap: 10px; }
.user-avatar {

  background: var(--accent-subtle); display: flex; align-items: center;
  justify-content: center; font-size: 13px; font-weight: 600; color: var(--accent);
}
.user-name { font-size: 13px; font-weight: 500; }
.user-email { font-size: 11px; color: var(--text-muted); }
.btn-logout {

  background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239,68,68,0.2);
  cursor: pointer; font-size: 12px; font-family: inherit; font-weight: 500;
  transition: all 0.15s;
}
.btn-logout:hover { background: rgba(239,68,68,0.2); }

.main-content { flex: 1; margin-left: 260px; padding: 24px 28px; min-height: 100vh; transition: margin-left 0.25s ease; }
.main-content.collapsed { margin-left: 56px; }
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px; gap: 16px; flex-wrap: wrap;
}
.page-title { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
.page-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

/* Cards */
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px;
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.card-title { font-size: 15px; font-weight: 600; }

/* Stats */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px;
  display: flex; flex-direction: column; gap: 6px;
}
.stat-icon {
  width: 36px; height: 36px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; margin-bottom: 4px;
}
.stat-value { font-size: 28px; font-weight: 700; font-family: 'JetBrains Mono', monospace; letter-spacing: -1px; }
.stat-label { font-size: 12px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
.kpi-grid-compact { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi-card-compact { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; min-height: 96px; display: flex; flex-direction: column; justify-content: space-between; }
.kpi-icon { width: 30px; height: 30px; font-size: 14px; margin-bottom: 4px; }
.kpi-value { font-size: clamp(20px, 2.1vw, 28px); font-weight: 800; font-family: 'JetBrains Mono', monospace; letter-spacing: -1px; line-height: 1.05; }

/* Forms */
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
.form-input, .form-select {

}
.form-input:focus, .form-select:focus { border-color: var(--border-focus); }
.form-input::placeholder { color: var(--text-muted); }
.form-select option { background: var(--bg-card); }
.form-input.sm { padding: 7px 10px; font-size: 13px; }

/* Date picker clickable */
.form-input[type="date"], input[type="date"] {

  color-scheme: dark;
  position: relative;
}
.form-input[type="date"]::-webkit-calendar-picker-indicator,
input[type="date"]::-webkit-calendar-picker-indicator {

  opacity: 0.85;
  filter: invert(1);
}
.form-input[type="date"]::-webkit-calendar-picker-indicator:hover,
input[type="date"]::-webkit-calendar-picker-indicator:hover {
  opacity: 1;
}


/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px;
  border-radius: var(--radius-sm); font-family: inherit; font-size: 13px;
  font-weight: 500; cursor: pointer; transition: all 0.15s; border: 1px solid transparent;
  white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: var(--bg-card-hover); color: var(--text-primary); border-color: var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-danger { background: var(--danger-bg); color: var(--danger); border-color: rgba(239,68,68,0.2); }
.btn-danger:hover { background: rgba(239,68,68,0.2); }
.btn-success { background: var(--success-bg); color: var(--success); border-color: rgba(16,185,129,0.2); }
.btn-success:hover { background: rgba(16,185,129,0.2); }
.btn-sm { padding: 6px 10px; font-size: 12px; }
.btn-icon { padding: 6px 8px; }

/* Table */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; padding: 10px 12px; font-size: 11px; font-weight: 600;
  color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
td {
  padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--border);
  color: var(--text-secondary); vertical-align: middle;
}
tr:hover td { background: var(--bg-card-hover); }
td.mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; }

/* Badges */
.badge {
  display: inline-flex; padding: 3px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
}
.badge-blue { background: var(--accent-subtle); color: var(--accent); }
.badge-green { background: var(--success-bg); color: var(--success); }
.badge-yellow { background: var(--warning-bg); color: var(--warning); }
.badge-red { background: var(--danger-bg); color: var(--danger); }
.badge-cyan { background: var(--info-bg); color: var(--info); }
.badge-gray { background: rgba(100,116,139,0.12); color: #94a3b8; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 10000; backdrop-filter: blur(4px);
}
.modal {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px; width: 95%;
  max-width: 560px; max-height: 85vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
.modal-lg { max-width: 800px; }
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

/* Garantir que o mapa Leaflet fique abaixo dos modais */
.leaflet-pane, .leaflet-top, .leaflet-bottom { z-index: 400 !important; }
.leaflet-control { z-index: 800 !important; }
.leaflet-popup { z-index: 900 !important; }

/* Login */
.login-container {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 20px;
  background: radial-gradient(ellipse at 30% 20%, rgba(37,99,235,0.08) 0%, transparent 50%),

              var(--bg-deep);
}
.login-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 14px; padding: 40px; width: 100%; max-width: 400px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.login-logo {
  font-size: 32px; font-weight: 700; text-align: center; margin-bottom: 6px;
  background: linear-gradient(135deg, var(--accent) 0%, #06b6d4 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.login-subtitle {
  text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 28px;
}
.login-form { display: flex; flex-direction: column; gap: 14px; }
.login-form .form-input { padding: 12px 14px; }
.login-btn {

  border: none; border-radius: var(--radius-sm); font-family: inherit;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s;
  margin-top: 4px;
}
.login-btn:hover { background: var(--accent-hover); }
.login-btn:disabled { opacity: 0.5; cursor: wait; }
.login-error {

  border-radius: var(--radius-sm); font-size: 13px; border: 1px solid rgba(239,68,68,0.2);

.toast-container { position: fixed; top: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast {

.toast-info { background: #1e3a5f; color: #7dd3fc; border: 1px solid rgba(56,189,248,0.3); }

@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* Upload area */
.upload-area {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 32px; text-align: center; cursor: pointer; transition: all 0.2s;
}
.upload-area:hover, .upload-area.drag-over {

}
.upload-icon { font-size: 36px; margin-bottom: 8px; }
.upload-text { font-size: 14px; color: var(--text-secondary); }
.upload-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

/* Progress */
.progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s; }

/* Tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tab {
  padding: 10px 18px; font-size: 13px; font-weight: 500; color: var(--text-muted);
  cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s;
  font-family: inherit; background: none; border-top: none; border-left: none; border-right: none;
}
.tab:hover { color: var(--text-secondary); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Empty state */
.empty-state {
  text-align: center; padding: 40px 20px; color: var(--text-muted);
}
.empty-icon { font-size: 40px; margin-bottom: 10px; opacity: 0.5; }
.empty-text { font-size: 14px; }

/* Responsive */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main-content { margin-left: 0; padding: 16px; }
  .form-grid { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .mobile-toggle {
    display: flex !important; position: fixed; top: 12px; left: 12px; z-index: 60;
    width: 40px; height: 40px; align-items: center; justify-content: center;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
    cursor: pointer; font-size: 18px;
  }
}
.mobile-toggle { display: none; }


/* Dashboard: gráfico responsivo sem aumentar cards */
.dashboard-chart-scroll {
  width: 100%;
  max-width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 10px 4px 8px;
}
.dashboard-chart-inner {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  height: 150px;
  width: max-content;
  min-width: 100%;
}
.dashboard-week-col {
  width: 42px;
  min-width: 42px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}
.dashboard-week-bar {
  width: 20px;
  display: flex;
  flex-direction: column-reverse;
  overflow: hidden;
  border-radius: 6px 6px 2px 2px;
  background: var(--border);
}
.dashboard-week-range {
  display: none;
}
@media (min-width: 1400px) {
  .dashboard-week-col { width: 46px; min-width: 46px; }
  .dashboard-week-range { display: block; font-size: 8px; color: var(--text-muted); white-space: nowrap; }
}
@media (max-width: 900px) {
  .dashboard-chart-inner { height: 140px; gap: 6px; }
  .dashboard-week-col { width: 38px; min-width: 38px; }
  .dashboard-week-bar { width: 18px; }

/* Ajuste final: gráfico menor para não distorcer a tela */
.dashboard-chart-scroll {
  max-height: 210px;
}
.dashboard-chart-inner {
  padding-bottom: 4px;
}
.dashboard-week-col {
  gap: 3px;
}

  font-size: 9px !important;
}
.dashboard-week-col > div:nth-child(3) {
  font-size: 9px !important;
}
.dashboard-week-col > div:last-child {
  font-size: 9px !important;
}

</style>

// Helper: converte serial date do Excel para string YYYY-MM-DD
function excelDateToString(val) {
  if (!val) return null;
  if (typeof val === 'string' && val.includes('-')) return val.split('T')[0]; // já é ISO
  if (typeof val === 'string' && val.includes('/')) {
    const parts = val.split('/');
    if (parts.length === 3) return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
  }
  if (typeof val === 'number') {
    // Excel serial: dias desde 1900-01-01 (com bug do 1900)
    const date = new Date((val - 25569) * 86400 * 1000);
    return date.toISOString().split('T')[0];
  }
  if (val instanceof Date) return val.toISOString().split('T')[0];
  return null;
}

// Helper: converte hora do Excel para HH:MM:SS
function excelTimeToString(val) {
  if (!val) return null;
  if (typeof val === 'string' && val.includes(':')) return val.length === 5 ? val + ':00' : val;
  if (typeof val === 'number') {
    const totalSecs = Math.round(val * 86400);
    const h = Math.floor(totalSecs / 3600);
    const m = Math.floor(totalSecs % 3600 / 60);
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:00`;
  }
  if (val instanceof Date) return val.toTimeString().slice(0, 8);
  return null;
}

// Helper: extrai número da semana da coluna Semanas da planilha Consulta

async function transferirEstoqueDireto({
  vacina_id,
  quantidade,
  origem_base_id,
  destino_aplicador_id,
  remessa_id,
  observacao
}) {
  try {
    // 1. Debitar da base
    const {
      data: origemRows
    } = await sb.from('estoque').select('id, quantidade').eq('vacina_id', vacina_id).eq('base_id', origem_base_id).eq('localizacao_tipo', 'base');
    if (!origemRows || origemRows.length === 0) {
      console.error('Origem não encontrada no estoque');
      return false;
    }

    // Somar todos os registros da origem (podem ser duplicados)
    const totalOrigem = origemRows.reduce((s, r) => s + Number(r.quantidade || 0), 0);
    if (totalOrigem < quantidade) {
      console.error(`Saldo insuficiente: ${totalOrigem} < ${quantidade}`);
      return false;
    }

    // Debitar do primeiro registro com saldo
    let restante = quantidade;
    for (const row of origemRows) {
      if (restante <= 0) break;
      const debitar = Math.min(restante, Number(row.quantidade || 0));
      await sb.from('estoque').update({
        quantidade: row.quantidade - debitar
      }).eq('id', row.id);
      restante -= debitar;
    }

    // 2. Creditar no aplicador (UPSERT manual)
    const {
      data: destRows
    } = await sb.from('estoque').select('id, quantidade').eq('vacina_id', vacina_id).eq('aplicador_id', destino_aplicador_id).eq('localizacao_tipo', 'aplicador');
    if (destRows && destRows.length > 0) {
      // Já existe — somar no primeiro
      await sb.from('estoque').update({
        quantidade: destRows[0].quantidade + quantidade
      }).eq('id', destRows[0].id);
    } else {
      // Não existe — criar
      await sb.from('estoque').insert({
        vacina_id,
        aplicador_id: destino_aplicador_id,
        localizacao_tipo: 'aplicador',
        quantidade
      });
    }

    // 3. Registrar movimentação
    const {
      data: {
        user
      }
    } = await sb.auth.getUser();
    await sb.from('movimentacoes').insert({
      tipo: 'envio_aplicador',
      vacina_id,
      quantidade,
      origem_tipo: 'base',
      origem_base_id,
      destino_tipo: 'aplicador',
      destino_aplicador_id,
      remessa_id,
      observacao,
      criado_por: user?.id
    });
    return true;
  } catch (err) {
    console.error('transferirEstoqueDireto error:', err);
    return false;
  }
}
