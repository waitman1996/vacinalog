function ImportConsulta() {
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState(null);
  const [importing, setImporting] = useState(false);
  const [progress, setProgress] = useState(0);
  const [result, setResult] = useState(null);
  // Data de corte: só debita estoque para tarefas com data_inicio >= dataCorte
  const hoje = new Date().toISOString().slice(0, 10);
  const [dataCorte, setDataCorte] = useState(hoje);
  const toast = useContext(ToastContext);
  const fileRef = useRef();

  const handleFile = (f) => {
    setFile(f); setResult(null);
    const reader = new FileReader();
    reader.onload = (e) => {
      // raw:true garante que números não sejam convertidos em datas
      const wb = XLSX.read(e.target.result, { type: 'array', raw: true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      // defval:'' evita undefined, raw:true mantém valores originais
      const data = XLSX.utils.sheet_to_json(sheet, { raw: true, defval: '' });

      // Detectar automaticamente coluna de doses — tolerante a variações de nome
      const firstRow = data[0] || {};
      const normKey = (k) => k.trim().toLowerCase().replace(/\s+/g, ' ');
      const dosesCol = Object.keys(firstRow).find(k => {
        const n = normKey(k);
        return n === 'doses previstas' ||
               n.includes('doses prev') ||
               n === 'previstas' ||
               n === 'doses agendadas' ||
               n === 'total doses' ||
               n === 'qtd doses' ||
               n === 'doses';
      }) || Object.keys(firstRow).find(k => normKey(k).includes('prev')) || 'Doses Previstas';

      // Log para diagnóstico
      console.log('[VacinaLog] Colunas disponíveis:', Object.keys(firstRow));
      console.log('[VacinaLog] Coluna doses detectada:', dosesCol);
      console.log('[VacinaLog] Amostra valor doses:', firstRow[dosesCol]);

      const filtered = data.filter(r => {
        const st = String(r['Status'] || '').trim();
        return ['Aprovada','Em validação','Em execução','Pronta p/ Faturamento'].includes(st);
      });

      // Checar quantos têm doses zeradas
      const comDoses = filtered.filter(r => Math.round(parseFloat(r[dosesCol])) > 0);
      const semDoses = filtered.length - comDoses.length;

      setPreview({ total: data.length, filtered: filtered.length, comDoses: comDoses.length, semDoses, data: filtered, dosesCol });
    };
    reader.readAsArrayBuffer(f);
  };

  const doImport = async () => {
    if (!preview) return;

    if (preview.comDoses === 0) {
      toast('❌ Todas as doses estão zeradas. Verifique se o arquivo está correto.', 'error');
      return;
    }

    setImporting(true); setProgress(0);

    try {
      const { data: bases, error: bErr } = await sb.from('bases').select('id, nome');
      if (bErr) throw new Error('Erro ao carregar bases: ' + bErr.message);
      const baseMap = {};
      (bases || []).forEach(b => { baseMap[b.nome.toLowerCase()] = b.id; });

      const { data: vacinas, error: vErr } = await sb.from('vacinas').select('id, nome');
      if (vErr) throw new Error('Erro ao carregar vacinas: ' + vErr.message);
      const vacinaMap = {};
      (vacinas || []).forEach(v => { vacinaMap[v.nome.toLowerCase()] = v.id; });

      // Buscar tarefas já existentes para detectar novas doses aplicadas
      // Paginar em lotes de 200 (limite seguro do .in() do Supabase)
      toast('Verificando tarefas existentes...', 'info');
      const codigos = preview.data.map(r => r['Código']).filter(Boolean);
      const existingMap = {};
      const LOOKUP_BATCH = 200;
      for (let i = 0; i < codigos.length; i += LOOKUP_BATCH) {
        const { data: existing, error: exErr } = await sb.from('tarefas')
          .select('id, codigo, doses_aplicadas')
          .in('codigo', codigos.slice(i, i + LOOKUP_BATCH));
        if (exErr) console.warn('Erro ao buscar existentes:', exErr.message);
        (existing || []).forEach(t => { existingMap[t.codigo] = t; });
        setProgress(Math.round((i / codigos.length) * 10)); // 0-10% para lookup
      }

      // Buscar escalas para vincular abatimentos — também paginar
      toast('Carregando escalas vinculadas...', 'info');
      const escalaMap = {};
      for (let i = 0; i < codigos.length; i += LOOKUP_BATCH) {
        const { data: escalasData } = await sb.from('escalas')
          .select('id, codigo_tarefa, aplicador_id, vacina_id, status, vacinas(nome, produto_nome)')
          .in('codigo_tarefa', codigos.slice(i, i + LOOKUP_BATCH))
          .in('status', ['aprovada','em_validacao','em_execucao','pronta_faturamento']);
        (escalasData || []).forEach(e => {
          if (!escalaMap[e.codigo_tarefa]) escalaMap[e.codigo_tarefa] = e;
        });
      }

      const userId = (await sb.auth.getUser()).data.user.id;

      const { data: imp, error: impErr } = await sb.from('importacoes').insert({
        tipo: 'tarefa', nome_arquivo: file.name,
        registros_total: preview.filtered,
        usuario_id: userId
      }).select().single();
      if (impErr) throw new Error('Erro ao registrar importação: ' + impErr.message);

      // Debita estoque do aplicador por PRODUTO, não por lote/vacina_id específico.
      // Isso resolve casos em que o aplicador tem saldo em outro lote do mesmo produto.
      const debitarAplicadorPorProduto = async ({ escala, quantidade, codigo, totalAplicadas }) => {
        if (!escala?.aplicador_id || !escala?.vacina_id || !quantidade || quantidade <= 0) return false;

        const produtoEscala = String(escala.vacinas?.produto_nome || escala.vacinas?.nome || '').trim().toLowerCase();

        const { data: estoqueRows, error: estErr } = await sb.from('estoque')
          .select('id, quantidade, vacina_id, vacinas(nome, produto_nome)')
          .eq('aplicador_id', escala.aplicador_id)
          .eq('localizacao_tipo', 'aplicador')
          .gt('quantidade', 0);

        if (estErr) {
          console.warn(`Erro ao consultar estoque do aplicador para ${codigo}:`, estErr.message);
          return false;
        }

        let candidatos = (estoqueRows || []).filter(e => {
          const produtoEstoque = String(e.vacinas?.produto_nome || e.vacinas?.nome || '').trim().toLowerCase();
          return produtoEscala && produtoEstoque === produtoEscala;
        });

        // Fallback de segurança: se o produto_nome ainda não estiver preenchido, tenta pelo vacina_id antigo.
        if (candidatos.length === 0) {
          candidatos = (estoqueRows || []).filter(e => String(e.vacina_id) === String(escala.vacina_id));
        }

        const disponivel = candidatos.reduce((s, e) => s + Number(e.quantidade || 0), 0);
        if (disponivel < quantidade) {
          console.warn(`Saldo insuficiente para ${codigo}: disponível ${disponivel}, necessário ${quantidade}`);
          return false;
        }

        let restante = quantidade;
        const ordenados = [...candidatos].sort((a,b) => Number(b.quantidade||0) - Number(a.quantidade||0));
        const vacinaMovId = ordenados[0]?.vacina_id || escala.vacina_id;

        for (const item of ordenados) {
          if (restante <= 0) break;
          const saldo = Number(item.quantidade || 0);
          const debito = Math.min(saldo, restante);
          const { error: debErr } = await sb.from('estoque')
            .update({ quantidade: saldo - debito })
            .eq('id', item.id);
          if (debErr) throw debErr;
          restante -= debito;
        }

        const { error: movErr } = await sb.from('movimentacoes').insert({
          tipo: 'aplicacao',
          vacina_id: vacinaMovId,
          quantidade,
          origem_tipo: 'aplicador',
          origem_aplicador_id: escala.aplicador_id,
          observacao: `Importação Consulta: +${quantidade} doses aplicadas (total: ${totalAplicadas}) | Tarefa ${codigo} | Data corte: ${dataCorte} | Débito por produto`,
          criado_por: userId,
        });

        if (movErr) throw movErr;
        return true;
      };

      const rows = preview.data;
      const batchSize = 50;
      let imported = 0, ignored = 0, atualizados = 0, abatimentos = 0;

      for (let i = 0; i < rows.length; i += batchSize) {
        const batch = rows.slice(i, i + batchSize);

        // Separar novos e existentes
        const novos = [];
        const paraAtualizar = [];

        batch.forEach(r => {
          const codigo = r['Código'] || '';
          const statusRaw = r['Status'] || '';
          const status = STATUS_MAP[statusRaw] || 'aprovada';
          const baseNome = (String(r['Bases'] || '')).trim();
          const vacinaNome = (String(r['vacina'] || 'Gripe')).trim();
          const dataInicio = excelDateToString(r['Início']);
          const dataTermino = excelDateToString(r['Término']);
          const horaInicio = excelTimeToString(r['Horas']);
          const horaTermino = excelTimeToString(r['Horas_1'] || r['Horas.1']);
          const dosesAplicadas = Math.round(parseFloat(r['Doses Aplicadas'])) || 0;
          // Helper para buscar valor da coluna ignorando espaços extras
          const getCol = (row, key) => {
            if (row[key] !== undefined) return row[key];
            // Tentar match por nome normalizado
            const normKey = key.trim().toLowerCase().replace(/\s+/g, ' ');
            const found = Object.keys(row).find(k => k.trim().toLowerCase().replace(/\s+/g, ' ') === normKey);
            return found ? row[found] : undefined;
          };
          const dosesPrevistas = Math.round(parseFloat(getCol(r, preview.dosesCol) ?? getCol(r, 'Doses Previstas'))) || 0;

          const payload = {
            codigo,
            nome_agenda: r['nome_agenda'] || '',
            grupo: r['Grupo'] || '',
            cliente: r['Cliente'] || '',
            unidade_campanha: r['Unidade de campanha'] || '',
            unidade: r['Unidade'] || '',
            cidade_campanha: r['Cidade da campanha'] || '',
            uf_campanha: r['UF da campanha'] || '',
            tipo_agendamento: r['Tipo de agendamento'] || '',
            data_inicio: dataInicio,
            hora_inicio: horaInicio,
            data_termino: dataTermino,
            hora_termino: horaTermino,
            ponto_focal: r['Ponto focal'] || '',
            vendedor: r['Vendedor'] || '',
            doses_previstas: dosesPrevistas,
            doses_consumidas: Math.round(parseFloat(r['Doses Consumidas'])) || 0,
            doses_aplicadas: dosesAplicadas,
            status,
            status_original: statusRaw,
            ponto_partida: (r['Ponto de partida'] || '').trim(),
            base_nome: baseNome,
            base_id: baseMap[baseNome.toLowerCase()] || null,
            pp_uf: r['P.P. UF'] || '',
            profissionais: parseInt(r['Profissionais']) || 0,
            administrativo: parseInt(r['Administrativo']) || 0,
            semanas: extractWeekNumber(r['Semanas']),
            endereco: r['Endereço'] || '',
            terceirizada: parseFloat(r['Terceirizada']) > 0,
            campanha: r['Campanha'] || '',
            vacina: vacinaNome,
            vacina_id: vacinaMap[vacinaNome.toLowerCase()] || vacinaMap['gripe'] || null,
            importacao_id: imp.id,
          };

          if (existingMap[codigo]) {
            // Tarefa existente → atualizar
            paraAtualizar.push({
              ...payload,
              id: existingMap[codigo].id,
              dosesAntigas: existingMap[codigo].doses_aplicadas || 0,
              dosesNovas: dosesAplicadas,
              escala: escalaMap[codigo] || null,
            });
          } else {
            novos.push(payload);
          }
        });

        // INSERT para novas tarefas
        if (novos.length > 0) {
          const { data: insertedData, error: insertErr } = await sb.from('tarefas').insert(novos).select('id,codigo');
          if (insertErr) {
            ignored += novos.length;
          } else {
            imported += (insertedData?.length || novos.length);

            // Para tarefas novas já com Doses Aplicadas, também debitar se estiverem dentro da data de corte.
            // Antes, o sistema só debitava tarefas já existentes; por isso algumas importações não geravam abatimento.
            for (const novo of novos) {
              const escala = escalaMap[novo.codigo] || null;
              const dentroDoCorte = dataCorte ? (novo.data_inicio || '') >= dataCorte : false;
              if (novo.doses_aplicadas > 0 && dentroDoCorte && escala?.id) {
                await sb.from('escalas')
                  .update({ doses_aplicadas: novo.doses_aplicadas })
                  .eq('id', escala.id);
                const ok = await debitarAplicadorPorProduto({
                  escala,
                  quantidade: novo.doses_aplicadas,
                  codigo: novo.codigo,
                  totalAplicadas: novo.doses_aplicadas,
                });
                if (ok) abatimentos++;
              }
            }
          }
        }

        // UPDATE para tarefas existentes + abatimento se houver novas doses
        for (const t of paraAtualizar) {
          const { id, dosesAntigas, dosesNovas, escala, ...fields } = t;
          delete fields.importacao_id;

          // REGRA: não pode diminuir doses aplicadas
          if (dosesNovas < dosesAntigas) {
            console.warn(`Ignorando ${fields.codigo||id}: tentativa de diminuir doses (${dosesAntigas} → ${dosesNovas})`);
            ignored++;
            continue;
          }

          // REGRA: sem alteração nas doses — normalmente não debita.
          // Exceção: se já foi importado antes, atualizou doses_aplicadas, mas NÃO existe movimentação,
          // permite reprocessar o arquivo e gerar o débito pendente.
          const incremento = dosesNovas - dosesAntigas;
          let qtdParaDebitar = incremento;

          if (incremento === 0 && dosesNovas > 0) {
            const { data: movExistente } = await sb.from('movimentacoes')
              .select('id')
              .eq('tipo', 'aplicacao')
              .ilike('observacao', `%Tarefa ${fields.codigo || id}%`)
              .limit(1);
            if (!movExistente || movExistente.length === 0) {
              qtdParaDebitar = dosesNovas;
            }
          }

          const { error: updErr } = await sb.from('tarefas')
            .update({
              doses_previstas: fields.doses_previstas,
              doses_consumidas: fields.doses_consumidas,
              doses_aplicadas: dosesNovas,
              status: fields.status,
              status_original: fields.status_original,
            })
            .eq('id', id);

          if (updErr) {
            ignored++;
          } else {
            atualizados++;

            // Atualizar doses_aplicadas na escala vinculada
            if (escala?.id && dosesNovas >= 0) {
              await sb.from('escalas')
                .update({ doses_aplicadas: dosesNovas })
                .eq('id', escala.id);
            }

            // Debitar SOMENTE o incremento (novas doses além do que já foi debitado antes)
            // e SOMENTE se data_inicio >= dataCorte
            const dataInicio = fields.data_inicio || '';
            const dentroDoCorte = dataCorte ? dataInicio >= dataCorte : false;

            if (qtdParaDebitar > 0 && dentroDoCorte && escala?.aplicador_id && escala?.vacina_id) {
              const ok = await debitarAplicadorPorProduto({
                escala,
                quantidade: qtdParaDebitar,
                codigo: fields.codigo || id,
                totalAplicadas: dosesNovas,
              });
              if (ok) abatimentos++;
            }
          }
        }

        setProgress(10 + Math.round(((i + batch.length) / rows.length) * 90));
      }

      await sb.from('importacoes').update({
        registros_importados: imported + atualizados,
        registros_ignorados: ignored,
        detalhes: { novos: imported, atualizados, abatimentos_gerados: abatimentos }
      }).eq('id', imp.id);

      setResult({ imported, atualizados, abatimentos, ignored, total: rows.length });
      toast(
        `Importação concluída! ${imported} novas · ${atualizados} atualizadas · ${abatimentos} abatimentos gerados.`,
        'success'
      );
    } catch (err) {
      toast('Erro na importação: ' + err.message, 'error');
    } finally {
      setImporting(false);
    }
  };

  return (
    <div className="card">
      <div className="card-title" style={{marginBottom:16}}>Importar Consulta (Tarefas)</div>
      <p style={{fontSize:13,color:'var(--text-secondary)',marginBottom:16}}>
        Importe a planilha de Consulta. Somente tarefas com status <strong>Aprovada</strong>, <strong>Em validação</strong>, <strong>Em execução</strong> e <strong>Pronta p/ Faturamento</strong> serão importadas.
      </p>

      <div className="upload-area" onClick={() => fileRef.current?.click()}
        onDragOver={e=>{e.preventDefault();e.currentTarget.classList.add('drag-over')}}
        onDragLeave={e=>e.currentTarget.classList.remove('drag-over')}
        onDrop={e=>{e.preventDefault();e.currentTarget.classList.remove('drag-over');handleFile(e.dataTransfer.files[0])}}>
        <div className="upload-icon">📄</div>
        <div className="upload-text">{file ? file.name : 'Clique ou arraste o arquivo Excel (.xlsx)'}</div>
        <div className="upload-hint">Planilha Consulta com colunas: Código, Status, Doses Previstas, Bases, etc.</div>
        <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])} />
      </div>

      {preview && (
        <div style={{marginTop:16}}>
          <div style={{display:'flex',gap:12,marginBottom:12,flexWrap:'wrap'}}>
            <div className="stat-card" style={{flex:1,minWidth:120}}>
              <div className="stat-label">Total na planilha</div>
              <div className="stat-value" style={{fontSize:22}}>{preview.total}</div>
            </div>
            <div className="stat-card" style={{flex:1,minWidth:120}}>
              <div className="stat-label">Status logística</div>
              <div className="stat-value" style={{fontSize:22,color:'var(--success)'}}>{preview.filtered}</div>
            </div>
            <div className="stat-card" style={{flex:1,minWidth:120}}>
              <div className="stat-label">Com doses</div>
              <div className="stat-value" style={{fontSize:22,color:'var(--accent)'}}>{preview.comDoses}</div>
            </div>
            <div className="stat-card" style={{flex:1,minWidth:120}}>
              <div className="stat-label">Doses zeradas</div>
              <div className="stat-value" style={{fontSize:22,color:preview.semDoses>0?'var(--warning)':'var(--text-muted)'}}>{preview.semDoses}</div>
            </div>
          </div>
          {preview.comDoses === 0 && (
            <div style={{padding:12,background:'var(--danger-bg)',border:'1px solid rgba(239,68,68,0.3)',borderRadius:'var(--radius-sm)',marginBottom:12,fontSize:13,color:'var(--danger)'}}>
              ❌ <strong>Todas as doses estão zeradas.</strong> Verifique se a coluna correta é <code>"{preview.dosesCol}"</code>. Possível problema no arquivo ou formatação Excel.
            </div>
          )}
          {preview.semDoses > 0 && preview.comDoses > 0 && (
            <div style={{padding:10,background:'var(--warning-bg)',border:'1px solid rgba(245,158,11,0.3)',borderRadius:'var(--radius-sm)',marginBottom:12,fontSize:12,color:'var(--warning)'}}>
              ⚠ {preview.semDoses} tarefas com doses zeradas serão importadas com valor 0. Coluna detectada: <code>"{preview.dosesCol}"</code>
            </div>
          )}
          {preview.comDoses > 0 && preview.semDoses === 0 && (
            <div style={{padding:10,background:'var(--success-bg)',border:'1px solid rgba(16,185,129,0.2)',borderRadius:'var(--radius-sm)',marginBottom:12,fontSize:12,color:'var(--success)'}}>
              ✓ Coluna de doses detectada: <code>"{preview.dosesCol}"</code>
            </div>
          )}

          {importing && (
            <div style={{marginBottom:12}}>
              <div style={{fontSize:13,color:'var(--text-secondary)',marginBottom:6}}>Importando... {progress}%</div>
              <div className="progress-bar"><div className="progress-fill" style={{width:progress+'%'}} /></div>
            </div>
          )}

          {result && (
            <div style={{padding:14,background:'var(--success-bg)',borderRadius:'var(--radius-sm)',border:'1px solid rgba(16,185,129,0.2)',marginBottom:12}}>
              <div style={{fontSize:14,fontWeight:600,color:'var(--success)'}}>✓ Importação concluída</div>
              <div style={{fontSize:13,color:'var(--text-secondary)',marginTop:4,display:'flex',gap:16,flexWrap:'wrap'}}>
                <span>📥 {result.imported} novas</span>
                <span>🔄 {result.atualizados} atualizadas</span>
                <span style={{color:'var(--accent)'}}>💉 {result.abatimentos} abatimentos gerados</span>
                {result.ignored > 0 && <span style={{color:'var(--warning)'}}>⚠ {result.ignored} com erro</span>}
              </div>
            </div>
          )}

          {/* Data de corte para débito de estoque */}
          <div style={{padding:14,background:'var(--bg-input)',borderRadius:'var(--radius-sm)',border:'1px solid var(--border)',marginBottom:12}}>
            <div style={{fontSize:13,fontWeight:600,marginBottom:6}}>💉 Débito de Estoque do Aplicador</div>
            <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:10}}>
              Somente tarefas com <strong>data de início a partir de</strong> esta data terão as doses aplicadas debitadas do estoque do aplicador. Tarefas anteriores serão atualizadas normalmente, mas <strong>sem debitar o estoque</strong>.
            </div>
            <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
              <label style={{fontSize:12,fontWeight:600}}>Data de corte:</label>
              <input type="date" className="form-input" style={{width:160,padding:'5px 8px',fontSize:13}}
                value={dataCorte} onChange={e => setDataCorte(e.target.value)} />
              <button className="btn btn-secondary btn-sm" onClick={() => setDataCorte(hoje)}>Hoje</button>
              <button className="btn btn-secondary btn-sm" onClick={() => setDataCorte('')}>Sem corte (não debitar)</button>
            </div>
            {dataCorte ? (
              <div style={{marginTop:8,fontSize:11,color:'var(--success)'}}>
                ✓ Vai debitar estoque apenas das tarefas com data ≥ {new Date(dataCorte+'T12:00:00').toLocaleDateString('pt-BR')}
              </div>
            ) : (
              <div style={{marginTop:8,fontSize:11,color:'var(--warning)'}}>
                ⚠ Nenhuma data de corte definida — não vai debitar nenhum estoque nesta importação
              </div>
            )}
          </div>

          <button className="btn btn-primary" onClick={doImport} disabled={importing || preview.filtered === 0}>
            {importing ? 'Importando...' : `Importar ${preview.filtered} tarefas`}
          </button>
        </div>
      )}
    </div>
  );
}

function ImportTutores() {
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState(null);
  const [importing, setImporting] = useState(false);
  const [progress, setProgress] = useState(0);
  const [result, setResult] = useState(null);
  const toast = useContext(ToastContext);
  const fileRef = useRef();

  const handleFile = (f) => {
    setFile(f); setResult(null);
    const reader = new FileReader();
    reader.onload = (e) => {
      const wb = XLSX.read(e.target.result, { type: 'array', raw: true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(sheet, { raw: true, defval: '' });
      // Filtrar por status relevante e que tenha CPF
      const filtered = data.filter(r => {
        const st = r['status'] || '';
        return ['Aprovada','Em validação','Em execução','Pronta p/ Faturamento'].includes(st);
      });
      const withCPF = filtered.filter(r => r['CPF'] && String(r['CPF']).trim());
      setPreview({ total: data.length, filtered: filtered.length, withCPF: withCPF.length, data: withCPF });
    };
    reader.readAsArrayBuffer(f);
  };

  const doImport = async () => {
    if (!preview) return;
    setImporting(true); setProgress(0);

    try {
      const { data: bases } = await sb.from('bases').select('id, nome');
      const baseMap = {};
      (bases || []).forEach(b => { baseMap[b.nome.toLowerCase()] = b.id; });

      const { data: vacinas } = await sb.from('vacinas').select('id, nome');
      const vacinaMap = {};
      (vacinas || []).forEach(v => { vacinaMap[v.nome.toLowerCase()] = v.id; });

      // Buscar tarefas para resolver tarefa_id via código
      const { data: tarefas } = await sb.from('tarefas').select('id, codigo');
      const tarefaMap = {};
      (tarefas || []).forEach(t => { tarefaMap[t.codigo] = t.id; });

      // Buscar aplicadores existentes
      const { data: apExist } = await sb.from('aplicadores').select('id, cpf');
      const apMap = {};
      (apExist || []).forEach(a => { apMap[a.cpf] = a.id; });

      const { data: imp } = await sb.from('importacoes').insert({
        tipo: 'escala', nome_arquivo: file.name,
        registros_total: preview.withCPF,
        usuario_id: (await sb.auth.getUser()).data.user.id
      }).select().single();

      const rows = preview.data;
      const batchSize = 50;
      let imported = 0, ignored = 0, aplicadoresCriados = 0;

      // Primeiro pass: criar aplicadores que não existem
      const cpfsSeen = new Set();
      const newAplicadores = [];
      for (const r of rows) {
        const cpf = String(r['CPF'] || '').trim();
        if (!cpf || cpfsSeen.has(cpf) || apMap[cpf]) continue;
        cpfsSeen.add(cpf);
        const baseNome = (r['Base'] || '').trim();
        newAplicadores.push({
          nome: r['Tutor'] || 'Sem nome',
          cpf: cpf,
          telefone: r['Celular'] ? String(r['Celular']) : null,
          endereco: r['Endereço'] || null,
          numero: r['Número'] ? String(r['Número']) : null,
          cidade: r['Cidade'] || null,
          uf: r['UF'] || null,
          cep: r['CEP'] ? String(r['CEP']) : null,
          base_vinculada_id: baseMap[baseNome.toLowerCase()] || null,
        });
      }

      // Inserir novos aplicadores em batch
      if (newAplicadores.length > 0) {
        for (let i = 0; i < newAplicadores.length; i += batchSize) {
          const batch = newAplicadores.slice(i, i + batchSize);
          const { data: inserted, error } = await sb.from('aplicadores').insert(batch).select('id, cpf');
          if (!error && inserted) {
            inserted.forEach(a => { apMap[a.cpf] = a.id; });
            aplicadoresCriados += inserted.length;
          }
        }
      }

      // Segundo pass: inserir escalas
      for (let i = 0; i < rows.length; i += batchSize) {
        const batch = rows.slice(i, i + batchSize).map(r => {
          const cpf = String(r['CPF'] || '').trim();
          const statusRaw = String(r['status'] || '').trim();
          const baseNome = String(r['Base'] || '').trim();
          const vacinaNome = String(r['Tipo de vacina'] || 'Gripe').trim();
          const codigoTarefa = String(r['Código da tarefa'] || '');

          const dataInicio = excelDateToString(r['Início da tarefa']);
          const dataTermino = excelDateToString(r['Término da tarefa']);
          const horaInicio = excelTimeToString(r['Horas - Início']);
          const horaTermino = excelTimeToString(r['Horas  - Término']);

          return {
            codigo_tarefa: codigoTarefa,
            tarefa_id: tarefaMap[codigoTarefa] || null,
            aplicador_id: apMap[cpf] || null,
            tutor_nome: r['Tutor'] || '',
            tutor_cpf: cpf,
            base_nome: baseNome,
            base_id: baseMap[baseNome.toLowerCase()] || null,
            ponto_partida: (r['Ponto de partida'] || '').trim(),
            doses_necessarias: Math.round(parseFloat(r['Qntd. de doses'])) || 0,
            tipo_vacina: vacinaNome,
            vacina_id: vacinaMap[vacinaNome.toLowerCase()] || vacinaMap['gripe'] || null,
            data_inicio: dataInicio,
            hora_inicio: horaInicio,
            data_termino: dataTermino,
            hora_termino: horaTermino,
            endereco_tarefa: r['Endereço da tarefa'] || '',
            terceirizada: parseFloat(r['terceirizada']) > 0,
            profissionais: parseInt(r['Qntd de enfermeiros']) || 0,
            administrativo: parseInt(r["Qntd de ADM's"]) || 0,
            semanas: extractWeekNumber(r['Semanas']),
            particularidade: r['particularidade'] || '',
            status: STATUS_MAP[statusRaw] || 'aprovada',
            status_original: statusRaw,
            importacao_id: imp.id,
          };
        });

        const { data: inserted, error } = await sb.from('escalas').insert(batch).select('id');
        if (error) {
          console.error('Batch error escalas:', error.message, error.details);
          ignored += batch.length;
          if (ignored <= batch.length) toast(`Aviso lote ${Math.ceil(i/batchSize)+1}: ${error.message}`, 'error');
        } else {
          imported += (inserted?.length || batch.length);
        }
        setProgress(Math.round(((i + batch.length) / rows.length) * 100));
      }

      await sb.from('importacoes').update({
        registros_importados: imported, registros_ignorados: ignored,
        detalhes: { aplicadores_criados: aplicadoresCriados }
      }).eq('id', imp.id);

      setResult({ imported, ignored, total: rows.length, aplicadoresCriados });
      toast(`Importação concluída! ${imported} escalas, ${aplicadoresCriados} aplicadores criados.`, 'success');
    } catch (err) {
      toast('Erro na importação: ' + err.message, 'error');
    } finally {
      setImporting(false);
    }
  };

  return (
    <div className="card">
      <div className="card-title" style={{marginBottom:16}}>Importar Tutores (Escalas)</div>
      <p style={{fontSize:13,color:'var(--text-secondary)',marginBottom:16}}>
        Importe a planilha de Tutores. Aplicadores com CPF novo serão criados automaticamente. A importação resolve os vínculos com Tarefas, Bases e Vacinas já cadastradas.
      </p>

      <div className="upload-area" onClick={() => fileRef.current?.click()}
        onDragOver={e=>{e.preventDefault();e.currentTarget.classList.add('drag-over')}}
        onDragLeave={e=>e.currentTarget.classList.remove('drag-over')}
        onDrop={e=>{e.preventDefault();e.currentTarget.classList.remove('drag-over');handleFile(e.dataTransfer.files[0])}}>
        <div className="upload-icon">📄</div>
        <div className="upload-text">{file ? file.name : 'Clique ou arraste o arquivo Excel (.xlsx)'}</div>
        <div className="upload-hint">Planilha Tutores com colunas: Código da tarefa, Tutor, CPF, Qntd. de doses, etc.</div>
        <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])} />
      </div>

      {preview && (
        <div style={{marginTop:16}}>
          <div style={{display:'flex',gap:16,marginBottom:12,flexWrap:'wrap'}}>
            <div className="stat-card" style={{flex:1,minWidth:120}}>
              <div className="stat-label">Total na planilha</div>
              <div className="stat-value" style={{fontSize:22}}>{preview.total}</div>
            </div>
            <div className="stat-card" style={{flex:1,minWidth:120}}>
              <div className="stat-label">Status logística</div>
              <div className="stat-value" style={{fontSize:22,color:'var(--success)'}}>{preview.filtered}</div>
            </div>
            <div className="stat-card" style={{flex:1,minWidth:120}}>
              <div className="stat-label">Com CPF válido</div>
              <div className="stat-value" style={{fontSize:22,color:'var(--accent)'}}>{preview.withCPF}</div>
            </div>
          </div>

          {importing && (
            <div style={{marginBottom:12}}>
              <div style={{fontSize:13,color:'var(--text-secondary)',marginBottom:6}}>Importando... {progress}%</div>
              <div className="progress-bar"><div className="progress-fill" style={{width:progress+'%'}} /></div>
            </div>
          )}

          {result && (
            <div style={{padding:14,background:'var(--success-bg)',borderRadius:'var(--radius-sm)',border:'1px solid rgba(16,185,129,0.2)',marginBottom:12}}>
              <div style={{fontSize:14,fontWeight:600,color:'var(--success)'}}>✓ Importação concluída</div>
              <div style={{fontSize:13,color:'var(--text-secondary)',marginTop:4}}>
                {result.imported} escalas importadas · {result.aplicadoresCriados} aplicadores criados · {result.ignored} com erro
              </div>
            </div>
          )}

          <button className="btn btn-primary" onClick={doImport} disabled={importing || preview.withCPF === 0}>
            {importing ? 'Importando...' : `Importar ${preview.withCPF} escalas`}
          </button>
        </div>
      )}
    </div>
  );
}



function ImportClinicas() {
  const [tab, setTab] = useState('saldo');
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState(null);
  const [importing, setImporting] = useState(false);
  const [progress, setProgress] = useState(0);
  const [result, setResult] = useState(null);
  const [modoSaldo, setModoSaldo] = useState('substituir');
  const toast = useContext(ToastContext);
  const fileRef = useRef();

  const norm = (v) => String(v || '').trim();
  const key = (v) => norm(v).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const onlyDigits = (v) => String(v || '').replace(/\D/g, '');
  const parseQtd = (v) => {
    const raw = String(v ?? '0').replace(/\./g, '').replace(',', '.');
    const n = Number(raw);
    return Number.isFinite(n) ? Math.round(n) : 0;
  };
  const get = (row, aliases) => {
    const map = {};
    Object.keys(row || {}).forEach(k => { map[key(k)] = row[k]; });
    for (const a of aliases) {
      const v = map[key(a)];
      if (v !== undefined && v !== null && String(v).trim() !== '') return v;
    }
    return '';
  };
  const modalidadeByCodigo = (codigo) => {
    const c = String(codigo || '').toUpperCase();
    if (c.includes('.IC')) return 'in_company';
    if (c.includes('.VD')) return 'venda_doses';
    return 'rede_credenciada';
  };
  const modalidadeLabel = (m) => ({ in_company: 'In Company', rede_credenciada: 'Rede Credenciada', venda_doses: 'Venda de Doses' }[m] || m);

  const baixarModeloClinicas = () => {
    const rows = tab === 'saldo' ? [
      { clinica: 'Clínica Exemplo', cnpj: '00.000.000/0001-00', cidade: 'São Paulo', uf: 'SP', endereco: 'Rua Exemplo, 123', vacina: 'Influenza', quantidade: 100 }
    ] : [
      { clinica: 'Clínica Exemplo', cnpj: '00.000.000/0001-00', data: '2026-05-15', vacina: 'Influenza', doses_aplicadas: 25, observacao: 'Campanha clínica parceira' }
    ];
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, tab === 'saldo' ? 'Saldo Clinicas' : 'Vacinados Clinicas');
    XLSX.writeFile(wb, tab === 'saldo' ? 'modelo_saldo_clinicas.xlsx' : 'modelo_vacinados_clinicas.xlsx');
  };

  const handleFile = (f) => {
    if (!f) return;
    setFile(f); setResult(null); setProgress(0);
    const reader = new FileReader();
    reader.onload = (e) => {
      const wb = XLSX.read(e.target.result, { type: 'array', raw: true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(sheet, { raw: true, defval: '' });
      const rows = data.map((r, idx) => {
        const clinica = norm(get(r, ['clinica','clínica','nome_clinica','nome clínica','nome','local']));
        const cnpj = onlyDigits(get(r, ['cnpj','cpf/cnpj','documento']));
        const vacina = norm(get(r, ['vacina','produto','imunizante','tipo_vacina','tipo de vacina'])) || 'Influenza';
        const qtd = tab === 'saldo' ? parseQtd(get(r, ['quantidade','saldo','doses','qtd','qtd doses'])) : parseQtd(get(r, ['doses_aplicadas','doses aplicadas','vacinados','aplicadas','quantidade','qtd'])) ;
        const dataRef = excelDateToString(get(r, ['data','data_aplicacao','data aplicação','data de aplicação'])) || new Date().toISOString().slice(0,10);
        return {
          linha: idx + 2,
          clinica,
          cnpj,
          cidade: norm(get(r, ['cidade','municipio','município'])),
          uf: norm(get(r, ['uf','estado'])).toUpperCase(),
          endereco: norm(get(r, ['endereco','endereço','logradouro'])),
          vacina,
          quantidade: qtd,
          data: dataRef,
          observacao: norm(get(r, ['observacao','observação','obs'])),
          modalidade: 'rede_credenciada',
          valido: !!clinica && qtd > 0,
        };
      });
      const valid = rows.filter(r => r.valido);
      const totalDoses = valid.reduce((s,r)=>s+Number(r.quantidade||0),0);
      setPreview({ total: rows.length, valid: valid.length, invalid: rows.length - valid.length, totalDoses, data: rows });
    };
    reader.readAsArrayBuffer(f);
  };

  const ensureClinica = async (row) => {
    let query = sb.from('clinicas').select('id,nome,cnpj').limit(1);
    if (row.cnpj) query = query.eq('cnpj', row.cnpj);
    else query = query.ilike('nome', row.clinica);
    const { data, error } = await query;
    if (error) throw error;
    if (data && data.length) {
      const id = data[0].id;
      await sb.from('clinicas').update({ nome: row.clinica, cidade: row.cidade || null, uf: row.uf || null, endereco: row.endereco || null, status: 'ativa' }).eq('id', id);
      return id;
    }
    const { data: inserted, error: insErr } = await sb.from('clinicas').insert({ nome: row.clinica, cnpj: row.cnpj || null, cidade: row.cidade || null, uf: row.uf || null, endereco: row.endereco || null, status: 'ativa' }).select('id').single();
    if (insErr) throw insErr;
    return inserted.id;
  };

  const findVacina = async (nome) => {
    const { data, error } = await sb.from('vacinas').select('id,nome,produto_nome').or(`nome.ilike.%${nome}%,produto_nome.ilike.%${nome}%`).limit(1);
    if (error) throw error;
    if (!data || !data.length) throw new Error(`Vacina/produto não encontrado: ${nome}`);
    return data[0];
  };

  const doImport = async () => {
    if (!preview) return;
    setImporting(true); setProgress(0);
    const userId = (await sb.auth.getUser()).data.user.id;
    let imported = 0, updated = 0, ignored = 0, errors = [];
    try {
      const { data: imp } = await sb.from('importacoes').insert({
        tipo: tab === 'saldo' ? 'clinicas_saldo' : 'clinicas_vacinados',
        nome_arquivo: file?.name || 'clinicas.xlsx',
        registros_total: preview.valid,
        usuario_id: userId,
        detalhes: { modalidade: 'rede_credenciada', modo: tab, modo_saldo: modoSaldo }
      }).select().single();

      const rows = preview.data.filter(r => r.valido);
      for (let i=0; i<rows.length; i++) {
        const r = rows[i];
        try {
          const clinicaId = await ensureClinica(r);
          const vacina = await findVacina(r.vacina);

          if (tab === 'saldo') {
            const { data: existing, error: exErr } = await sb.from('estoque')
              .select('id,quantidade')
              .eq('localizacao_tipo','clinica')
              .eq('clinica_id', clinicaId)
              .eq('vacina_id', vacina.id)
              .limit(1);
            if (exErr) throw exErr;
            if (existing && existing.length) {
              const novaQtd = modoSaldo === 'somar' ? Number(existing[0].quantidade || 0) + r.quantidade : r.quantidade;
              const { error } = await sb.from('estoque').update({ quantidade: novaQtd }).eq('id', existing[0].id);
              if (error) throw error;
              updated++;
            } else {
              const { error } = await sb.from('estoque').insert({ vacina_id: vacina.id, localizacao_tipo: 'clinica', clinica_id: clinicaId, quantidade: r.quantidade });
              if (error) throw error;
              imported++;
            }
          } else {
            const { data: estoques, error: estErr } = await sb.from('estoque')
              .select('id,quantidade,vacina_id,vacinas(nome,produto_nome)')
              .eq('localizacao_tipo','clinica')
              .eq('clinica_id', clinicaId)
              .gt('quantidade', 0);
            if (estErr) throw estErr;
            const produtoRef = String(vacina.produto_nome || vacina.nome || '').toLowerCase().trim();
            const candidatos = (estoques || []).filter(e => String(e.vacinas?.produto_nome || e.vacinas?.nome || '').toLowerCase().trim() === produtoRef || String(e.vacina_id) === String(vacina.id));
            const disponivel = candidatos.reduce((s,e)=>s+Number(e.quantidade||0),0);
            if (disponivel < r.quantidade) throw new Error(`Saldo insuficiente na clínica. Disponível ${disponivel}, solicitado ${r.quantidade}`);
            let restante = r.quantidade;
            const ordenados = candidatos.sort((a,b)=>Number(b.quantidade||0)-Number(a.quantidade||0));
            for (const e of ordenados) {
              if (restante <= 0) break;
              const debito = Math.min(Number(e.quantidade||0), restante);
              const { error } = await sb.from('estoque').update({ quantidade: Number(e.quantidade||0) - debito }).eq('id', e.id);
              if (error) throw error;
              restante -= debito;
            }
            const { error: movErr } = await sb.from('movimentacoes').insert({
              tipo: 'aplicacao', vacina_id: ordenados[0]?.vacina_id || vacina.id, quantidade: r.quantidade,
              origem_tipo: 'clinica', origem_clinica_id: clinicaId,
              observacao: `Rede Credenciada: ${r.quantidade} doses aplicadas | Clínica ${r.clinica} | Data ${r.data}${r.observacao ? ' | ' + r.observacao : ''}`,
              criado_por: userId,
            });
            if (movErr) throw movErr;
            imported++;
          }
        } catch (err) {
          ignored++;
          if (errors.length < 10) errors.push(`Linha ${r.linha}: ${err.message}`);
        }
        setProgress(Math.round(((i+1) / Math.max(rows.length,1)) * 100));
      }
      if (imp?.id) await sb.from('importacoes').update({ registros_importados: imported + updated, registros_ignorados: ignored, detalhes: { modalidade: 'rede_credenciada', modo: tab, erros: errors } }).eq('id', imp.id);
      setResult({ imported, updated, ignored, total: rows.length, errors });
      toast(`Importação de clínicas concluída: ${imported + updated} registros processados.`, ignored ? 'info' : 'success');
    } catch (err) {
      toast('Erro na importação de clínicas: ' + err.message, 'error');
    } finally { setImporting(false); }
  };

  return (
    <div className="card">
      <div className="card-header">
        <div>
          <div className="card-title">Importar Clínicas Parceiras</div>
          <div className="page-subtitle">Rede Credenciada — saldos e vacinados separados do In Company</div>
        </div>
        <button className="btn btn-secondary btn-sm" type="button" onClick={baixarModeloClinicas}>⬇️ Baixar modelo</button>
      </div>

      <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
        <button className={`btn btn-sm ${tab==='saldo'?'btn-primary':'btn-secondary'}`} onClick={()=>{setTab('saldo');setPreview(null);setResult(null);setFile(null);}}>📦 Importar saldo das clínicas</button>
        <button className={`btn btn-sm ${tab==='vacinados'?'btn-primary':'btn-secondary'}`} onClick={()=>{setTab('vacinados');setPreview(null);setResult(null);setFile(null);}}>💉 Importar vacinados das clínicas</button>
      </div>

      <div style={{padding:12,background:'var(--info-bg)',border:'1px solid rgba(8,145,178,0.2)',borderRadius:'var(--radius-sm)',marginBottom:12,fontSize:12,color:'var(--text-secondary)'}}>
        Modalidades: <strong>In Company</strong> = tarefas com <code>.IC</code>, <strong>Rede Credenciada</strong> = clínicas parceiras desta tela, <strong>Venda de Doses</strong> = tarefas com <code>.VD</code>.
      </div>

      {tab === 'saldo' && (
        <div style={{padding:12,background:'var(--bg-input)',border:'1px solid var(--border)',borderRadius:'var(--radius-sm)',marginBottom:12}}>
          <label style={{fontSize:12,fontWeight:600,marginRight:10}}>Como tratar saldo importado:</label>
          <select className="form-select" style={{width:220,display:'inline-block'}} value={modoSaldo} onChange={e=>setModoSaldo(e.target.value)}>
            <option value="substituir">Substituir saldo atual</option>
            <option value="somar">Somar ao saldo atual</option>
          </select>
        </div>
      )}

      <div className="upload-area" onClick={() => fileRef.current?.click()}
        onDragOver={e=>{e.preventDefault();e.currentTarget.classList.add('drag-over')}}
        onDragLeave={e=>e.currentTarget.classList.remove('drag-over')}
        onDrop={e=>{e.preventDefault();e.currentTarget.classList.remove('drag-over');handleFile(e.dataTransfer.files[0])}}>
        <div className="upload-icon">🏥</div>
        <div className="upload-text">{file ? file.name : 'Clique ou arraste o arquivo Excel das clínicas'}</div>
        <div className="upload-hint">Colunas: clínica, cnpj, vacina/produto, quantidade. Para vacinados: doses_aplicadas e data.</div>
        <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])} />
      </div>

      {preview && (
        <div style={{marginTop:16}}>
          <div style={{display:'flex',gap:12,marginBottom:12,flexWrap:'wrap'}}>
            <div className="stat-card" style={{flex:1,minWidth:120}}><div className="stat-label">Linhas</div><div className="stat-value" style={{fontSize:22}}>{preview.total}</div></div>
            <div className="stat-card" style={{flex:1,minWidth:120}}><div className="stat-label">Válidas</div><div className="stat-value" style={{fontSize:22,color:'var(--success)'}}>{preview.valid}</div></div>
            <div className="stat-card" style={{flex:1,minWidth:120}}><div className="stat-label">Doses</div><div className="stat-value" style={{fontSize:22,color:'var(--accent)'}}>{preview.totalDoses.toLocaleString('pt-BR')}</div></div>
            <div className="stat-card" style={{flex:1,minWidth:120}}><div className="stat-label">Ignoradas</div><div className="stat-value" style={{fontSize:22,color:preview.invalid?'var(--warning)':'var(--text-muted)'}}>{preview.invalid}</div></div>
          </div>
          {importing && <div style={{marginBottom:12}}><div style={{fontSize:13,color:'var(--text-secondary)',marginBottom:6}}>Importando... {progress}%</div><div className="progress-bar"><div className="progress-fill" style={{width:progress+'%'}} /></div></div>}
          {result && <div style={{padding:14,background:'var(--success-bg)',borderRadius:'var(--radius-sm)',border:'1px solid rgba(16,185,129,0.2)',marginBottom:12}}><div style={{fontSize:14,fontWeight:600,color:'var(--success)'}}>✓ Importação concluída</div><div style={{fontSize:13,color:'var(--text-secondary)',marginTop:4}}>{result.imported} novos · {result.updated} atualizados · {result.ignored} ignorados</div>{result.errors?.length > 0 && <div style={{fontSize:11,color:'var(--warning)',marginTop:8}}>{result.errors.map((e,i)=><div key={i}>{e}</div>)}</div>}</div>}
          <button className="btn btn-primary" onClick={doImport} disabled={importing || preview.valid === 0}>{importing ? 'Importando...' : `Importar ${preview.valid} registros de ${tab === 'saldo' ? 'saldo' : 'vacinados'}`}</button>
        </div>
      )}
    </div>
  );
}

function ImportEstoque() {
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState(null);
  const [importing, setImporting] = useState(false);
  const [progress, setProgress] = useState(0);
  const [result, setResult] = useState(null);
  const [modo, setModo] = useState('substituir');
  const toast = useContext(ToastContext);
  const fileRef = useRef();

  const norm = (v) => String(v || '').trim();
  const key = (v) => norm(v)
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
  const onlyDigits = (v) => String(v || '').replace(/\D/g, '');
  const parseQtd = (v) => {
    const raw = String(v ?? '0').replace(/\./g, '').replace(',', '.');
    const n = Number(raw);
    return Number.isFinite(n) ? Math.round(n) : 0;
  };
  const pick = (row, names) => {
    const rowKeys = Object.keys(row || {});
    for (const name of names) {
      const found = rowKeys.find(k => key(k) === key(name));
      if (found !== undefined) return row[found];
    }
    return '';
  };

  const baixarModeloEstoque = () => {
    const rows = [
      ['localizacao_tipo','local','vacina','quantidade','cpf_aplicador','base','aplicador','lote','validade','observacao'],
      ['base','Base Marília','Gripe',1000,'','Base Marília','','L001','2026-12-31','Estoque inicial base'],
      ['aplicador','Pedro Silva','Gripe',150,'12345678901','','Pedro Silva','L001','2026-12-31','Estoque em posse do aplicador'],
      ['base','Base Campinas','Gripe',500,'','Base Campinas','','L002','2026-12-31','Exemplo']
    ];
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [
      {wch:18},{wch:26},{wch:20},{wch:12},{wch:18},{wch:24},{wch:28},{wch:12},{wch:14},{wch:34}
    ];
    XLSX.utils.book_append_sheet(wb, ws, 'Estoque');
    XLSX.writeFile(wb, 'modelo_importacao_estoque.xlsx');
  };

  const normalizarLinha = (r, idx) => {
    const tipoRaw = pick(r, ['localizacao_tipo','tipo_estoque','tipo estoque','tipo','localização tipo','localizacao tipo']);
    const localRaw = pick(r, ['local','nome_local','nome local','base','aplicador']);
    const baseRaw = pick(r, ['base','nome_base','nome base']);
    const aplicadorRaw = pick(r, ['aplicador','nome_aplicador','nome aplicador','tutor']);
    const cpfRaw = pick(r, ['cpf_aplicador','cpf aplicador','cpf','documento']);
    const vacinaRaw = pick(r, ['vacina','nome_vacina','nome vacina','produto']);
    const qtdRaw = pick(r, ['quantidade','qtd','doses','dose','saldo','estoque']);
    const loteRaw = pick(r, ['lote']);
    const validadeRaw = pick(r, ['validade','data_validade','data validade']);
    const tipoKey = key(tipoRaw || localRaw);
    let localizacao_tipo = '';
    if (tipoKey.includes('base') || tipoKey.includes('cd')) localizacao_tipo = 'base';
    else if (tipoKey.includes('aplicador') || tipoKey.includes('tutor')) localizacao_tipo = 'aplicador';
    else if (tipoKey.includes('clinica') || tipoKey.includes('clinica')) localizacao_tipo = 'clinica';

    const quantidade = parseQtd(qtdRaw);
    const vacina = norm(vacinaRaw);
    const base = norm(baseRaw || (localizacao_tipo === 'base' ? localRaw : ''));
    const aplicador = norm(aplicadorRaw || (localizacao_tipo === 'aplicador' ? localRaw : ''));
    const cpf = onlyDigits(cpfRaw);
    const local = norm(localRaw || base || aplicador);

    const erros = [];
    if (!localizacao_tipo) erros.push('tipo inválido');
    if (!vacina) erros.push('vacina vazia');
    if (quantidade < 0) erros.push('quantidade negativa');
    if (localizacao_tipo === 'base' && !base && !local) erros.push('base/local vazio');
    if (localizacao_tipo === 'aplicador' && !aplicador && !cpf && !local) erros.push('aplicador/cpf/local vazio');
    if (localizacao_tipo === 'clinica') erros.push('clínica ainda não implementada no banco');

    return {
      linha: idx + 2,
      raw: r,
      localizacao_tipo,
      local,
      base,
      aplicador,
      cpf,
      vacina,
      quantidade,
      lote: norm(loteRaw),
      validade: excelDateToString(validadeRaw) || norm(validadeRaw),
      erros
    };
  };

  const handleFile = (f) => {
    if (!f) return;
    setFile(f); setResult(null);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'array', raw: true });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(sheet, { raw: true, defval: '' });
        const linhas = data.map(normalizarLinha);
        const valid = linhas.filter(r => r.erros.length === 0);
        const invalid = linhas.filter(r => r.erros.length > 0);
        const bases = valid.filter(r => r.localizacao_tipo === 'base');
        const aplicadores = valid.filter(r => r.localizacao_tipo === 'aplicador');
        const clinicas = linhas.filter(r => r.localizacao_tipo === 'clinica');
        setPreview({
          total: data.length,
          valid: valid.length,
          invalid: invalid.length,
          bases: bases.length,
          aplicadores: aplicadores.length,
          clinicas: clinicas.length,
          data: linhas,
          validRows: valid,
          invalidRows: invalid.slice(0, 20)
        });
      } catch (err) {
        toast('Erro ao ler arquivo de estoque: ' + err.message, 'error');
      }
    };
    reader.readAsArrayBuffer(f);
  };

  const findExistingEstoque = async (row, vacinaId, baseId, aplicadorId) => {
    let q = sb.from('estoque').select('id, quantidade')
      .eq('vacina_id', vacinaId)
      .eq('localizacao_tipo', row.localizacao_tipo);
    if (row.localizacao_tipo === 'base') q = q.eq('base_id', baseId);
    if (row.localizacao_tipo === 'aplicador') q = q.eq('aplicador_id', aplicadorId);
    const { data, error } = await q.limit(1);
    if (error) throw error;
    return (data || [])[0] || null;
  };

  const doImport = async () => {
    if (!preview) return;
    setImporting(true); setProgress(0);
    try {
      const [{ data: bases, error: bErr }, { data: aplicadores, error: aErr }, { data: vacinas, error: vErr }] = await Promise.all([
        sb.from('bases').select('id,nome,cidade,uf,ponto_partida'),
        sb.from('aplicadores').select('id,nome,cpf,cidade,uf'),
        sb.from('vacinas').select('id,nome')
      ]);
      if (bErr) throw bErr;
      if (aErr) throw aErr;
      if (vErr) throw vErr;

      const baseMap = {};
      (bases || []).forEach(b => {
        baseMap[key(b.nome)] = b.id;
        if (b.cidade && b.uf) baseMap[key(`${b.cidade}-${b.uf}`)] = b.id;
        if (b.ponto_partida) baseMap[key(b.ponto_partida)] = b.id;
      });
      const apCpfMap = {};
      const apNomeMap = {};
      (aplicadores || []).forEach(a => {
        if (a.cpf) apCpfMap[onlyDigits(a.cpf)] = a.id;
        apNomeMap[key(a.nome)] = a.id;
      });
      const vacinaMap = {};
      (vacinas || []).forEach(v => { vacinaMap[key(v.nome)] = v.id; });

      const { data: userData } = await sb.auth.getUser();
      const { data: imp } = await sb.from('importacoes').insert({
        tipo: 'estoque',
        nome_arquivo: file.name,
        registros_total: preview.valid,
        usuario_id: userData?.user?.id || null
      }).select().single();

      let imported = 0, updated = 0, inserted = 0, ignored = 0;
      const errors = [];
      const rows = preview.validRows;
      for (let i = 0; i < rows.length; i++) {
        const r = rows[i];
        try {
          const vacinaId = vacinaMap[key(r.vacina)];
          let baseId = null;
          let aplicadorId = null;
          if (r.localizacao_tipo === 'base') baseId = baseMap[key(r.base || r.local)];
          if (r.localizacao_tipo === 'aplicador') aplicadorId = apCpfMap[r.cpf] || apNomeMap[key(r.aplicador || r.local)];

          if (!vacinaId) throw new Error(`Vacina não encontrada: ${r.vacina}`);
          if (r.localizacao_tipo === 'base' && !baseId) throw new Error(`Base não encontrada: ${r.base || r.local}`);
          if (r.localizacao_tipo === 'aplicador' && !aplicadorId) throw new Error(`Aplicador não encontrado: ${r.aplicador || r.local || r.cpf}`);

          const existing = await findExistingEstoque(r, vacinaId, baseId, aplicadorId);
          if (existing) {
            const novaQtd = modo === 'somar' ? Number(existing.quantidade || 0) + r.quantidade : r.quantidade;
            const { error } = await sb.from('estoque').update({ quantidade: novaQtd }).eq('id', existing.id);
            if (error) throw error;
            updated++;
          } else {
            const payload = {
              vacina_id: vacinaId,
              localizacao_tipo: r.localizacao_tipo,
              base_id: baseId,
              aplicador_id: aplicadorId,
              quantidade: r.quantidade
            };
            const { error } = await sb.from('estoque').insert(payload);
            if (error) throw error;
            inserted++;
          }
          imported++;
        } catch (err) {
          ignored++;
          if (errors.length < 15) errors.push(`Linha ${r.linha}: ${err.message}`);
        }
        setProgress(Math.round(((i + 1) / Math.max(rows.length, 1)) * 100));
      }

      ignored += preview.invalid;
      if (imp?.id) await sb.from('importacoes').update({
        registros_importados: imported,
        registros_ignorados: ignored
      }).eq('id', imp.id);
      setResult({ imported, updated, inserted, ignored, total: preview.total, errors });
      toast(`Estoque importado: ${imported} registros.`, imported > 0 ? 'success' : 'error');
    } catch (err) {
      toast('Erro na importação de estoque: ' + err.message, 'error');
    } finally {
      setImporting(false);
    }
  };

  return (
    <div className="card">
      <div className="card-header">
        <div>
          <div className="card-title">Importar Estoque Inicial</div>
          <div className="page-subtitle">Migração do estoque antigo para Base ou Aplicador</div>
        </div>
        <button className="btn btn-secondary btn-sm" type="button" onClick={baixarModeloEstoque}>⬇️ Baixar modelo Excel</button>
      </div>
      <p style={{fontSize:13,color:'var(--text-secondary)',marginBottom:12}}>
        Colunas aceitas: <strong>localizacao_tipo</strong>, <strong>local</strong>, <strong>vacina</strong>, <strong>quantidade</strong>, <strong>cpf_aplicador</strong>, <strong>base</strong>, <strong>aplicador</strong>, lote e validade. Também aceita nomes antigos como Tipo Estoque, Local, Vacina e Quantidade.
      </p>

      <div className="form-grid" style={{marginBottom:14}}>
        <div className="form-group">
          <label className="form-label">Como atualizar o estoque?</label>
          <select className="form-select" value={modo} onChange={e=>setModo(e.target.value)}>
            <option value="substituir">Substituir saldo atual pelo valor da planilha</option>
            <option value="somar">Somar valor da planilha ao saldo atual</option>
          </select>
        </div>
      </div>

      <div className="upload-area" onClick={() => fileRef.current?.click()}
        onDragOver={e=>{e.preventDefault();e.currentTarget.classList.add('drag-over')}}
        onDragLeave={e=>e.currentTarget.classList.remove('drag-over')}
        onDrop={e=>{e.preventDefault();e.currentTarget.classList.remove('drag-over');handleFile(e.dataTransfer.files[0])}}>
        <div className="upload-icon">📦</div>
        <div className="upload-text">{file ? file.name : 'Clique ou arraste o arquivo Excel de estoque'}</div>
        <div className="upload-hint">Para base, preencha base/local. Para aplicador, use CPF do aplicador ou nome do aplicador.</div>
        <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])} />
      </div>

      {preview && <div style={{marginTop:16}}>
        <div style={{display:'flex',gap:12,marginBottom:12,flexWrap:'wrap'}}>
          <div className="stat-card" style={{flex:1,minWidth:120}}><div className="stat-label">Linhas</div><div className="stat-value" style={{fontSize:22}}>{preview.total}</div></div>
          <div className="stat-card" style={{flex:1,minWidth:120}}><div className="stat-label">Válidas</div><div className="stat-value" style={{fontSize:22,color:'var(--success)'}}>{preview.valid}</div></div>
          <div className="stat-card" style={{flex:1,minWidth:120}}><div className="stat-label">Bases</div><div className="stat-value" style={{fontSize:22}}>{preview.bases}</div></div>
          <div className="stat-card" style={{flex:1,minWidth:120}}><div className="stat-label">Aplicadores</div><div className="stat-value" style={{fontSize:22}}>{preview.aplicadores}</div></div>
          <div className="stat-card" style={{flex:1,minWidth:120}}><div className="stat-label">Ignoradas</div><div className="stat-value" style={{fontSize:22,color:preview.invalid>0?'var(--warning)':'var(--text-muted)'}}>{preview.invalid}</div></div>
        </div>

        {preview.invalidRows.length > 0 && <div style={{padding:12,background:'var(--warning-bg)',border:'1px solid rgba(245,158,11,0.3)',borderRadius:'var(--radius-sm)',marginBottom:12,fontSize:12,color:'var(--warning)'}}>
          <strong>Atenção:</strong> {preview.invalid} linhas têm problema e serão ignoradas. Exemplos: {preview.invalidRows.slice(0,5).map(r => `Linha ${r.linha}: ${r.erros.join(', ')}`).join(' · ')}
        </div>}

        {importing && <div style={{marginBottom:12}}><div style={{fontSize:13,color:'var(--text-secondary)',marginBottom:6}}>Importando... {progress}%</div><div className="progress-bar"><div className="progress-fill" style={{width:progress+'%'}} /></div></div>}
        {result && <div style={{padding:14,background: result.imported > 0 ? 'var(--success-bg)' : 'var(--danger-bg)',borderRadius:'var(--radius-sm)',border:`1px solid ${result.imported > 0 ? 'rgba(16,185,129,0.2)' : 'rgba(239,68,68,0.2)'}`,marginBottom:12}}>
          <div style={{fontSize:14,fontWeight:600,color: result.imported > 0 ? 'var(--success)' : 'var(--danger)'}}>✓ Importação finalizada</div>
          <div style={{fontSize:13,color:'var(--text-secondary)',marginTop:4}}>{result.imported} processados · {result.inserted} novos · {result.updated} atualizados · {result.ignored} ignorados · {result.total} total</div>
          {result.errors?.length > 0 && <div style={{fontSize:12,color:'var(--warning)',marginTop:8}}>{result.errors.join(' · ')}</div>}
        </div>}
        <button className="btn btn-primary" onClick={doImport} disabled={importing || preview.valid === 0}>{importing ? 'Importando...' : `Importar ${preview.valid} registros de estoque`}</button>
      </div>}
    </div>
  );
}

// TAREFAS (visualização)
// ═══════════════════════════════════════════════
function TarefasPage({ profile }) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState('');
  const [dataInicioFilter, setDataInicioFilter] = useState('');
  const [dataFimFilter, setDataFimFilter] = useState('');
  const [page, setPage] = useState(0);
  const PAGE_SIZE = 50;
  const toast = useContext(ToastContext);

  const LOGISTICA_LABELS = {
    nao_roteirizado: 'Não roteirizado',
    roteirizado: 'Roteirizado',
    montado: 'Montado',
    carregado: 'Carregado',
    em_rota: 'Em rota',
    concluido: 'Concluído'
  };
  const LOGISTICA_BADGES = {
    nao_roteirizado: 'badge-gray',
    roteirizado: 'badge-blue',
    montado: 'badge-yellow',
    carregado: 'badge-cyan',
    em_rota: 'badge-green',
    concluido: 'badge-green'
  };
  const normalizaStatusLogistica = (status) => {
    const st = String(status || '').toLowerCase();
    if (['concluida','concluído','entregue','finalizada','finalizado'].includes(st)) return 'concluido';
    if (['em_transito','em trânsito','em rota'].includes(st)) return 'em_rota';
    if (['carregada','carregado'].includes(st)) return 'carregado';
    if (['pronta','montada','montado'].includes(st)) return 'montado';
    if (['montagem'].includes(st)) return 'roteirizado';
    if (['planejada','planejado'].includes(st)) return 'roteirizado';
    return 'roteirizado';
  };
  const codigosDaObservacao = (obs) => String(obs || '').match(/[A-Z0-9]+(?:\.[A-Z0-9&]+)+/gi) || [];

  const load = async () => {
    setLoading(true);
    let q = sb.from('tarefas').select('*', { count: 'exact' })
      .order('data_inicio', { ascending: true })
      .range(page * PAGE_SIZE, (page + 1) * PAGE_SIZE - 1);
    if (search) q = q.or(`codigo.ilike.%${search}%,cliente.ilike.%${search}%,cidade_campanha.ilike.%${search}%`);
    if (statusFilter) q = q.eq('status', statusFilter);
    if (dataInicioFilter) q = q.gte('data_inicio', dataInicioFilter);
    if (dataFimFilter) q = q.lte('data_inicio', dataFimFilter);
    const { data, error, count } = await q;
    if (error) { toast(error.message, 'error'); setLoading(false); return; }

    const codigosPagina = new Set((data || []).map(t => String(t.codigo || '').trim()).filter(Boolean));
    const logMap = {};
    try {
      const { data: remessas } = await sb.from('remessas').select('status, observacao').limit(20000);
      (remessas || []).forEach(rem => {
        const st = normalizaStatusLogistica(rem.status);
        codigosDaObservacao(rem.observacao).forEach(c => {
          const cod = c.trim();
          if (codigosPagina.has(cod)) logMap[cod] = st;
        });
      });
    } catch (e) {
      console.warn('Não foi possível carregar status de logística', e);
    }

    const enriched = (data || []).map(t => ({
      ...t,
      status_logistica_calc: t.status_logistica || logMap[String(t.codigo || '').trim()] || 'nao_roteirizado'
    }));
    setItems({ data: enriched, count: count || 0 });
    setLoading(false);
  };
  useEffect(() => { load(); }, [page, statusFilter, dataInicioFilter, dataFimFilter]);

  const isAdmin = profile?.role === 'admin';

  const updateStatusLogistica = async (tarefaId, novoStatus) => {
    if (!isAdmin) return;
    const anterior = items.data || [];
    setItems(prev => ({
      ...prev,
      data: (prev.data || []).map(t => t.id === tarefaId ? { ...t, status_logistica: novoStatus, status_logistica_calc: novoStatus } : t)
    }));
    const { error } = await sb.from('tarefas').update({ status_logistica: novoStatus }).eq('id', tarefaId);
    if (error) {
      setItems(prev => ({ ...prev, data: anterior }));
      toast('Erro ao salvar status da logística. Rode o SQL da coluna status_logistica se ainda não rodou. Detalhe: ' + error.message, 'error');
    } else {
      toast('Status da logística atualizado!', 'success');
    }
  };

  const handleSearch = (e) => { e.preventDefault(); setPage(0); load(); };

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Tarefas</div>
          <div className="page-subtitle">{items.count || 0} tarefas importadas</div>
        </div>
      </div>

      <div className="card" style={{marginBottom:16}}>
        <form onSubmit={handleSearch} style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
          <div className="form-group" style={{flex:1,minWidth:200}}>
            <label className="form-label">Buscar</label>
            <input className="form-input sm" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Código, cliente ou cidade..." />
          </div>
          <div className="form-group">
            <label className="form-label">Data inicial</label>
            <input className="form-input sm" type="date" onClick={openDatePicker} onFocus={openDatePicker} value={dataInicioFilter} onChange={e=>{setDataInicioFilter(e.target.value);setPage(0);}} />
          </div>
          <div className="form-group">
            <label className="form-label">Data final</label>
            <input className="form-input sm" type="date" onClick={openDatePicker} onFocus={openDatePicker} value={dataFimFilter} onChange={e=>{setDataFimFilter(e.target.value);setPage(0);}} />
          </div>
          <div className="form-group">
            <label className="form-label">Status</label>
            <select className="form-select" style={{padding:'7px 10px',fontSize:13}} value={statusFilter} onChange={e=>{setStatusFilter(e.target.value);setPage(0);}}>
              <option value="">Todos</option>
              {Object.entries(STATUS_LABELS).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
            </select>
          </div>
          <button className="btn btn-secondary btn-sm" type="button" onClick={()=>{setDataInicioFilter('');setDataFimFilter('');setPage(0);}}>Limpar datas</button>
          <button className="btn btn-primary btn-sm" type="submit">Buscar</button>
        </form>
      </div>

      <div className="card">
        <div className="table-wrap">
          <table>
            <thead>
              <tr><th>Código</th><th>Cliente</th><th>Cidade</th><th>UF</th><th>Data</th><th>Vacina</th><th>Doses Prev.</th><th>Doses Aplic.</th><th>Status</th><th>Status Logística</th><th>Base</th></tr>
            </thead>
            <tbody>
              {(items.data || []).map(t => (
                <tr key={t.id}>
                  <td className="mono" style={{fontSize:11,maxWidth:220,overflow:'hidden',textOverflow:'ellipsis'}}>{t.codigo}</td>
                  <td style={{maxWidth:180,overflow:'hidden',textOverflow:'ellipsis'}}>{t.cliente}</td>
                  <td>{t.cidade_campanha}</td>
                  <td className="mono">{t.uf_campanha}</td>
                  <td>{t.data_inicio ? new Date(t.data_inicio+'T12:00:00').toLocaleDateString('pt-BR') : '—'}</td>
                  <td><span style={{fontSize:11,fontWeight:600,color:'var(--accent)',whiteSpace:'nowrap'}}>{t.vacina || '—'}</span></td>
                  <td className="mono">{t.doses_previstas}</td>
                  <td className="mono">{t.doses_aplicadas}</td>
                  <td><span className={`badge ${STATUS_BADGES[t.status]||'badge-gray'}`}>{STATUS_LABELS[t.status]||t.status}</span></td>
                  <td>{isAdmin ? (
                    <select className="form-select" style={{padding:'6px 8px',fontSize:12,minWidth:150}} value={t.status_logistica_calc || 'nao_roteirizado'} onChange={e=>updateStatusLogistica(t.id, e.target.value)}>
                      {Object.entries(LOGISTICA_LABELS).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
                    </select>
                  ) : (
                    <span className={`badge ${LOGISTICA_BADGES[t.status_logistica_calc]||'badge-gray'}`}>{LOGISTICA_LABELS[t.status_logistica_calc]||'Não roteirizado'}</span>
                  )}</td>
                  <td>{t.base_nome || '—'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        {items.count > PAGE_SIZE && (
          <div style={{display:'flex',justifyContent:'center',gap:8,marginTop:16}}>
            <button className="btn btn-secondary btn-sm" disabled={page===0} onClick={()=>setPage(p=>p-1)}>← Anterior</button>
            <span style={{padding:'6px 12px',fontSize:13,color:'var(--text-muted)'}}>
              {page*PAGE_SIZE+1}–{Math.min((page+1)*PAGE_SIZE,items.count)} de {items.count}
            </span>
            <button className="btn btn-secondary btn-sm" disabled={(page+1)*PAGE_SIZE>=items.count} onClick={()=>setPage(p=>p+1)}>Próxima →</button>
          </div>
        )}
      </div>
    </div>
  );
}
