        </div>
      </div>
    </Modal>
  );
}

// ── Modal de Assinatura Digital para Entrega ──
function AssinaturaEntregaModal({ remessa, rota, onConfirm, onClose }) {
  const canvasRef = React.useRef(null);
  const [drawing, setDrawing] = React.useState(false);
  const [hasSignature, setHasSignature] = React.useState(false);
  const [nome, setNome] = React.useState('');
  const [cpf, setCpf] = React.useState('');
  const [saving, setSaving] = React.useState(false);

  // Pré-preencher nome e CPF do aplicador
  React.useEffect(() => {
    const n = remessa.destino_tipo === 'aplicador' ? remessa.aplicadores?.nome : remessa.bases?.nome;
    const c = remessa.destino_tipo === 'aplicador' ? remessa.aplicadores?.cpf : '';
    // Fallback: extrair da observação
    let nomeF = n || '';
    let cpfF = c || '';
    if (!nomeF) {
      const obs = remessa.observacao || '';
      const mN = obs.match(/^([^(|]+)/);
      const mC = obs.match(/\(([^)]+)\)/);
      if (mN) nomeF = mN[1].trim();
      if (mC) cpfF = mC[1].trim();
    }
    setNome(nomeF);
    setCpf(cpfF);
  }, [remessa]);

  // Canvas setup
  React.useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * 2;
    canvas.height = rect.height * 2;
    ctx.scale(2, 2);
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }, []);

  const getPos = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] : e;
    return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
  };

  const startDraw = (e) => {
    e.preventDefault();
    setDrawing(true);
    const ctx = canvasRef.current.getContext('2d');
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  };

  const draw = (e) => {
    e.preventDefault();
    if (!drawing) return;
    const ctx = canvasRef.current.getContext('2d');
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    setHasSignature(true);
  };

  const endDraw = (e) => {
    e.preventDefault();
    setDrawing(false);
  };

  const limpar = () => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    setHasSignature(false);
  };

  const confirmar = async () => {
    if (!hasSignature) { alert('Por favor, assine no campo abaixo.'); return; }
    if (!nome.trim()) { alert('Informe o nome do responsável.'); return; }
    setSaving(true);
    const sigData = canvasRef.current.toDataURL('image/png');
    const now = new Date();
    const sigInfo = '\n[ASSINATURA ' + now.toLocaleTimeString('pt-BR') + '] Recebido por: ' + nome.trim() + (cpf.trim() ? ' (CPF: ' + cpf.trim() + ')' : '') + ' [SIG_IMG:' + sigData + ':END_SIG]';
    const obsAtual = remessa.observacao || '';

    // Tentar salvar localização da entrega
    let locStr = '';
    try {
      const pos = await new Promise((res, rej) => {
        navigator.geolocation.getCurrentPosition(p => res(p), () => res(null), {timeout:5000});
      });
      if (pos) locStr = ' [ENTREGA_LOCAL:' + pos.coords.latitude.toFixed(6) + ',' + pos.coords.longitude.toFixed(6) + ':END_LOCAL]';
    } catch(e) {}

    await sb.from('remessas').update({
      observacao: obsAtual + sigInfo + locStr,
    }).eq('id', remessa.id);
    await onConfirm(remessa.id);
    setSaving(false);
  };

  const destNome = remessa.destino_tipo === 'aplicador' ? remessa.aplicadores?.nome : remessa.bases?.nome;
  const doses = (remessa.remessa_itens||[]).reduce((s,i)=>s+i.quantidade,0);

  return (
    <Modal title="Confirmar Entrega — Assinatura" onClose={onClose} large>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        {/* Resumo da entrega */}
        <div style={{padding:12,background:'var(--bg-input)',borderRadius:'var(--radius-sm)',border:'1px solid var(--border)'}}>
          <div style={{fontSize:13,fontWeight:600,marginBottom:6}}>Remessa: <span style={{color:'var(--accent)',fontFamily:'JetBrains Mono'}}>{remessa.codigo_rastreio}</span></div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,fontSize:12}}>
            <div><span style={{color:'var(--text-muted)'}}>Aplicador:</span> <strong>{destNome||nome||'—'}</strong></div>
            <div><span style={{color:'var(--text-muted)'}}>Doses:</span> <strong style={{color:'var(--success)'}}>{doses}</strong></div>
          </div>
          {(remessa.remessa_itens||[]).length > 0 && (
            <div style={{marginTop:8,display:'flex',gap:6,flexWrap:'wrap'}}>
              {(remessa.remessa_itens||[]).map((it,i) => (
                <span key={i} style={{fontSize:11,padding:'2px 8px',borderRadius:4,fontWeight:600,
                  background:'var(--accent-subtle)',color:'var(--accent)'}}>
                  💉 {it.vacinas?.nome}: {it.quantidade}
                </span>
              ))}
            </div>
          )}
        </div>

        {/* Nome e CPF */}
        <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:10}}>
          <div className="form-group" style={{marginBottom:0}}>
            <label className="form-label">Nome do Responsável <span style={{color:'var(--danger)'}}>*</span></label>
            <input className="form-input" value={nome} onChange={e=>setNome(e.target.value)} placeholder="Nome completo" />
          </div>
          <div className="form-group" style={{marginBottom:0}}>
            <label className="form-label">CPF</label>
            <input className="form-input" value={cpf} onChange={e=>setCpf(e.target.value)} placeholder="000.000.000-00" />
          </div>
        </div>

        {/* Área de assinatura */}
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
            <label className="form-label" style={{marginBottom:0}}>Assinatura <span style={{color:'var(--danger)'}}>*</span></label>
            <button className="btn btn-secondary btn-sm" onClick={limpar} style={{fontSize:10}}>↺ Limpar</button>
          </div>
          <div style={{border:'2px solid var(--border)',borderRadius:'var(--radius)',background:'#fff',position:'relative',overflow:'hidden'}}>
            <canvas ref={canvasRef}
              style={{width:'100%',height:160,cursor:'crosshair',touchAction:'none',display:'block'}}
              onMouseDown={startDraw} onMouseMove={draw} onMouseUp={endDraw} onMouseLeave={endDraw}
              onTouchStart={startDraw} onTouchMove={draw} onTouchEnd={endDraw} />
            {!hasSignature && (
              <div style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',
                color:'#ccc',fontSize:13,pointerEvents:'none',textAlign:'center'}}>
                Assine aqui com o dedo ou mouse
              </div>
            )}
          </div>
        </div>

        {/* Botões */}
        <div className="modal-actions">
          <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
          <button className="btn btn-success" onClick={confirmar} disabled={saving || !hasSignature || !nome.trim()}>
            {saving ? 'Registrando...' : '✓ Confirmar Entrega com Assinatura'}
          </button>
        </div>
      </div>
    </Modal>
  );
}

function MotoristaRota({ rota: rotaInit, onBack, isAdmin }) {
  const [rota, setRota] = useState(rotaInit);
  const [remessas, setRemessas] = useState([]);
  const [loading, setLoading] = useState(true);
  const [checkoutModal, setCheckoutModal] = useState(false);
  const [checkinModal, setCheckinModal] = useState(false);
  const [assinaturaModal, setAssinaturaModal] = useState(null);
  const [entregaDetalhe, setEntregaDetalhe] = useState(null);
  const [gpsAtivo, setGpsAtivo] = useState(false);
  const toast = useContext(ToastContext);

  const ST_REM = { planejada:'Planejada', montagem:'Montagem', pronta:'Pronta', carregada:'Carregada', em_transito:'Em Trânsito', concluida:'Entregue', cancelada:'Cancelada' };
  const SB_REM = { planejada:'badge-gray', montagem:'badge-yellow', pronta:'badge-cyan', carregada:'badge-blue', em_transito:'badge-green', concluida:'badge-gray', cancelada:'badge-red' };

  const load = async () => {
    setLoading(true);
    const [remRes, rotaRes] = await Promise.all([
      sb.from('remessas')
        .select('*, remessa_itens(quantidade, vacinas(nome)), bases(nome,cidade,uf), aplicadores(nome,cpf,cidade,uf,endereco)')
        .eq('rota_id', rota.id).order('ordem_entrega'),
      sb.from('rotas')
        .select('*, bases!rotas_base_origem_id_fkey(nome), profiles!rotas_motorista_id_fkey(nome)')
        .eq('id', rota.id).single()
    ]);
    setRemessas(remRes.data || []);
    if (rotaRes.data) setRota(rotaRes.data);
    setLoading(false);
  };
  useEffect(() => { load(); }, []);

  // Helper: pegar localização atual
  const getLocation = () => new Promise((resolve) => {
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      () => resolve(null),
      { timeout: 8000 }
    );
  });

  const iniciarRota = async () => {
    toast('Registrando localização...', 'info');
    const loc = await getLocation();
    const now = new Date().toISOString();
    const payload = {
      status: 'em_transito',
      checkin_at: now,
      ...(loc ? { checkin_lat: loc.lat, checkin_lng: loc.lng, current_lat: loc.lat, current_lng: loc.lng, current_location_at: now } : {})
    };
    const { error } = await sb.from('rotas').update(payload).eq('id', rota.id);
    if (error) { toast(error.message, 'error'); return; }
    await sb.from('remessas').update({ status: 'em_transito' }).eq('rota_id', rota.id).in('status', ['pronta','carregada','montagem']);
    toast('Check-in registrado! Boa viagem! 🚀', 'success');
    setCheckinModal(false);
    iniciarTracking();
    load();
  };

  // Tracking contínuo de localização
  const trackingRef = React.useRef(null);

  const iniciarTracking = () => {
    if (trackingRef.current) return;
    if (!navigator.geolocation) return;

    const enviarLocalizacao = async (position) => {
      const now = new Date().toISOString();
      setGpsAtivo(true);
      console.log('[VacinaLog] Enviando GPS:', position.coords.latitude, position.coords.longitude);
      const { error } = await sb.from('rotas').update({
        current_lat: position.coords.latitude,
        current_lng: position.coords.longitude,
        current_location_at: now,
        current_speed: position.coords.speed ? Math.round(position.coords.speed * 3.6) : null
      }).eq('id', rota.id);
      if (error) {
        console.error('[VacinaLog] Erro ao salvar GPS:', error.message);
        // Se coluna não existe, tenta só com lat/lng sem speed
        if (error.message.includes('current_speed') || error.message.includes('current_')) {
          await sb.from('rotas').update({
            current_lat: position.coords.latitude,
            current_lng: position.coords.longitude,
            current_location_at: now,
          }).eq('id', rota.id);
        }
      }
    };

    const onErro = (err) => {
      setGpsAtivo(false);
      console.warn('GPS erro:', err.message);
    };

    trackingRef.current = navigator.geolocation.watchPosition(
      enviarLocalizacao,
      onErro,
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
    );
    setGpsAtivo(true);
    console.log('[VacinaLog] Tracking GPS iniciado');
  };

  const pararTracking = () => {
    if (trackingRef.current) {
      navigator.geolocation.clearWatch(trackingRef.current);
      trackingRef.current = null;
      setGpsAtivo(false);
      console.log('[VacinaLog] Tracking GPS parado');
    }
  };

  // Iniciar tracking quando rota estiver em_transito
  // Usar ref para evitar parar/reiniciar a cada re-render
  const trackingStartedRef = React.useRef(false);

  useEffect(() => {
    if (rota.status === 'em_transito' && !trackingStartedRef.current) {
      trackingStartedRef.current = true;
      iniciarTracking();
    }
    // Cleanup APENAS quando o componente desmonta (não a cada mudança de status)
    return () => {
      if (!document.contains(document.getElementById('root'))) {
        pararTracking();
      }
    };
  }, [rota.status]);

  // Cleanup definitivo ao desmontar o componente
  useEffect(() => {
    return () => pararTracking();
  }, []);

  const fazerCheckoutComTracking = async (obs) => {
    pararTracking();
    const loc = await getLocation();
    const now = new Date().toISOString();
    const { error } = await sb.from('rotas').update({
      status: 'concluida',
      checkout_at: now,
      checkout_obs: obs || null,
      current_lat: null, current_lng: null, current_location_at: null, // limpar posição
      ...(loc ? { checkout_lat: loc.lat, checkout_lng: loc.lng } : {})
    }).eq('id', rota.id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Check-out registrado! Rota finalizada.', 'success');
    setCheckoutModal(false);
    load();
    setTimeout(() => onBack(), 1500);
  };

  const confirmarEntrega = async (remId) => {
    // Buscar dados completos da remessa com itens
    const { data: rem, error: remErr } = await sb.from('remessas')
      .select('*, remessa_itens(id, vacina_id, quantidade, vacinas(nome, produto_nome)), aplicadores(nome, cpf)')
      .eq('id', remId).single();
    if (remErr) { toast(remErr.message, 'error'); return; }

    const itens = rem.remessa_itens || [];

    // Resolver destino correto (aplicador)
    let destTipo = rem.destino_tipo;
    let destId = destTipo === 'aplicador' ? rem.destino_aplicador_id : rem.destino_base_id;

    // Se destino incorreto, resolver pelo CPF na observação
    if ((!destId || destTipo !== 'aplicador') && rem.observacao) {
      const mCPF = rem.observacao.match(/\(([^)]+)\)/);
      if (mCPF) {
        const { data: ap } = await sb.from('aplicadores').select('id').eq('cpf', mCPF[1].trim()).single();
        if (ap) {
          destTipo = 'aplicador';
          destId = ap.id;
          await sb.from('remessas').update({
            destino_tipo: 'aplicador', destino_aplicador_id: ap.id, destino_base_id: null
          }).eq('id', remId);
        }
      }
    }

    if (!destId || destTipo !== 'aplicador') {
      toast('Não foi possível identificar o aplicador de destino. Entrega não concluída para evitar estoque errado.', 'error');
      return;
    }

    // A validação de saldo agora é feita dentro da função SQL transferir_estoque_produto,
    // de forma atômica e por produto consolidado, sem prender no lote.

    // Transferir estoque base → aplicador para cada item.
    // Usa a rotina direta robusta para garantir: debita base, credita aplicador e registra movimentação.
    if (itens.length > 0) {
      let erros = 0;
      for (const item of itens) {
        const obs = [
          'Entrega confirmada',
          'Rota: ' + rota.codigo,
          'Remessa: ' + rem.codigo_rastreio,
          'Aplicador: ' + (rem.aplicadores?.nome || destId),
          item.vacinas?.nome ? 'Vacina: ' + item.vacinas.nome : null
        ].filter(Boolean).join(' | ');

        const transferOk = await transferirEstoqueDireto({
          vacina_id: item.vacina_id,
          quantidade: Number(item.quantidade || 0),
          origem_base_id: rota.base_origem_id,
          destino_aplicador_id: destId,
          remessa_id: remId,
          observacao: obs
        });

        if (!transferOk) {
          erros++;
          toast('Erro ao transferir ' + (item.vacinas?.nome||'') + ': entrega não concluída.', 'error');
        }
      }
      if (erros > 0) return;
      toast('Estoque transferido para o aplicador ✓', 'success');
    } else {
      toast('Remessa sem itens — entrega confirmada sem movimentação de estoque', 'info');
    }

    // Marcar remessa como concluída
    const { error } = await sb.from('remessas').update({ status: 'concluida' }).eq('id', remId);
    if (error) { toast(error.message, 'error'); return; }

    // Atualizar status_logistica das tarefas vinculadas para 'entregue'
    await atualizarStatusLogisticaRemessa(rem, destId);

    toast('Entrega confirmada! ✓', 'success');
    load();
    const { data } = await sb.from('remessas').select('status').eq('rota_id', rota.id);
    const allDone = (data||[]).every(r => ['concluida','cancelada'].includes(r.status));
    if (allDone) toast('Todas as entregas feitas! Faça o check-out quando chegar na empresa.', 'success');
  };

  // Atualizar status_logistica das tarefas vinculadas à remessa
  const atualizarStatusLogisticaRemessa = async (rem, aplicadorId) => {
    try {
      // Buscar escalas do aplicador com tarefas vinculadas
      if (!aplicadorId) return;
      const { data: escalas } = await sb.from('escalas')
        .select('tarefa_id')
        .eq('aplicador_id', aplicadorId)
        .not('tarefa_id', 'is', null);
      const tarefaIds = [...new Set((escalas||[]).map(e => e.tarefa_id).filter(Boolean))];
      if (tarefaIds.length === 0) return;
      // Atualizar status_logistica = 'entregue' para essas tarefas
      await sb.from('tarefas').update({ status_logistica: 'entregue' }).in('id', tarefaIds);
    } catch(e) {
      console.warn('Não foi possível atualizar status_logistica:', e.message);
    }
  };

  const fazerCheckout = fazerCheckoutComTracking;

  const reportarProblema = async (remId, problema) => {
    const obs = (remessas.find(r=>r.id===remId)?.observacao||'') + '\n[PROBLEMA ' + new Date().toLocaleTimeString('pt-BR') + '] ' + problema;
    const { error } = await sb.from('remessas').update({ observacao: obs }).eq('id', remId);
    if (error) toast(error.message, 'error');
    else { toast('Problema reportado', 'success'); load(); }
  };

  const abrirMaps = (destEnd, destCidade) => {
    const q = encodeURIComponent([destEnd, destCidade, 'Brasil'].filter(Boolean).join(', '));
    // Tenta abrir o app Maps nativo, fallback para web
    const urlApp = `geo:0,0?q=${q}`;
    const urlWeb = `https://www.google.com/maps/search/?api=1&query=${q}`;
    // Em mobile abre o app; em desktop abre no browser
    const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
    window.open(isMobile ? urlApp : urlWeb, '_blank');
  };

  // Ocultar caixas com 0 doses do motorista (aplicador já tem estoque)
  const remessasVisiveis = isAdmin ? remessas : remessas.filter(r => {
    const doses = (r.remessa_itens||[]).reduce((s,i)=>s+i.quantidade,0);
    return doses > 0 || r.status === 'concluida' || r.status === 'cancelada';
  });

  const totalDoses = remessas.reduce((s,r) => s + (r.remessa_itens||[]).reduce((ss,i)=>ss+i.quantidade,0), 0);
  const entregues = remessas.filter(r => r.status === 'concluida').length;
  const pendentes = remessas.filter(r => !['concluida','cancelada'].includes(r.status)).length;
  const progresso = remessas.length > 0 ? (entregues / remessas.length * 100) : 0;
  const todasEntregues = remessas.length > 0 && pendentes === 0;

  // Formatação de data/hora
  const fmtDateTime = (iso) => iso ? new Date(iso).toLocaleString('pt-BR') : '—';
  const calcDuracao = (ini, fim) => {
    if (!ini || !fim) return null;
    const diff = new Date(fim) - new Date(ini);
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    return `${h}h ${m}min`;
  };

  return (
    <div>
      {/* Header */}
      <div className="page-header">
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <button className="btn btn-secondary btn-sm" onClick={onBack}>← Voltar</button>
          <div>
            <div className="page-title">Rota {rota.codigo}</div>
            <div className="page-subtitle">{rota.bases?.nome} · {rota.data_prevista ? new Date(rota.data_prevista+'T12:00:00').toLocaleDateString('pt-BR') : '—'}</div>
          </div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          {rota.status === 'pronta' && (
            <button className="btn btn-success" style={{fontSize:15,padding:'10px 20px'}} onClick={() => setCheckinModal(true)}>
              🚀 Iniciar Rota
            </button>
          )}
          {rota.status === 'em_transito' && (
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <div style={{display:'flex',alignItems:'center',gap:6,padding:'6px 12px',borderRadius:20,
                background: gpsAtivo ? 'rgba(16,185,129,0.15)' : 'rgba(107,114,128,0.15)',
                border: `1px solid ${gpsAtivo ? 'rgba(16,185,129,0.4)' : 'rgba(107,114,128,0.3)'}`,
                fontSize:12,fontWeight:600,
                color: gpsAtivo ? 'var(--success)' : 'var(--text-muted)'}}>
                <span style={{width:8,height:8,borderRadius:'50%',background: gpsAtivo ? 'var(--success)' : '#6b7280',
                  boxShadow: gpsAtivo ? '0 0 6px var(--success)' : 'none',
                  animation: gpsAtivo ? 'pulse 2s infinite' : 'none', display:'inline-block'}} />
                {gpsAtivo ? 'GPS Ativo' : 'GPS Offline'}
              </div>
            </div>
          )}
          {rota.status === 'em_transito' && todasEntregues && (
            <button className="btn btn-primary" onClick={() => setCheckoutModal(true)}>
              🏁 Check-out / Finalizar Rota
            </button>
          )}
          {rota.status === 'concluida' && (
            <span className="badge badge-gray" style={{fontSize:13,padding:'6px 14px'}}>✓ Rota Concluída</span>
          )}
        </div>
      </div>

      {/* Modal de Check-in com aceite de rastreamento */}
      {checkinModal && (
        <Modal title="🚀 Iniciar Rota" onClose={() => setCheckinModal(false)}>
          <div style={{display:'flex',flexDirection:'column',gap:16}}>
            <div style={{padding:14,background:'rgba(37,99,235,0.08)',border:'1px solid rgba(37,99,235,0.2)',borderRadius:'var(--radius-sm)'}}>
              <div style={{fontSize:15,fontWeight:700,marginBottom:8}}>Rota {rota.codigo}</div>
              <div style={{fontSize:13,color:'var(--text-secondary)'}}>
                📅 {rota.data_prevista ? new Date(rota.data_prevista+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'}) : '—'}
              </div>
              <div style={{fontSize:13,color:'var(--text-secondary)'}}>🏢 {rota.bases?.nome}</div>
              <div style={{fontSize:13,color:'var(--text-secondary)'}}>🚗 {rota.veiculo || '—'}</div>
            </div>

            <div style={{padding:14,background:'rgba(16,185,129,0.08)',border:'1px solid rgba(16,185,129,0.3)',borderRadius:'var(--radius-sm)'}}>
              <div style={{fontSize:13,fontWeight:700,color:'var(--success)',marginBottom:8}}>📍 Rastreamento em Tempo Real</div>
              <div style={{fontSize:12,color:'var(--text-secondary)',lineHeight:1.6}}>
                Ao iniciar a rota, seu dispositivo vai <strong>compartilhar sua localização continuamente</strong> com a central de operações enquanto a rota estiver ativa.<br/><br/>
                O rastreamento para automaticamente quando você fizer o <strong>check-out</strong>.<br/><br/>
                <strong>⚠️ Mantenha a tela ligada</strong> durante as entregas para garantir o envio contínuo da localização.
              </div>
            </div>

            <div style={{display:'flex',gap:10}}>
              <button className="btn btn-secondary" style={{flex:1}} onClick={() => setCheckinModal(false)}>Cancelar</button>
              <button className="btn btn-success" style={{flex:2,fontSize:15,padding:'12px'}} onClick={iniciarRota}>
                ✓ Concordo — Iniciar Rota com Rastreamento
              </button>
            </div>
          </div>
        </Modal>
      )}

      {/* Check-in / Check-out info */}
      {(rota.checkin_at || rota.checkout_at) && (
        <div className="card" style={{marginBottom:16,padding:14}}>
          <div style={{fontSize:13,fontWeight:600,marginBottom:10}}>Registro de Jornada</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:12}}>
            <div>
              <div style={{fontSize:10,color:'var(--text-muted)',textTransform:'uppercase',marginBottom:2}}>Check-in (Início)</div>
              <div style={{fontSize:14,fontWeight:600,color:'var(--success)'}}>{fmtDateTime(rota.checkin_at)}</div>
              {rota.checkin_lat && (
                <button className="btn btn-secondary btn-sm" style={{marginTop:4,fontSize:10}}
                  onClick={() => window.open('https://www.google.com/maps?q='+rota.checkin_lat+','+rota.checkin_lng,'_blank')}>
                  📍 Ver localização
                </button>
              )}
            </div>
            <div>
              <div style={{fontSize:10,color:'var(--text-muted)',textTransform:'uppercase',marginBottom:2}}>Check-out (Devolução)</div>
              {rota.checkout_at ? (
                <>
                  <div style={{fontSize:14,fontWeight:600,color:'var(--accent)'}}>{fmtDateTime(rota.checkout_at)}</div>
                  {rota.checkout_lat && (
                    <button className="btn btn-secondary btn-sm" style={{marginTop:4,fontSize:10}}
                      onClick={() => window.open('https://www.google.com/maps?q='+rota.checkout_lat+','+rota.checkout_lng,'_blank')}>
                      📍 Ver localização
                    </button>
                  )}
                </>
              ) : <div style={{fontSize:13,color:'var(--text-muted)'}}>Aguardando...</div>}
            </div>
            {rota.checkin_at && rota.checkout_at && (
              <div>
                <div style={{fontSize:10,color:'var(--text-muted)',textTransform:'uppercase',marginBottom:2}}>Duração Total</div>
                <div style={{fontSize:18,fontWeight:700,color:'var(--warning)',fontFamily:'JetBrains Mono'}}>
                  {calcDuracao(rota.checkin_at, rota.checkout_at)}
                </div>
              </div>
            )}
            {rota.checkout_obs && (
              <div style={{gridColumn:'1/-1'}}>
                <div style={{fontSize:10,color:'var(--text-muted)',textTransform:'uppercase',marginBottom:2}}>Observação do Motorista</div>
                <div style={{fontSize:12,color:'var(--text-secondary)'}}>{rota.checkout_obs}</div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* Resumo */}
      <div className="stats-grid" style={{marginBottom:16}}>
        <div className="stat-card">
          <div className="stat-icon" style={{background:'var(--accent-subtle)',color:'var(--accent)'}}>📦</div>
          <div className="stat-value">{remessas.length}</div>
          <div className="stat-label">Paradas</div>
        </div>
        <div className="stat-card">
          <div className="stat-icon" style={{background:'var(--success-bg)',color:'var(--success)'}}>✓</div>
          <div className="stat-value">{entregues}</div>
          <div className="stat-label">Entregues</div>
        </div>
        <div className="stat-card">
          <div className="stat-icon" style={{background:'var(--warning-bg)',color:'var(--warning)'}}>⏳</div>
          <div className="stat-value">{pendentes}</div>
          <div className="stat-label">Pendentes</div>
        </div>
        <div className="stat-card">
          <div className="stat-icon" style={{background:'var(--info-bg)',color:'var(--info)'}}>💉</div>
          <div className="stat-value">{totalDoses.toLocaleString('pt-BR')}</div>
          <div className="stat-label">Doses</div>
        </div>
      </div>

      {/* Barra de progresso */}
      <div style={{marginBottom:16}}>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--text-muted)',marginBottom:4}}>
          <span>Progresso das entregas</span><span>{entregues}/{remessas.length}</span>
        </div>
        <div className="progress-bar" style={{height:10}}>
          <div className="progress-fill" style={{width:progresso+'%',background:progresso===100?'var(--success)':'var(--accent)'}} />
        </div>
      </div>

      {/* Aviso check-out */}
      {rota.status==='em_transito' && todasEntregues && (
        <div style={{padding:14,background:'var(--success-bg)',border:'1px solid rgba(16,185,129,0.3)',borderRadius:'var(--radius-sm)',marginBottom:16,display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,flexWrap:'wrap'}}>
          <div>
            <div style={{fontSize:14,fontWeight:600,color:'var(--success)'}}>✓ Todas as entregas concluídas!</div>
            <div style={{fontSize:12,color:'var(--text-muted)'}}>Ao chegar na empresa, faça o check-out para finalizar a rota.</div>
          </div>
          <button className="btn btn-success" onClick={() => setCheckoutModal(true)}>🏁 Fazer Check-out</button>
        </div>
      )}

      {/* Lista de remessas */}
      {loading && <div style={{textAlign:'center',padding:40,color:'var(--text-muted)'}}>Carregando...</div>}
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {remessasVisiveis.map(rem => {
          const isConcluida = rem.status === 'concluida';
          const isCancelada = rem.status === 'cancelada';
          const destNome = rem.destino_tipo==='base' ? rem.bases?.nome : rem.aplicadores?.nome;
          const destCidade = rem.destino_tipo==='base'
            ? (rem.bases?.cidade||'')+'/'+(rem.bases?.uf||'')
            : (rem.aplicadores?.cidade||'')+'/'+(rem.aplicadores?.uf||'');
          const destCPF = rem.destino_tipo==='aplicador' ? rem.aplicadores?.cpf : null;
          const destEnd = rem.destino_tipo==='aplicador' ? rem.aplicadores?.endereco : null;
          const doses = (rem.remessa_itens||[]).reduce((s,i)=>s+i.quantidade,0);

          let nomeExibir = destNome;
          let cpfExibir = destCPF;
          let endExibir = destEnd;
          if (!nomeExibir || nomeExibir === rota.bases?.nome) {
            const obs = rem.observacao || '';
            const mNome = obs.match(/^([^(|]+)/);
            const mCPF = obs.match(/\(([^)]+)\)/);
            if (mNome) nomeExibir = mNome[1].trim();
            if (mCPF) cpfExibir = mCPF[1].trim();
          }

          return (
            <div key={rem.id} className="card" style={{
              borderColor: isConcluida ? 'rgba(16,185,129,0.4)' : isCancelada ? 'rgba(239,68,68,0.2)' : 'var(--border)',
              opacity: isCancelada ? 0.6 : 1
            }}>
              <div style={{display:'flex',gap:12,alignItems:'flex-start'}}>
                <div style={{
                  width:36,height:36,borderRadius:'50%',flexShrink:0,
                  background: isConcluida ? 'var(--success)' : 'var(--accent)',
                  color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',
                  fontWeight:700,fontSize:16
                }}>{isConcluida ? '✓' : rem.ordem_entrega}</div>

                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:6,marginBottom:6}}>
                    <div>
                      <div style={{fontFamily:'JetBrains Mono',fontSize:12,color:'var(--accent)',fontWeight:600}}>{rem.codigo_rastreio}</div>
                      <div style={{fontSize:14,fontWeight:600,color:'var(--text-primary)',marginTop:2}}>{nomeExibir || '—'}</div>
                      <div style={{fontSize:12,color:'var(--text-muted)'}}>{destCidade}{cpfExibir && ' · CPF: '+cpfExibir}</div>
                      {endExibir && <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>{endExibir}</div>}
                    </div>
                    <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
                      <span className={`badge ${SB_REM[rem.status]||'badge-gray'}`}>{ST_REM[rem.status]||rem.status}</span>
                      {doses > 0 && <span className="badge badge-cyan">{doses} doses</span>}
                    </div>
                  </div>

                  {(rem.remessa_itens||[]).length > 0 && (
                    <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:8}}>
                      {(rem.remessa_itens||[]).map((it,i) => (
                        <span key={i} style={{
                          fontSize:11, padding:'3px 10px', borderRadius:4, fontWeight:600,
                          background: (it.vacinas?.nome||'').toLowerCase().includes('tetrav') ? 'rgba(37,99,235,0.2)' :
                                      (it.vacinas?.nome||'').toLowerCase().includes('triv') ? 'rgba(16,185,129,0.2)' : 'var(--bg-input)',
                          color: (it.vacinas?.nome||'').toLowerCase().includes('tetrav') ? 'var(--accent)' :
                                 (it.vacinas?.nome||'').toLowerCase().includes('triv') ? 'var(--success)' : 'var(--text-secondary)',
                        }}>
                          💉 {it.vacinas?.nome}: <strong>{it.quantidade}</strong>
                        </span>
                      ))}
                    </div>
                  )}

                  {!isConcluida && !isCancelada && rota.status === 'em_transito' && (
                    <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:4}}>
                      <button className="btn btn-success btn-sm" onClick={() => setAssinaturaModal(rem)}>
                        ✓ Confirmar Entrega
                      </button>
                      <button className="btn btn-secondary btn-sm" onClick={() => {
                        const p = prompt('Descreva o problema:');
                        if (p) reportarProblema(rem.id, p);
                      }}>⚠ Problema</button>
                      <button className="btn btn-secondary btn-sm" onClick={() => abrirMaps(endExibir, destCidade)}>
                        🗺 Abrir Maps
                      </button>
                    </div>
                  )}

                  {/* Sempre mostrar Maps mesmo sem estar em trânsito */}
                  {(isConcluida || rota.status !== 'em_transito') && (endExibir || destCidade) && (
                    <button className="btn btn-secondary btn-sm" style={{marginTop:4}} onClick={() => abrirMaps(endExibir, destCidade)}>
                      🗺 Abrir Maps
                    </button>
                  )}

                  {/* Botão ver detalhes da entrega */}
                  {isConcluida && (
                    <button className="btn btn-secondary btn-sm" style={{marginTop:4}} onClick={() => setEntregaDetalhe(rem)}>
                      📋 Ver Entrega
                    </button>
                  )}

                  {rem.observacao && rem.observacao.includes('[PROBLEMA') && (
                    <div style={{marginTop:8,padding:'6px 10px',background:'var(--danger-bg)',borderRadius:'var(--radius-sm)',fontSize:11,color:'var(--danger)'}}>
                      {rem.observacao.split('\n').filter(l=>l.includes('[PROBLEMA')).join(' | ')}
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      
      {/* Modal Detalhes da Entrega */}
      {entregaDetalhe && (
        <EntregaDetalheModal remessa={entregaDetalhe} rota={rota} onClose={() => setEntregaDetalhe(null)} />
      )}

      {/* Modal Assinatura de Entrega */}
      {assinaturaModal && (
        <AssinaturaEntregaModal
          remessa={assinaturaModal}
          rota={rota}
          onConfirm={async (remId) => { setAssinaturaModal(null); await confirmarEntrega(remId); }}
          onClose={() => setAssinaturaModal(null)}
        />
      )}

      {/* Modal Check-out */}
      {checkoutModal && (
        <CheckoutModal
          rota={rota}
          entregues={entregues}
          total={remessas.length}
          onClose={() => setCheckoutModal(false)}
          onConfirm={fazerCheckout}
        />
      )}
    </div>
  );
}

function CheckoutModal({ rota, entregues, total, onClose, onConfirm }) {
  const [obs, setObs] = useState('');
  const [saving, setSaving] = useState(false);

  const handleConfirm = async () => {
    setSaving(true);
    await onConfirm(obs);
    setSaving(false);
  };

  const checkinTime = rota.checkin_at ? new Date(rota.checkin_at) : null;
  const now = new Date();
  const duracao = checkinTime ? Math.round((now - checkinTime) / 60000) : null;
  const duracaoStr = duracao ? `${Math.floor(duracao/60)}h ${duracao%60}min` : '—';

  return (
    <Modal title="Check-out — Devolução do Veículo" onClose={onClose}>
      <div style={{padding:16,background:'var(--bg-input)',borderRadius:'var(--radius-sm)',marginBottom:16}}>
        <div style={{fontSize:13,fontWeight:600,marginBottom:10}}>Resumo da Jornada</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,fontSize:13}}>
          <div><span style={{color:'var(--text-muted)'}}>Rota:</span> <strong>{rota.codigo}</strong></div>
          <div><span style={{color:'var(--text-muted)'}}>Entregas:</span> <strong style={{color:'var(--success)'}}>{entregues}/{total}</strong></div>
          <div><span style={{color:'var(--text-muted)'}}>Check-in:</span> <strong>{checkinTime ? checkinTime.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '—'}</strong></div>
          <div><span style={{color:'var(--text-muted)'}}>Duração:</span> <strong style={{color:'var(--warning)'}}>{duracaoStr}</strong></div>
        </div>
      </div>
      <div className="form-group">
        <label className="form-label">Observações do motorista (opcional)</label>
        <textarea className="form-input" value={obs} onChange={e=>setObs(e.target.value)}
          placeholder="Ex: Veículo devolvido sem avarias. Problema na entrega 3..." rows={3}
          style={{resize:'vertical',fontFamily:'inherit'}} />
      </div>
      <div style={{fontSize:12,color:'var(--text-muted)',marginTop:8}}>
        Ao confirmar, sua localização atual será registrada como ponto de devolução.
      </div>
      <div className="modal-actions">
        <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" onClick={handleConfirm} disabled={saving}>
          {saving ? 'Registrando...' : '🏁 Confirmar Check-out'}
        </button>
      </div>
    </Modal>
  );
}

// MÓDULO APLICADOR
// ═══════════════════════════════════════════════
function MinhasDosesPage() {
  const [aplicador, setAplicador] = useState(null);
  const [estoque, setEstoque] = useState([]);
  const [escalas, setEscalas] = useState([]);
  const [loading, setLoading] = useState(true);
  const toast = useContext(ToastContext);

  useEffect(() => {
    const init = async () => {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return;
      const { data: profile } = await sb.from('profiles').select('cpf').eq('id', user.id).single();
      if (!profile?.cpf) { setLoading(false); return; }
      const { data: ap } = await sb.from('aplicadores').select('*').eq('cpf', profile.cpf).single();
      if (!ap) { setLoading(false); return; }
      setAplicador(ap);

      const [estoqueRes, escalasRes] = await Promise.all([
        sb.from('estoque').select('*, vacinas(nome, lote, validade)')
          .eq('aplicador_id', ap.id).eq('localizacao_tipo', 'aplicador'),
        sb.from('escalas').select('*, tarefas(codigo, cliente, cidade_campanha, uf_campanha)')
          .eq('aplicador_id', ap.id)
          .in('status', ['aprovada','em_validacao','em_execucao','pronta_faturamento'])
          .order('data_inicio', { ascending: true })
      ]);
      setEstoque(estoqueRes.data || []);
      setEscalas(escalasRes.data || []);
      setLoading(false);
    };
    init();
  }, []);

  const totalDoses = estoque.reduce((s,e) => s + (e.quantidade||0), 0);
  const dosesNecessarias = escalas.reduce((s,e) => s + (e.doses_necessarias||0), 0);
  const dosesAplicadas = escalas.reduce((s,e) => s + (e.doses_aplicadas||0), 0);
  const gap = dosesNecessarias - dosesAplicadas - totalDoses;

  if (loading) return <div style={{textAlign:'center',padding:60,color:'var(--text-muted)'}}>Carregando...</div>;

  if (!aplicador) return (
    <div className="card">
      <div className="empty-state">
        <div className="empty-icon">👤</div>
        <div className="empty-text">Seu perfil não está vinculado a um aplicador.<br/>Verifique se seu CPF está cadastrado no sistema.</div>
      </div>
    </div>
  );

  return (
    <div>
      <div className="page-header">
        <div><div className="page-title">Minhas Doses</div><div className="page-subtitle">{aplicador.nome} · CPF: {aplicador.cpf}</div></div>
      </div>

      <div className="stats-grid" style={{marginBottom:20}}>
        <div className="stat-card">
          <div className="stat-icon" style={{background:'var(--accent-subtle)',color:'var(--accent)'}}>💉</div>
          <div className="stat-value">{totalDoses.toLocaleString('pt-BR')}</div>
          <div className="stat-label">Doses em Custódia</div>
        </div>
        <div className="stat-card">
          <div className="stat-icon" style={{background:'var(--warning-bg)',color:'var(--warning)'}}>📋</div>
          <div className="stat-value">{dosesNecessarias.toLocaleString('pt-BR')}</div>
          <div className="stat-label">Doses Necessárias</div>
        </div>
        <div className="stat-card">
          <div className="stat-icon" style={{background:'var(--success-bg)',color:'var(--success)'}}>✓</div>
          <div className="stat-value">{dosesAplicadas.toLocaleString('pt-BR')}</div>
          <div className="stat-label">Doses Aplicadas</div>
        </div>
        <div className="stat-card">
          <div className="stat-icon" style={{background: gap > 0 ? 'var(--danger-bg)' : 'var(--success-bg)', color: gap > 0 ? 'var(--danger)' : 'var(--success)'}}>⚖️</div>
          <div className="stat-value" style={{color: gap > 0 ? 'var(--danger)' : 'var(--success)'}}>{gap > 0 ? '+'+gap : gap}</div>
          <div className="stat-label">{gap > 0 ? 'Aguardando Envio' : 'OK'}</div>
        </div>
      </div>

      {/* Estoque atual */}
      <div className="card" style={{marginBottom:16}}>
        <div className="card-header"><div className="card-title">💊 Estoque em Mãos</div></div>
        {estoque.length === 0
          ? <div style={{color:'var(--text-muted)',fontSize:13,fontStyle:'italic'}}>Nenhuma dose em custódia no momento.</div>
          : <div className="table-wrap"><table><thead>
              <tr><th>Vacina</th><th>Lote</th><th>Validade</th><th>Quantidade</th></tr>
            </thead><tbody>
              {estoque.map(e => (
                <tr key={e.id}>
                  <td style={{fontWeight:500,color:'var(--text-primary)'}}>{e.vacinas?.nome}</td>
                  <td className="mono">{e.vacinas?.lote || '—'}</td>
                  <td>{e.vacinas?.validade ? new Date(e.vacinas.validade+'T12:00:00').toLocaleDateString('pt-BR') : '—'}</td>
                  <td className="mono" style={{fontWeight:700,fontSize:16,color: e.quantidade < 0 ? 'var(--danger)' : 'var(--success)'}}>
                    {e.quantidade}
                  </td>
                </tr>
              ))}
            </tbody></table></div>
        }
      </div>

      {/* Escalas ativas */}
      <div className="card">
        <div className="card-header"><div className="card-title">📅 Minhas Tarefas Ativas</div></div>
        {escalas.length === 0
          ? <div style={{color:'var(--text-muted)',fontSize:13,fontStyle:'italic'}}>Nenhuma tarefa ativa no momento.</div>
          : <div className="table-wrap"><table><thead>
              <tr><th>Tarefa</th><th>Cliente</th><th>Data</th><th>Necessário</th><th>Aplicado</th><th>Perdido</th><th>Saldo</th></tr>
            </thead><tbody>
              {escalas.map(e => {
                const saldo = e.doses_necessarias - e.doses_aplicadas - e.doses_perdidas - e.doses_danificadas;
                return (
                  <tr key={e.id}>
                    <td className="mono" style={{fontSize:11,maxWidth:180,overflow:'hidden',textOverflow:'ellipsis'}}>{e.codigo_tarefa || e._tarefa?.codigo}</td>
                    <td style={{maxWidth:160,overflow:'hidden',textOverflow:'ellipsis'}}>{e.tarefas?.cliente || '—'}</td>
                    <td>{e.data_inicio ? new Date(e.data_inicio+'T12:00:00').toLocaleDateString('pt-BR') : '—'}</td>
                    <td className="mono">{e.doses_necessarias}</td>
                    <td className="mono" style={{color:'var(--success)'}}>{e.doses_aplicadas}</td>
                    <td className="mono" style={{color:e.doses_perdidas>0?'var(--warning)':'inherit'}}>{e.doses_perdidas}</td>
                    <td className="mono" style={{fontWeight:600,color: saldo > 0 ? 'var(--accent)' : 'var(--success)'}}>{saldo}</td>
                  </tr>
                );
              })}
            </tbody></table></div>
        }
      </div>
    </div>
  );
}

function AbatimentoPage() {
  const [aplicador, setAplicador] = useState(null);
  const [escalas, setEscalas] = useState([]);
  const [vacinas, setVacinas] = useState([]);
  const [form, setForm] = useState({ escala_id: '', tipo: 'vacinados', quantidade: '', observacao: '' });
  const [saving, setSaving] = useState(false);
  const [historico, setHistorico] = useState([]);
  const toast = useContext(ToastContext);

  useEffect(() => {
    const init = async () => {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return;
      const { data: profile } = await sb.from('profiles').select('cpf').eq('id', user.id).single();
      if (!profile?.cpf) return;
      const { data: ap } = await sb.from('aplicadores').select('*').eq('cpf', profile.cpf).single();
      if (!ap) return;
      setAplicador(ap);

      const [escalasRes, vacinasRes, histRes] = await Promise.all([
        sb.from('escalas').select('id, codigo_tarefa, doses_necessarias, doses_aplicadas, doses_perdidas, doses_danificadas, vacinas(nome), tarefas(cliente, cidade_campanha)')
          .eq('aplicador_id', ap.id)
          .in('status', ['aprovada','em_validacao','em_execucao','pronta_faturamento'])
          .order('data_inicio'),
        sb.from('vacinas').select('id, nome').eq('ativa', true).order('nome'),
        sb.from('abatimentos').select('*, escalas(codigo_tarefa), vacinas(nome)').eq('aplicador_id', ap.id)
          .order('created_at', { ascending: false }).limit(20)
      ]);
      setEscalas(escalasRes.data || []);
      setVacinas(vacinasRes.data || []);
      setHistorico(histRes.data || []);
    };
    init();
  }, []);

  const registrar = async () => {
    if (!form.escala_id || !form.quantidade || parseInt(form.quantidade) <= 0) {
      toast('Preencha escala e quantidade', 'error'); return;
    }
    setSaving(true);
    const { error } = await sb.rpc('registrar_abatimento', {
      p_escala_id: form.escala_id,
      p_tipo: form.tipo,
      p_quantidade: parseInt(form.quantidade),
      p_observacao: form.observacao || null
    });
    if (error) { toast(error.message, 'error'); setSaving(false); return; }
    toast('Abatimento registrado com sucesso!', 'success');
    setForm({ escala_id: '', tipo: 'vacinados', quantidade: '', observacao: '' });
    setSaving(false);
    // Recarregar histórico
    if (aplicador) {
      const { data } = await sb.from('abatimentos').select('*, escalas(codigo_tarefa), vacinas(nome)')
        .eq('aplicador_id', aplicador.id).order('created_at', { ascending: false }).limit(20);
      setHistorico(data || []);
    }
  };

  const TIPO_LABELS = { vacinados: '💉 Vacinados', perdidas: '⚠️ Perdidas', danificadas: '🚫 Danificadas' };
  const TIPO_COLORS = { vacinados: 'var(--success)', perdidas: 'var(--warning)', danificadas: 'var(--danger)' };

  const escSel = escalas.find(e => e.id === form.escala_id);
  const saldoDisp = escSel ? (escSel.doses_necessarias - escSel.doses_aplicadas - escSel.doses_perdidas - escSel.doses_danificadas) : null;

  return (
    <div>
      <div className="page-header">
        <div><div className="page-title">Registrar Abatimento</div><div className="page-subtitle">Vacinados, perdas e danos</div></div>
      </div>

      {/* Formulário */}
      <div className="card" style={{marginBottom:16}}>
        <div className="card-title" style={{marginBottom:14}}>Novo Registro</div>
        <div className="form-grid">
          <div className="form-group" style={{gridColumn:'1/-1'}}>
            <label className="form-label">Escala / Tarefa *</label>
            <select className="form-select" value={form.escala_id} onChange={e=>setForm(f=>({...f,escala_id:e.target.value}))}>
              <option value="">Selecione uma tarefa...</option>
              {escalas.map(e => {
                const saldo = e.doses_necessarias - e.doses_aplicadas - e.doses_perdidas - e.doses_danificadas;
                return (
                  <option key={e.id} value={e.id}>
                    {e.tarefas?.cliente || e.codigo_tarefa} — {e.vacinas?.nome} — Saldo: {saldo}
                  </option>
                );
              })}
            </select>
            {escSel && (
              <div style={{marginTop:6,display:'flex',gap:10,flexWrap:'wrap',fontSize:12}}>
                <span style={{color:'var(--text-muted)'}}>Necessário: <strong>{escSel.doses_necessarias}</strong></span>
                <span style={{color:'var(--success)'}}>Aplicado: <strong>{escSel.doses_aplicadas}</strong></span>
                <span style={{color:'var(--warning)'}}>Perdido: <strong>{escSel.doses_perdidas}</strong></span>
                <span style={{color:'var(--accent)'}}>Saldo disponível: <strong>{saldoDisp}</strong></span>
              </div>
            )}
          </div>
          <div className="form-group">
            <label className="form-label">Tipo *</label>
            <div style={{display:'flex',gap:8}}>
              {['vacinados','perdidas','danificadas'].map(t => (
                <button key={t} className={`btn btn-sm ${form.tipo===t ? 'btn-primary' : 'btn-secondary'}`}
                  style={{flex:1,fontSize:11}} onClick={() => setForm(f=>({...f,tipo:t}))}>
                  {TIPO_LABELS[t]}
                </button>
              ))}
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Quantidade *</label>
            <input className="form-input" type="number" min="1"
              max={saldoDisp || undefined}
              value={form.quantidade} onChange={e=>setForm(f=>({...f,quantidade:e.target.value}))}
              style={{borderColor: form.quantidade && saldoDisp !== null && parseInt(form.quantidade) > saldoDisp ? 'var(--danger)' : undefined}} />
            {form.quantidade && saldoDisp !== null && parseInt(form.quantidade) > saldoDisp && (
              <div style={{fontSize:11,color:'var(--danger)',marginTop:3}}>⚠ Quantidade maior que o saldo disponível ({saldoDisp})</div>
            )}
          </div>
          <div className="form-group" style={{gridColumn:'1/-1'}}>
            <label className="form-label">Observação</label>
            <input className="form-input" value={form.observacao} onChange={e=>setForm(f=>({...f,observacao:e.target.value}))} placeholder="Motivo da perda, número do lote, etc." />
          </div>
        </div>
        <div style={{marginTop:14,display:'flex',gap:10,alignItems:'center'}}>
          <button className="btn btn-primary" onClick={registrar} disabled={saving || !form.escala_id || !form.quantidade}>
            {saving ? 'Registrando...' : '✓ Registrar ' + TIPO_LABELS[form.tipo]}
          </button>
          {form.tipo !== 'vacinados' && (
            <span style={{fontSize:12,color:'var(--warning)'}}>⚠ Perdas e danos debitam do seu saldo</span>
          )}
        </div>
      </div>

      {/* Histórico */}
      <div className="card">
        <div className="card-title" style={{marginBottom:12}}>Histórico Recente</div>
        {historico.length === 0
          ? <div style={{color:'var(--text-muted)',fontSize:13,fontStyle:'italic'}}>Nenhum registro ainda.</div>
          : <div className="table-wrap"><table><thead>
              <tr><th>Data</th><th>Tarefa</th><th>Tipo</th><th>Qtd</th></tr>
            </thead><tbody>
              {historico.map(h => (
                <tr key={h.id}>
                  <td style={{fontSize:12}}>{new Date(h.created_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td>
                  <td className="mono" style={{fontSize:11}}>{h.escalas?.codigo_tarefa}</td>
                  <td><span style={{fontSize:11,fontWeight:600,color:TIPO_COLORS[h.tipo]}}>{TIPO_LABELS[h.tipo]}</span></td>
                  <td className="mono" style={{fontWeight:700}}>{h.quantidade}</td>
                </tr>
              ))}
            </tbody></table></div>
        }
      </div>
    </div>
  );
}

// MOVIMENTAÇÕES
// ═══════════════════════════════════════════════
function MovimentacoesPage() {
  const [bases, setBases] = useState([]);
  const [aplicadores, setAplicadores] = useState([]);
  const [localSel, setLocalSel] = useState(null); // { tipo: 'base'|'aplicador', id, nome }
  const [vacinas, setVacinas] = useState([]);
  const [filtroVacina, setFiltroVacina] = useState('');
  const [extrato, setExtrato] = useState([]);
  const [loading, setLoading] = useState(false);
  const [saldoAtual, setSaldoAtual] = useState(0);
  const [cancelando, setCancelando] = useState(null);
  const toast = useContext(ToastContext);

  const estornar = async (mov) => {
    if (!confirm(`Confirmar cancelamento do lançamento de ${mov.quantidade.toLocaleString('pt-BR')} doses?\n\nIsso vai gerar um lançamento inverso (estorno) com registro do cancelamento.`)) return;
    setCancelando(mov.id);
    try {
      const userId = (await sb.auth.getUser()).data.user.id;

      // Lançamento inverso: origem e destino trocados
      // Só usar tipos válidos para o banco: 'base' ou 'aplicador'
      const tiposValidos = ['base', 'aplicador'];
      const origemTipo = tiposValidos.includes(mov.origem_tipo) ? mov.origem_tipo : null;
      const destinoTipo = tiposValidos.includes(mov.destino_tipo) ? mov.destino_tipo : null;

      // Para estorno: se era entrada (local = destino) → estorno é saída (local = origem)
      //               se era saída (local = origem) → estorno é entrada (local = destino)
      let estornoOrigemTipo, estornoOrigemBaseId, estornoOrigemApId;
      let estornoDestinoTipo, estornoDestinoBaseId, estornoDestinoApId;

      if (mov.direcao === 'entrada') {
        // Estorno de entrada = saída do local para lugar nenhum (ajuste)
        estornoOrigemTipo = localSel.tipo;
        estornoOrigemBaseId = localSel.tipo === 'base' ? localSel.id : null;
        estornoOrigemApId = localSel.tipo === 'aplicador' ? localSel.id : null;
        estornoDestinoTipo = localSel.tipo;
        estornoDestinoBaseId = localSel.tipo === 'base' ? localSel.id : null;
        estornoDestinoApId = localSel.tipo === 'aplicador' ? localSel.id : null;
      } else {
        // Estorno de saída = entrada de volta no local
        estornoOrigemTipo = tiposValidos.includes(mov.destino_tipo) ? mov.destino_tipo : localSel.tipo;
        estornoOrigemBaseId = mov.destino_base_id || null;
        estornoOrigemApId = mov.destino_aplicador_id || null;
        estornoDestinoTipo = localSel.tipo;
        estornoDestinoBaseId = localSel.tipo === 'base' ? localSel.id : null;
        estornoDestinoApId = localSel.tipo === 'aplicador' ? localSel.id : null;
      }

      const { error } = await sb.from('movimentacoes').insert({
        tipo: 'ajuste',
        vacina_id: mov.vacina_id,
        quantidade: mov.quantidade,
        origem_tipo: estornoOrigemTipo,
        origem_base_id: estornoOrigemBaseId,
        origem_aplicador_id: estornoOrigemApId,
        destino_tipo: estornoDestinoTipo,
        destino_base_id: estornoDestinoBaseId,
        destino_aplicador_id: estornoDestinoApId,
        observacao: `ESTORNO do lançamento ${mov.id.slice(0,8)} de ${new Date(mov.created_at).toLocaleString('pt-BR')} (${mov.quantidade} doses) — Cancelado por ${userId}`,
        criado_por: userId,
      });
      if (error) { toast(error.message, 'error'); setCancelando(null); return; }

      // Ajustar estoque fisicamente
      // Lógica simples: se era entrada no local selecionado → debitar; se era saída → creditar
      const ajustarEstoque = async (delta) => {
        // delta = -N para debitar, +N para creditar
        if (localSel.tipo === 'base') {
          const { data: rows } = await sb.from('estoque').select('id,quantidade')
            .eq('vacina_id', mov.vacina_id).eq('base_id', localSel.id).eq('localizacao_tipo','base');
          if (rows?.length) {
            await sb.from('estoque').update({ quantidade: rows[0].quantidade + delta }).eq('id', rows[0].id);
          } else if (delta > 0) {
            await sb.from('estoque').insert({ vacina_id: mov.vacina_id, base_id: localSel.id, localizacao_tipo: 'base', quantidade: delta });
          }
        } else {
          const { data: rows } = await sb.from('estoque').select('id,quantidade')
            .eq('vacina_id', mov.vacina_id).eq('aplicador_id', localSel.id).eq('localizacao_tipo','aplicador');
          if (rows?.length) {
            await sb.from('estoque').update({ quantidade: rows[0].quantidade + delta }).eq('id', rows[0].id);
          } else if (delta > 0) {
            await sb.from('estoque').insert({ vacina_id: mov.vacina_id, aplicador_id: localSel.id, localizacao_tipo: 'aplicador', quantidade: delta });
          }
        }
      };

      if (mov.direcao === 'entrada') {
        await ajustarEstoque(-mov.quantidade); // era entrada → debitar
      } else if (mov.direcao === 'saida') {
        await ajustarEstoque(+mov.quantidade); // era saída → creditar de volta
      }

      toast(`Lançamento estornado! ${mov.quantidade.toLocaleString('pt-BR')} doses revertidas. ✓`, 'success');
      loadExtrato(localSel, filtroVacina);
    } catch(err) {
      toast('Erro: ' + err.message, 'error');
    }
    setCancelando(null);
  };

  useEffect(() => {
    Promise.all([
      sb.from('bases').select('id, nome, cidade, uf').order('nome'),
      sb.from('aplicadores').select('id, nome, cpf, cidade, uf').order('nome'),
      sb.from('vacinas').select('id, nome').order('nome'),
    ]).then(([b, a, v]) => {
      setBases(b.data || []);
      setAplicadores(a.data || []);
      setVacinas(v.data || []);
    });
  }, []);

  const loadExtrato = async (local, vacinaId) => {
    if (!local) return;
    setLoading(true);
    setExtrato([]);

    const campo_origem = local.tipo === 'base' ? 'origem_base_id' : 'origem_aplicador_id';
    const campo_destino = local.tipo === 'base' ? 'destino_base_id' : 'destino_aplicador_id';

    // Buscar saldo real do banco (fonte da verdade)
    let estoqueQ = local.tipo === 'base'
      ? sb.from('estoque').select('quantidade, vacinas(nome)').eq('base_id', local.id).eq('localizacao_tipo', 'base')
      : sb.from('estoque').select('quantidade, vacinas(nome)').eq('aplicador_id', local.id).eq('localizacao_tipo', 'aplicador');
    if (vacinaId) estoqueQ = estoqueQ.eq('vacina_id', vacinaId);
    const { data: estoqueRows } = await estoqueQ;
    const saldoReal = (estoqueRows || []).reduce((s, r) => s + Number(r.quantidade||0), 0);
    setSaldoAtual(saldoReal);

    let q = sb.from('movimentacoes')
      .select('*, vacinas(nome), profiles(nome), bases_orig:bases!movimentacoes_origem_base_id_fkey(nome), bases_dest:bases!movimentacoes_destino_base_id_fkey(nome), aplic_orig:aplicadores!movimentacoes_origem_aplicador_id_fkey(nome), aplic_dest:aplicadores!movimentacoes_destino_aplicador_id_fkey(nome)')
      .or(`${campo_origem}.eq.${local.id},${campo_destino}.eq.${local.id}`)
      .order('created_at', { ascending: true })
      .limit(500);
    if (vacinaId) q = q.eq('vacina_id', vacinaId);

    const { data, error } = await q;
    if (error) { toast(error.message, 'error'); setLoading(false); return; }

    // Calcular saldo progressivo a partir das movimentações
    let saldo = 0;
    const rows = (data || []).map(m => {
      const ehOrigem = (local.tipo === 'base' ? m.origem_base_id : m.origem_aplicador_id) === local.id;
      const ehDestino = (local.tipo === 'base' ? m.destino_base_id : m.destino_aplicador_id) === local.id;

      let direcao, sinal;
      if (ehDestino && !ehOrigem) { direcao = 'entrada'; sinal = +1; }
      else if (ehOrigem && !ehDestino) { direcao = 'saida'; sinal = -1; }
      else { direcao = 'interno'; sinal = 0; }

      saldo += sinal * m.quantidade;

      const origemNome = m.bases_orig?.nome || m.aplic_orig?.nome || (m.origem_tipo && !['base','aplicador'].includes(m.origem_tipo) ? m.origem_tipo : '—');
      const destinoNome = m.bases_dest?.nome || m.aplic_dest?.nome || '—';
      const tipoLabel = { entrada:'Entrada', saida:'Saída', transferencia:'Transferência', envio_aplicador:'Envio → Aplicador', devolucao:'Devolução', aplicacao:'Aplicação', perda:'Perda', dano:'Dano', ajuste:'Ajuste' }[m.tipo] || m.tipo;

      return { ...m, direcao, sinal, saldoPos: saldo, origemNome, destinoNome, tipoLabel };
    });

    // Mostrar aviso se saldo calculado diverge do real
    const diff = saldoReal - saldo;
    if (Math.abs(diff) > 0) {
      console.warn(`Extrato: saldo calculado (${saldo}) ≠ estoque real (${saldoReal}). Diferença: ${diff}`);
    }

    setExtrato(rows);
    setLoading(false);
  };

  useEffect(() => {
    if (localSel) loadExtrato(localSel, filtroVacina);
  }, [localSel, filtroVacina]);

  const imprimirExtrato = (local, rows, saldoReal, vacinaId, vacinasList) => {
    const vacinaNome = vacinaId ? (vacinasList.find(v => v.id === vacinaId)?.nome || 'Todas') : 'Todas as vacinas';
    const agora = new Date().toLocaleString('pt-BR');
    const rowsOrdenados = [...rows].reverse();
    const TIPO_COR = { entrada: '#16a34a', saida: '#dc2626', interno: '#6b7280' };
    const TIPO_LABEL = { entrada: '↓ Entrada', saida: '↑ Saída', interno: '↔ Interno' };

    const linhas = rowsOrdenados.map(m => `
      <tr style="border-bottom:1px solid #e5e7eb;">
        <td style="padding:5px 7px;font-size:10px;white-space:nowrap;color:#6b7280">${new Date(m.created_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}</td>
        <td style="padding:5px 7px"><span style="font-size:10px;font-weight:700;color:${TIPO_COR[m.direcao]||'#6b7280'}">${TIPO_LABEL[m.direcao]||m.direcao}</span><div style="font-size:9px;color:#9ca3af">${m.tipoLabel||''}</div></td>
        <td style="padding:5px 7px;font-size:10px">${m.vacinas?.nome||'—'}</td>
        <td style="padding:5px 7px;font-size:10px">${m.origemNome||'—'}</td>
        <td style="padding:5px 7px;font-size:10px">${m.destinoNome||'—'}</td>
        <td style="padding:5px 7px;text-align:right;font-family:monospace;font-weight:700;font-size:11px;color:${m.sinal>0?'#16a34a':m.sinal<0?'#dc2626':'#6b7280'}">${m.sinal>0?'+':m.sinal<0?'-':''}${m.quantidade.toLocaleString('pt-BR')}</td>
        <td style="padding:5px 7px;text-align:right;font-family:monospace;font-weight:600;font-size:11px;color:${m.saldoPos>=0?'#111827':'#dc2626'}">${m.saldoPos.toLocaleString('pt-BR')}</td>
        <td style="padding:5px 7px;font-size:10px;color:#6b7280">${m.profiles?.nome||'—'}</td>
        <td style="padding:5px 7px;font-size:9px;color:#9ca3af;max-width:180px;overflow:hidden;text-overflow:ellipsis">${(m.observacao||'—').slice(0,80)}</td>
      </tr>
    `).join('');

    const entradas = rows.filter(r=>r.direcao==='entrada').reduce((s,r)=>s+r.quantidade,0);
    const saidas = rows.filter(r=>r.direcao==='saida').reduce((s,r)=>s+r.quantidade,0);

    const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Extrato '+local.nome+'</title>'
      + '<style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:Arial,sans-serif;font-size:12px;color:#111;padding:20px;}'
      + '@page{size:A4 landscape;margin:12mm;}@media print{body{padding:0;}}'
      + 'h1{font-size:18px;font-weight:800;color:#1e3a5f;}'
      + '.sub{font-size:11px;color:#6b7280;margin-bottom:14px;}'
      + '.resumo{display:flex;gap:12px;margin-bottom:14px;}'
      + '.cr{background:#f8fafc;border:1px solid #e2e8f0;border-radius:5px;padding:8px 14px;flex:1;}'
      + '.cr .lb{font-size:9px;color:#6b7280;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px;}'
      + '.cr .vl{font-size:18px;font-weight:800;font-family:monospace;}'
      + 'table{width:100%;border-collapse:collapse;}'
      + 'thead tr{background:#1e3a5f;color:#fff;}'
      + 'thead th{padding:7px 8px;text-align:left;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}'
      + 'tbody tr:nth-child(even){background:#f9fafb;}'
      + '.footer{margin-top:12px;font-size:9px;color:#9ca3af;text-align:right;border-top:1px solid #e5e7eb;padding-top:6px;}'
      + '</style></head><body>'
      + '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">'
      + '<div><h1>VacinaLog — Extrato de Estoque</h1><div class="sub">'+local.nome+' · '+vacinaNome+' · '+agora+'</div></div>'
      + '<div style="text-align:right"><div style="font-size:9px;color:#6b7280">Saldo Atual</div>'
      + '<div style="font-size:26px;font-weight:800;font-family:monospace;color:'+(saldoReal>=0?'#16a34a':'#dc2626')+'">'+saldoReal.toLocaleString('pt-BR')+'</div></div>'
      + '</div>'
      + '<div class="resumo">'
      + '<div class="cr"><div class="lb">Total Entradas</div><div class="vl" style="color:#16a34a">+'+entradas.toLocaleString('pt-BR')+'</div></div>'
      + '<div class="cr"><div class="lb">Total Saídas</div><div class="vl" style="color:#dc2626">-'+saidas.toLocaleString('pt-BR')+'</div></div>'
      + '<div class="cr"><div class="lb">Lançamentos</div><div class="vl" style="color:#1e3a5f">'+rows.length+'</div></div>'

      + '<table><thead><tr><th>Data</th><th>Tipo</th><th>Vacina</th><th>Origem</th><th>Destino</th><th style="text-align:right">Valor</th><th style="text-align:right">Saldo</th><th>Usuário</th><th>Obs</th></tr></thead>'

    const w = window.open('', '_blank', 'width=1100,height=750');

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Extrato de Estoque</div>

          {localSel && (
            <button className="btn btn-secondary" onClick={() => loadExtrato(localSel, filtroVacina)} disabled={loading}>
              {loading ? '⟳ Carregando...' : '↻ Atualizar'}
            </button>
          )}
          {localSel && extrato.length > 0 && (
            <button className="btn btn-primary" onClick={() => imprimirExtrato(localSel, extrato, saldoAtual, filtroVacina, vacinas)}>

          )}

      </div>

      <div className="card" style={{marginBottom:16,padding:14}}>

              value={localSel ? `${localSel.tipo}|${localSel.id}` : ''}
              onChange={e => {
                if (!e.target.value) { setLocalSel(null); setExtrato([]); return; }
                const [tipo, id] = e.target.value.split('|');
                const lista = tipo === 'base' ? bases : aplicadores;
                const item = lista.find(x => x.id === id);
                setLocalSel({ tipo, id, nome: item?.nome || '' });
              }}>
              <option value="">Selecione...</option>
              <optgroup label="🏢 Bases">
                {bases.map(b => <option key={b.id} value={`base|${b.id}`}>{b.nome} — {b.cidade}/{b.uf}</option>)}
              </optgroup>
              <optgroup label="👤 Aplicadores">
                {aplicadores.map(a => <option key={a.id} value={`aplicador|${a.id}`}>{a.nome}</option>)}

            </select>
          </div>
          <div className="form-group" style={{marginBottom:0,minWidth:180}}>
            <label className="form-label">Vacina</label>
            <select className="form-select" style={{padding:'6px 10px'}}
              value={filtroVacina} onChange={e => setFiltroVacina(e.target.value)}>
              <option value="">Todas</option>
              {vacinas.map(v => <option key={v.id} value={v.id}>{v.nome}</option>)}
            </select>
          </div>
          {localSel && (
            <div style={{marginLeft:'auto',textAlign:'right'}}>
              <div style={{fontSize:11,color:'var(--text-muted)'}}>Saldo atual</div>
              <div style={{fontSize:24,fontWeight:700,fontFamily:'JetBrains Mono',color: saldoAtual >= 0 ? 'var(--success)' : 'var(--danger)'}}>
                {saldoAtual.toLocaleString('pt-BR')}
              </div>
            </div>
          )}
        </div>
      </div>

      {/* Extrato */}
      {!localSel && (
        <div className="card"><div className="empty-state"><div className="empty-icon">📋</div><div className="empty-text">Selecione uma base ou aplicador para ver o extrato</div></div></div>
      )}

      {loading && <div className="card"><div className="empty-state"><div className="empty-text">Carregando...</div></div></div>}

      {localSel && !loading && extrato.length === 0 && (
        <div className="card"><div className="empty-state"><div className="empty-icon">📋</div><div className="empty-text">Nenhuma movimentação encontrada para {localSel.nome}</div></div></div>
      )}

      {extrato.length > 0 && (
        <>
          {(() => {
            const saldoCalculado = extrato[extrato.length-1]?.saldoPos || 0;
            const diff = saldoAtual - saldoCalculado;
            return Math.abs(diff) > 0 ? (
              <div style={{padding:'8px 14px',background:'rgba(245,158,11,0.1)',border:'1px solid rgba(245,158,11,0.3)',borderRadius:'var(--radius-sm)',marginBottom:10,fontSize:12,color:'var(--warning)'}}>
                ⚠ O saldo calculado pelo extrato ({saldoCalculado.toLocaleString('pt-BR')}) difere do estoque real ({saldoAtual.toLocaleString('pt-BR')}) em <strong>{Math.abs(diff).toLocaleString('pt-BR')} doses</strong>.
              </div>
            ) : null;
          })()}
          <div className="card">
            <div style={{padding:'10px 14px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div style={{fontSize:14,fontWeight:600}}>{localSel?.nome}</div>
              <div style={{fontSize:12,color:'var(--text-muted)'}}>{extrato.length} lançamentos</div>
            </div>
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Tipo</th>
                  <th>Vacina</th>
                  <th>Origem</th>
                  <th>Destino</th>
                  <th style={{textAlign:'right'}}>Valor</th>
                  <th style={{textAlign:'right'}}>Saldo</th>
                  <th>Usuário</th>
                  <th>Obs</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                {[...extrato].reverse().map((m, idx) => (
                  <tr key={m.id} style={{background: idx === 0 ? 'var(--accent-subtle)' : ''}}>
                    <td style={{fontSize:11,whiteSpace:'nowrap'}}>{new Date(m.created_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}</td>
                    <td>
                      <span className={`badge ${m.direcao==='entrada'?'badge-green':m.direcao==='saida'?'badge-red':'badge-gray'}`} style={{fontSize:10}}>
                        {m.direcao==='entrada'?'↓ Entrada':m.direcao==='saida'?'↑ Saída':'↔ Interno'}
                      </span>
                      <div style={{fontSize:9,color:'var(--text-muted)',marginTop:2}}>{m.tipoLabel}</div>
                    </td>
                    <td style={{fontSize:12}}>{m.vacinas?.nome || '—'}</td>
                    <td style={{fontSize:12,maxWidth:140,overflow:'hidden',textOverflow:'ellipsis'}}>{m.origemNome}</td>
                    <td style={{fontSize:12,maxWidth:140,overflow:'hidden',textOverflow:'ellipsis'}}>{m.destinoNome}</td>
                    <td style={{textAlign:'right',fontFamily:'JetBrains Mono',fontWeight:700,
                      color: m.sinal > 0 ? 'var(--success)' : m.sinal < 0 ? 'var(--danger)' : 'var(--text-muted)'}}>
                      {m.direcao === 'interno' ? <span style={{fontSize:10,color:'var(--text-muted)'}}>—</span> : (
                        <>{m.sinal > 0 ? '+' : '-'}{m.quantidade.toLocaleString('pt-BR')}</>
                      )}
                    </td>
                    <td style={{textAlign:'right',fontFamily:'JetBrains Mono',fontWeight:600,
                      color: m.direcao === 'interno' ? 'var(--text-muted)' : m.saldoPos >= 0 ? 'var(--text-primary)' : 'var(--danger)'}}>
                      {m.saldoPos.toLocaleString('pt-BR')}
                    </td>
                    <td style={{fontSize:11}}>{m.profiles?.nome || '—'}</td>
                    <td style={{fontSize:10,color:'var(--text-muted)',maxWidth:160,overflow:'hidden',textOverflow:'ellipsis'}}>{m.observacao || '—'}</td>
                    <td>
                      {!m.observacao?.includes('ESTORNO') && (
                        <button
                          className="btn btn-secondary btn-sm"
                          style={{fontSize:10,padding:'2px 8px',color:'var(--danger)',borderColor:'var(--danger)'}}
                          disabled={cancelando === m.id}
                          onClick={() => estornar(m)}
                          title="Estornar este lançamento">
                          {cancelando === m.id ? '...' : '↩ Estornar'}
                        </button>
                      )}
                      {m.observacao?.includes('ESTORNO') && (
                        <span style={{fontSize:9,color:'var(--text-muted)',fontStyle:'italic'}}>estorno</span>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
        </>
      )}
    </div>
  );
}

// APLICADORES PAGE
// ═══════════════════════════════════════════════
function AplicadoresPage() {
  const [items, setItems] = useState({ data: [], count: 0 });
  const [search, setSearch] = useState('');
  const [page, setPage] = useState(0);
  const PAGE_SIZE = 50;
  const toast = useContext(ToastContext);

  const load = async () => {
    let q = sb.from('aplicadores').select('*, bases(nome)', { count: 'exact' })
      .order('nome').range(page * PAGE_SIZE, (page+1) * PAGE_SIZE - 1);
    if (search) q = q.or(`nome.ilike.%${search}%,cpf.ilike.%${search}%,cidade.ilike.%${search}%`);
    const { data, error, count } = await q;
    if (error) toast(error.message, 'error');
    else setItems({ data: data || [], count: count || 0 });
  };
  useEffect(() => { load(); }, [page]);

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Aplicadores</div>
          <div className="page-subtitle">{items.count} aplicadores cadastrados</div>
        </div>
      </div>
      <div className="card" style={{marginBottom:16}}>
        <form onSubmit={e=>{e.preventDefault();setPage(0);load();}} style={{display:'flex',gap:10,alignItems:'flex-end'}}>
          <div className="form-group" style={{flex:1}}>
            <input className="form-input sm" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar por nome, CPF ou cidade..." />
          </div>
          <button className="btn btn-primary btn-sm" type="submit">Buscar</button>
        </form>
      </div>
      <div className="card">
        <div className="table-wrap">
          <table>
            <thead>
              <tr><th>Nome</th><th>CPF</th><th>Cidade/UF</th><th>Telefone</th><th>Base Vinculada</th></tr>
            </thead>
            <tbody>
              {items.data.map(a => (
                <tr key={a.id}>
                  <td style={{color:'var(--text-primary)',fontWeight:500}}>{a.nome}</td>
                  <td className="mono" style={{fontSize:11}}>{a.cpf}</td>
                  <td>{a.cidade || '—'} / {a.uf || '—'}</td>
                  <td className="mono" style={{fontSize:12}}>{a.telefone || '—'}</td>
                  <td>{a.bases?.nome || '—'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        {items.count > PAGE_SIZE && (
          <div style={{display:'flex',justifyContent:'center',gap:8,marginTop:16}}>
            <button className="btn btn-secondary btn-sm" disabled={page===0} onClick={()=>setPage(p=>p-1)}>← Anterior</button>
            <span style={{padding:'6px 12px',fontSize:13,color:'var(--text-muted)'}}>{page*PAGE_SIZE+1}–{Math.min((page+1)*PAGE_SIZE,items.count)} de {items.count}</span>
            <button className="btn btn-secondary btn-sm" disabled={(page+1)*PAGE_SIZE>=items.count} onClick={()=>setPage(p=>p+1)}>Próxima →</button>
          </div>
        )}
      </div>
    </div>
  );
}

function MotoristaAppMobile({ profile }) {
  const [page, setPage] = useState('rotas'); // 'rotas' | 'rota_detail'

    });
  }, []);

  const sair = async () => { await sb.auth.signOut(); window.location.reload(); };

  return (
    <div style={{
      minHeight: '100vh', background: 'var(--bg-deep)', color: 'var(--text-primary)',
      fontFamily: 'inherit', maxWidth: 480, margin: '0 auto',
      display: 'flex', flexDirection: 'column'
    }}>
      {/* Header mobile */}
      <div style={{
        background: 'var(--bg-card)', borderBottom: '1px solid var(--border)',
        padding: '14px 16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        position: 'sticky', top: 0, zIndex: 100
      }}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          {page === 'rota_detail' && (
            <button onClick={() => { setPage('rotas'); setRotaSel(null); }}
              style={{background:'none',border:'none',color:'var(--accent)',cursor:'pointer',fontSize:20,padding:0}}>←</button>
          )}
          <div>

          </div>
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <button onClick={() => {
            const cur = localStorage.getItem('vacinalog-theme') || 'dark';
            const next = cur === 'dark' ? 'light' : 'dark';
            localStorage.setItem('vacinalog-theme', next);
            if (next === 'light') document.documentElement.classList.add('light');

            setPage(p => p);
          }} style={{background:'none',border:'1px solid var(--border)',borderRadius:6,cursor:'pointer',padding:'6px 10px',fontSize:14}}>
            {document.documentElement.classList.contains('light') ? '🌙' : '☀️'}

        )}
