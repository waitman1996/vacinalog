  const load = async () => {
    let q = sb.from('rotas').select('*, bases!rotas_base_origem_id_fkey(nome), profiles!rotas_motorista_id_fkey(nome), veiculos(placa, modelo)').order('created_at', { ascending: false });
    if (statusFilter) q = q.eq('status', statusFilter);
    const { data, error } = await q;
    if (error) toast(error.message, 'error');
    else setRotas(data || []);
  };
  useEffect(() => { load(); }, [statusFilter]);

  const enviarMontagem = async (id) => {
    const { error } = await sb.from('rotas').update({ status: 'montagem' }).eq('id', id);
    if (error) toast(error.message, 'error'); else { toast('Rota enviada para montagem!', 'success'); load(); }
  };

  const cancelar = async (id) => {
    if (!confirm('Cancelar esta rota?')) return;
    const { error } = await sb.from('rotas').update({ status: 'cancelada' }).eq('id', id);
    if (error) toast(error.message, 'error'); else { toast('Rota cancelada', 'success'); load(); }
  };

  return (
    <div>
      <div className="page-header">
        <div><div className="page-title">Rotas</div><div className="page-subtitle">Gerencie rotas de entrega e coleta</div></div>
        <button className="btn btn-primary" onClick={onOpenRoteirizacao}>+ Nova Roteirização</button>
      </div>
      <div className="card" style={{marginBottom:16}}>
        <div className="form-group" style={{maxWidth:200}}>
          <label className="form-label">Status</label>
          <select className="form-select" style={{padding:'7px 10px',fontSize:13}} value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
            <option value="">Todos</option>{Object.entries(ROTA_ST).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
          </select>
        </div>
      </div>
      <div className="card"><div className="table-wrap"><table><thead>
        <tr><th>Código</th><th>Data</th><th>Tipo</th><th>Base Origem</th><th>Motorista</th><th>Veículo</th><th>Status</th><th>Ações</th></tr>
      </thead><tbody>
        {rotas.length === 0 && <tr><td colSpan={8}><div className="empty-state"><div className="empty-icon">🚚</div><div className="empty-text">Nenhuma rota encontrada</div></div></td></tr>}
        {rotas.map(r => (
          <tr key={r.id}>
            <td className="mono" style={{fontWeight:600,color:'var(--accent)'}}>{r.codigo}</td>
            <td>{r.data_prevista ? new Date(r.data_prevista+'T12:00:00').toLocaleDateString('pt-BR') : '—'}</td>
            <td><span className={`badge ${r.tipo==='entrega'?'badge-green':r.tipo==='coleta'?'badge-yellow':'badge-blue'}`}>{r.tipo}</span></td>
            <td>{r.bases?.nome||'—'}</td>
            <td>{r.profiles?.nome||'—'}</td>
            <td>{r.veiculos ? `${r.veiculos.modelo} - ${r.veiculos.placa}` : (r.veiculo||'—')}</td>
            <td><span className={`badge ${ROTA_BADGE[r.status]}`}>{ROTA_ST[r.status]}</span></td>
            <td><div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
              {r.status==='planejada' && <><button className="btn btn-success btn-sm" onClick={()=>enviarMontagem(r.id)}>→ Montagem</button><button className="btn btn-danger btn-sm" onClick={()=>cancelar(r.id)}>Cancelar</button></>}
            </div></td>
          </tr>
        ))}
      </tbody></table></div></div>
    </div>
  );
}

// ── Roteirização principal (3 painéis) ──
function RotasPage() {
  const [mode, setMode] = useState('list'); // 'list' ou 'roteirizacao'
  if (mode === 'roteirizacao') return <RoteirizacaoPage onBack={() => setMode('list')} />;
  return <RotasListPage onOpenRoteirizacao={() => setMode('roteirizacao')} />;
}

function RoteirizacaoPage({ onBack }) {
  const [bases, setBases] = useState([]);
  const [veiculos, setVeiculos] = useState([]);
  const [motoristas, setMotoristas] = useState([]);
  const [escalas, setEscalas] = useState([]);
  const [tutores, setTutores] = useState([]);
  const [filteredTutores, setFilteredTutores] = useState([]);
  const [paradas, setParadas] = useState([]);
  const [dragIdx, setDragIdx] = useState(null);
  const [leftOpen, setLeftOpen] = useState(true);
  const [rightOpen, setRightOpen] = useState(true);
  const [expandedTutor, setExpandedTutor] = useState(null);

  const [baseOrigem, setBaseOrigem] = useState('');
  const [filterPP, setFilterPP] = useState('');
  const [filterDateStart, setFilterDateStart] = useState('');
  const [filterDateEnd, setFilterDateEnd] = useState('');
  const [filterStatus, setFilterStatus] = useState('');
  const [searchTarefa, setSearchTarefa] = useState('');
  const [pontosPartida, setPontosPartida] = useState([]);

  const [rotaTipo, setRotaTipo] = useState('entrega');
  const [rotaData, setRotaData] = useState(new Date().toISOString().split('T')[0]);
  const [motoristaId, setMotoristaId] = useState('');
  const [veiculoId, setVeiculoId] = useState('');
  const [saving, setSaving] = useState(false);
  const [mapKey, setMapKey] = useState(0);
  const [geocodeCache, setGeocodeCache] = useState({});
  const toast = useContext(ToastContext);

  useEffect(() => {
    sb.from('bases').select('id, nome, latitude, longitude').eq('ativa', true).order('nome').then(r => setBases(r.data||[]));
    sb.from('veiculos').select('id, placa, modelo, capacidade_doses, motorista_padrao_id').eq('ativo', true).order('modelo').then(r => setVeiculos(r.data||[]));
    sb.from('profiles').select('id, nome').eq('role', 'motorista').eq('ativo', true).order('nome').then(r => setMotoristas(r.data||[]));
    loadEscalas();
  }, []);

  const loadEscalas = async () => {
    const { data } = await sb.from('escalas')
      .select('id, codigo_tarefa, tutor_nome, tutor_cpf, ponto_partida, doses_necessarias, data_inicio, data_termino, base_nome, base_id, status, endereco_tarefa, aplicador_id, aplicadores(nome, cpf, cidade, uf, endereco)')
      .in('status', ['aprovada','em_validacao','em_execucao','pronta_faturamento'])
      .order('tutor_nome');
    const rows = data || [];
    setEscalas(rows);

    // Agrupar por CPF do tutor
    const groups = {};
    rows.forEach(e => {
      const key = e.tutor_cpf || e.id;
      if (!groups[key]) {
        groups[key] = {
          cpf: e.tutor_cpf,
          nome: e.tutor_nome,
          ponto_partida: e.ponto_partida,
          cidade: e.aplicadores?.cidade || '',
          uf: e.aplicadores?.uf || '',
          endereco: e.aplicadores?.endereco || '',
          base_nome: e.base_nome,
          tarefas: [],
          total_doses: 0,
        };
      }
      groups[key].tarefas.push(e);
      groups[key].total_doses += (e.doses_necessarias || 0);
    });
    const tutorList = Object.values(groups).sort((a,b) => b.total_doses - a.total_doses);
    setTutores(tutorList);

    const pps = {};
    tutorList.forEach(t => { if (t.ponto_partida) pps[t.ponto_partida] = (pps[t.ponto_partida]||0)+1; });
    setPontosPartida(Object.entries(pps).sort((a,b)=>b[1]-a[1]));
  };

  useEffect(() => {
    let f = [...tutores];
    const addedCPFs = new Set(paradas.map(p => p.cpf));
    f = f.filter(t => !addedCPFs.has(t.cpf));
    if (filterPP) f = f.filter(t => t.ponto_partida === filterPP);
    if (filterStatus) f = f.filter(t => t.tarefas.some(e => e.status === filterStatus));
    if (filterDateStart) f = f.filter(t => t.tarefas.some(e => e.data_inicio >= filterDateStart));
    if (filterDateEnd) f = f.filter(t => t.tarefas.some(e => e.data_inicio <= filterDateEnd));
    if (searchTarefa) {
      const s = searchTarefa.toLowerCase();
      f = f.filter(t => t.nome.toLowerCase().includes(s) || t.cpf.includes(s) || t.tarefas.some(e => (e.codigo_tarefa||'').toLowerCase().includes(s)));
    }
    setFilteredTutores(f);
  }, [tutores, paradas, filterPP, filterStatus, filterDateStart, filterDateEnd, searchTarefa]);

  useEffect(() => {
    if (veiculoId) {
      const v = veiculos.find(x => x.id === veiculoId);
      if (v?.motorista_padrao_id && !motoristaId) setMotoristaId(v.motorista_padrao_id);
    }
  }, [veiculoId]);

  const geocode = async (query) => {
    if (geocodeCache[query]) return geocodeCache[query];
    try {
      const res = await fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(query+', Brasil')+'&format=json&limit=1&countrycodes=br');
      const data = await res.json();
      if (data?.[0]) {
        const coords = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
        setGeocodeCache(c => ({...c, [query]: coords}));
        return coords;
      }
    } catch(e) {}
    return null;
  };

  const addTutor = async (tutor) => {
    toast('Buscando coordenadas...', 'info');
    const query = tutor.ponto_partida || (tutor.cidade + ', ' + tutor.uf);
    const coords = await geocode(query);
    const parada = {
      cpf: tutor.cpf,
      nome: tutor.nome,
      ponto_partida: tutor.ponto_partida,
      cidade: tutor.cidade,
      uf: tutor.uf,
      doses: tutor.total_doses,
      tarefas_count: tutor.tarefas.length,
      tarefas: tutor.tarefas,
      lat: coords?.lat || null,
      lng: coords?.lng || null,
      ordem: paradas.length + 1
    };
    setParadas(p => [...p, parada]);
    setMapKey(k => k+1);
    toast(tutor.nome + ' adicionado(a) à rota', 'success');
  };

  const removeParada = (idx) => {
    setParadas(p => p.filter((_,i) => i !== idx).map((x,i) => ({...x, ordem: i+1})));
    setMapKey(k => k+1);
  };

  const onDragStart = (idx) => setDragIdx(idx);
  const onDragOver = (e) => e.preventDefault();
  const onDrop = (e, dropIdx) => {
    e.preventDefault();
    if (dragIdx === null || dragIdx === dropIdx) return;
    const n = [...paradas]; const [m] = n.splice(dragIdx, 1); n.splice(dropIdx, 0, m);
    setParadas(n.map((p,i) => ({...p, ordem: i+1})));
    setDragIdx(null); setMapKey(k => k+1);
  };

  const otimizarRota = () => {
    const withCoord = paradas.filter(p => p.lat && p.lng);
    const noCoord = paradas.filter(p => !p.lat || !p.lng);
    if (withCoord.length < 2) { toast('Precisa de pelo menos 2 paradas com coordenadas', 'error'); return; }
    const base = bases.find(b => b.id === baseOrigem);
    let cur = { lat: parseFloat(base?.latitude)||withCoord[0].lat, lng: parseFloat(base?.longitude)||withCoord[0].lng };
    const rem = [...withCoord]; const ordered = [];
    while (rem.length > 0) {
      let ni = 0, nd = Infinity;
      rem.forEach((p,i) => { const d = Math.sqrt((cur.lat-p.lat)**2+(cur.lng-p.lng)**2); if (d < nd) { nd = d; ni = i; } });
      const next = rem.splice(ni, 1)[0]; ordered.push(next); cur = next;
    }
    setParadas([...ordered, ...noCoord].map((p,i) => ({...p, ordem: i+1})));
    setMapKey(k => k+1); toast('Rota otimizada!', 'success');
  };

  const distTotal = () => {
    const c = paradas.filter(p => p.lat && p.lng);
    if (c.length < 2) return 0;
    let t = 0;
    const base = bases.find(b => b.id === baseOrigem);
    const pts = base?.latitude ? [{lat:parseFloat(base.latitude),lng:parseFloat(base.longitude)}, ...c] : c;
    for (let i = 1; i < pts.length; i++) {
      const R=6371, dLat=(pts[i].lat-pts[i-1].lat)*Math.PI/180, dLon=(pts[i].lng-pts[i-1].lng)*Math.PI/180;
      const a = Math.sin(dLat/2)**2+Math.cos(pts[i-1].lat*Math.PI/180)*Math.cos(pts[i].lat*Math.PI/180)*Math.sin(dLon/2)**2;
      t += R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    }
    return t;
  };

  const salvarRota = async () => {
    if (!baseOrigem) { toast('Selecione base de origem', 'error'); return; }
    if (paradas.length === 0) { toast('Adicione paradas', 'error'); return; }
    if (!motoristaId) { toast('Selecione motorista', 'error'); return; }
    setSaving(true);
    const userId = (await sb.auth.getUser()).data.user.id;
    const veiculo = veiculos.find(v => v.id === veiculoId);
    const { data: rota, error: re } = await sb.from('rotas').insert({
      base_origem_id: baseOrigem, data_prevista: rotaData, tipo: rotaTipo,
      motorista_id: motoristaId, veiculo: veiculo ? veiculo.modelo+' - '+veiculo.placa : null,
      veiculo_id: veiculoId||null, criado_por: userId, codigo: ''
    }).select().single();
    if (re) { toast(re.message, 'error'); setSaving(false); return; }
    let errs = 0;
    for (const p of paradas) {
      const obs = p.tarefas.map(t => t.codigo_tarefa).join(', ');
      const { error } = await sb.from('remessas').insert({
        rota_id: rota.id, tipo: rotaTipo==='coleta'?'coleta':'entrega',
        destino_tipo: 'base', destino_base_id: baseOrigem,
        ordem_entrega: p.ordem, observacao: p.nome+' ('+p.cpf+') | '+p.doses+' doses | '+obs,
        codigo_rastreio: ''
      });
      if (error) errs++;
    }
    setSaving(false);
    toast('Rota '+rota.codigo+' criada com '+paradas.length+' paradas!', 'success');
    onBack();
  };

  const totalDoses = paradas.reduce((s,p) => s + (p.doses||0), 0);
  const veiculoSel = veiculos.find(v => v.id === veiculoId);
  const motoristaSel = motoristas.find(m => m.id === motoristaId);
  const km = distTotal();

  return (
    <div style={{display:'flex',flexDirection:'column',height:'calc(100vh - 48px)'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--border)',marginBottom:8,gap:8,flexWrap:'wrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <button className="btn btn-secondary btn-sm" onClick={onBack}>← Voltar</button>
          <span style={{fontSize:18,fontWeight:700}}>Roteirização</span>
          {paradas.length > 0 && <span className="badge badge-blue">{paradas.length} paradas · {totalDoses.toLocaleString('pt-BR')} doses</span>}
        </div>
        <div style={{display:'flex',gap:6}}>
          <button className="btn btn-secondary btn-sm" onClick={() => setLeftOpen(!leftOpen)}>{leftOpen ? '◀ Ocultar filtros' : '▶ Filtros'}</button>
          <button className="btn btn-secondary btn-sm" onClick={() => setRightOpen(!rightOpen)}>{rightOpen ? 'Ocultar rota ▶' : '◀ Rota'}</button>
          <button className="btn btn-success btn-sm" onClick={otimizarRota} disabled={paradas.length < 2}>⚡ Otimizar</button>
          <button className="btn btn-primary" onClick={salvarRota} disabled={saving||paradas.length===0}>{saving ? 'Salvando...' : '💾 Salvar'}</button>
        </div>
      </div>

      <div style={{display:'flex',gap:8,flex:1,minHeight:0,overflow:'hidden'}}>
        {/* LEFT */}
        {leftOpen && (
          <div style={{width:300,flexShrink:0,display:'flex',flexDirection:'column',overflow:'hidden'}}>
            <div className="card" style={{padding:10,marginBottom:6,flexShrink:0}}>
              <div style={{fontSize:12,fontWeight:600,marginBottom:6}}>Config. da Rota</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
                <div className="form-group"><label className="form-label" style={{fontSize:10}}>Base Origem</label>
                  <select className="form-select" style={{padding:'5px 6px',fontSize:11}} value={baseOrigem} onChange={e=>setBaseOrigem(e.target.value)}>
                    <option value="">Selecione</option>{bases.map(b=><option key={b.id} value={b.id}>{b.nome}</option>)}
                  </select></div>
                <div className="form-group"><label className="form-label" style={{fontSize:10}}>Data</label>
                  <input className="form-input" style={{padding:'5px 6px',fontSize:11}} type="date" value={rotaData} onChange={e=>setRotaData(e.target.value)} /></div>
                <div className="form-group"><label className="form-label" style={{fontSize:10}}>Motorista</label>
                  <select className="form-select" style={{padding:'5px 6px',fontSize:11}} value={motoristaId} onChange={e=>setMotoristaId(e.target.value)}>
                    <option value="">Selecione</option>{motoristas.map(m=><option key={m.id} value={m.id}>{m.nome}</option>)}
                  </select></div>
                <div className="form-group"><label className="form-label" style={{fontSize:10}}>Veículo</label>
                  <select className="form-select" style={{padding:'5px 6px',fontSize:11}} value={veiculoId} onChange={e=>setVeiculoId(e.target.value)}>
                    <option value="">Selecione</option>{veiculos.map(v=><option key={v.id} value={v.id}>{v.modelo} {v.placa}</option>)}
                  </select></div>
              </div>
            </div>

            <div className="card" style={{padding:10,marginBottom:6,flexShrink:0}}>
              <div style={{fontSize:12,fontWeight:600,marginBottom:6}}>Filtros</div>
              <input className="form-input" style={{padding:'5px 8px',fontSize:11,marginBottom:4}} value={searchTarefa} onChange={e=>setSearchTarefa(e.target.value)} placeholder="🔍 Nome, CPF, código..." />
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:4,marginBottom:4}}>
                <input className="form-input" style={{padding:'5px 6px',fontSize:11}} type="date" value={filterDateStart} onChange={e=>setFilterDateStart(e.target.value)} />
                <input className="form-input" style={{padding:'5px 6px',fontSize:11}} type="date" value={filterDateEnd} onChange={e=>setFilterDateEnd(e.target.value)} />
              </div>
              <select className="form-select" style={{padding:'5px 6px',fontSize:11,width:'100%'}} value={filterPP} onChange={e=>setFilterPP(e.target.value)}>
                <option value="">Todos pontos de partida</option>
                {pontosPartida.map(([pp,c]) => <option key={pp} value={pp}>{pp} ({c})</option>)}
              </select>
              <select className="form-select" style={{padding:'5px 6px',fontSize:11,width:'100%',marginTop:4}} value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
                <option value="">Todos os status</option>
                <option value="aprovada">Aprovada</option>
                <option value="em_validacao">Em Validação</option>
                <option value="em_execucao">Em Execução</option>
                <option value="pronta_faturamento">Pronta p/ Fat.</option>
              </select>
              <div style={{fontSize:10,color:'var(--text-muted)',marginTop:4}}>
                <span className="badge badge-blue" style={{fontSize:10}}>Disponíveis {filteredTutores.length}</span>{' '}
                <span className="badge badge-green" style={{fontSize:10}}>Na rota {paradas.length}</span>
              </div>
            </div>

            <div style={{flex:1,overflow:'auto',border:'1px solid var(--border)',borderRadius:'var(--radius)',background:'var(--bg-card)'}}>
              {filteredTutores.length === 0 && <div style={{padding:20,textAlign:'center',color:'var(--text-muted)',fontSize:12}}>{tutores.length===0?'Importe escalas primeiro':'Nenhum resultado'}</div>}
              {filteredTutores.slice(0,80).map(t => {
                const isExpanded = expandedTutor === t.cpf;
                const statusCounts = t.tarefas.reduce((acc, e) => { acc[e.status] = (acc[e.status]||0)+1; return acc; }, {});
                return (
                  <div key={t.cpf} style={{borderBottom:'1px solid var(--border)'}}>
                    {/* Header do card - clica para colapsar/expandir */}
                    <div style={{padding:'7px 10px',fontSize:11,display:'flex',justifyContent:'space-between',alignItems:'center',transition:'background 0.1s',gap:4}}
                      onMouseEnter={e=>e.currentTarget.style.background='var(--bg-card-hover)'}
                      onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                      {/* Nome + info - clica para expand */}
                      <div style={{flex:1,minWidth:0,cursor:'pointer'}} onClick={() => setExpandedTutor(isExpanded?null:t.cpf)}>
                        <div style={{display:'flex',alignItems:'center',gap:4}}>
                          <span style={{fontSize:9,color:'var(--text-muted)'}}>{isExpanded?'▼':'▶'}</span>
                          <span style={{fontWeight:600,color:'var(--text-primary)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.nome}</span>
                        </div>
                        <div style={{color:'var(--text-muted)',fontSize:10,marginLeft:12}}>
                          {t.ponto_partida||t.cidade} · {t.tarefas.length} tar.
                          {statusCounts['aprovada'] && <span style={{color:'var(--success)',marginLeft:4}}>✓{statusCounts['aprovada']}</span>}
                          {statusCounts['pronta_faturamento'] && <span style={{color:'var(--info)',marginLeft:4}}>💰{statusCounts['pronta_faturamento']}</span>}
                          {statusCounts['em_execucao'] && <span style={{color:'var(--accent)',marginLeft:4}}>▶{statusCounts['em_execucao']}</span>}
                        </div>
                      </div>
                      <div style={{display:'flex',alignItems:'center',gap:4,flexShrink:0}}>
                        <span className="badge badge-cyan" style={{fontSize:10}}>{t.total_doses.toLocaleString('pt-BR')}</span>
                        <button className="btn btn-primary btn-sm" style={{padding:'3px 8px',fontSize:10}} onClick={(e) => {e.stopPropagation(); addTutor(t);}}>+</button>
                      </div>
                    </div>
                    {/* Detalhe colapsável */}
                    {isExpanded && (
                      <div style={{padding:'4px 10px 8px',background:'var(--bg-input)'}}>
                        <div style={{fontSize:10,color:'var(--text-muted)',marginBottom:4}}>
                          CPF: {t.cpf} · Base: {t.base_nome}
                        </div>
                        {t.tarefas.slice(0,10).map(e => (
                          <div key={e.id} style={{fontSize:10,color:'var(--text-secondary)',padding:'3px 0',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                            <span style={{fontFamily:'JetBrains Mono',fontSize:9,overflow:'hidden',textOverflow:'ellipsis',maxWidth:140}}>{e.codigo_tarefa}</span>
                            <div style={{display:'flex',gap:4,alignItems:'center'}}>
                              <span className={`badge ${STATUS_BADGES[e.status]||'badge-gray'}`} style={{fontSize:9,padding:'1px 5px'}}>{STATUS_LABELS[e.status]||e.status}</span>
                              <span style={{color:'var(--info)',minWidth:50,textAlign:'right'}}>{e.doses_necessarias} doses</span>
                            </div>
                          </div>
                        ))}
                        {t.tarefas.length > 10 && <div style={{fontSize:10,color:'var(--text-muted)',marginTop:3}}>+{t.tarefas.length-10} tarefas...</div>}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* CENTER - MAP */}
        <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0}}>
          <MapaRota key={mapKey} paradas={paradas} bases={bases} baseOrigemId={baseOrigem} />
          <div style={{display:'flex',gap:12,padding:'8px 12px',background:'var(--bg-card)',border:'1px solid var(--border)',borderTop:'none',borderRadius:'0 0 var(--radius) var(--radius)',flexWrap:'wrap',fontSize:12}}>
            <div><span style={{fontSize:10,color:'var(--text-muted)'}}>ORIGEM</span><br/><strong>{bases.find(b=>b.id===baseOrigem)?.nome||'—'}</strong></div>
            <div><span style={{fontSize:10,color:'var(--text-muted)'}}>PARADAS</span><br/><strong>{paradas.length}</strong></div>
            <div><span style={{fontSize:10,color:'var(--text-muted)'}}>DOSES</span><br/><strong>{totalDoses.toLocaleString('pt-BR')}</strong></div>
            <div><span style={{fontSize:10,color:'var(--text-muted)'}}>DISTÂNCIA</span><br/><strong>{km > 0 ? km.toFixed(0)+' km' : '—'}</strong></div>
            {veiculoSel && <div><span style={{fontSize:10,color:'var(--text-muted)'}}>CAPACIDADE</span><br/><strong style={{color:totalDoses>veiculoSel.capacidade_doses?'var(--danger)':'inherit'}}>{totalDoses}/{veiculoSel.capacidade_doses}</strong></div>}
          </div>
        </div>

        {/* RIGHT */}
        {rightOpen && (
          <div style={{width:280,flexShrink:0,display:'flex',flexDirection:'column',overflow:'hidden'}}>
            <div style={{display:'flex',gap:4,marginBottom:6,flexShrink:0}}>
              <button className="btn btn-secondary btn-sm" style={{flex:1,fontSize:10}} onClick={otimizarRota} disabled={paradas.length<2}>⚡ Otimizar</button>
              <button className="btn btn-danger btn-sm" style={{flex:1,fontSize:10}} onClick={() => {if(confirm('Limpar?')){setParadas([]);setMapKey(k=>k+1)}}} disabled={paradas.length===0}>✕ Limpar</button>
            </div>
            <div style={{flex:1,overflow:'auto',border:'1px solid var(--border)',borderRadius:'var(--radius)',background:'var(--bg-card)'}}>
              <div style={{padding:'6px 10px',fontSize:10,color:'var(--text-muted)',borderBottom:'1px solid var(--border)',fontWeight:600}}>ARRASTE PARA REORDENAR</div>
              {paradas.length === 0 && <div style={{padding:24,textAlign:'center',color:'var(--text-muted)',fontSize:12}}>Clique + nos aplicadores à esquerda</div>}
              {paradas.map((p,idx) => (
                <div key={p.cpf} draggable onDragStart={()=>onDragStart(idx)} onDragOver={onDragOver} onDrop={e=>onDrop(e,idx)}
                  style={{padding:'8px 10px',borderBottom:'1px solid var(--border)',cursor:'grab',background:dragIdx===idx?'var(--accent-subtle)':'transparent'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                    <div style={{display:'flex',gap:6,alignItems:'flex-start',flex:1}}>
                      <div style={{width:20,height:20,borderRadius:'50%',background:'var(--accent)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,flexShrink:0}}>{p.ordem}</div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:11,fontWeight:600,color:'var(--text-primary)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.nome}</div>
                        <div style={{fontSize:10,color:'var(--text-muted)'}}>
                          {p.ponto_partida||p.cidade} · {p.doses} doses · {p.tarefas_count} tarefas
                          {!p.lat && <span style={{color:'var(--danger)',marginLeft:3}}>⚠</span>}
                        </div>
                      </div>
                    </div>
                    <button style={{background:'none',border:'none',color:'var(--danger)',cursor:'pointer',fontSize:12,padding:2}} onClick={e=>{e.stopPropagation();removeParada(idx)}}>✕</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function MapaRota({ paradas, bases, baseOrigemId }) {
  const mapRef = useRef(null);
  const mapInstanceRef = useRef(null);

  useEffect(() => {
    if (mapInstanceRef.current) { mapInstanceRef.current.remove(); mapInstanceRef.current = null; }
    if (!mapRef.current) return;
    const map = L.map(mapRef.current).setView([-15.78, -47.93], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
    mapInstanceRef.current = map;
    const bounds = [];
    const base = bases.find(b => b.id === baseOrigemId);
    if (base?.latitude) {
      const lat = parseFloat(base.latitude), lng = parseFloat(base.longitude);
      L.marker([lat, lng], { icon: L.divIcon({ className: '', html: '<div style="background:#2563eb;color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)">🏢</div>', iconSize:[28,28], iconAnchor:[14,14] }) }).addTo(map).bindPopup('<b>ORIGEM: '+base.nome+'</b>');
      bounds.push([lat, lng]);
    }
    const coords = [];
    paradas.forEach(p => {
      if (!p.lat || !p.lng) return;
      L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', html: '<div style="background:#10b981;color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)">'+p.ordem+'</div>', iconSize:[24,24], iconAnchor:[12,12] }) }).addTo(map).bindPopup('<b>'+p.ordem+'. '+p.nome+'</b><br>'+p.ponto_partida+'<br>'+p.doses+' doses · '+p.tarefas_count+' tarefas');
      bounds.push([p.lat, p.lng]); coords.push([p.lat, p.lng]);
    });
    if (base?.latitude && coords.length > 0) L.polyline([[parseFloat(base.latitude),parseFloat(base.longitude)], ...coords], { color:'#2563eb', weight:3, opacity:0.7, dashArray:'8,8' }).addTo(map);
    else if (coords.length > 1) L.polyline(coords, { color:'#2563eb', weight:3, opacity:0.7, dashArray:'8,8' }).addTo(map);
    if (bounds.length > 0) map.fitBounds(bounds, { padding:[30,30], maxZoom:12 });
    return () => { if (mapInstanceRef.current) { mapInstanceRef.current.remove(); mapInstanceRef.current = null; } };
  }, [paradas, bases, baseOrigemId]);

  return <div ref={mapRef} style={{flex:1,borderRadius:'var(--radius) var(--radius) 0 0',border:'1px solid var(--border)',borderBottom:'none',minHeight:250}} />;
}


function TransferenciaPage() {
  const [bases, setBases] = useState([]);
  const [vacinas, setVacinas] = useState([]);
  const [form, setForm] = useState({ vacina_id:'', quantidade:'', origem_tipo:'base', origem_id:'', destino_tipo:'aplicador', destino_id:'', observacao:'' });
  const [searchOrig, setSearchOrig] = useState('');
  const [searchDest, setSearchDest] = useState('');
  const [origResults, setOrigResults] = useState([]);
  const [destResults, setDestResults] = useState([]);
  const [saving, setSaving] = useState(false);
  const toast = useContext(ToastContext);

  useEffect(() => {
    sb.from('bases').select('id, nome').eq('ativa', true).order('nome').then(r => setBases(r.data||[]));
    sb.from('vacinas').select('id, nome, lote').eq('ativa', true).order('nome').then(r => setVacinas(r.data||[]));
  }, []);

  const searchAp = async (term, setter) => {
    if (term.length < 2) { setter([]); return; }
    const { data } = await sb.from('aplicadores').select('id, nome, cpf').or(`nome.ilike.%${term}%,cpf.ilike.%${term}%`).eq('ativo', true).limit(10);
    setter(data || []);
  };

  const transfer = async () => {
    if (!form.vacina_id || !form.quantidade || !form.origem_id || !form.destino_id) { toast('Preencha todos os campos', 'error'); return; }
    setSaving(true);
    const { error } = await sb.rpc('transferir_estoque', {
      p_vacina_id: form.vacina_id, p_quantidade: parseInt(form.quantidade),
      p_origem_tipo: form.origem_tipo, p_origem_id: form.origem_id,
      p_destino_tipo: form.destino_tipo, p_destino_id: form.destino_id,
      p_observacao: form.observacao || null
    });
    if (error) toast(error.message, 'error');
    else { toast('Transferência realizada!', 'success'); setForm(f=>({...f, quantidade:'', observacao:''})); }
    setSaving(false);
  };

  return (
    <div>
      <div className="page-header"><div><div className="page-title">Transferência de Estoque</div><div className="page-subtitle">Mover doses entre bases e aplicadores</div></div></div>
      <div className="card">
        <div className="form-grid">
          <div className="form-group"><label className="form-label">Vacina *</label>
            <select className="form-select" value={form.vacina_id} onChange={e=>setForm(f=>({...f,vacina_id:e.target.value}))}><option value="">Selecione...</option>{vacinas.map(v=><option key={v.id} value={v.id}>{v.nome} {v.lote?`(${v.lote})`:''}</option>)}</select></div>
          <div className="form-group"><label className="form-label">Quantidade *</label>
            <input className="form-input" type="number" min="1" value={form.quantidade} onChange={e=>setForm(f=>({...f,quantidade:e.target.value}))} /></div>
          <div className="form-group"><label className="form-label">Tipo Origem</label>
            <select className="form-select" value={form.origem_tipo} onChange={e=>setForm(f=>({...f,origem_tipo:e.target.value,origem_id:''}))}><option value="base">Base</option><option value="aplicador">Aplicador</option></select></div>
          <div className="form-group"><label className="form-label">Origem *</label>
            {form.origem_tipo==='base' ? (
              <select className="form-select" value={form.origem_id} onChange={e=>setForm(f=>({...f,origem_id:e.target.value}))}><option value="">Selecione...</option>{bases.map(b=><option key={b.id} value={b.id}>{b.nome}</option>)}</select>
            ) : (
              <div><input className="form-input" value={searchOrig} onChange={e=>{setSearchOrig(e.target.value);searchAp(e.target.value,setOrigResults)}} placeholder="Buscar..." />
                {origResults.length>0 && !form.origem_id && <div style={{maxHeight:100,overflow:'auto',marginTop:2,border:'1px solid var(--border)',borderRadius:4}}>{origResults.map(a=><div key={a.id} style={{padding:6,fontSize:12,cursor:'pointer'}} onClick={()=>{setForm(f=>({...f,origem_id:a.id}));setSearchOrig(a.nome);setOrigResults([])}}>{a.nome} ({a.cpf})</div>)}</div>}</div>
            )}</div>
          <div className="form-group"><label className="form-label">Tipo Destino</label>
            <select className="form-select" value={form.destino_tipo} onChange={e=>setForm(f=>({...f,destino_tipo:e.target.value,destino_id:''}))}><option value="base">Base</option><option value="aplicador">Aplicador</option></select></div>
          <div className="form-group"><label className="form-label">Destino *</label>
            {form.destino_tipo==='base' ? (
              <select className="form-select" value={form.destino_id} onChange={e=>setForm(f=>({...f,destino_id:e.target.value}))}><option value="">Selecione...</option>{bases.map(b=><option key={b.id} value={b.id}>{b.nome}</option>)}</select>
            ) : (
              <div><input className="form-input" value={searchDest} onChange={e=>{setSearchDest(e.target.value);searchAp(e.target.value,setDestResults)}} placeholder="Buscar..." />
                {destResults.length>0 && !form.destino_id && <div style={{maxHeight:100,overflow:'auto',marginTop:2,border:'1px solid var(--border)',borderRadius:4}}>{destResults.map(a=><div key={a.id} style={{padding:6,fontSize:12,cursor:'pointer'}} onClick={()=>{setForm(f=>({...f,destino_id:a.id}));setSearchDest(a.nome);setDestResults([])}}>{a.nome} ({a.cpf})</div>)}</div>}</div>
            )}</div>
          <div className="form-group" style={{gridColumn:'1/-1'}}><label className="form-label">Observação</label>
            <input className="form-input" value={form.observacao} onChange={e=>setForm(f=>({...f,observacao:e.target.value}))} /></div>
        </div>
        <div style={{marginTop:16}}><button className="btn btn-primary" onClick={transfer} disabled={saving}>{saving ? 'Transferindo...' : '↔ Transferir Estoque'}</button></div>
      </div>
    </div>
  );
}

// MOVIMENTAÇÕES
// ═══════════════════════════════════════════════
function MovimentacoesPage() {
  const [items, setItems] = useState([]);
  const toast = useContext(ToastContext);

  useEffect(() => {
    sb.from('movimentacoes')
      .select('*, vacinas(nome), profiles(nome)')
      .order('created_at', { ascending: false })
      .limit(100)
      .then(({ data, error }) => {
        if (error) toast(error.message, 'error');
        else setItems(data || []);
      });
  }, []);

  const TIPO_LABELS = {
    entrada: { label: 'Entrada', badge: 'badge-green' },
    saida: { label: 'Saída', badge: 'badge-red' },
    transferencia: { label: 'Transferência', badge: 'badge-blue' },
    envio_aplicador: { label: 'Envio → Aplicador', badge: 'badge-yellow' },
    devolucao: { label: 'Devolução', badge: 'badge-cyan' },
    aplicacao: { label: 'Aplicação', badge: 'badge-green' },
    perda: { label: 'Perda', badge: 'badge-red' },
    dano: { label: 'Dano', badge: 'badge-red' },
    ajuste: { label: 'Ajuste', badge: 'badge-gray' },
  };

  return (
    <div>
      <div className="page-header">
        <div className="page-title">Movimentações</div>
      </div>
      <div className="card">
        <div className="table-wrap">
          <table>
            <thead>
              <tr><th>Data</th><th>Tipo</th><th>Vacina</th><th>Qtd</th><th>Usuário</th><th>Obs</th></tr>
            </thead>
            <tbody>
              {items.length === 0 && (
                <tr><td colSpan={6}><div className="empty-state"><div className="empty-text">Nenhuma movimentação registrada</div></div></td></tr>
              )}
              {items.map(m => {
                const t = TIPO_LABELS[m.tipo] || { label: m.tipo, badge: 'badge-gray' };
                return (
                  <tr key={m.id}>
                    <td>{new Date(m.created_at).toLocaleString('pt-BR')}</td>
                    <td><span className={`badge ${t.badge}`}>{t.label}</span></td>
                    <td>{m.vacinas?.nome || '—'}</td>
                    <td className="mono" style={{fontWeight:600}}>{m.quantidade}</td>
                    <td>{m.profiles?.nome || '—'}</td>
                    <td style={{maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',fontSize:12}}>{m.observacao || '—'}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════
// APLICADORES PAGE
// ═══════════════════════════════════════════════
function AplicadoresPage() {
  const [items, setItems] = useState({ data: [], count: 0 });
  const [search, setSearch] = useState('');
  const [page, setPage] = useState(0);
  const PAGE_SIZE = 50;
  const toast = useContext(ToastContext);

  const load = async () => {
    let q = sb.from('aplicadores').select('*, bases(nome)', { count: 'exact' })
      .order('nome').range(page * PAGE_SIZE, (page+1) * PAGE_SIZE - 1);
    if (search) q = q.or(`nome.ilike.%${search}%,cpf.ilike.%${search}%,cidade.ilike.%${search}%`);
    const { data, error, count } = await q;
    if (error) toast(error.message, 'error');
    else setItems({ data: data || [], count: count || 0 });
  };
  useEffect(() => { load(); }, [page]);

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Aplicadores</div>
          <div className="page-subtitle">{items.count} aplicadores cadastrados</div>
        </div>
      </div>
      <div className="card" style={{marginBottom:16}}>
        <form onSubmit={e=>{e.preventDefault();setPage(0);load();}} style={{display:'flex',gap:10,alignItems:'flex-end'}}>
          <div className="form-group" style={{flex:1}}>
            <input className="form-input sm" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar por nome, CPF ou cidade..." />
          </div>
          <button className="btn btn-primary btn-sm" type="submit">Buscar</button>
        </form>
      </div>
      <div className="card">
        <div className="table-wrap">
          <table>
            <thead>
              <tr><th>Nome</th><th>CPF</th><th>Cidade/UF</th><th>Telefone</th><th>Base Vinculada</th></tr>
            </thead>
            <tbody>
              {items.data.map(a => (
                <tr key={a.id}>
                  <td style={{color:'var(--text-primary)',fontWeight:500}}>{a.nome}</td>
                  <td className="mono" style={{fontSize:11}}>{a.cpf}</td>
                  <td>{a.cidade || '—'} / {a.uf || '—'}</td>
                  <td className="mono" style={{fontSize:12}}>{a.telefone || '—'}</td>
                  <td>{a.bases?.nome || '—'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        {items.count > PAGE_SIZE && (
          <div style={{display:'flex',justifyContent:'center',gap:8,marginTop:16}}>
            <button className="btn btn-secondary btn-sm" disabled={page===0} onClick={()=>setPage(p=>p-1)}>← Anterior</button>
            <span style={{padding:'6px 12px',fontSize:13,color:'var(--text-muted)'}}>{page*PAGE_SIZE+1}–{Math.min((page+1)*PAGE_SIZE,items.count)} de {items.count}</span>
            <button className="btn btn-secondary btn-sm" disabled={(page+1)*PAGE_SIZE>=items.count} onClick={()=>setPage(p=>p+1)}>Próxima →</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════
function App() {
  const [session, setSession] = useState(undefined); // undefined = loading
  const [profile, setProfile] = useState(null);
  const [currentPage, setCurrentPage] = useState('dashboard');
  const [sidebarOpen, setSidebarOpen] = useState(false);

  useEffect(() => {
    sb.auth.getSession().then(({ data: { session } }) => setSession(session));
    const { data: { subscription } } = sb.auth.onAuthStateChange((_event, session) => setSession(session));
    return () => subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session?.user) { setProfile(null); return; }
    sb.from('profiles').select('*').eq('id', session.user.id).single()
      .then(({ data }) => setProfile(data));
  }, [session]);

  if (session === undefined) {
    return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh'}}>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:32,marginBottom:8}}>💉</div>
          <div style={{color:'var(--text-muted)'}}>Carregando...</div>
        </div>
      </div>
    );
  }

  if (!session) {
    return <LoginScreen onLogin={({ session }) => setSession(session)} />;
  }

  const renderPage = () => {
    switch (currentPage) {
      case 'dashboard': return <DashboardPage />;
      case 'bases': return <BasesPage />;
      case 'vacinas': return <VacinasPage />;
      case 'aplicadores': return <AplicadoresPage />;
      case 'importacao': return <ImportacaoPage />;
      case 'tarefas': return <TarefasPage />;
      case 'escalas': return <EscalasPage />;
      case 'estoque': return <EstoquePage />;
      case 'demanda': return <DemandaOfertaPage />;
      case 'movimentacoes': return <MovimentacoesPage />;
      case 'rotas': return <RotasPage />;
      case 'veiculos': return <VeiculosPage />;
      case 'transferencia': return <TransferenciaPage />;
      case 'montagem': return <PlaceholderPage title="Fila de Montagem" icon="📦" description="Montagem de caixas e geração de etiquetas" />;
      case 'etiquetas': return <PlaceholderPage title="Etiquetas" icon="🏷️" description="Impressão de etiquetas 10x15" />;
      case 'minhas-rotas': return <PlaceholderPage title="Minhas Rotas" icon="🚚" description="Rotas atribuídas ao motorista" />;
      case 'minhas-doses': return <PlaceholderPage title="Minhas Doses" icon="💉" description="Saldo de doses sob sua custódia" />;
      case 'abatimento': return <PlaceholderPage title="Registrar Abatimento" icon="✏️" description="Registrar vacinados, perdas e danos" />;
      case 'usuarios': return <PlaceholderPage title="Usuários" icon="👥" description="Gestão de usuários e perfis" />;
      default: return <DashboardPage />;
    }
  };

  return (
    <div className="app-layout">
      <div className="mobile-toggle" onClick={() => setSidebarOpen(!sidebarOpen)}>☰</div>
      <Sidebar profile={profile} currentPage={currentPage} onNavigate={setCurrentPage}
        open={sidebarOpen} onClose={() => setSidebarOpen(false)} />
      <div className="main-content">
        {renderPage()}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════
ReactDOM.render(
  <ToastProvider><App /></ToastProvider>,
  document.getElementById('root')
);
</script>
</body>
