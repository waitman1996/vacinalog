    const authRes = await sb.auth.getUser();
    setMeuId(authRes?.data?.user?.id || null);

    const { data: canal, error: canalErr } = await sb.rpc('get_or_create_chat_rota', { p_rota_id: rota.id });
    if (canalErr) {
      toast('Erro ao abrir chat: ' + canalErr.message, 'error');
      setLoading(false);
      return;
    }
    setCanalId(canal);

    let { data, error } = await sb.from('chat_mensagens')
      .select('id, mensagem, tipo, lat, lng, criado_em, usuario_id, profiles(nome, role)')
      .eq('canal_id', canal)
      .order('criado_em', { ascending: true });

    // Fallback: se o Supabase não conseguir fazer o join com profiles, carrega sem o join.
    if (error) {
      const fallback = await sb.from('chat_mensagens')
        .select('id, mensagem, tipo, lat, lng, criado_em, usuario_id')
        .eq('canal_id', canal)
        .order('criado_em', { ascending: true });
      data = fallback.data;
      error = fallback.error;
    }

    if (error) toast('Erro ao carregar mensagens: ' + error.message, 'error');
    else setMensagens(data || []);

    await sb.rpc('marcar_chat_rota_lido', { p_rota_id: rota.id });
    setLoading(false);
    setTimeout(() => bottomRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
  };

  useEffect(() => {
    carregar();
    pedirGps();
  }, []);

  useEffect(() => {
    if (!canalId) return;
    const channel = sb.channel('chat-rota-' + canalId)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_mensagens', filter: 'canal_id=eq.' + canalId }, () => carregar())
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [canalId]);

  const enviar = async (msg, tipo) => {
    const conteudo = String(msg || texto || '').trim();
    if (!conteudo) {
      toast('Digite uma mensagem antes de enviar.', 'info');
      return;
    }

    setEnviando(true);

    try {
      pedirGps();

      let cid = canalId;
      if (!cid) {
        const canalRes = await sb.rpc('get_or_create_chat_rota', { p_rota_id: rota.id });
        if (canalRes.error) throw canalRes.error;
        cid = canalRes.data;
        setCanalId(cid);
      }

      const userRes = await sb.auth.getUser();
      const uid = userRes?.data?.user?.id || null;

      // Envia direto na tabela para evitar retorno silencioso da RPC
      const insertRes = await sb.from('chat_mensagens').insert({
        canal_id: cid,
        usuario_id: uid,
        mensagem: conteudo,
        tipo: tipo || 'texto',
        lat: gps?.lat || null,
        lng: gps?.lng || null
      }).select('id, mensagem, tipo, lat, lng, criado_em, usuario_id').single();

      if (insertRes.error) throw insertRes.error;

      // Marca como lido, mas não bloqueia o envio se der erro
      try { await sb.rpc('marcar_chat_rota_lido', { p_rota_id: rota.id }); } catch (_) {}

      const novaMsg = {
        ...insertRes.data,
        profiles: { nome: 'Eu' }
      };

      setMensagens(prev => [...prev, novaMsg]);
      setTexto('');
      toast('Mensagem enviada.', 'success');
      setTimeout(() => bottomRef.current?.scrollIntoView({ behavior: 'smooth' }), 150);

    } catch (err) {
      toast('Erro ao enviar mensagem: ' + (err.message || err), 'error');
      alert('Erro ao enviar mensagem: ' + (err.message || err));
    }

    setEnviando(false);
  };

  return (
    <Modal title={`Chat da Rota ${rota.codigo || ''}`} onClose={onClose} large>
      <div style={{display:'grid',gridTemplateColumns:'1fr auto',gap:8,alignItems:'center',marginBottom:10}}>
        <div style={{fontSize:12,color:'var(--text-muted)'}}>
          Motorista: <strong style={{color:'var(--text-primary)'}}>{rota.profiles?.nome || '—'}</strong>
          {' · '}Status: <strong style={{color:'var(--text-primary)'}}>{rota.status || '—'}</strong>
          {gps && <span>{' · '}GPS atualizado</span>}
        </div>
        <button className="btn btn-secondary btn-sm" onClick={pedirGps}>📍 Atualizar GPS</button>
      </div>

      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
        <button className="btn btn-secondary btn-sm" onClick={() => enviar('Estou a caminho', 'texto')}>🚚 Estou a caminho</button>
        <button className="btn btn-secondary btn-sm" onClick={() => enviar('Cheguei no local', 'texto')}>📍 Cheguei</button>
        <button className="btn btn-secondary btn-sm" onClick={() => enviar('Cliente ausente', 'problema')}>⚠️ Cliente ausente</button>
        <button className="btn btn-secondary btn-sm" onClick={() => enviar('Preciso de ajuda da logística', 'problema')}>🆘 Ajuda logística</button>
      </div>

      <div style={{height:360,overflowY:'auto',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:12,background:'var(--bg-input)',marginBottom:10}}>
        {loading ? (
          <div className="empty-state"><div className="empty-icon">⏳</div><div className="empty-text">Carregando chat...</div></div>
        ) : mensagens.length === 0 ? (
          <div className="empty-state"><div className="empty-icon">💬</div><div className="empty-text">Nenhuma mensagem ainda.</div></div>
        ) : mensagens.map(m => {
          const minha = m.usuario_id === meuId;
          return (
            <div key={m.id} style={{display:'flex',justifyContent:minha?'flex-end':'flex-start',marginBottom:8}}>
              <div style={{maxWidth:'78%',background:minha?'var(--accent)':'var(--bg-card)',color:minha?'#fff':'var(--text-primary)',border:'1px solid ' + (minha?'var(--accent)':'var(--border)'),borderRadius:12,padding:'8px 10px'}}>
                <div style={{fontSize:10,opacity:.75,marginBottom:3}}>
                  {m.profiles?.nome || (m.usuario_id === meuId ? 'Eu' : 'Usuário')} · {new Date(m.criado_em).toLocaleString('pt-BR')}
                  {m.tipo === 'problema' && <span style={{marginLeft:6}}>⚠️</span>}
                </div>
                <div style={{fontSize:13,whiteSpace:'pre-wrap'}}>{m.mensagem}</div>
                {m.lat && m.lng && (
                  <button className="btn btn-secondary btn-sm" style={{marginTop:6,fontSize:10,padding:'3px 7px'}}
                    onClick={() => window.open('https://www.google.com/maps?q=' + m.lat + ',' + m.lng, '_blank')}>
                    📍 Ver localização
                  </button>
                )}
              </div>
            </div>
          );
        })}
        <div ref={bottomRef}></div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr auto',gap:8}}>
        <input className="form-input" value={texto} onChange={e=>setTexto(e.target.value)}
          onKeyDown={e=>{ if(e.key==='Enter'){ e.preventDefault(); enviar(); }}}
          placeholder="Digite uma mensagem..." />
        <button className="btn btn-primary" onClick={() => enviar()} disabled={enviando}>
          {enviando ? 'Enviando...' : 'Enviar'}
        </button>
      </div>

      <div className="modal-actions">
        <button className="btn btn-secondary" onClick={onClose}>Fechar</button>
      </div>
    </Modal>
  );
}


// ── Lista de Rotas ──
function RotasListPage({ onOpenRoteirizacao }) {
  const [rotas, setRotas] = useState([]);
  const [statusFilter, setStatusFilter] = useState('');
  const [showMonitoramento, setShowMonitoramento] = useState(false);
  const [rotaDetalhe, setRotaDetalhe] = useState(null);
  const [chatRota, setChatRota] = useState(null);
  const [naoLidas, setNaoLidas] = useState({});
  const toast = useContext(ToastContext);

  const ROTA_ST = { planejada:'Planejada', montagem:'Em Montagem', pronta:'Pronta', em_transito:'Em Trânsito', concluida:'Concluída', cancelada:'Cancelada' };
  const ROTA_BADGE = { planejada:'badge-blue', montagem:'badge-yellow', pronta:'badge-cyan', em_transito:'badge-green', concluida:'badge-gray', cancelada:'badge-red' };

  const statusCards = [
    { key: '', label: 'Total', icon: '🚚', cls: 'badge-blue' },
    { key: 'planejada', label: 'Planejadas', icon: '📝', cls: 'badge-blue' },
    { key: 'montagem', label: 'Montagem', icon: '📦', cls: 'badge-yellow' },
    { key: 'pronta', label: 'Prontas', icon: '✅', cls: 'badge-cyan' },
    { key: 'em_transito', label: 'Em Trânsito', icon: '🛣️', cls: 'badge-green' },
    { key: 'concluida', label: 'Concluídas', icon: '🏁', cls: 'badge-gray' },
    { key: 'cancelada', label: 'Canceladas', icon: '🚫', cls: 'badge-red' },
  ];

  const countStatus = (key) => key
    ? rotas.filter(r => r.status === key).length
    : rotas.length;

  const load = async () => {
    let q = sb.from('rotas').select('*, bases!rotas_base_origem_id_fkey(nome,cidade,uf), profiles!rotas_motorista_id_fkey(nome), veiculos(placa, modelo)').order('created_at', { ascending: false });
    if (statusFilter) q = q.eq('status', statusFilter);
    const { data, error } = await q;
    if (error) toast(error.message, 'error');
    else setRotas(data || []);

    const { data: chats } = await sb.from('vw_chat_rota_nao_lidas').select('rota_id, nao_lidas');
    const mapa = {};
    (chats || []).forEach(c => { mapa[c.rota_id] = c.nao_lidas || 0; });
    setNaoLidas(mapa);
  };
  useEffect(() => { load(); }, [statusFilter]);


  const abrirDetalheSeguro = async (rota) => {
    try {
      if (!rota || !rota.id) {
        toast('Rota inválida.', 'error');
        return;
      }

      const { data, error } = await sb.from('rotas')
        .select('id,codigo,data_prevista,status,veiculo,bases!rotas_base_origem_id_fkey(nome,cidade,uf),profiles!rotas_motorista_id_fkey(nome),remessas(id,status,ordem_entrega,destino_tipo,observacao,bases(nome,cidade,uf),aplicadores(nome,cpf,cidade,uf),remessa_itens(quantidade,vacinas(nome,lote)))')
        .eq('id', rota.id)
        .single();

      if (error) {
        toast('Erro ao carregar rota: ' + error.message, 'error');
        return;
      }

      const r = data || rota;
      const remessas = (r.remessas || []).slice().sort(function(a,b){
        return Number(a.ordem_entrega || 0) - Number(b.ordem_entrega || 0);
      });

      const esc = function(v) {
        return String(v == null ? '' : v).replace(/[&<>"']/g, function(ch) {
          return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch];
        });
      };

      const dataRota = r.data_prevista ? new Date(r.data_prevista + 'T12:00:00').toLocaleDateString('pt-BR') : '—';
      const motorista = (r.profiles && r.profiles.nome) ? r.profiles.nome : '—';
      const base = (r.bases && r.bases.nome) ? r.bases.nome : '—';

      let linhas = '';
      remessas.forEach(function(rem) {
        const dest = rem.destino_tipo === 'base' ? rem.bases : rem.aplicadores;
        const itens = rem.remessa_itens || [];
        let doses = 0;
        const vacinas = [];
        itens.forEach(function(it) {
          doses += Number(it.quantidade || 0);
          vacinas.push(esc((it.vacinas && it.vacinas.nome) ? it.vacinas.nome : 'Vacina') + ' (' + esc(it.quantidade || 0) + ')');
        });

        linhas += '<tr>'
          + '<td>' + esc(rem.ordem_entrega || '—') + '</td>'
          + '<td><b>' + esc(dest && dest.nome ? dest.nome : '—') + '</b>' + (dest && dest.cpf ? '<br><small>CPF: ' + esc(dest.cpf) + '</small>' : '') + '</td>'
          + '<td>' + esc([dest && dest.cidade ? dest.cidade : '', dest && dest.uf ? dest.uf : ''].filter(Boolean).join('/')) + '</td>'
          + '<td>' + esc(rem.status || '—') + '</td>'
          + '<td style="text-align:right"><b>' + esc(doses) + '</b></td>'
          + '<td>' + (vacinas.join(', ') || '—') + '</td>'
          + '<td>' + esc(rem.observacao || '—') + '</td>'
          + '</tr>';
      });

      if (!linhas) {
        linhas = '<tr><td colspan="7" style="text-align:center;padding:20px">Nenhuma remessa encontrada.</td></tr>';
      }

      const html =
        '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Detalhe da Rota</title>'
        + '<style>body{font-family:Arial,sans-serif;padding:20px;color:#111;background:#fff}h1{margin:0 0 8px;color:#1e3a5f}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.card{border:1px solid #ddd;border-radius:8px;padding:10px;background:#f8fafc}.lb{font-size:10px;color:#666;text-transform:uppercase}.vl{font-size:14px;font-weight:700;margin-top:4px}table{width:100%;border-collapse:collapse;margin-top:14px}th{background:#1e3a5f;color:white;text-align:left;padding:8px;font-size:11px}td{border-bottom:1px solid #eee;padding:8px;font-size:12px;vertical-align:top}</style>'
        + '</head><body>'
        + '<h1>Detalhes da Rota ' + esc(r.codigo || '') + '</h1>'
        + '<div style="color:#666">Visualização segura da rota</div>'
        + '<div class="grid">'
        + '<div class="card"><div class="lb">Data</div><div class="vl">' + esc(dataRota) + '</div></div>'
        + '<div class="card"><div class="lb">Status</div><div class="vl">' + esc(r.status || '—') + '</div></div>'
        + '<div class="card"><div class="lb">Base Origem</div><div class="vl">' + esc(base) + '</div></div>'
        + '<div class="card"><div class="lb">Motorista</div><div class="vl">' + esc(motorista) + '</div></div>'
        + '<div class="card"><div class="lb">Veículo</div><div class="vl">' + esc(r.veiculo || '—') + '</div></div>'
        + '<div class="card"><div class="lb">Paradas</div><div class="vl">' + esc(remessas.length) + '</div></div>'
        + '</div>'
        + '<table><thead><tr><th>Ordem</th><th>Destino</th><th>Cidade/UF</th><th>Status</th><th>Doses</th><th>Vacinas</th><th>Obs</th></tr></thead><tbody>'
        + linhas
        + '</tbody></table>'
        + '</body></html>';

      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);

    } catch (err) {
      toast('Erro ao abrir rota: ' + (err.message || err), 'error');
      alert('Erro ao abrir rota: ' + (err.message || err));
    }
  };


  const enviarMontagem = async (id) => {
    const { error } = await sb.from('rotas').update({ status: 'montagem' }).eq('id', id);
    if (error) toast(error.message, 'error'); else { toast('Rota enviada para montagem!', 'success'); load(); }
  };

  const cancelar = async (id) => {
    if (!confirm('Cancelar esta rota?')) return;
    const { error } = await sb.from('rotas').update({ status: 'cancelada' }).eq('id', id);
    if (error) toast(error.message, 'error'); else { toast('Rota cancelada', 'success'); load(); }
  };


  const imprimirRomaneio = async (rota) => {
    try {
      toast('Gerando romaneio...', 'info');

      const { data: rotaData, error: rotaError } = await sb.from('rotas')
        .select('*, bases!rotas_base_origem_id_fkey(nome,cidade,uf,endereco), profiles!rotas_motorista_id_fkey(nome), veiculos(placa, modelo)')
        .eq('id', rota.id)
        .single();

      if (rotaError) throw rotaError;

      const { data: remessasData, error: remessasError } = await sb.from('remessas')
        .select('*, remessa_itens(*, vacinas(nome, lote)), bases(nome, cidade, uf, endereco), aplicadores(nome, cpf, cidade, uf, endereco)')
        .eq('rota_id', rota.id)
        .order('ordem_entrega', { ascending: true });

      if (remessasError) throw remessasError;

      const esc = (v) => String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
      const dataBr = (d) => d ? new Date(d + 'T12:00:00').toLocaleDateString('pt-BR') : new Date().toLocaleDateString('pt-BR');
      const parseDosesObs = (obs) => {
        const m = String(obs || '').match(/(\d+)\s*doses/i);
        return m ? Number(m[1]) : 0;
      };

      const remessas = remessasData || [];
      const motorista = rotaData.profiles?.nome || rota.profiles?.nome || '—';
      const veiculoPlaca = rotaData.veiculos
        ? `${rotaData.veiculos.modelo || ''}${rotaData.veiculos.placa ? ' - ' + rotaData.veiculos.placa : ''}`.trim()
        : (rotaData.veiculo || rota.veiculo || '—');
      const dataRota = dataBr(rotaData.data_prevista || rota.data_prevista);
      const baseOrigem = rotaData.bases?.nome || rota.bases?.nome || '—';

      const totalDoses = remessas.reduce((s, rem) => {
        const itens = rem.remessa_itens || [];
        return s + (itens.length ? itens.reduce((x, it) => x + Number(it.quantidade || 0), 0) : parseDosesObs(rem.observacao));
      }, 0);

      const rowsHtml = remessas.map((rem, idx) => {
        const destino = rem.destino_tipo === 'base' ? rem.bases : rem.aplicadores;
        const responsavel = rem.destino_tipo === 'base'
          ? (destino?.nome || 'Base')
          : `${destino?.nome || 'Aplicador'}${destino?.cpf ? ' — CPF: ' + destino.cpf : ''}`;
        const endereco = [destino?.endereco || '', destino?.cidade || '', destino?.uf || ''].filter(Boolean).join(' — ');
        const itens = rem.remessa_itens || [];
        const doses = itens.length ? itens.reduce((s, it) => s + Number(it.quantidade || 0), 0) : parseDosesObs(rem.observacao);
        const labLote = itens.length
          ? itens.map(it => `${esc(it.vacinas?.nome || 'Vacina')}${(it.lote || it.vacinas?.lote) ? ' / Lote ' + esc(it.lote || it.vacinas?.lote) : ''}`).join('<br>')
          : '—';
        const descricao = itens.length
          ? itens.map(it => `${esc(it.quantidade || 0)} doses — ${esc(it.vacinas?.nome || 'Vacina')}`).join('<br>')
          : esc(rem.observacao || 'Doses / materiais da campanha');

        return [
          '<tr>',
          '<td>' + esc(responsavel) + '</td>',
          '<td>' + esc(endereco) + '</td>',
          '<td style="text-align:center">' + esc(destino?.uf || '') + '</td>',
          '<td>Ordem ' + esc(rem.ordem_entrega || idx + 1) + '</td>',
          '<td style="text-align:center">' + esc(itens.length || (doses > 0 ? 1 : '—')) + '</td>',
          '<td style="text-align:center;font-weight:700">' + esc(doses || '—') + '</td>',
          '<td>' + labLote + '</td>',
          '<td style="text-align:center">Entrega</td>',
          '<td>' + descricao + '</td>',
          '<td></td>',
          '<td></td>',
          '</tr>'
        ].join('');
      }).join('');

      const htmlParts = [
        '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Romaneio ' + esc(rotaData.codigo || rota.codigo || '') + '</title>',
        '<style>',
        '*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;padding:10mm;background:#fff;color:#000;font-size:10px}',
        '@page{size:A4 landscape;margin:8mm}@media print{body{padding:0}.no-print{display:none}}',
        'h1{font-size:16px;text-align:center;margin:0 0 10px;text-transform:uppercase}',
        '.top{width:100%;border-collapse:collapse;margin-bottom:8px}.top td{border:1px solid #000;padding:5px;font-size:11px;height:28px}',
        '.alert{border:1px solid #000;background:#f2f2f2;text-align:center;font-weight:700;padding:6px;margin-bottom:8px;font-size:11px}',
        'table.rom{width:100%;border-collapse:collapse;table-layout:fixed}.rom th,.rom td{border:1px solid #000;padding:4px;vertical-align:top;word-break:break-word}',
        '.rom th{background:#e5e7eb;font-size:9px;text-align:center;text-transform:uppercase}.footer{display:flex;justify-content:space-between;margin-top:12px;font-size:10px}',
        '.no-print{position:fixed;right:12px;top:12px}.btn{padding:8px 14px;background:#2563eb;color:#fff;border:0;border-radius:4px;cursor:pointer;font-weight:700}',
        '</style></head><body>',
        '<button class="btn no-print" onclick="window.print()">Imprimir / Salvar PDF</button>',
        '<h1>Romaneio de movimentação base - Campanha 2026</h1>',
        '<table class="top">',
        '<tr><td style="width:12%;font-weight:700">ROTA:</td><td style="width:18%">' + esc(rotaData.codigo || rota.codigo || '—') + '</td><td style="width:12%;font-weight:700">MOTORISTA:</td><td style="width:22%">' + esc(motorista) + '</td><td style="width:8%;font-weight:700">DATA:</td><td style="width:12%">' + esc(dataRota) + '</td><td style="width:16%;font-weight:700">ASSINATURA MOTORISTA:</td></tr>',
        '<tr><td style="font-weight:700">BASE ORIGEM:</td><td>' + esc(baseOrigem) + '</td><td style="font-weight:700">VEÍCULO-PLACA:</td><td>' + esc(veiculoPlaca) + '</td><td style="font-weight:700">TOTAL DOSES:</td><td>' + esc(totalDoses.toLocaleString('pt-BR')) + '</td><td></td></tr>',
        '</table>',
        '<div class="alert">ATENÇÃO: TODA OPERAÇÃO COM VACINAS TERÁ QUE SER FEITA TRANSFERÊNCIA VIA SISTEMA</div>',
        '<table class="rom"><thead><tr>',
        '<th style="width:13%">Responsável CPF/CNPJ<br>(Clínica, empresa ou enfermeira)</th><th style="width:15%">Endereço</th><th style="width:3%">UF</th><th style="width:8%">Contato e Horário</th><th style="width:5%">Volumes</th><th style="width:7%">Quantidade Doses</th><th style="width:12%">Laboratório e Lote</th><th style="width:7%">Entrega e/ou Retirada</th><th style="width:13%">Descrição do Volume ou Material</th><th style="width:9%">Conferência Base e Observação</th><th style="width:8%">Assinatura e CPF do responsável</th>',
        '</tr></thead><tbody>',
        rowsHtml || '<tr><td colspan="11" style="text-align:center;padding:18px">Nenhuma parada/remessa encontrada para esta rota.</td></tr>',
        '</tbody></table>',
        '<div class="footer"><div>Gerado automaticamente pelo VacinaLog em ' + esc(new Date().toLocaleString('pt-BR')) + '</div><div>' + esc(remessas.length) + ' paradas na ordem de entrega</div></div>',
        '</body></html>'
      ];

      const blob = new Blob([htmlParts.join('')], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const win = window.open(url, '_blank');
      if (!win) {
        const a = document.createElement('a');
        a.href = url;
        a.download = 'romaneio-' + (rotaData.codigo || rota.codigo || 'rota') + '.html';
        document.body.appendChild(a);
        a.click();
        a.remove();
      }
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (err) {
      toast('Erro ao gerar romaneio: ' + (err.message || err), 'error');
    }
  };

  return (
    <div>
      {chatRota && <ChatRotaModal rota={chatRota} onClose={() => { setChatRota(null); load(); }} />}
      <div className="page-header">
        <div><div className="page-title">Rotas</div><div className="page-subtitle">Gerencie rotas de entrega e coleta</div></div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-secondary" onClick={() => setShowMonitoramento(true)}>
            🗺️ Monitoramento ao Vivo
          </button>
          <button className="btn btn-primary" onClick={onOpenRoteirizacao}>+ Nova Roteirização</button>
        </div>
      </div>
      {showMonitoramento && <MonitoramentoAoVivo onClose={() => setShowMonitoramento(false)} />}

      <div className="kpi-grid-compact" style={{marginBottom:16}}>
        {statusCards.map(card => {
          const active = statusFilter === card.key;
          return (
            <div
              key={card.key || 'total'}
              className="kpi-card-compact"
              onClick={() => setStatusFilter(card.key)}
              style={{
                cursor:'pointer',
                minHeight:86,
                borderColor: active ? 'var(--accent)' : 'var(--border)',
                boxShadow: active ? '0 0 0 2px var(--accent-subtle)' : undefined
              }}
            >
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
                <div className={`badge ${card.cls}`}>{card.icon}</div>
                {active && <span style={{fontSize:10,color:'var(--accent)',fontWeight:700}}>Filtro ativo</span>}
              </div>
              <div className="kpi-value">{countStatus(card.key).toLocaleString('pt-BR')}</div>
              <div className="kpi-label">{card.label}</div>
            </div>
          );
        })}
      </div>

      <div className="card" style={{marginBottom:16}}>
        <div className="form-group" style={{maxWidth:200}}>
          <label className="form-label">Status</label>
          <select className="form-select" style={{padding:'7px 10px',fontSize:13}} value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
            <option value="">Todos</option>{Object.entries(ROTA_ST).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
          </select>
        </div>
      </div>
      <div className="card"><div className="table-wrap"><table><thead>
        <tr><th>Código</th><th>Data</th><th>Base Origem</th><th>Motorista</th><th>Veículo</th><th>Status</th><th>Check-in</th><th>Check-out</th><th>Duração</th><th>Ações</th></tr>
      </thead><tbody>
        {rotas.length === 0 && <tr><td colSpan={10}><div className="empty-state"><div className="empty-icon">🚚</div><div className="empty-text">Nenhuma rota encontrada</div></div></td></tr>}
        {rotas.map(r => {
          const fmtDT = (dt) => dt ? new Date(dt).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
          const duracao = () => {
            if (!r.checkin_at || !r.checkout_at) return '—';
            const mins = Math.round((new Date(r.checkout_at)-new Date(r.checkin_at))/60000);
            return mins < 60 ? `${mins}min` : `${Math.floor(mins/60)}h${mins%60>0?String(mins%60).padStart(2,'0')+'min':''}`;
          };
          return (
          <tr key={r.id}>
            <td className="mono" style={{fontWeight:600,color:'var(--accent)'}}>{r.codigo}</td>
            <td>{r.data_prevista ? new Date(r.data_prevista+'T12:00:00').toLocaleDateString('pt-BR') : '—'}</td>
            <td>{r.bases?.nome||'—'}</td>
            <td>{r.profiles?.nome||'—'}</td>
            <td style={{fontSize:11}}>{r.veiculos ? `${r.veiculos.modelo} · ${r.veiculos.placa}` : (r.veiculo||'—')}</td>
            <td><span className={`badge ${ROTA_BADGE[r.status]}`}>{ROTA_ST[r.status]}</span></td>
            <td style={{fontSize:11,whiteSpace:'nowrap'}}>
              {r.checkin_at ? (
                <div>
                  <div style={{color:'var(--success)',fontWeight:600}}>{fmtDT(r.checkin_at)}</div>
                  {r.checkin_lat && <div style={{fontSize:9,color:'var(--text-muted)',cursor:'pointer'}}
                    onClick={()=>window.open(`https://maps.google.com?q=${r.checkin_lat},${r.checkin_lng}`,'_blank')}>
                    📍 ver local
                  </div>}
                </div>
              ) : <span style={{color:'var(--text-muted)'}}>—</span>}
            </td>
            <td style={{fontSize:11,whiteSpace:'nowrap'}}>
              {r.checkout_at ? (
                <div>
                  <div style={{color:'var(--accent)',fontWeight:600}}>{fmtDT(r.checkout_at)}</div>
                  {r.checkout_lat && <div style={{fontSize:9,color:'var(--text-muted)',cursor:'pointer'}}
                    onClick={()=>window.open(`https://maps.google.com?q=${r.checkout_lat},${r.checkout_lng}`,'_blank')}>
                    📍 ver local
                  </div>}
                </div>
              ) : r.status === 'em_transito' ? (
                <span style={{fontSize:10,color:'var(--warning)'}}>Em andamento...</span>
              ) : <span style={{color:'var(--text-muted)'}}>—</span>}
            </td>
            <td style={{fontSize:11,fontFamily:'JetBrains Mono',color:'var(--text-muted)'}}>{duracao()}</td>
            <td><div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
              <button className="btn btn-secondary btn-sm" onClick={() => abrirDetalheSeguro(r)}>👁 Ver</button>
              <button className="btn btn-secondary btn-sm" onClick={() => imprimirRomaneio(r)}>📄 Romaneio</button>
              <button className="btn btn-secondary btn-sm" onClick={() => setChatRota(r)}>
                💬 Chat {naoLidas[r.id] ? <span className="badge badge-red" style={{marginLeft:4}}>{naoLidas[r.id]}</span> : null}
              </button>
              {r.status==='planejada' && <><button className="btn btn-success btn-sm" onClick={()=>enviarMontagem(r.id)}>→ Montagem</button><button className="btn btn-danger btn-sm" onClick={()=>cancelar(r.id)}>Cancelar</button></>}
              {r.status==='em_transito' && <span style={{fontSize:10,color:'var(--success)'}}>🟢 ao vivo</span>}
            </div></td>
          </tr>
        )})}
      </tbody></table></div></div>
    </div>
  );
}

// ── Roteirização principal (3 painéis) ──
function RotasPage() {
  const [mode, setMode] = useState('list'); // 'list' ou 'roteirizacao'
  if (mode === 'roteirizacao') return <RoteirizacaoPage onBack={() => setMode('list')} />;
  return <RotasListPage onOpenRoteirizacao={() => setMode('roteirizacao')} />;
}

function RoteirizacaoPage({ onBack }) {
  const [bases, setBases] = useState([]);
  const [veiculos, setVeiculos] = useState([]);
  const [motoristas, setMotoristas] = useState([]);
  const [escalas, setEscalas] = useState([]);
  const [tutores, setTutores] = useState([]);
  const [filteredTutores, setFilteredTutores] = useState([]);
  const [paradas, setParadas] = useState([]);
  const [dragIdx, setDragIdx] = useState(null);
  const [leftOpen, setLeftOpen] = useState(true);
  const [rightOpen, setRightOpen] = useState(true);
  const [expandedTutor, setExpandedTutor] = useState(null);
  const [infoTutor, setInfoTutor] = useState(null);

  const [baseOrigem, setBaseOrigem] = useState('');
  const [filterPP, setFilterPP] = useState('');
  const [filterDateStart, setFilterDateStart] = useState('');
  const [filterDateEnd, setFilterDateEnd] = useState('');
  const [filterStatus, setFilterStatus] = useState('');
  const [showJaRoteirizado, setShowJaRoteirizado] = useState(true);
  const [searchTarefa, setSearchTarefa] = useState('');
  const [pontosPartida, setPontosPartida] = useState([]);
  const [planejamentoByAplicador, setPlanejamentoByAplicador] = useState({});
  const [manualDosesRota, setManualDosesRota] = useState({});
  const [selectedTarefasRota, setSelectedTarefasRota] = useState({});
  const [manualDosesTarefaRota, setManualDosesTarefaRota] = useState({});

  const [rotaTipo, setRotaTipo] = useState('entrega');
  const [rotaData, setRotaData] = useState(new Date().toISOString().split('T')[0]);
  const [motoristaId, setMotoristaId] = useState('');
  const [veiculoId, setVeiculoId] = useState('');
  const [saving, setSaving] = useState(false);
  const [mapKey, setMapKey] = useState(0);
  const [geocodeCache, setGeocodeCache] = useState({});
  const toast = useContext(ToastContext);

  useEffect(() => {
    sb.from('bases').select('id, nome, latitude, longitude').eq('ativa', true).order('nome').then(r => setBases(r.data||[]));
    sb.from('veiculos').select('id, placa, modelo, capacidade_doses, motorista_padrao_id, base_id').eq('ativo', true).order('modelo').then(r => setVeiculos(r.data||[]));
    sb.from('profiles').select('id, nome, base_id').eq('role', 'motorista').eq('ativo', true).order('nome').then(r => setMotoristas(r.data||[]));
    loadEscalas();
  }, []);

  const loadEscalas = async () => {
    const PAGE = 1000;
    const normalizeRouteCode = (v) => String(v || '')
      .trim()
      .toUpperCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^A-Z0-9]/g, '');

    const normalizeStatusKey = (status) => {
      const raw = String(status || '').trim();
      if (!raw) return 'aprovada';
      if (STATUS_MAP[raw]) return STATUS_MAP[raw];
      const key = raw
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/ç/g, 'c')
        .replace(/[^a-z0-9]+/g, '_')
        .replace(/^_+|_+$/g, '');
      const aliases = {
        'em_validacao': 'em_validacao',
        'em_execucao': 'em_execucao',
        'pronta_p_faturamento': 'pronta_faturamento',
        'pronta_fat': 'pronta_faturamento',
        'pronta_faturamento': 'pronta_faturamento',
        'aprovada': 'aprovada',
        'cancelada': 'cancelada'
      };
      return aliases[key] || key || 'aprovada';
    };

    const fetchPaged = async (table, select, queryBuilder) => {
      let all = [];
      for (let page = 0; ; page++) {
        let q = sb.from(table).select(select).range(page * PAGE, (page + 1) * PAGE - 1);
        if (queryBuilder) q = queryBuilder(q);
        const { data, error } = await q;
        if (error) throw error;
        all = all.concat(data || []);
        if (!data || data.length < PAGE) break;
      }
      return all;
    };

    try {
      // Carregamento principal baseado na própria tabela escalas.
      // Essa é a mesma fonte da aba Escalas, então não depende de relacionamento ou join para aparecer.
      let allRows = [];
      try {
        allRows = await fetchPaged('escalas', '*', q => q.order('data_inicio', { ascending: true }));
      } catch (err) {
        console.warn('Falha no order por data_inicio. Tentando sem order:', err);
        allRows = await fetchPaged('escalas', '*');
      }

      if (!allRows.length) {
        setEscalas([]);
        setTutores([]);
        setFilteredTutores([]);
        setPontosPartida([]);
        return;
      }

      // Aplicadores em separado, apenas para enriquecer. Se falhar, a escala continua aparecendo.
      const apIds = [...new Set(allRows.map(e => e.aplicador_id).filter(Boolean))];
      const apById = {};
      for (let i = 0; i < apIds.length; i += 500) {
        const ids = apIds.slice(i, i + 500);
        try {
          const { data: aps } = await sb.from('aplicadores')
            .select('id,nome,cpf,cidade,uf,endereco,base_vinculada_id')
            .in('id', ids);
          (aps || []).forEach(a => { apById[a.id] = a; });
        } catch (err) { console.warn('Falha ao buscar aplicadores:', err); }
      }

      // Tarefas em separado, apenas para complementar data/status/doses/cliente.
      let tarefasAll = [];
      try {
        tarefasAll = await fetchPaged(
          'tarefas',
          'id,codigo,cliente,cidade_campanha,uf_campanha,data_inicio,doses_previstas,status,status_logistica,ponto_partida,base_id,base_nome,vacina_id,semanas',
          q => q.order('data_inicio', { ascending: true })
        );
      } catch (err) {
        console.warn('Não foi possível carregar tarefas para complementar rotas:', err);
      }

      const tarefaByCodigo = {};
      const tarefaById = {};
      tarefasAll.forEach(t => {
        if (t.id) tarefaById[t.id] = t;
        const c = normalizeRouteCode(t.codigo);
        if (c) tarefaByCodigo[c] = t;
      });

      // Remessas ativas: se falhar, apenas não marca como já roteirizado.
      const apJaRoteirizados = new Set();
      try {
        const { data: remessasAtivas } = await sb.from('remessas')
          .select('destino_aplicador_id,status')
          .not('destino_aplicador_id', 'is', null)
          .limit(20000);
        (remessasAtivas || []).forEach(r => {
          const st = String(r.status || '').toLowerCase();
          if (!['concluida','concluído','concluido','cancelada','entregue'].includes(st)) {
            apJaRoteirizados.add(r.destino_aplicador_id);
          }
        });
      } catch (err) { console.warn('Falha ao buscar remessas ativas:', err); }

      // Estoque atual do aplicador.
      let estoqueAplicadorAll = [];
      try {
        estoqueAplicadorAll = await fetchPaged(
          'estoque',
          'aplicador_id,vacina_id,quantidade,localizacao_tipo',
          q => q.eq('localizacao_tipo', 'aplicador')
        );
      } catch (err) { console.warn('Falha ao buscar estoque do aplicador:', err); }

      const estoqueByAplicador = {};
      const estoqueByAplicadorVacina = {};
      estoqueAplicadorAll.forEach(s => {
        if (!s.aplicador_id) return;
        const qtd = Number(s.quantidade || 0);
        estoqueByAplicador[s.aplicador_id] = (estoqueByAplicador[s.aplicador_id] || 0) + qtd;
        const k = s.aplicador_id + '|' + (s.vacina_id || '');
        estoqueByAplicadorVacina[k] = (estoqueByAplicadorVacina[k] || 0) + qtd;
      });

      let rows = allRows.map(e => {
        const ap = apById[e.aplicador_id] || {};
        const t = tarefaById[e.tarefa_id] || tarefaByCodigo[normalizeRouteCode(e.codigo_tarefa)] || {};
        const statusOriginal = t.status || e.status || 'Aprovada';
        const statusFinal = normalizeStatusKey(statusOriginal);
        return {
          ...e,
          aplicadores: ap,
          _tarefa: t,
          _data_inicio: String(t.data_inicio || e.data_inicio || '').slice(0,10),
          _status: statusFinal,
          _status_original: statusOriginal,
          _status_logistica: String(t.status_logistica || e.status_logistica || 'nao_roteirizado').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, ''),
          _doses: Number(t.doses_previstas || e.doses_necessarias || 0),
          _ponto_partida: t.ponto_partida || e.ponto_partida || e.base_nome || '',
          _base_nome: t.base_nome || e.base_nome || '',
          _cliente: t.cliente || '',
          _semana: Number(t.semanas || e.semanas || 0) || null,
        };
      });

      setEscalas(rows);

      // Decisões da Demanda vs Oferta para ajustar quantidade a roteirizar.
      let planningRows = [];
      try {
        const { data: pr, error: prErr } = await sb.from('planejamento_logistico')
          .select('aplicador_id,vacina_id,semana,quantidade_sugerida,status,saldo_projetado,demanda_futura,estoque_atual')
          .not('aplicador_id', 'is', null)
          .limit(20000);
        if (!prErr) planningRows = pr || [];
      } catch (err) { planningRows = []; }

      const planMap = {};
      planningRows.forEach(p => {
        if (!p.aplicador_id) return;
        if (!planMap[p.aplicador_id]) planMap[p.aplicador_id] = { quantidade_sugerida: 0, status: p.status, items: [] };
        planMap[p.aplicador_id].items.push(p);
        if (p.status === 'nao_enviar_estoque_suficiente') {
          planMap[p.aplicador_id].status = p.status;
        } else if (['envio_sugerido','envio_aprovado','em_montagem','montado','carregado','em_rota'].includes(p.status)) {
          planMap[p.aplicador_id].quantidade_sugerida += Number(p.quantidade_sugerida || 0);
          planMap[p.aplicador_id].status = p.status;
        }
      });
      setPlanejamentoByAplicador(planMap);

      // Agrupar por aplicador/CPF. Mesmo sem aplicador_id, a escala aparece pelo CPF/nome.
      const groups = {};
      rows.forEach(e => {
        const ap = e.aplicadores || {};
        const cpfRaw = String(e.tutor_cpf || ap.cpf || '').trim();
        const cpfNorm = cpfRaw.replace(/\D/g, '');
        const key = e.aplicador_id || cpfNorm || e.tutor_nome || e.id;
        if (!groups[key]) {
          groups[key] = {
            cpf: cpfRaw,
            cpfNorm,
            nome: (e.tutor_nome || ap.nome || 'Sem nome').trim(),
            ponto_partida: e._ponto_partida,
            cidade: ap.cidade || '',
            uf: ap.uf || '',
            endereco: ap.endereco || e.endereco_tarefa || '',
            base_nome: e._base_nome,
            aplicador_id: e.aplicador_id,
            tarefas: [],
            total_doses: 0,
            statuses: new Set(),
            jaRoteirizado: e.aplicador_id ? apJaRoteirizados.has(e.aplicador_id) : false,
            estoque_atual: e.aplicador_id ? (estoqueByAplicador[e.aplicador_id] || 0) : 0,
            estoque_mesma_vacina: 0,
            _vacinasEstoqueComputadas: new Set(),
          };
        }
        if (!groups[key].ponto_partida && e._ponto_partida) groups[key].ponto_partida = e._ponto_partida;
        if (!groups[key].base_nome && e._base_nome) groups[key].base_nome = e._base_nome;
        // Deduplicar por codigo_tarefa — só adiciona se ainda não existe
        const codigoTarefa = e.codigo_tarefa || e._codigo_tarefa || '';
        const jaExiste = codigoTarefa && groups[key].tarefas.some(t => (t.codigo_tarefa || t._codigo_tarefa || '') === codigoTarefa);
        if (!jaExiste) {
          groups[key].tarefas.push(e);
          groups[key].total_doses += Number(e._doses || e.doses_necessarias || 0);
        }
        const vacKey = e.vacina_id || e._tarefa?.vacina_id || '';
        if (e.aplicador_id && vacKey && !groups[key]._vacinasEstoqueComputadas.has(vacKey)) {
          groups[key].estoque_mesma_vacina += Number(estoqueByAplicadorVacina[e.aplicador_id + '|' + vacKey] || 0);
          groups[key]._vacinasEstoqueComputadas.add(vacKey);
        }
        groups[key].statuses.add(e._status || e.status || 'aprovada');
      });

      Object.values(groups).forEach(g => {
        delete g._vacinasEstoqueComputadas;
        // Calcular se todas as tarefas estão com status logística concluído
        const normSL = (v) => String(v || '').toLowerCase().trim()
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        const CONCLUIDOS = ['entregue','concluido','concluida','finalizado','finalizada'];
        g.todasConcluidas = g.tarefas.length > 0 && g.tarefas.every(e => {
          const sl = normSL(e._status_logistica || e._tarefa?.status_logistica || e.status_logistica || '');
          return CONCLUIDOS.includes(sl);
        });
      });
      const tutorList = Object.values(groups).sort((a,b) => b.total_doses - a.total_doses);
      setTutores(tutorList);

      const pps = {};
      tutorList.forEach(t => { if (t.ponto_partida) pps[t.ponto_partida] = (pps[t.ponto_partida]||0)+1; });
      setPontosPartida(Object.entries(pps).sort((a,b) => a[0].localeCompare(b[0], 'pt-BR')));
    } catch (err) {
      console.error('Erro geral ao carregar escalas para rotas:', err);
      toast('Erro ao carregar escalas para rotas: ' + (err.message || err), 'error');
      setEscalas([]);
      setTutores([]);
      setFilteredTutores([]);
      setPontosPartida([]);
    }
  };

  useEffect(() => {
    let f = [...tutores];

    // Bug fix: não excluir tutor da lista por estar na rota
    // Se filtro de status ativo, mostrar tutor mesmo que já esteja na rota com outro status
    // (para poder adicionar tarefas de outro status do mesmo tutor)
    if (!filterStatus) {
      // Sem filtro: ocultar tutores já adicionados
      const addedCPFs = new Set(paradas.map(p => p.cpf));
      f = f.filter(t => !addedCPFs.has(t.cpf));
    }
    // Com filtro: só ocultar se o tutor está na rota COM esse mesmo status
    if (filterStatus) {
      const addedCPFsWithStatus = new Set(
        paradas.filter(p => p.status_filtro === filterStatus).map(p => p.cpf)
      );
      f = f.filter(t => !addedCPFsWithStatus.has(t.cpf));
    }

    // Ocultar já roteirizados por padrão
    if (!showJaRoteirizado) f = f.filter(t => !t.jaRoteirizado);
    // Ocultar tutores cujas tarefas estão todas com status logística concluído/entregue
    f = f.filter(t => !t.todasConcluidas);
    if (filterPP) f = f.filter(t => t.ponto_partida === filterPP);
    if (filterStatus) f = f.filter(t => t.statuses ? t.statuses.has(filterStatus) : t.tarefas.some(e => (e._status || e.status) === filterStatus));
    if (filterDateStart) f = f.filter(t => t.tarefas.some(e => (e._data_inicio || e.data_inicio) >= filterDateStart));
    if (filterDateEnd) f = f.filter(t => t.tarefas.some(e => (e._data_inicio || e.data_inicio) <= filterDateEnd));
    if (searchTarefa) {
      const s = searchTarefa.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      f = f.filter(t => {
        const nome = (t.nome||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        const cpfDigits = (t.cpfNorm||t.cpf||'').replace(/\D/g,'');
        const searchDigits = s.replace(/\D/g,'');
        return nome.includes(s) ||
          (searchDigits.length >= 3 && cpfDigits.includes(searchDigits)) ||
          t.tarefas.some(e => (e.codigo_tarefa||'').toLowerCase().includes(s));
      });
    }
    setFilteredTutores(f);
  }, [tutores, paradas, filterPP, filterStatus, showJaRoteirizado, filterDateStart, filterDateEnd, searchTarefa]);

  const motoristasFiltrados = baseOrigem
    ? motoristas.filter(m => !m.base_id || String(m.base_id) === String(baseOrigem))
    : motoristas;

  const veiculosFiltrados = baseOrigem
    ? veiculos.filter(v => !v.base_id || String(v.base_id) === String(baseOrigem))
    : veiculos;

  useEffect(() => {
    if (!baseOrigem) return;
    if (motoristaId) {
      const motoristaAtual = motoristas.find(m => m.id === motoristaId);
      if (motoristaAtual?.base_id && String(motoristaAtual.base_id) !== String(baseOrigem)) setMotoristaId('');
    }
    if (veiculoId) {
      const veiculoAtual = veiculos.find(v => v.id === veiculoId);
      if (veiculoAtual?.base_id && String(veiculoAtual.base_id) !== String(baseOrigem)) setVeiculoId('');
    }
  }, [baseOrigem, motoristas, veiculos]);

  useEffect(() => {
    if (veiculoId) {
      const v = veiculos.find(x => x.id === veiculoId);
      if (v?.motorista_padrao_id && !motoristaId) {
        const motoristaPadrao = motoristas.find(m => m.id === v.motorista_padrao_id);
        if (!baseOrigem || !motoristaPadrao?.base_id || String(motoristaPadrao.base_id) === String(baseOrigem)) {
          setMotoristaId(v.motorista_padrao_id);
        }
      }
    }
  }, [veiculoId, baseOrigem, motoristas]);

  const geocode = async (query) => {
    if (geocodeCache[query]) return geocodeCache[query];
    // Normalizar: "São José Do Rio Preto-sp" → "São José do Rio Preto, SP"
    const normalizado = query
      .replace(/-([a-z]{2})$/i, ', $1') // "cidade-uf" → "cidade, uf"
      .replace(/\b(\w)/g, c => c.toUpperCase()); // Title Case
    const queries = [
      normalizado + ', Brasil',
      query.split('-')[0].trim() + ', Brasil', // só a cidade
      query + ', Brasil', // original
    ];
    for (const q of queries) {
      try {
        const res = await fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(q)+'&format=json&limit=1&countrycodes=br');
        const data = await res.json();
        if (data?.[0]) {
          const coords = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
          setGeocodeCache(c => ({...c, [query]: coords}));
          return coords;
        }
      } catch(e) {}
    }
    return null;
  };

  const tarefaRouteKey = (e) => String(e.id || e.tarefa_id || e.codigo_tarefa || e._tarefa?.codigo || '').trim();

  const getTarefasRotaTutor = (tutor) => {
    const CONCL = ['concluido','concluida','entregue','finalizado','finalizada'];
    let tarefas = filterStatus
      ? tutor.tarefas.filter(e => (e._status || e.status) === filterStatus)
      : tutor.tarefas;
    // Excluir tarefas com logística concluída
    tarefas = tarefas.filter(e => {
      const sl = String(e._status_logistica || e._tarefa?.status_logistica || e.status_logistica || '').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      return !CONCL.includes(sl);
    });
    if (filterDateStart) tarefas = tarefas.filter(e => (e._data_inicio || e.data_inicio || '') >= filterDateStart);
    if (filterDateEnd) tarefas = tarefas.filter(e => (e._data_inicio || e.data_inicio || '') <= filterDateEnd);
    return tarefas;
  };

  const isTarefaRotaSelecionada = (e) => {
    const key = tarefaRouteKey(e);
    return selectedTarefasRota[key] !== false;
  };

  const getDoseTarefaRota = (e) => {
    const key = tarefaRouteKey(e);
    if (manualDosesTarefaRota[key] !== undefined && manualDosesTarefaRota[key] !== '') {
      return Math.max(0, Number(manualDosesTarefaRota[key]) || 0);
    }
    return Number(e._doses || e.doses_necessarias || 0);
  };

  const calcDosesRotaTutor = (tutor) => {
    const tarefasFiltradas = getTarefasRotaTutor(tutor).filter(isTarefaRotaSelecionada);
    const original = tarefasFiltradas.reduce((s, e) => s + getDoseTarefaRota(e), 0);
    const manualKey = tutor.cpfNorm || tutor.cpf || tutor.aplicador_id;
    if (manualDosesRota[manualKey] !== undefined && manualDosesRota[manualKey] !== '') {
      return Math.max(0, Number(manualDosesRota[manualKey]) || 0);
    }
    const plan = planejamentoByAplicador[tutor.aplicador_id];
    if (plan?.status === 'nao_enviar_estoque_suficiente') return 0;
    if (plan?.quantidade_sugerida > 0) return Math.min(Number(plan.quantidade_sugerida || 0), original || Number(plan.quantidade_sugerida || 0));
    return original;
  };

  const statusDemandaTutor = (tutor) => {
    const plan = planejamentoByAplicador[tutor.aplicador_id];
    if (!plan) return 'Sem decisão DvO';
    if (plan.status === 'nao_enviar_estoque_suficiente') return 'DvO: não enviar';
    if (plan.quantidade_sugerida > 0) return `DvO: enviar ${Number(plan.quantidade_sugerida || 0).toLocaleString('pt-BR')}`;
    return 'DvO: revisar';
  };

  const addTutor = async (tutor) => {
    toast('Buscando coordenadas para ' + (tutor.ponto_partida||tutor.cidade) + '...', 'info');
    const query = tutor.ponto_partida || (tutor.cidade + ', ' + tutor.uf);
    const coords = await geocode(query);
    if (!coords) toast('⚠ Coordenadas não encontradas para "' + query + '" — parada adicionada sem pin no mapa', 'error');

    // Filtrar tarefas pelo status/data e manter somente as selecionadas para esta rota.
    const tarefasFiltradasBase = getTarefasRotaTutor(tutor);
    const tarefasFiltradas = tarefasFiltradasBase
      .filter(isTarefaRotaSelecionada)
      .map(e => ({ ...e, _doses_rota: getDoseTarefaRota(e), _selecionada_rota: true }));
    const dosesOriginais = tarefasFiltradasBase.reduce((s, e) => s + (e._doses || e.doses_necessarias || 0), 0);
    const dosesFiltradas = calcDosesRotaTutor(tutor);
    if (tarefasFiltradas.length === 0 || dosesFiltradas <= 0) {
      if (!confirm('Nenhuma tarefa/dose selecionada para este aplicador. Adicionar mesmo assim?')) return;
    }

    const parada = {
      cpf: tutor.cpf,
      nome: tutor.nome,
      ponto_partida: tutor.ponto_partida,
      cidade: tutor.cidade,
      uf: tutor.uf,
      doses: dosesFiltradas,
      doses_originais: dosesOriginais,
      decisao_demanda_oferta: statusDemandaTutor(tutor),
      tarefas_count: tarefasFiltradas.length,
      tarefas: tarefasFiltradas,
      status_filtro: filterStatus || null,
      lat: coords?.lat || null,
      lng: coords?.lng || null,
      ordem: paradas.length + 1
    };
    setParadas(p => [...p, parada]);
    setMapKey(k => k+1);
    if (coords) toast(tutor.nome + ' adicionado(a) ✓ (' + tarefasFiltradas.length + ' tarefas · ' + dosesFiltradas + ' doses para enviar)', 'success');
  };

  const removeParada = (idx) => {
    setParadas(p => p.filter((_,i) => i !== idx).map((x,i) => ({...x, ordem: i+1})));
    setMapKey(k => k+1);
  };

  const onDragStart = (idx) => setDragIdx(idx);
  const onDragOver = (e) => e.preventDefault();
  const onDrop = (e, dropIdx) => {
    e.preventDefault();
    if (dragIdx === null || dragIdx === dropIdx) return;
    const n = [...paradas]; const [m] = n.splice(dragIdx, 1); n.splice(dropIdx, 0, m);
    setParadas(n.map((p,i) => ({...p, ordem: i+1})));
    setDragIdx(null); setMapKey(k => k+1);
  };

  const otimizarRota = () => {
    const withCoord = paradas.filter(p => p.lat && p.lng);
    const noCoord = paradas.filter(p => !p.lat || !p.lng);
    if (withCoord.length < 2) { toast('Precisa de pelo menos 2 paradas com coordenadas', 'error'); return; }
    const base = bases.find(b => b.id === baseOrigem);
    let cur = { lat: parseFloat(base?.latitude)||withCoord[0].lat, lng: parseFloat(base?.longitude)||withCoord[0].lng };
    const rem = [...withCoord]; const ordered = [];
    while (rem.length > 0) {
      let ni = 0, nd = Infinity;
      rem.forEach((p,i) => { const d = Math.sqrt((cur.lat-p.lat)**2+(cur.lng-p.lng)**2); if (d < nd) { nd = d; ni = i; } });
      const next = rem.splice(ni, 1)[0]; ordered.push(next); cur = next;
    }
    setParadas([...ordered, ...noCoord].map((p,i) => ({...p, ordem: i+1})));
    setMapKey(k => k+1); toast('Rota otimizada!', 'success');
  };

  const distTotal = () => {
    const c = paradas.filter(p => p.lat && p.lng);
    if (c.length < 2) return 0;
    let t = 0;
    const base = bases.find(b => b.id === baseOrigem);
    const pts = base?.latitude ? [{lat:parseFloat(base.latitude),lng:parseFloat(base.longitude)}, ...c] : c;
    for (let i = 1; i < pts.length; i++) {
      const R=6371, dLat=(pts[i].lat-pts[i-1].lat)*Math.PI/180, dLon=(pts[i].lng-pts[i-1].lng)*Math.PI/180;
      const a = Math.sin(dLat/2)**2+Math.cos(pts[i-1].lat*Math.PI/180)*Math.cos(pts[i].lat*Math.PI/180)*Math.sin(dLon/2)**2;
      t += R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    }
    return t;
  };

  const salvarRota = async () => {
    if (!baseOrigem) { toast('Selecione base de origem', 'error'); return; }
    if (paradas.length === 0) { toast('Adicione paradas', 'error'); return; }
    if (!motoristaId) { toast('Selecione motorista', 'error'); return; }
    setSaving(true);
    const userId = (await sb.auth.getUser()).data.user.id;
    const veiculo = veiculos.find(v => v.id === veiculoId);

    // Criar rota
    const { data: rota, error: re } = await sb.from('rotas').insert({
      base_origem_id: baseOrigem, data_prevista: rotaData, tipo: rotaTipo,
      motorista_id: motoristaId, veiculo: veiculo ? veiculo.modelo+' - '+veiculo.placa : null,
      veiculo_id: veiculoId||null, criado_por: userId, codigo: ''
    }).select().single();
    if (re) { toast(re.message, 'error'); setSaving(false); return; }

    // Buscar aplicadores por CPF para resolver os IDs
    const cpfs = paradas.map(p => p.cpf).filter(Boolean);
    let apMap = {};
    if (cpfs.length > 0) {
      const { data: aps } = await sb.from('aplicadores').select('id, cpf').in('cpf', cpfs);
      (aps || []).forEach(a => { apMap[a.cpf] = a.id; });
    }

    let errs = 0;
    for (const p of paradas) {
      const aplicadorId = apMap[p.cpf] || null;
      const obs = p.nome+' ('+p.cpf+') | '+p.doses+' doses para enviar | original '+(p.doses_originais||p.doses)+' | '+(p.decisao_demanda_oferta||'')+' | '+p.tarefas.map(t => t.codigo_tarefa || t._tarefa?.codigo).join(', ');
      const { error } = await sb.from('remessas').insert({
        rota_id: rota.id,
        tipo: rotaTipo === 'coleta' ? 'coleta' : 'entrega',
        // Se tiver aplicador vinculado, destino é o aplicador; senão usa base
        destino_tipo: aplicadorId ? 'aplicador' : 'base',
        destino_aplicador_id: aplicadorId || null,
        destino_base_id: aplicadorId ? null : baseOrigem,
        ordem_entrega: p.ordem,
        observacao: obs,
        codigo_rastreio: ''
      });
      if (error) errs++;
    }
    setSaving(false);
    if (errs > 0) toast('Rota '+rota.codigo+' criada com '+errs+' erros em remessas', 'error');
    else toast('Rota '+rota.codigo+' criada com '+paradas.length+' paradas!', 'success');
    onBack();
  };

  const totalDoses = paradas.reduce((s,p) => s + (p.doses||0), 0);
  const veiculoSel = veiculos.find(v => v.id === veiculoId);
  const motoristaSel = motoristas.find(m => m.id === motoristaId);
  const km = distTotal();

  return (
    <div style={{display:'flex',flexDirection:'column',height:'calc(100vh - 48px)'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--border)',marginBottom:8,gap:8,flexWrap:'wrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <button className="btn btn-secondary btn-sm" onClick={onBack}>← Voltar</button>
          <span style={{fontSize:18,fontWeight:700}}>Roteirização</span>
          {paradas.length > 0 && <span className="badge badge-blue">{paradas.length} paradas · {totalDoses.toLocaleString('pt-BR')} doses</span>}
        </div>
        <div style={{display:'flex',gap:6}}>
          <button className="btn btn-secondary btn-sm" onClick={() => setLeftOpen(!leftOpen)}>{leftOpen ? '◀ Ocultar filtros' : '▶ Filtros'}</button>
          <button className="btn btn-secondary btn-sm" onClick={() => setRightOpen(!rightOpen)}>{rightOpen ? 'Ocultar rota ▶' : '◀ Rota'}</button>
          <button className="btn btn-success btn-sm" onClick={otimizarRota} disabled={paradas.length < 2}>⚡ Otimizar</button>
          <button className="btn btn-primary" onClick={salvarRota} disabled={saving||paradas.length===0}>{saving ? 'Salvando...' : '💾 Salvar'}</button>
        </div>
      </div>

      <div style={{display:'flex',gap:8,flex:1,minHeight:0,overflow:'hidden'}}>
        {/* LEFT */}
        {leftOpen && (
          <div style={{width:300,flexShrink:0,display:'flex',flexDirection:'column',overflow:'hidden'}}>
            <div className="card" style={{padding:10,marginBottom:6,flexShrink:0}}>
              <div style={{fontSize:12,fontWeight:600,marginBottom:6}}>Config. da Rota</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
                <div className="form-group"><label className="form-label" style={{fontSize:10}}>Base Origem</label>
                  <select className="form-select" style={{padding:'5px 6px',fontSize:11}} value={baseOrigem} onChange={e=>setBaseOrigem(e.target.value)}>
                    <option value="">Selecione</option>{bases.map(b=><option key={b.id} value={b.id}>{b.nome}</option>)}
                  </select></div>
                <div className="form-group"><label className="form-label" style={{fontSize:10}}>Data</label>
                  <input className="form-input" style={{padding:'5px 6px',fontSize:11}} type="date" onClick={openDatePicker} onFocus={openDatePicker} value={rotaData} onChange={e=>setRotaData(e.target.value)} /></div>
                <div className="form-group"><label className="form-label" style={{fontSize:10}}>Motorista</label>
                  <select className="form-select" style={{padding:'5px 6px',fontSize:11}} value={motoristaId} onChange={e=>setMotoristaId(e.target.value)} disabled={!baseOrigem}>
                    <option value="">{baseOrigem ? 'Selecione' : 'Escolha a base primeiro'}</option>{motoristasFiltrados.map(m=><option key={m.id} value={m.id}>{m.nome}</option>)}
                  </select></div>
                <div className="form-group"><label className="form-label" style={{fontSize:10}}>Veículo</label>
                  <select className="form-select" style={{padding:'5px 6px',fontSize:11}} value={veiculoId} onChange={e=>setVeiculoId(e.target.value)} disabled={!baseOrigem}>
                    <option value="">{baseOrigem ? 'Selecione' : 'Escolha a base primeiro'}</option>{veiculosFiltrados.map(v=><option key={v.id} value={v.id}>{v.modelo} {v.placa}</option>)}
                  </select></div>
              </div>
            </div>

            <div className="card" style={{padding:10,marginBottom:6,flexShrink:0}}>
              <div style={{fontSize:12,fontWeight:600,marginBottom:6}}>Filtros</div>
              <input className="form-input" style={{padding:'5px 8px',fontSize:11,marginBottom:4}} value={searchTarefa} onChange={e=>setSearchTarefa(e.target.value)} placeholder="🔍 Nome, CPF, código..." />
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:4,marginBottom:4}}>
                <input className="form-input" style={{padding:'5px 6px',fontSize:11}} type="date" onClick={openDatePicker} onFocus={openDatePicker} value={filterDateStart} onChange={e=>setFilterDateStart(e.target.value)} />
                <input className="form-input" style={{padding:'5px 6px',fontSize:11}} type="date" onClick={openDatePicker} onFocus={openDatePicker} value={filterDateEnd} onChange={e=>setFilterDateEnd(e.target.value)} />
              </div>
              <select className="form-select" style={{padding:'5px 6px',fontSize:11,width:'100%'}} value={filterPP} onChange={e=>setFilterPP(e.target.value)}>
                <option value="">Todos pontos de partida</option>
                {pontosPartida.map(([pp,c]) => <option key={pp} value={pp}>{pp} ({c})</option>)}
              </select>
              <div style={{marginTop:4}}>
                <div style={{fontSize:10,color:'var(--text-muted)',marginBottom:3,fontWeight:600}}>STATUS</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                  {[
                    {v:'aprovada', label:'Aprovada', color:'var(--success)'},
                    {v:'em_validacao', label:'Em Valid.', color:'var(--warning)'},
                    {v:'em_execucao', label:'Em Exec.', color:'var(--accent)'},
                    {v:'pronta_faturamento', label:'Pronta Fat.', color:'var(--info)'},
                  ].map(opt => (
                    <label key={opt.v} style={{display:'flex',alignItems:'center',gap:4,cursor:'pointer',fontSize:10,padding:'3px 7px',borderRadius:4,border:`1px solid ${filterStatus === opt.v ? opt.color : 'var(--border)'}`,background: filterStatus === opt.v ? `${opt.color}22` : 'transparent',transition:'all 0.15s'}}>
                      <input type="radio" name="filterStatus" value={opt.v}
                        checked={filterStatus === opt.v}
                        onChange={() => setFilterStatus(filterStatus === opt.v ? '' : opt.v)}
                        style={{display:'none'}} />
                      <span style={{color: filterStatus === opt.v ? opt.color : 'var(--text-muted)', fontWeight: filterStatus === opt.v ? 600 : 400}}>
                        {filterStatus === opt.v ? '✓ ' : ''}{opt.label}
                      </span>
                    </label>
                  ))}
                  {filterStatus && (
                    <button onClick={() => setFilterStatus('')} style={{fontSize:10,padding:'3px 6px',background:'none',border:'1px solid var(--border)',borderRadius:4,color:'var(--text-muted)',cursor:'pointer'}}>
                      ✕ Limpar
                    </button>
                  )}
                </div>
              </div>
              <div style={{fontSize:10,color:'var(--text-muted)',marginTop:4,display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
                <span className="badge badge-blue" style={{fontSize:10}}>Disponíveis {filteredTutores.length}</span>
                <span className="badge badge-green" style={{fontSize:10}}>Na rota {paradas.length}</span>
                <span className="badge badge-gray" style={{fontSize:10}}>
                  Já roteirizados {tutores.filter(t=>t.jaRoteirizado).length}
                </span>
                <button className="btn btn-secondary btn-sm" style={{fontSize:9,padding:'2px 6px'}}
                  onClick={() => setShowJaRoteirizado(s=>!s)}>
                  {showJaRoteirizado ? '🙈 Ocultar roteirizados' : '👁 Ver roteirizados'}
                </button>
                <button className="btn btn-secondary btn-sm" style={{fontSize:9,padding:'2px 6px'}}
                  onClick={() => { setFilterDateStart(''); setFilterDateEnd(''); setFilterPP(''); setFilterStatus(''); setSearchTarefa(''); }}>
                  🧹 Limpar filtros
                </button>
              </div>
            </div>

            <div style={{flex:1,overflow:'auto',border:'1px solid var(--border)',borderRadius:'var(--radius)',background:'var(--bg-card)'}}>
              {filteredTutores.length === 0 && <div style={{padding:20,textAlign:'center',color:'var(--text-muted)',fontSize:12}}>{tutores.length===0?'Nenhuma escala encontrada. A tela de Escalas tem registros, então clique em Atualizar ou limpe os filtros.':'Nenhum resultado para os filtros selecionados. Use Limpar filtros para voltar a listar as escalas.'}</div>}
              {filteredTutores.slice(0,80).map(t => {
                const isExpanded = expandedTutor === t.cpf;
                const statusCounts = t.tarefas.reduce((acc, e) => { const st = e._status || e.status; acc[st] = (acc[st]||0)+1; return acc; }, {});
                return (
                  <div key={t.cpf} style={{borderBottom:'1px solid var(--border)', opacity: t.jaRoteirizado ? 0.65 : 1}}>
                    {/* Header do card - clica para colapsar/expandir */}
                    <div style={{padding:'7px 10px',fontSize:11,display:'flex',justifyContent:'space-between',alignItems:'center',transition:'background 0.1s',gap:4, background: t.jaRoteirizado ? 'rgba(245,158,11,0.06)' : 'transparent'}}
                      onMouseEnter={e=>e.currentTarget.style.background='var(--bg-card-hover)'}
                      onMouseLeave={e=>e.currentTarget.style.background=t.jaRoteirizado?'rgba(245,158,11,0.06)':'transparent'}>
                      {/* Nome + info - clica para expand */}
                      <div style={{flex:1,minWidth:0,cursor:'pointer'}} onClick={() => setExpandedTutor(isExpanded?null:t.cpf)}>
                        <div style={{display:'flex',alignItems:'center',gap:4}}>
                          <span style={{fontSize:9,color:'var(--text-muted)'}}>{isExpanded?'▼':'▶'}</span>
                          <span style={{fontWeight:600,color:'var(--text-primary)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.nome}</span>
                          {t.jaRoteirizado && <span style={{fontSize:9,color:'var(--warning)',flexShrink:0}}>🚚 em rota</span>}
                          <button
                            onClick={ev => { ev.stopPropagation(); setInfoTutor(t); }}
                            style={{background:'none',border:'1px solid var(--border)',borderRadius:'50%',width:16,height:16,cursor:'pointer',fontSize:9,color:'var(--text-muted)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,padding:0}}
                            title="Ver informações">ⓘ</button>
                        </div>
                        <div style={{color:'var(--text-muted)',fontSize:10,marginLeft:12}}>
                          {t.ponto_partida||t.cidade} · {filterStatus ? t.tarefas.filter(e=>(e._status || e.status)===filterStatus).length : t.tarefas.length} tar.
                          {statusCounts['aprovada'] && <span style={{color:'var(--success)',marginLeft:4}}>✓{statusCounts['aprovada']}</span>}
                          {statusCounts['pronta_faturamento'] && <span style={{color:'var(--info)',marginLeft:4}}>💰{statusCounts['pronta_faturamento']}</span>}
                          {statusCounts['em_execucao'] && <span style={{color:'var(--accent)',marginLeft:4}}>▶{statusCounts['em_execucao']}</span>}
                          {/* Vacinas distintas do tutor */}
                          {[...new Set(t.tarefas.map(e => {
                            const raw = e.tipo_vacina || e._vacina_nome || e.vacina_nome || e._tarefa?.vacina || '';
                            const s = raw.trim().toLowerCase();
                            if (!s || s === 'gripe' || s.includes('tetrav')) return 'Influenza Tetravalente';
                            if (s.includes('triv') || s === 'gripe trivalente') return 'Influenza Trivalente';
                            return raw;
                          }).filter(Boolean))].map(v => (
                            <span key={v} style={{marginLeft:4,fontSize:9,fontWeight:600,padding:'1px 4px',borderRadius:3,
                              background:v.includes('Tetrav')?'rgba(37,99,235,0.2)':'rgba(16,185,129,0.2)',
                              color:v.includes('Tetrav')?'var(--accent)':'var(--success)'
                            }}>💉{v.replace('Influenza ','')}</span>
                          ))}
                        </div>
                      </div>
                      <div style={{display:'flex',alignItems:'center',gap:4,flexShrink:0}}>
                        <span className="badge badge-green" title="Estoque atual do aplicador" style={{fontSize:10}}>
                          Est. {(t.estoque_atual || 0).toLocaleString('pt-BR')}
                        </span>
                        <span className="badge badge-cyan" title="Doses selecionadas para esta rota" style={{fontSize:10}}>
                          Enviar {calcDosesRotaTutor(t).toLocaleString('pt-BR')}
                        </span>
                        <button className="btn btn-primary btn-sm" style={{padding:'3px 8px',fontSize:10}} onClick={(e) => {e.stopPropagation(); addTutor(t);}}>+</button>
                      </div>
                    </div>
                    {/* Detalhe colapsável */}
                    {isExpanded && (
                      <div style={{padding:'4px 10px 8px',background:'var(--bg-input)'}}>
                        <div style={{fontSize:10,color:'var(--text-muted)',marginBottom:4}}>
                          CPF: {t.cpf} · Base: {t.base_nome} · Estoque aplicador: <strong style={{color:'var(--success)'}}>{(t.estoque_atual || 0).toLocaleString('pt-BR')}</strong> · Estoque mesma vacina: <strong style={{color:'var(--info)'}}>{(t.estoque_mesma_vacina || 0).toLocaleString('pt-BR')}</strong> · <span style={{color:'var(--info)'}}>{statusDemandaTutor(t)}</span>
                          {filterStatus && <span style={{marginLeft:6,color:'var(--warning)'}}>⚠ Mostrando só: {STATUS_LABELS[filterStatus]}</span>}
                        </div>
                        <div style={{display:'grid',gridTemplateColumns:'1fr 90px',gap:6,alignItems:'end',marginBottom:6}}>
                          <div style={{fontSize:10,color:'var(--text-muted)'}}>
                            Selecione as tarefas que entram nesta rota. A quantidade pode ser parcial por tarefa.
                            <br />Selecionadas: {getTarefasRotaTutor(t).filter(isTarefaRotaSelecionada).length} · Doses: <strong style={{color:'var(--info)'}}>{calcDosesRotaTutor(t).toLocaleString('pt-BR')}</strong>
                          </div>
                          <input className="form-input" type="number" min="0" style={{padding:'4px 6px',fontSize:10}}
                            title="Sobrescreve o total do aplicador nesta rota"
                            value={manualDosesRota[t.cpfNorm || t.cpf || t.aplicador_id] ?? calcDosesRotaTutor(t)}
                            onChange={ev => setManualDosesRota(m => ({...m, [t.cpfNorm || t.cpf || t.aplicador_id]: ev.target.value}))}
                          />
                        </div>
                        <div style={{display:'flex',gap:6,marginBottom:5}}>
                          <button className="btn btn-secondary btn-sm" style={{fontSize:9,padding:'3px 6px'}} onClick={() => {
                            const updates = {};
                            getTarefasRotaTutor(t).forEach(e => { updates[tarefaRouteKey(e)] = true; });
                            setSelectedTarefasRota(m => ({...m, ...updates}));
                          }}>Selecionar todas</button>
                          <button className="btn btn-secondary btn-sm" style={{fontSize:9,padding:'3px 6px'}} onClick={() => {
                            const updates = {};
                            getTarefasRotaTutor(t).forEach(e => { updates[tarefaRouteKey(e)] = false; });
                            setSelectedTarefasRota(m => ({...m, ...updates}));
                          }}>Limpar</button>
                        </div>
                        {getTarefasRotaTutor(t).slice(0,20).map(e => {
                          const tk = tarefaRouteKey(e);
                          const selected = isTarefaRotaSelecionada(e);
                          const originalDose = Number(e._doses || e.doses_necessarias || 0);
                          const doseRota = getDoseTarefaRota(e);
                          return (
                          <div key={tk || e.id} style={{fontSize:10,color:selected?'var(--text-secondary)':'var(--text-muted)',padding:'4px 0',borderBottom:'1px solid var(--border)',display:'grid',gridTemplateColumns:'18px 1fr 54px',gap:6,alignItems:'center',opacity:selected?1:0.55}}>
                            <input type="checkbox" checked={selected} onChange={ev => setSelectedTarefasRota(m => ({...m, [tk]: ev.target.checked}))} />
                            <div style={{minWidth:0}}>
                              <div style={{fontFamily:'JetBrains Mono',fontSize:9,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.codigo_tarefa || e._tarefa?.codigo}</div>
                              <div style={{display:'flex',gap:4,alignItems:'center',marginTop:2,flexWrap:'wrap'}}>
                                <span className={`badge ${STATUS_BADGES[e._status || e.status]||'badge-gray'}`} style={{fontSize:9,padding:'1px 5px'}}>{STATUS_LABELS[e._status || e.status]||(e._status || e.status)}</span>
                                {(e.tipo_vacina || e._vacina_nome || e.vacina_nome || e._tarefa?.vacina) && (() => {
                                  const raw = e.tipo_vacina || e._vacina_nome || e.vacina_nome || e._tarefa?.vacina || '';
                                  const s = raw.trim().toLowerCase();
                                  const nome = (!s || s === 'gripe' || s.includes('tetrav')) ? 'Influenza Tetravalente' : (s.includes('triv') || s === 'gripe trivalente') ? 'Influenza Trivalente' : raw;
                                  const isTetrav = nome.includes('Tetrav');
                                  return <span style={{fontSize:9,fontWeight:600,padding:'1px 5px',borderRadius:3,
                                    background:isTetrav?'rgba(37,99,235,0.2)':'rgba(16,185,129,0.2)',
                                    color:isTetrav?'var(--accent)':'var(--success)'
                                  }}>💉{nome.replace('Influenza ','')}</span>;
                                })()}
                                {doseRota < originalDose && <span style={{color:'var(--warning)',fontSize:9}}>Parcial: falta {originalDose - doseRota}</span>}
                              </div>
                            </div>
                            <input className="form-input" type="number" min="0" max={originalDose} disabled={!selected} style={{padding:'3px 5px',fontSize:10,textAlign:'right'}} value={manualDosesTarefaRota[tk] ?? originalDose} onChange={ev => setManualDosesTarefaRota(m => ({...m, [tk]: ev.target.value}))} />
                          </div>
                        )})}
                        {getTarefasRotaTutor(t).length > 20 && <div style={{fontSize:10,color:'var(--text-muted)',marginTop:3}}>+{getTarefasRotaTutor(t).length-20} tarefas...</div>}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* CENTER - MAP */}
        <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0}}>
          <MapaRota key={mapKey} paradas={paradas} bases={bases} baseOrigemId={baseOrigem} />
          <div style={{display:'flex',gap:12,padding:'8px 12px',background:'var(--bg-card)',border:'1px solid var(--border)',borderTop:'none',borderRadius:'0 0 var(--radius) var(--radius)',flexWrap:'wrap',fontSize:12}}>
            <div><span style={{fontSize:10,color:'var(--text-muted)'}}>ORIGEM</span><br/><strong>{bases.find(b=>b.id===baseOrigem)?.nome||'—'}</strong></div>
            <div><span style={{fontSize:10,color:'var(--text-muted)'}}>PARADAS</span><br/><strong>{paradas.length}</strong></div>
            <div><span style={{fontSize:10,color:'var(--text-muted)'}}>DOSES</span><br/><strong>{totalDoses.toLocaleString('pt-BR')}</strong></div>
            <div><span style={{fontSize:10,color:'var(--text-muted)'}}>DISTÂNCIA</span><br/><strong>{km > 0 ? km.toFixed(0)+' km' : '—'}</strong></div>
            {veiculoSel && <div><span style={{fontSize:10,color:'var(--text-muted)'}}>CAPACIDADE</span><br/><strong style={{color:totalDoses>veiculoSel.capacidade_doses?'var(--danger)':'inherit'}}>{totalDoses}/{veiculoSel.capacidade_doses}</strong></div>}
          </div>
        </div>

        {/* RIGHT */}
        {rightOpen && (
          <div style={{width:280,flexShrink:0,display:'flex',flexDirection:'column',overflow:'hidden'}}>
            <div style={{display:'flex',gap:4,marginBottom:6,flexShrink:0}}>
              <button className="btn btn-secondary btn-sm" style={{flex:1,fontSize:10}} onClick={otimizarRota} disabled={paradas.length<2}>⚡ Otimizar</button>
              <button className="btn btn-danger btn-sm" style={{flex:1,fontSize:10}} onClick={() => {if(confirm('Limpar?')){setParadas([]);setMapKey(k=>k+1)}}} disabled={paradas.length===0}>✕ Limpar</button>
            </div>
            <div style={{flex:1,overflow:'auto',border:'1px solid var(--border)',borderRadius:'var(--radius)',background:'var(--bg-card)'}}>
              <div style={{padding:'6px 10px',fontSize:10,color:'var(--text-muted)',borderBottom:'1px solid var(--border)',fontWeight:600}}>ARRASTE PARA REORDENAR</div>
              {paradas.length === 0 && <div style={{padding:24,textAlign:'center',color:'var(--text-muted)',fontSize:12}}>Clique + nos aplicadores à esquerda</div>}
              {paradas.map((p,idx) => (
                <div key={p.cpf} draggable onDragStart={()=>onDragStart(idx)} onDragOver={onDragOver} onDrop={e=>onDrop(e,idx)}
                  style={{padding:'8px 10px',borderBottom:'1px solid var(--border)',cursor:'grab',background:dragIdx===idx?'var(--accent-subtle)':'transparent'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                    <div style={{display:'flex',gap:6,alignItems:'flex-start',flex:1}}>
                      <div style={{width:20,height:20,borderRadius:'50%',background:'var(--accent)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,flexShrink:0}}>{p.ordem}</div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:11,fontWeight:600,color:'var(--text-primary)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.nome}</div>
                        <div style={{fontSize:10,color:'var(--text-muted)'}}>
                          {p.ponto_partida||p.cidade} · {p.doses} doses · {p.tarefas_count} tarefas selecionadas
                          {!p.lat && <span style={{color:'var(--danger)',marginLeft:3}}>⚠</span>}
                        </div>
                      </div>
                    </div>
                    <button style={{background:'none',border:'none',color:'var(--danger)',cursor:'pointer',fontSize:12,padding:2}} onClick={e=>{e.stopPropagation();removeParada(idx)}}>✕</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
      {infoTutor && <TutorInfoModal tutor={infoTutor} onClose={() => setInfoTutor(null)} />}
    </div>
  );
}

function MapaRota({ paradas, bases, baseOrigemId }) {
  const mapRef = useRef(null);
  const mapInstanceRef = useRef(null);

  useEffect(() => {
    if (mapInstanceRef.current) { mapInstanceRef.current.remove(); mapInstanceRef.current = null; }
    if (!mapRef.current) return;
    const map = L.map(mapRef.current).setView([-15.78, -47.93], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
    mapInstanceRef.current = map;
    const bounds = [];
    const base = bases.find(b => b.id === baseOrigemId);
    if (base?.latitude) {
      const lat = parseFloat(base.latitude), lng = parseFloat(base.longitude);
      L.marker([lat, lng], { icon: L.divIcon({ className: '', html: '<div style="background:#2563eb;color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)">🏢</div>', iconSize:[28,28], iconAnchor:[14,14] }) }).addTo(map).bindPopup('<b>ORIGEM: '+base.nome+'</b>');
      bounds.push([lat, lng]);
    }
    const coords = [];
    paradas.forEach(p => {
      if (!p.lat || !p.lng) return;
