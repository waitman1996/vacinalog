function EstoquePage() {
  const [items, setItems] = useState([]);
  const [showEntrada, setShowEntrada] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editingVal, setEditingVal] = useState('');
  const [profile, setProfile] = useState(null);
  const [filterVacina, setFilterVacina] = useState('');
  const [filterTipo, setFilterTipo] = useState('');
  const [dosesTransito, setDosesTransito] = useState(0);
  const [showTransitoModal, setShowTransitoModal] = useState(false);
  const [rotasTransito, setRotasTransito] = useState([]);
  const [conciliando, setConciliando] = useState(null); // aplicador_id sendo conciliado
  const [conciliacaoVal, setConciliacaoVal] = useState('');
  const toast = useContext(ToastContext);

  const load = async () => {
    const { data, error } = await sb.from('estoque')
      .select('*, vacinas(nome, lote), bases(nome, cidade, uf), aplicadores(nome, cpf, cidade, uf)')
      .order('localizacao_tipo');
    if (error) { toast(error.message, 'error'); return; }

    // Consolidar registros duplicados: agrupar por tipo + local + vacina
    const map = {};
    (data || []).forEach(row => {
      const localId = row.base_id || row.aplicador_id || '';
      const key = `${row.localizacao_tipo}|${localId}|${row.vacina_id}`;
      if (!map[key]) {
        map[key] = { ...row, _ids: [row.id] };
      } else {
        map[key].quantidade += Number(row.quantidade || 0);
        map[key]._ids.push(row.id);
      }
    });

    // Filtrar zeros após consolidação
    const consolidated = Object.values(map).filter(i => i.quantidade !== 0);
    setItems(consolidated);
  };

  useEffect(() => {
    load();
    sb.auth.getUser().then(({ data }) => {
      if (data?.user) sb.from('profiles').select('role').eq('id', data.user.id).single().then(({ data: p }) => setProfile(p));
    });
    // Buscar doses em trânsito
    sb.from('remessas').select('remessa_itens(quantidade)').in('status',['em_transito','pronta','carregada'])
      .then(({ data }) => {
        const total = (data||[]).reduce((s,r) => s + (r.remessa_itens||[]).reduce((ss,i) => ss + Number(i.quantidade||0), 0), 0);
        setDosesTransito(total);
      });
    // Carregar rotas em trânsito
    sb.from('rotas')
      .select('codigo, data_prevista, status, veiculo, profiles!rotas_motorista_id_fkey(nome), remessas(id, status, ordem_entrega, updated_at, remessa_itens(quantidade))')
      .in('status', ['pronta','em_transito','montagem'])
      .order('data_prevista', { ascending: false })
      .then(({ data }) => setRotasTransito(data || []));
  }, []);

  const isAdmin = profile?.role === 'admin';

  const startEdit = (item) => {
    setEditingId(item.id);
    setEditingVal(String(item.quantidade));
  };

  const cancelEdit = () => { setEditingId(null); setEditingVal(''); };

  const saveEdit = async (item) => {
    const novaQtd = parseInt(editingVal);
    if (isNaN(novaQtd)) { toast('Valor inválido', 'error'); return; }
    if (novaQtd === item.quantidade) { cancelEdit(); return; }

    const diff = novaQtd - item.quantidade;
    const locNome = item.localizacao_tipo === 'base' ? item.bases?.nome : item.aplicadores?.nome;
    const obs = `Ajuste manual ADM: ${item.quantidade} → ${novaQtd} (${diff > 0 ? '+' : ''}${diff}) em ${locNome}`;

    // Se há múltiplos IDs duplicados: zerar os secundários e colocar tudo no primeiro
    const ids = item._ids || [item.id];
    if (ids.length > 1) {
      // Zerar todos exceto o primeiro
      for (let i = 1; i < ids.length; i++) {
        await sb.from('estoque').update({ quantidade: 0 }).eq('id', ids[i]);
      }
    }
    // Atualizar o primeiro com o valor total
    const { error: estErr } = await sb.from('estoque').update({ quantidade: novaQtd }).eq('id', ids[0]);
    if (estErr) { toast(estErr.message, 'error'); return; }

    // Registrar movimentação de ajuste
    const userId = (await sb.auth.getUser()).data.user.id;
    await sb.from('movimentacoes').insert({
      tipo: 'ajuste',
      vacina_id: item.vacina_id,
      quantidade: Math.abs(diff),
      origem_tipo: item.localizacao_tipo === 'base' ? 'base' : 'aplicador',
      origem_base_id: item.localizacao_tipo === 'base' ? item.base_id : null,
      origem_aplicador_id: item.localizacao_tipo === 'aplicador' ? item.aplicador_id : null,
      observacao: obs + (ids.length > 1 ? ` (consolidado ${ids.length} registros)` : ''),
      criado_por: userId,
    });

    toast(`Estoque ajustado: ${diff > 0 ? '+' : ''}${diff} doses${ids.length > 1 ? ` (${ids.length} registros consolidados)` : ''}`, 'success');
    cancelEdit();
    load();
  };

  // Vacinas únicas para o filtro
  const vacinasUnicas = [...new Set(items.map(i => i.vacinas?.nome).filter(Boolean))].sort();

  // Aplicar filtros
  const itemsFiltrados = items.filter(i => {
    if (filterVacina && i.vacinas?.nome !== filterVacina) return false;
    if (filterTipo && i.localizacao_tipo !== filterTipo) return false;
    return true;
  });

  const exportarEstoqueXLSX = (dados, filtroVacina, filtroTipo) => {
    const agora = new Date().toLocaleString('pt-BR');
    const rows = dados.map(i => ({
      'Tipo': i.localizacao_tipo === 'base' ? 'Base' : 'Aplicador',
      'Localização': i.localizacao_tipo === 'base' ? (i.bases?.nome || '—') : (i.aplicadores?.nome || '—'),
      'CPF': i.aplicadores?.cpf || '—',
      'Cidade': i.localizacao_tipo === 'base' ? (i.bases?.cidade || '—') : (i.aplicadores?.cidade || '—'),
      'UF': i.localizacao_tipo === 'base' ? (i.bases?.uf || '—') : (i.aplicadores?.uf || '—'),
      'Vacina': i.vacinas?.nome || '—',
      'Lote': i.vacinas?.lote || '—',
      'Quantidade': i.quantidade,
    }));

    // Totais por tipo
    const totalBase = dados.filter(i=>i.localizacao_tipo==='base').reduce((s,i)=>s+i.quantidade,0);
    const totalAp = dados.filter(i=>i.localizacao_tipo==='aplicador').reduce((s,i)=>s+i.quantidade,0);

    const wb = XLSX.utils.book_new();

    // Aba principal
    const ws = XLSX.utils.json_to_sheet(rows);
    // Larguras das colunas
    ws['!cols'] = [
      {wch:12},{wch:35},{wch:18},{wch:18},{wch:6},{wch:25},{wch:12},{wch:12}
    ];
    XLSX.utils.book_append_sheet(wb, ws, 'Estoque');

    // Aba de resumo
    const resumo = [
      ['VacinaLog — Extrato de Estoque', ''],
      ['Gerado em:', agora],
      ['Filtro Vacina:', filtroVacina || 'Todas'],
      ['Filtro Tipo:', filtroTipo || 'Todos'],
      ['', ''],
      ['RESUMO', ''],
      ['Doses em Bases:', totalBase],
      ['Doses com Aplicadores:', totalAp],
      ['Total Geral:', totalBase + totalAp],
      ['Registros:', dados.length],
    ];
    const wsResumo = XLSX.utils.aoa_to_sheet(resumo);
    wsResumo['!cols'] = [{wch:25},{wch:20}];
    XLSX.utils.book_append_sheet(wb, wsResumo, 'Resumo');

    const dataStr = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, `estoque_vacinalog_${dataStr}.xlsx`);
  };

  const conciliar = async (item) => {
    const qtdInformada = parseInt(conciliacaoVal);
    if (isNaN(qtdInformada) || qtdInformada < 0) { toast('Informe uma quantidade válida', 'error'); return; }
    const userId = (await sb.auth.getUser()).data.user.id;
    const locNome = item.localizacao_tipo === 'base' ? item.bases?.nome : item.aplicadores?.nome;
    const bate = qtdInformada === item.quantidade;
    await sb.from('movimentacoes').insert({
      tipo: 'ajuste', vacina_id: item.vacina_id, quantidade: qtdInformada,
      origem_tipo: item.localizacao_tipo,
      origem_base_id: item.localizacao_tipo==='base' ? item.base_id : null,
      origem_aplicador_id: item.localizacao_tipo==='aplicador' ? item.aplicador_id : null,
      destino_tipo: item.localizacao_tipo,
      destino_base_id: item.localizacao_tipo==='base' ? item.base_id : null,
      destino_aplicador_id: item.localizacao_tipo==='aplicador' ? item.aplicador_id : null,
      observacao: `CONCILIAÇÃO ${bate?'✓ CONFERIDO':'⚠ DIVERGÊNCIA'}: ${locNome} informou ${qtdInformada} doses | Sistema: ${item.quantidade} doses${bate?'':` | Diferença: ${qtdInformada-item.quantidade}`}`,
      criado_por: userId,
    });
    if (bate) toast(`✓ Conferido! ${locNome} confirma ${qtdInformada} doses.`, 'success');
    else toast(`⚠ Divergência! ${locNome} informou ${qtdInformada} mas sistema tem ${item.quantidade}. Registrado.`, 'error');
    setConciliando(null); setConciliacaoVal('');
  };

  const totalBases = itemsFiltrados.filter(i => i.localizacao_tipo === 'base').reduce((s, i) => s + i.quantidade, 0);
  const totalAp = itemsFiltrados.filter(i => i.localizacao_tipo === 'aplicador').reduce((s, i) => s + i.quantidade, 0);

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Estoque</div>
          <div className="page-subtitle">Posição atual de doses{isAdmin && ' · Clique na quantidade para editar'}</div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-secondary" onClick={() => exportarEstoqueXLSX(itemsFiltrados, filterVacina, filterTipo)}>
            📥 Exportar XLSX
          </button>
          <button className="btn btn-primary" onClick={() => setShowEntrada(true)}>+ Entrada / Criar Estoque</button>
        </div>
      </div>

      <div className="stats-grid">
        <div className="stat-card">
          <div className="stat-icon" style={{background:'var(--accent-subtle)',color:'var(--accent)'}}>🏢</div>
          <div className="stat-value">{totalBases.toLocaleString('pt-BR')}</div>
          <div className="stat-label">Doses em Bases</div>
        </div>
        <div className="stat-card">
          <div className="stat-icon" style={{background:'var(--warning-bg)',color:'var(--warning)'}}>👤</div>
          <div className="stat-value">{totalAp.toLocaleString('pt-BR')}</div>
          <div className="stat-label">Doses com Aplicadores</div>
        </div>
        <div className="stat-card" style={{border:'1px solid rgba(16,185,129,0.3)',cursor:'pointer'}}
          onClick={() => setShowTransitoModal(true)}>
          <div className="stat-icon" style={{background:'var(--success-bg)',color:'var(--success)'}}>🚚</div>
          <div className="stat-value" style={{color:'var(--success)'}}>{dosesTransito.toLocaleString('pt-BR')}</div>
          <div className="stat-label">Em Trânsito <span style={{fontSize:9,color:'var(--success)'}}>▼ ver rotas</span></div>
        </div>
        <div className="stat-card">
          <div className="stat-icon" style={{background:'var(--success-bg)',color:'var(--success)'}}>📦</div>
          <div className="stat-value">{(totalBases + totalAp).toLocaleString('pt-BR')}</div>
          <div className="stat-label">Total Geral</div>
        </div>
      </div>

      {isAdmin && (
        <div style={{padding:'8px 14px',background:'var(--warning-bg)',border:'1px solid rgba(245,158,11,0.3)',borderRadius:'var(--radius-sm)',marginBottom:12,fontSize:12,color:'var(--warning)'}}>
          ✏️ <strong>Modo Admin:</strong> Clique no valor de quantidade para editar diretamente. O ajuste será registrado em Movimentações.
        </div>
      )}

      {/* Filtros */}
      <div style={{display:'flex',gap:10,marginBottom:12,flexWrap:'wrap',alignItems:'flex-end'}}>
        <div className="form-group" style={{marginBottom:0,minWidth:200}}>
          <label className="form-label">Vacina</label>
          <select className="form-select" style={{padding:'6px 10px',fontSize:13}} value={filterVacina} onChange={e=>setFilterVacina(e.target.value)}>
            <option value="">Todas as vacinas</option>
            {vacinasUnicas.map(v => (
              <option key={v} value={v}>{v}</option>
            ))}
          </select>
        </div>
        <div className="form-group" style={{marginBottom:0}}>
          <label className="form-label">Tipo</label>
          <select className="form-select" style={{padding:'6px 10px',fontSize:13}} value={filterTipo} onChange={e=>setFilterTipo(e.target.value)}>
            <option value="">Todos</option>
            <option value="base">Base</option>
            <option value="aplicador">Aplicador</option>
          </select>
        </div>
        {(filterVacina || filterTipo) && (
          <button className="btn btn-secondary btn-sm" style={{alignSelf:'flex-end'}} onClick={() => { setFilterVacina(''); setFilterTipo(''); }}>
            ✕ Limpar filtros
          </button>
        )}
        {(filterVacina || filterTipo) && (
          <div style={{alignSelf:'flex-end',fontSize:12,color:'var(--text-muted)'}}>
            Mostrando <strong style={{color:'var(--accent)'}}>{itemsFiltrados.length}</strong> de {items.length} registros
            · Total: <strong style={{color:'var(--success)'}}>{itemsFiltrados.reduce((s,i)=>s+i.quantidade,0).toLocaleString('pt-BR')}</strong> doses
          </div>
        )}
      </div>

      <div className="card">
        <div className="table-wrap">
          <table>
            <thead>
              <tr><th>Tipo</th><th>Localização</th><th>Cidade/UF</th><th>Vacina</th><th>Lote</th><th>Quantidade</th><th>Conciliação</th></tr>
            </thead>
            <tbody>
              {itemsFiltrados.length === 0 && (
                <tr><td colSpan={6}><div className="empty-state"><div className="empty-icon">📦</div><div className="empty-text">{items.length === 0 ? 'Nenhum estoque registrado. Use "Entrada de Estoque" para começar.' : 'Nenhum resultado para os filtros selecionados.'}</div></div></td></tr>
              )}
              {itemsFiltrados.map(i => (
                <tr key={i.id}>
                  <td><span className={`badge ${i.localizacao_tipo==='base'?'badge-blue':'badge-yellow'}`}>{i.localizacao_tipo==='base'?'Base':'Aplicador'}</span></td>
                  <td style={{color:'var(--text-primary)',fontWeight:500}}>
                    {i.localizacao_tipo === 'base' ? i.bases?.nome : i.aplicadores?.nome}
                  </td>
                  <td>
                    {i.localizacao_tipo === 'base' ? `${i.bases?.cidade || ''} / ${i.bases?.uf || ''}` : `${i.aplicadores?.cidade || ''} / ${i.aplicadores?.uf || ''}`}
                  </td>
                  <td>
                    <span style={{
                      fontSize:12, fontWeight:600, padding:'2px 8px', borderRadius:4,
                      background: (i.vacinas?.nome||'').toLowerCase().includes('tetrav') ? 'rgba(37,99,235,0.15)' :
                                  (i.vacinas?.nome||'').toLowerCase().includes('triv') ? 'rgba(16,185,129,0.15)' : 'var(--accent-subtle)',
                      color: (i.vacinas?.nome||'').toLowerCase().includes('tetrav') ? 'var(--accent)' :
                             (i.vacinas?.nome||'').toLowerCase().includes('triv') ? 'var(--success)' : 'var(--text-primary)',
                      whiteSpace:'nowrap'
                    }}>{i.vacinas?.nome || '—'}</span>
                  </td>
                  <td className="mono">{i.vacinas?.lote || '—'}</td>
                  <td>
                    {isAdmin && editingId === i.id ? (
                      <div style={{display:'flex',gap:6,alignItems:'center'}}>
                        <input
                          type="number"
                          value={editingVal}
                          onChange={e => setEditingVal(e.target.value)}
                          onKeyDown={e => { if (e.key === 'Enter') saveEdit(i); if (e.key === 'Escape') cancelEdit(); }}
                          autoFocus
                          style={{width:100,padding:'4px 8px',background:'var(--bg-input)',border:'1px solid var(--accent)',borderRadius:4,color:'var(--text-primary)',fontFamily:'JetBrains Mono',fontSize:14,fontWeight:600}}
                        />
                        <button className="btn btn-success btn-sm btn-icon" onClick={() => saveEdit(i)} title="Salvar">✓</button>
                        <button className="btn btn-secondary btn-sm btn-icon" onClick={cancelEdit} title="Cancelar">✕</button>
                      </div>
                    ) : (
                      <span
                        className="mono"
                        onClick={() => isAdmin && startEdit(i)}
                        style={{
                          fontWeight:600, fontSize:15,
                          color: i.quantidade < 0 ? 'var(--danger)' : 'var(--success)',
                          cursor: isAdmin ? 'pointer' : 'default',
                          padding: isAdmin ? '3px 8px' : '0',
                          borderRadius: isAdmin ? 4 : 0,
                          border: isAdmin ? '1px dashed transparent' : 'none',
                          display: 'inline-block',
                          transition: 'all 0.15s',
                        }}
                        onMouseEnter={e => { if (isAdmin) { e.target.style.borderColor = 'var(--accent)'; e.target.style.background = 'var(--accent-subtle)'; }}}
                        onMouseLeave={e => { if (isAdmin) { e.target.style.borderColor = 'transparent'; e.target.style.background = 'transparent'; }}}
                        title={isAdmin ? 'Clique para editar' : ''}
                      >
                        {i.quantidade.toLocaleString('pt-BR')}
                        {isAdmin && <span style={{fontSize:10,marginLeft:4,opacity:0.5}}>✏️</span>}
                      </span>
                    )}
                  </td>
                  <td>
                    {i.localizacao_tipo === 'aplicador' && (
                      conciliando === i.id ? (
                        <div style={{display:'flex',gap:4,alignItems:'center'}}>
                          <input type="number" min="0" value={conciliacaoVal}
                            onChange={e=>setConciliacaoVal(e.target.value)}
                            onKeyDown={e=>{if(e.key==='Enter')conciliar(i);if(e.key==='Escape'){setConciliando(null);setConciliacaoVal('');}}}
                            autoFocus placeholder="Qtd real"
                            style={{width:75,padding:'3px 6px',background:'var(--bg-input)',border:'1px solid var(--accent)',borderRadius:4,color:'var(--text-primary)',fontSize:12}} />
                          <button className="btn btn-success btn-sm btn-icon" onClick={()=>conciliar(i)} title="Confirmar">✓</button>
                          <button className="btn btn-secondary btn-sm btn-icon" onClick={()=>{setConciliando(null);setConciliacaoVal('')}} title="Cancelar">✕</button>
                        </div>
                      ) : (
                        <button className="btn btn-secondary btn-sm" style={{fontSize:11,padding:'3px 8px'}}
                          onClick={()=>{setConciliando(i.id);setConciliacaoVal(String(i.quantidade));}}>
                          🔍 Conciliar
                        </button>
                      )
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {showEntrada && <EntradaEstoqueModal onClose={() => { setShowEntrada(false); load(); }} />}

      {showTransitoModal && (
        <Modal title="🚚 Doses em Trânsito" onClose={() => setShowTransitoModal(false)} large>
          {rotasTransito.length === 0
            ? <div className="empty-state"><div className="empty-icon">🚚</div><div className="empty-text">Nenhuma rota em trânsito</div></div>
            : rotasTransito.map(r => {
              const entregues = (r.remessas||[]).filter(rem => rem.status === 'concluida').length;
              const total = (r.remessas||[]).length;
              const dosesRota = (r.remessas||[]).reduce((s,rem) => s + (rem.remessa_itens||[]).reduce((ss,i) => ss+Number(i.quantidade||0),0), 0);
              return (
                <div key={r.id||r.codigo} className="card" style={{marginBottom:10,padding:14}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:8}}>
                    <div>
                      <div style={{fontFamily:'JetBrains Mono',fontSize:15,fontWeight:700,color:'var(--accent)'}}>{r.codigo}</div>
                      <div style={{fontSize:12,color:'var(--text-secondary)',marginTop:3,display:'flex',gap:12,flexWrap:'wrap'}}>
                        <span>👤 {r.profiles?.nome || '—'}</span>
                        <span>🚗 {r.veiculo || '—'}</span>
                        <span>📅 {r.data_prevista ? new Date(r.data_prevista+'T12:00:00').toLocaleDateString('pt-BR') : '—'}</span>
                        <span>💊 {dosesRota.toLocaleString('pt-BR')} doses</span>
                      </div>
                    </div>
                    <div style={{textAlign:'right'}}>
                      <span className={`badge ${r.status==='em_transito'?'badge-green':r.status==='pronta'?'badge-cyan':'badge-yellow'}`}>
                        {r.status==='em_transito'?'Em Trânsito':r.status==='pronta'?'Pronta':r.status}
                      </span>
                      <div style={{fontSize:12,color:'var(--text-muted)',marginTop:4}}>{entregues}/{total} entregas</div>
                    </div>
                  </div>
                  <div style={{marginTop:8,height:4,background:'var(--border)',borderRadius:2,overflow:'hidden'}}>
                    <div style={{height:'100%',width:(total>0?entregues/total*100:0)+'%',background:'var(--success)',transition:'width 0.3s'}}/>
                  </div>
                </div>
              );
            })
          }
        </Modal>
      )}
    </div>
  );
}

function EntradaEstoqueModal({ onClose }) {
  const [bases, setBases] = useState([]);
  const [aplicadores, setAplicadores] = useState([]);
  const [vacinas, setVacinas] = useState([]);
  const [form, setForm] = useState({ destino_tipo: 'base', vacina_id: '', base_id: '', aplicador_id: '', quantidade: '', observacao: '' });
  const [saving, setSaving] = useState(false);
  const toast = useContext(ToastContext);

  useEffect(() => {
    sb.from('bases').select('id, nome').eq('ativa', true).order('nome').then(r => setBases(r.data || []));
    sb.from('aplicadores').select('id, nome, cpf, cidade, uf').order('nome').then(r => setAplicadores(r.data || []));
    // Entrada de estoque deve listar PRODUTO pelo nome comercial da vacina, sem depender de lote.
    // Importante: NÃO usar produto_nome aqui, porque no banco ele pode estar agrupando
    // Influenza Tetravalente e Influenza Trivalente como apenas "Influenza".
    // O lote continua fora da tela; quando houver vários lotes do mesmo nome, usamos
    // apenas um vacina_id representante para criar/atualizar o saldo do produto.
    sb.from('vacinas').select('id, nome, lote, produto_nome, ativa').order('nome').then(r => {
      const mapa = new Map();
      (r.data || []).forEach(v => {
        const produto = String(v.nome || '').trim();
        if (!produto) return;
        const key = produto.toLowerCase();
        const atual = mapa.get(key);
        // Preferência do representante:
        // 1) ativo e sem lote; 2) ativo; 3) sem lote; 4) primeiro encontrado.
        const score = (v.ativa === true ? 10 : 0) + (!v.lote ? 2 : 0);
        const atualScore = atual ? ((atual.ativa === true ? 10 : 0) + (!atual.lote ? 2 : 0)) : -1;
        if (!atual || score > atualScore) {
          mapa.set(key, { id: v.id, nome: produto, lote: null, produto_nome: produto, ativa: v.ativa });
        }
      });
      setVacinas(Array.from(mapa.values()).sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR')));
    });
  }, []);

  const save = async () => {
    const qtd = parseInt(form.quantidade);
    if (!form.vacina_id || !form.quantidade || isNaN(qtd) || qtd <= 0) {
      toast('Informe produto e uma quantidade válida', 'error'); return;
    }
    if (form.destino_tipo === 'base' && !form.base_id) {
      toast('Selecione a base de destino', 'error'); return;
    }
    if (form.destino_tipo === 'aplicador' && !form.aplicador_id) {
      toast('Selecione o aplicador de destino', 'error'); return;
    }

    setSaving(true);
    const userId = (await sb.auth.getUser()).data.user.id;
    const destinoBase = form.destino_tipo === 'base';

    try {
      // Para base, tenta usar RPC existente primeiro. Para aplicador, faz upsert direto.
      let rpcErr = null;
      if (destinoBase) {
        const rpc = await sb.rpc('entrada_estoque', {
          p_vacina_id: form.vacina_id,
          p_base_id: form.base_id,
          p_quantidade: qtd,
          p_observacao: form.observacao || null
        });
        rpcErr = rpc.error;
        if (!rpcErr) {
          toast('Entrada registrada com sucesso!', 'success');
          onClose();
          setSaving(false);
          return;
        }
      }

      // Fallback/entrada manual: soma se já existe, cria se ainda não existe.
      let query = sb.from('estoque')
        .select('id, quantidade')
        .eq('vacina_id', form.vacina_id)
        .eq('localizacao_tipo', form.destino_tipo);

      if (destinoBase) {
        query = query.eq('base_id', form.base_id).is('aplicador_id', null);
      } else {
        query = query.eq('aplicador_id', form.aplicador_id).is('base_id', null);
      }

      const { data: existing, error: existingErr } = await query.maybeSingle();
      if (existingErr) throw existingErr;

      let dbErr;
      if (existing) {
        const { error } = await sb.from('estoque')
          .update({ quantidade: Number(existing.quantidade || 0) + qtd })
          .eq('id', existing.id);
        dbErr = error;
      } else {
        const payload = {
          vacina_id: form.vacina_id,
          localizacao_tipo: form.destino_tipo,
          quantidade: qtd,
          base_id: destinoBase ? form.base_id : null,
          aplicador_id: destinoBase ? null : form.aplicador_id
        };
        const { error } = await sb.from('estoque').insert(payload);
        dbErr = error;
      }
      if (dbErr) throw dbErr;

      const obsPadrao = destinoBase
        ? 'Entrada manual de estoque em base'
        : 'Criação/entrada manual de estoque do aplicador sem entrevista prévia';

      const { error: movErr } = await sb.from('movimentacoes').insert({
        tipo: destinoBase ? 'entrada' : 'ajuste',
        vacina_id: form.vacina_id,
        quantidade: qtd,
        destino_tipo: form.destino_tipo,
        destino_base_id: destinoBase ? form.base_id : null,
        destino_aplicador_id: destinoBase ? null : form.aplicador_id,
        observacao: form.observacao || obsPadrao,
        criado_por: userId
      });
      if (movErr) throw movErr;

      toast(destinoBase ? 'Entrada registrada com sucesso!' : 'Estoque do aplicador criado/atualizado com sucesso!', 'success');
      onClose();
    } catch (err) {
      toast(err.message || 'Erro ao registrar estoque', 'error');
    } finally {
      setSaving(false);
    }
  };

  return (
    <Modal title="Entrada de Estoque" onClose={onClose}>
      <p style={{fontSize:13,color:'var(--text-secondary)',marginBottom:16}}>Registre entrada em base ou crie estoque inicial para aplicador que ainda não estava no sistema.</p>
      <div className="form-grid">
        <div className="form-group">
          <label className="form-label">Destino *</label>
          <select className="form-select" value={form.destino_tipo} onChange={e=>setForm(f=>({...f,destino_tipo:e.target.value,base_id:'',aplicador_id:''}))}>
            <option value="base">Base</option>
            <option value="aplicador">Aplicador</option>
          </select>
        </div>
        <div className="form-group">
          <label className="form-label">Produto *</label>
          <select className="form-select" value={form.vacina_id} onChange={e=>setForm(f=>({...f,vacina_id:e.target.value}))}>
            <option value="">Selecione...</option>
            {vacinas.map(v => <option key={v.id} value={v.id}>{v.nome}</option>)}
          </select>
          <div style={{fontSize:10,color:'var(--text-muted)',marginTop:4}}>Saldo será criado/atualizado por produto, ignorando lote.</div>
        </div>
        {form.destino_tipo === 'base' ? (
          <div className="form-group">
            <label className="form-label">Base de destino *</label>
            <select className="form-select" value={form.base_id} onChange={e=>setForm(f=>({...f,base_id:e.target.value}))}>
              <option value="">Selecione...</option>
              {bases.map(b => <option key={b.id} value={b.id}>{b.nome}</option>)}
            </select>
          </div>
        ) : (
          <div className="form-group">
            <label className="form-label">Aplicador de destino *</label>
            <select className="form-select" value={form.aplicador_id} onChange={e=>setForm(f=>({...f,aplicador_id:e.target.value}))}>
              <option value="">Selecione...</option>
              {aplicadores.map(a => <option key={a.id} value={a.id}>{a.nome} {a.cpf ? `— ${a.cpf}` : ''} {a.cidade ? `(${a.cidade}/${a.uf || ''})` : ''}</option>)}
            </select>
          </div>
        )}
        <div className="form-group">
          <label className="form-label">Quantidade (doses) *</label>
          <input className="form-input" type="number" min="1" value={form.quantidade} onChange={e=>setForm(f=>({...f,quantidade:e.target.value}))} />
        </div>
        <div className="form-group" style={{gridColumn:'1 / -1'}}>
          <label className="form-label">Observação</label>
          <input className="form-input" value={form.observacao} onChange={e=>setForm(f=>({...f,observacao:e.target.value}))} placeholder={form.destino_tipo === 'aplicador' ? 'Ex: estoque inicial informado pelo aplicador' : 'NF, fornecedor, etc.'} />
        </div>
      </div>
      {form.destino_tipo === 'aplicador' && (
        <div style={{marginTop:12,padding:10,border:'1px solid var(--warning)',background:'var(--warning-bg)',borderRadius:6,fontSize:12,color:'var(--warning)'}}>
          Esse lançamento cria saldo direto no aplicador e também registra uma movimentação de ajuste no extrato.
        </div>
      )}
      <div className="modal-actions">
        <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" onClick={save} disabled={saving}>{saving ? 'Salvando...' : 'Registrar Estoque'}</button>
      </div>
    </Modal>
  );
}

// ═══════════════════════════════════════════════
// DEMANDA vs OFERTA — CENTRAL DE DECISÃO LOGÍSTICA
// ═══════════════════════════════════════════════
function DemandaOfertaPage({ profile }) {
  const WEEK1_START = new Date('2026-03-08T00:00:00');
  function getCurrentOperationalWeek() {
    const today = new Date();
    const todayOnly = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const diff = Math.floor((todayOnly - WEEK1_START) / 86400000);
    return Math.max(1, Math.floor(diff / 7) + 1);
  }
  function safeSemana(value) {
    const n = parseInt(value, 10);
    return Number.isFinite(n) && n > 0 ? n : getCurrentOperationalWeek();
  }
  function weekRange(w) {
    const semanaNum = safeSemana(w);
    const ini = new Date(WEEK1_START);
    ini.setDate(ini.getDate() + (semanaNum - 1) * 7);
    const fim = new Date(ini);
    fim.setDate(fim.getDate() + 6);
    const iso = d => d.toISOString().split('T')[0];
    return { inicio: iso(ini), fim: iso(fim), semana: semanaNum, label: `${ini.toLocaleDateString('pt-BR')} até ${fim.toLocaleDateString('pt-BR')}` };
  }

  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('todos');
  const [semana, setSemana] = useState(() => getCurrentOperationalWeek());
  const [pontoPartida, setPontoPartida] = useState('');
  const [vacinaFiltro, setVacinaFiltro] = useState('');
  const [planejamentos, setPlanejamentos] = useState({});
  const [transferModal, setTransferModal] = useState(null);
  const [transferForm, setTransferForm] = useState({ origem: '', quantidade: '' });
  const toast = useContext(ToastContext);
  const isAdmin = profile?.role === 'admin';
  async function fetchAll(table, select, build) {
    let all = [], from = 0, step = 1000;
    while (true) {
      let q = sb.from(table).select(select).range(from, from + step - 1);
      if (build) q = build(q);
      const { data, error } = await q;
      if (error) throw error;
      all = all.concat(data || []);
      if (!data || data.length < step) break;
      from += step;
    }
    return all;
  }
  function statusPlanejamento(item) {
    const p = planejamentos[item.key];
    if (p?.status) return p.status;
    if ((item.necessidade || 0) <= 0) return 'nao_enviar_estoque_suficiente';
    return 'envio_sugerido';
  }
  function labelStatus(status) {
    return {
      pendente_analise: 'Pendente análise',
      nao_enviar_estoque_suficiente: 'Não enviar',
      envio_sugerido: 'Envio sugerido',
      envio_aprovado: 'Envio aprovado',
      em_montagem: 'Em montagem',
      montado: 'Montado',
      carregado: 'Carregado',
      em_rota: 'Em rota',
      entregue: 'Entregue',
      cancelado: 'Cancelado'
    }[status] || status || 'Pendente';
  }
  function badgeStatus(status) {
    if (status === 'nao_enviar_estoque_suficiente' || status === 'entregue') return 'badge-green';
    if (['envio_aprovado','em_montagem','montado','carregado','em_rota'].includes(status)) return 'badge-blue';
    if (status === 'cancelado') return 'badge-red';
    if (status === 'envio_sugerido') return 'badge-yellow';
    return 'badge-gray';
  }

  const load = async () => {
    setLoading(true);
    try {
      const range = weekRange(semana);
      const [escalas, tarefasFallback, estoque, vacinas, bases, aplicadores, planning] = await Promise.all([
        fetchAll('escalas', 'id,tarefa_id,codigo_tarefa,aplicador_id,tutor_nome,tutor_cpf,ponto_partida,doses_necessarias,doses_aplicadas,vacina_id,tipo_vacina,data_inicio,data_termino,semanas,status,base_id,base_nome'),
        fetchAll('tarefas', 'id,codigo,cliente,cidade_campanha,uf_campanha,data_inicio,doses_previstas,status,status_logistica,semanas,vacina_id,vacina,ponto_partida,base_id,base_nome'),
        fetchAll('estoque', 'vacina_id,aplicador_id,base_id,localizacao_tipo,quantidade,aplicadores(id,nome,cpf,cidade,uf,base_vinculada_id),vacinas(id,nome)', q => q.eq('localizacao_tipo','aplicador')),
        fetchAll('vacinas', 'id,nome'),
        fetchAll('bases', 'id,nome,cidade,uf,ponto_partida'),
        fetchAll('aplicadores', 'id,nome,cpf,cidade,uf,base_vinculada_id'),
        fetchAll('planejamento_logistico', '*', q => q.eq('semana', safeSemana(semana))).catch(() => [])
      ]);

      const norm = (v) => String(v || '').trim().toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      const normalizeCode = (v) => String(v || '')
        .trim()
        .toUpperCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^A-Z0-9]/g, '');
      const vacinaMap = {}; const vacinaNomeMap = {};
      (vacinas || []).forEach(v => { vacinaMap[v.id] = v.nome; vacinaNomeMap[norm(v.nome)] = v.id; });
      const baseMap = {}; (bases || []).forEach(b => baseMap[b.id] = b);
      const apMap = {}; (aplicadores || []).forEach(a => apMap[a.id] = a);
      const tarefaById = {};
      const tarefaByCodigo = {};
      (tarefasFallback || []).forEach(t => {
        if (t.id) tarefaById[t.id] = t;
        const c = normalizeCode(t.codigo);
        if (c) tarefaByCodigo[c] = t;
      });

      const defaultVacinaId = (vacinas && vacinas[0]?.id) || null;
      // Normalizar nomes de vacina da planilha → nome oficial do sistema
      const normVacina = (v) => {
        const s = String(v || '').trim().toLowerCase();
        if (!s || s === 'gripe' || s === 'influenza tetravalente') return 'Influenza Tetravalente';
        if (s.includes('triv') || s === 'gripe trivalente' || s === 'influenza trivalente') return 'Influenza Trivalente';
        if (s.includes('tetrav')) return 'Influenza Tetravalente';
        return String(v || '').trim();
      };

      const resolveVacinaId = (e, t={}) => {
        if (e?.vacina_id) return e.vacina_id;
        if (t?.vacina_id) return t.vacina_id;
        const nome = normVacina(e?.tipo_vacina || t?.vacina || 'Gripe');
        return vacinaNomeMap[norm(nome)] || vacinaNomeMap['gripe'] || defaultVacinaId;
      };
      const resolveVacinaNome = (id, e={}, t={}) => vacinaMap[id] || normVacina(e.tipo_vacina || t.vacina) || 'Vacina';

      const estoqueMap = {};
      (estoque || []).forEach(e => {
        if (!e.aplicador_id || !e.vacina_id) return;
        const k = `${e.aplicador_id}|${e.vacina_id}`;
        if (!estoqueMap[k]) {
          const ap = e.aplicadores || apMap[e.aplicador_id] || {};
          estoqueMap[k] = {
            aplicador_id: e.aplicador_id,
            aplicador_nome: ap.nome || 'Aplicador',
            cpf: ap.cpf || '',
            cidade: ap.cidade || '',
            uf: ap.uf || '',
            base_id: ap.base_vinculada_id || e.base_id || null,
            vacina_id: e.vacina_id,
            vacina_nome: e.vacinas?.nome || vacinaMap[e.vacina_id] || 'Vacina',
            estoque_atual: 0
          };
        }
        estoqueMap[k].estoque_atual += Number(e.quantidade || 0);
      });

      const grouped = {};
      const start = range.inicio, end = range.fim;
      const codigosComEscala = new Set();
      const selectedSemana = safeSemana(semana);
      const numSemana = (v) => {
        if (v === null || v === undefined || v === '') return null;
        const n = Number(String(v).replace(',', '.'));
        if (Number.isFinite(n) && n > 0) return Math.floor(n);
        const m = String(v ?? '').match(/\d+/);
        return m ? parseInt(m[0], 10) : null;
      };
      const dateInRange = (d) => {
        const x = String(d || '').slice(0,10);
        return !!x && x >= start && x <= end;
      };
      const belongsToWeek = (e, t={}) => {
        const semanaEscala = numSemana(e?.semanas);
        const semanaTarefa = numSemana(t?.semanas);
        if (semanaEscala === selectedSemana || semanaTarefa === selectedSemana) return true;
        return dateInRange(t?.data_inicio) || dateInRange(e?.data_inicio);
      };

      // Principal: todos os aplicadores escalados entram, mesmo com estoque zerado.
      // Usa primeiro a coluna Semanas importada; se ela não existir, cai para o intervalo de datas.
      (escalas || []).forEach(e => {
        const codigoEscala = normalizeCode(e.codigo_tarefa);
        const t = tarefaById[e.tarefa_id] || tarefaByCodigo[codigoEscala] || {};
        if (!belongsToWeek(e, t)) return;
        const data = (t.data_inicio || e.data_inicio || '').slice(0,10);
        const statusEscala = String(e.status || t.status || '').toLowerCase();
        if (statusEscala === 'cancelada' || statusEscala === 'cancelado') return;
        const statusLog = String(t.status_logistica || 'nao_roteirizado').toLowerCase();
        if (['concluido','concluida','entregue','finalizado','finalizada'].includes(statusLog)) return;

        const vacinaId = resolveVacinaId(e, t);
        if (!vacinaId) return;
        const apId = e.aplicador_id || null;
        const cpfKey = String(e.tutor_cpf || '').trim();
        const k = apId ? `${apId}|${vacinaId}` : `escala|${cpfKey || e.tutor_nome || e.id}|${vacinaId}`;
        const est = apId ? (estoqueMap[`${apId}|${vacinaId}`] || {}) : {};
        const ap = apId ? (apMap[apId] || {}) : {};
        const baseId = e.base_id || est.base_id || ap.base_vinculada_id || t.base_id || null;
        const base = baseMap[baseId] || {};
        if (!grouped[k]) {
          grouped[k] = {
            key: k,
            aplicador_id: apId,
            aplicador_nome: est.aplicador_nome || e.tutor_nome || ap.nome || 'Aplicador sem cadastro',
            cpf: est.cpf || e.tutor_cpf || ap.cpf || '',
            cidade: est.cidade || ap.cidade || t.cidade_campanha || '',
            uf: est.uf || ap.uf || t.uf_campanha || '',
            ponto_partida: e.ponto_partida || t.ponto_partida || base.ponto_partida || base.nome || '',
            base_origem_id: baseId,
            base_origem_nome: base.nome || e.base_nome || t.base_nome || '—',
            vacina_id: vacinaId,
            vacina_nome: resolveVacinaNome(vacinaId, e, t),
            estoque_atual: est.estoque_atual || 0,
            demanda_futura: 0,
            tarefas: []
          };
        }
        const doses = Number(e.doses_necessarias || t.doses_previstas || 0);
        grouped[k].demanda_futura += doses;
        grouped[k].tarefas.push({
          escala_id: e.id,
          tarefa_id: e.tarefa_id || t.id,
          codigo: e.codigo_tarefa || t.codigo || '',
          cliente: t.cliente || '',
          data_inicio: data,
          doses,
          status_logistica: statusLog
        });
        const codigo = normalizeCode(e.codigo_tarefa || t.codigo);
        if (codigo) codigosComEscala.add(codigo);
      });

      // Demanda da semana: tarefas são a fonte principal da necessidade.
      // Se houver escala vinculada pelo código, a demanda entra no aplicador.
      // Se não houver escala, entra como cliente sem escala para programação.
      (tarefasFallback || []).forEach(t => {
        const data = (t.data_inicio || '').slice(0,10);
        if (!belongsToWeek({}, t)) return;
        const statusTarefa = String(t.status || '').toLowerCase();
        if (statusTarefa === 'cancelada' || statusTarefa === 'cancelado') return;
        const statusLog = String(t.status_logistica || 'nao_roteirizado').toLowerCase();
        if (['concluido','concluida','entregue','finalizado','finalizada'].includes(statusLog)) return;

        const codigoNorm = normalizeCode(t.codigo);
        const vacinaId = resolveVacinaId({}, t);
        if (!vacinaId) return;

        // tenta achar escala pelo código da tarefa e semana
        const escalaVinculada = (escalas || []).find(e => {
          const ce = normalizeCode(e.codigo_tarefa);
          if (!ce || ce !== codigoNorm) return false;
          return belongsToWeek(e, t);
        });

        let key, baseId, base, nome, cpf, cidade, uf, apId;
        if (escalaVinculada && escalaVinculada.aplicador_id) {
          apId = escalaVinculada.aplicador_id;
          key = `${apId}|${vacinaId}`;
          const est = estoqueMap[key] || {};
          const ap = apMap[apId] || {};
          baseId = escalaVinculada.base_id || est.base_id || ap.base_vinculada_id || t.base_id || null;
          base = baseMap[baseId] || {};
          nome = est.aplicador_nome || escalaVinculada.tutor_nome || ap.nome || 'Aplicador sem cadastro';
          cpf = est.cpf || escalaVinculada.tutor_cpf || ap.cpf || '';
          cidade = est.cidade || ap.cidade || t.cidade_campanha || '';
          uf = est.uf || ap.uf || t.uf_campanha || '';
        } else {
          apId = null;
          key = `cliente|${t.cliente || codigoNorm || t.id}|${vacinaId}`;
          baseId = t.base_id || null;
          base = baseMap[baseId] || {};
          nome = t.cliente || 'Cliente sem escala';
          cpf = '';
          cidade = t.cidade_campanha || '';
          uf = t.uf_campanha || '';
        }

        if (!grouped[key]) {
          grouped[key] = {
            key,
            aplicador_id: apId,
            aplicador_nome: nome,
            cpf,
            cidade,
            uf,
            ponto_partida: (escalaVinculada?.ponto_partida) || t.ponto_partida || base.ponto_partida || t.base_nome || base.nome || '',
            base_origem_id: baseId,
            base_origem_nome: base.nome || escalaVinculada?.base_nome || t.base_nome || '—',
            vacina_id: vacinaId,
            vacina_nome: resolveVacinaNome(vacinaId, escalaVinculada || {}, t),
            estoque_atual: apId ? (estoqueMap[`${apId}|${vacinaId}`]?.estoque_atual || 0) : 0,
            demanda_futura: 0,
            tarefas: []
          };
        }

        // Evita duplicar se essa mesma tarefa já entrou via escala antes
        const jaTem = grouped[key].tarefas.some(x => normalizeCode(x.codigo) === codigoNorm && codigoNorm);
        if (!jaTem) {
          const doses = Number(t.doses_previstas || escalaVinculada?.doses_necessarias || 0);
          grouped[key].demanda_futura += doses;
          grouped[key].tarefas.push({ tarefa_id: t.id, escala_id: escalaVinculada?.id, codigo: t.codigo || '', cliente: t.cliente || '', data_inicio: data, doses, status_logistica: statusLog });
        }
      });

      // Se ainda não houver demanda, inclui escalas da semana diretamente como fallback,
      // mesmo sem tarefa vinculada ou sem código compatível.
      (escalas || []).forEach(e => {
        const t = tarefaById[e.tarefa_id] || tarefaByCodigo[normalizeCode(e.codigo_tarefa)] || {};
        if (!belongsToWeek(e, t)) return;
        const statusEscala = String(e.status || t.status || '').toLowerCase();
        if (statusEscala === 'cancelada' || statusEscala === 'cancelado') return;
        const vacinaId = resolveVacinaId(e, t);
        if (!vacinaId) return;
        const apId = e.aplicador_id || null;
        const key = apId ? `${apId}|${vacinaId}` : `escala|${e.tutor_cpf || e.tutor_nome || e.id}|${vacinaId}`;
        const codigoNorm = normalizeCode(e.codigo_tarefa || t.codigo);
        if (!grouped[key]) {
          const est = apId ? (estoqueMap[key] || {}) : {};
          const ap = apId ? (apMap[apId] || {}) : {};
          const baseId = e.base_id || est.base_id || ap.base_vinculada_id || t.base_id || null;
          const base = baseMap[baseId] || {};
          grouped[key] = {
            key,
            aplicador_id: apId,
            aplicador_nome: est.aplicador_nome || e.tutor_nome || ap.nome || 'Aplicador sem cadastro',
            cpf: est.cpf || e.tutor_cpf || ap.cpf || '',
            cidade: est.cidade || ap.cidade || t.cidade_campanha || '',
            uf: est.uf || ap.uf || t.uf_campanha || '',
            ponto_partida: e.ponto_partida || t.ponto_partida || base.ponto_partida || e.base_nome || t.base_nome || base.nome || '',
            base_origem_id: baseId,
            base_origem_nome: base.nome || e.base_nome || t.base_nome || '—',
            vacina_id: vacinaId,
            vacina_nome: resolveVacinaNome(vacinaId, e, t),
            estoque_atual: est.estoque_atual || 0,
            demanda_futura: 0,
            tarefas: []
          };
        }
        const jaTem = grouped[key].tarefas.some(x => normalizeCode(x.codigo) === codigoNorm && codigoNorm);
        if (!jaTem) {
          const doses = Number(e.doses_necessarias || t.doses_previstas || 0);
          grouped[key].demanda_futura += doses;
          grouped[key].tarefas.push({ escala_id: e.id, tarefa_id: e.tarefa_id || t.id, codigo: e.codigo_tarefa || t.codigo || '', cliente: t.cliente || '', data_inicio: (t.data_inicio || e.data_inicio || '').slice(0,10), doses, status_logistica: t.status_logistica || 'nao_roteirizado' });
        }
      });

      // Inclui aplicadores com estoque, mesmo sem demanda na semana, para analisar transferência para outro aplicador.
      Object.entries(estoqueMap).forEach(([k, e]) => {
        if (!grouped[k]) {
          const base = baseMap[e.base_id] || {};
          grouped[k] = {
            key: k,
            ...e,
            ponto_partida: base.ponto_partida || base.nome || '',
            base_origem_id: e.base_id || null,
            base_origem_nome: base.nome || '—',
            demanda_futura: 0,
            tarefas: []
          };
        }
      });

      const planMap = {};
      (planning || []).forEach(p => { if (p.aplicador_id && p.vacina_id) planMap[`${p.aplicador_id}|${p.vacina_id}`] = p; });
      setPlanejamentos(planMap);

      let rows = Object.values(grouped).map(i => {
        const saldo = Number(i.estoque_atual || 0) - Number(i.demanda_futura || 0);
        const necessidade = Math.max(0, Number(i.demanda_futura || 0) - Number(i.estoque_atual || 0));
        return { ...i, saldo_projetado: saldo, necessidade, sugestao: necessidade > 0 ? `Enviar ${necessidade}` : 'Não enviar' };
      });

      // Sugestão profissional de transferência: dentro do mesmo ponto + vacina, procura aplicadores com sobra.
      const donorsByGroup = {};
      rows.forEach(r => {
        if (!r.aplicador_id || r.saldo_projetado <= 0) return;
        const g = `${r.ponto_partida || ''}|${r.vacina_id}`;
        if (!donorsByGroup[g]) donorsByGroup[g] = [];
        donorsByGroup[g].push({ nome: r.aplicador_nome, aplicador_id: r.aplicador_id, disponivel: r.saldo_projetado });
      });
      Object.values(donorsByGroup).forEach(list => list.sort((a,b)=>b.disponivel-a.disponivel));
      rows = rows.map(r => {
        if (r.necessidade <= 0) return r;
        const g = `${r.ponto_partida || ''}|${r.vacina_id}`;
        const donor = (donorsByGroup[g] || []).find(d => d.aplicador_id !== r.aplicador_id && d.disponivel > 0);
        if (donor) {
          return { ...r, sugestao: `Transferir ${Math.min(r.necessidade, donor.disponivel)} de ${donor.nome}` };
        }
        return r;
      });

      rows.sort((a,b) => (b.necessidade - a.necessidade) || (b.demanda_futura - a.demanda_futura) || String(a.aplicador_nome).localeCompare(String(b.aplicador_nome)));
      setItems(rows);
    } catch (err) {
      toast('Erro ao carregar Demanda vs Oferta: ' + err.message, 'error');
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { load(); }, [semana]);

  const savePlanning = async (item, status, extra = {}) => {
    if (!isAdmin) { toast('Somente ADM pode alterar decisões logísticas.', 'error'); return; }
    const payload = {
      aplicador_id: item.aplicador_id,
      vacina_id: item.vacina_id,
      base_origem_id: item.base_origem_id || null,
      semana: safeSemana(semana),
      estoque_atual: Number(item.estoque_atual || 0),
      demanda_futura: Number(item.demanda_futura || 0),
      saldo_projetado: Number(item.saldo_projetado || 0),
      quantidade_sugerida: Number(item.necessidade || 0),
      status,
      observacao: extra.observacao || null,
      atualizado_em: new Date().toISOString()
    };
    const existing = planejamentos[item.key];
    const res = existing?.id
      ? await sb.from('planejamento_logistico').update(payload).eq('id', existing.id).select().single()
      : await sb.from('planejamento_logistico').insert(payload).select().single();
    if (res.error) {
      toast('Erro ao salvar decisão. Rode o SQL do planejamento_logistico uma vez. Detalhe: ' + res.error.message, 'error');
      return;
    }
    setPlanejamentos(p => ({ ...p, [item.key]: res.data }));
    toast('Decisão logística salva.', 'success');
  };

  const updateStatus = async (item, status) => savePlanning(item, status);

  const confirmarEntrega = async (item) => {
    if (!isAdmin) { toast('Somente ADM pode confirmar entrega.', 'error'); return; }
    if (!item.necessidade || item.necessidade <= 0) { toast('Este aplicador não precisa de envio.', 'info'); return; }
    if (!item.base_origem_id) { toast('Este registro não tem base de origem definida.', 'error'); return; }

    // Verificar saldo antes
    const { data: estoque } = await sb.from('estoque')
      .select('quantidade')
      .eq('vacina_id', item.vacina_id)
      .eq('base_id', item.base_origem_id)
      .eq('localizacao_tipo', 'base')
      .single();
    const saldo = estoque?.quantidade || 0;
    if (saldo < item.necessidade) {
      toast(`⚠ Saldo insuficiente na base: disponível ${saldo}, necessário ${item.necessidade}. Use Ajuste Manual no Estoque para corrigir.`, 'error');
      return;
    }

    if (!confirm(`Confirmar entrega de ${item.necessidade} doses para ${item.aplicador_nome}?`)) return;
    try {
      const { error } = await sb.rpc('transferir_estoque', {
        p_vacina_id: item.vacina_id,
        p_quantidade: item.necessidade,
        p_origem_tipo: 'base',
        p_origem_id: item.base_origem_id,
        p_destino_tipo: 'aplicador',
        p_destino_id: item.aplicador_id,
        p_remessa_id: null,
        p_observacao: `Demanda vs Oferta - Semana ${safeSemana(semana)}`
      });
      if (error) throw error;

      // Atualizar status_logistica das tarefas do aplicador para 'entregue'
      if (item.aplicador_id) {
        const { data: escalas } = await sb.from('escalas')
          .select('tarefa_id').eq('aplicador_id', item.aplicador_id).not('tarefa_id', 'is', null);
        const tarefaIds = [...new Set((escalas||[]).map(e => e.tarefa_id).filter(Boolean))];
        if (tarefaIds.length > 0) {
          await sb.from('tarefas').update({ status_logistica: 'entregue' }).in('id', tarefaIds);
        }
      }

      await savePlanning(item, 'entregue', { observacao: `Entrega confirmada pela tela Demanda vs Oferta - Semana ${safeSemana(semana)}` });
      await load();
    } catch (err) {
      toast('Erro ao confirmar entrega: ' + err.message, 'error');
    }
  };

  const aprovarEnvio = async (item) => {
    if (!isAdmin) { toast('Somente ADM pode aprovar envio.', 'error'); return; }
    if (!item.aplicador_id) { toast('Este item ainda não tem aplicador vinculado.', 'error'); return; }
    if ((item.necessidade || 0) <= 0) { toast('Este aplicador não precisa de envio.', 'info'); return; }
    await savePlanning(item, 'envio_aprovado', { observacao: `Envio aprovado para ${item.necessidade} doses - Semana ${safeSemana(semana)}` });
  };

  const gerarMontagem = async (item) => {
    if (!isAdmin) { toast('Somente ADM pode enviar para montagem.', 'error'); return; }
    if ((item.necessidade || 0) <= 0) { toast('Este aplicador não precisa de montagem.', 'info'); return; }
    await savePlanning(item, 'em_montagem', { observacao: `Enviado para montagem pela Demanda vs Oferta - Semana ${safeSemana(semana)}` });
  };

  const abrirTransferencia = (item) => {
    const donors = items.filter(d =>
      d.aplicador_id && d.aplicador_id !== item.aplicador_id &&
      d.vacina_id === item.vacina_id &&
      (d.ponto_partida || '') === (item.ponto_partida || '') &&
      Number(d.saldo_projetado || 0) > 0
    );
    if (donors.length === 0) { toast('Não encontrei aplicador com sobra no mesmo ponto de partida e vacina.', 'error'); return; }
    setTransferModal({ destino: item, donors });
    setTransferForm({ origem: donors[0].aplicador_id, quantidade: String(Math.min(item.necessidade || 0, donors[0].saldo_projetado || 0)) });
  };

  const confirmarTransferencia = async () => {
    if (!isAdmin) { toast('Somente ADM pode transferir.', 'error'); return; }
    const item = transferModal?.destino;
    const donor = transferModal?.donors?.find(d => d.aplicador_id === transferForm.origem);
    const qtd = parseInt(transferForm.quantidade, 10);
    if (!item || !donor) { toast('Selecione a origem da transferência.', 'error'); return; }
    if (!qtd || qtd <= 0) { toast('Informe uma quantidade válida.', 'error'); return; }
    if (qtd > Number(donor.saldo_projetado || 0)) { toast('Quantidade maior que a sobra disponível do aplicador origem.', 'error'); return; }
    if (qtd > Number(item.necessidade || 0)) { toast('Quantidade maior que a necessidade do aplicador destino.', 'error'); return; }
    if (!confirm(`Transferir ${qtd} doses de ${donor.aplicador_nome} para ${item.aplicador_nome}?`)) return;
    try {
      const { error } = await sb.rpc('transferir_estoque', {
        p_vacina_id: item.vacina_id,
        p_quantidade: qtd,
        p_origem_tipo: 'aplicador',
        p_origem_id: donor.aplicador_id,
        p_destino_tipo: 'aplicador',
        p_destino_id: item.aplicador_id,
        p_remessa_id: null,
        p_observacao: `Transferência entre aplicadores - Demanda vs Oferta - Semana ${safeSemana(semana)}`
      });
      if (error) throw error;
      await savePlanning(item, qtd >= item.necessidade ? 'nao_enviar_estoque_suficiente' : 'envio_sugerido', { observacao: `Transferidas ${qtd} doses de ${donor.aplicador_nome}.` });
      setTransferModal(null);
      await load();
      toast('Transferência realizada com sucesso.', 'success');
    } catch (err) {
      toast('Erro ao transferir: ' + err.message, 'error');
    }
  };

  let filtered = items;
  if (search) {
    const s = search.toLowerCase();
    filtered = filtered.filter(i =>
      (i.aplicador_nome||'').toLowerCase().includes(s) ||
      (i.cpf||'').includes(s) ||
      (i.cidade||'').toLowerCase().includes(s) ||
      (i.ponto_partida||'').toLowerCase().includes(s)
    );
  }
  if (pontoPartida) filtered = filtered.filter(i => (i.ponto_partida || '') === pontoPartida);
  if (vacinaFiltro) filtered = filtered.filter(i => i.vacina_id === vacinaFiltro);
  if (filter === 'precisa_enviar') filtered = filtered.filter(i => i.necessidade > 0);
  else if (filter === 'nao_enviar') filtered = filtered.filter(i => i.necessidade <= 0 && i.demanda_futura > 0);
  else if (filter === 'sem_demanda') filtered = filtered.filter(i => i.demanda_futura <= 0);
  else if (filter === 'risco') filtered = filtered.filter(i => i.necessidade > 0 && i.estoque_atual <= 0);

  const pontos = [...new Set(items.map(i => i.ponto_partida).filter(Boolean))].sort();
  const vacinasLista = [...new Map(items.map(i => [i.vacina_id, i.vacina_nome]).filter(x=>x[0])).entries()].sort((a,b)=>String(a[1]).localeCompare(String(b[1])));
  const totalEnviar = filtered.reduce((s,i)=>s + Number(i.necessidade||0),0);
  const totalEstoque = filtered.reduce((s,i)=>s + Number(i.estoque_atual||0),0);
  const totalDemanda = filtered.reduce((s,i)=>s + Number(i.demanda_futura||0),0);
  const semEnvio = filtered.filter(i => i.demanda_futura > 0 && i.necessidade <= 0).length;
  const range = weekRange(semana);

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Demanda vs Oferta</div>
          <div className="page-subtitle">Decisão de envio por aplicador · Semana {range.semana}: {range.label} · Fonte: tarefas + escalas + estoque</div>
        </div>
        <button className="btn btn-secondary" onClick={load}>↻ Atualizar</button>
      </div>

      <div className="stats-grid">
        <div className="stat-card"><div className="stat-icon" style={{background:'var(--danger-bg)',color:'var(--danger)'}}>🚚</div><div className="stat-value">{totalEnviar.toLocaleString('pt-BR')}</div><div className="stat-label">Doses sugeridas p/ envio</div></div>
        <div className="stat-card"><div className="stat-icon" style={{background:'var(--success-bg)',color:'var(--success)'}}>✅</div><div className="stat-value">{semEnvio}</div><div className="stat-label">Aplicadores sem envio</div></div>
        <div className="stat-card"><div className="stat-icon" style={{background:'var(--accent-subtle)',color:'var(--accent)'}}>📦</div><div className="stat-value">{totalEstoque.toLocaleString('pt-BR')}</div><div className="stat-label">Estoque dos aplicadores</div></div>
        <div className="stat-card"><div className="stat-icon" style={{background:'var(--warning-bg)',color:'var(--warning)'}}>📋</div><div className="stat-value">{totalDemanda.toLocaleString('pt-BR')}</div><div className="stat-label">Demanda futura</div></div>
      </div>

      <div className="card" style={{marginBottom:16}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(170px,1fr))',gap:10,alignItems:'end'}}>
          <div className="form-group"><label className="form-label">Semana operacional</label><input className="form-input sm" type="number" min="1" value={semana} onChange={e=>setSemana(e.target.value)} /></div>
          <div className="form-group"><label className="form-label">Buscar</label><input className="form-input sm" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Aplicador, CPF, cidade ou ponto..." /></div>
          <div className="form-group"><label className="form-label">Ponto de partida</label><select className="form-select" style={{padding:'7px 10px',fontSize:13}} value={pontoPartida} onChange={e=>setPontoPartida(e.target.value)}><option value="">Todos</option>{pontos.map(p=><option key={p} value={p}>{p}</option>)}</select></div>
          <div className="form-group"><label className="form-label">Vacina</label><select className="form-select" style={{padding:'7px 10px',fontSize:13}} value={vacinaFiltro} onChange={e=>setVacinaFiltro(e.target.value)}><option value="">Todas</option>{vacinasLista.map(([id,n])=><option key={id} value={id}>{n}</option>)}</select></div>
          <div className="form-group"><label className="form-label">Filtro</label><select className="form-select" style={{padding:'7px 10px',fontSize:13}} value={filter} onChange={e=>setFilter(e.target.value)}><option value="precisa_enviar">Precisa enviar</option><option value="nao_enviar">Não enviar</option><option value="risco">Risco: sem estoque</option><option value="sem_demanda">Sem demanda na semana</option><option value="todos">Todos</option></select></div>
        </div>
      </div>

      <div className="card">
        <div className="card-header"><div className="card-title">Central de decisão</div><div style={{fontSize:12,color:'var(--text-muted)'}}>{filtered.length} registros</div></div>
        <div className="table-wrap">
          <table>
            <thead>
              <tr><th>Aplicador</th><th>Ponto</th><th>Vacina</th><th>Estoque</th><th>Demanda</th><th>Saldo</th><th>Sugestão</th><th>Status</th><th>Ação ADM</th></tr>
            </thead>
            <tbody>
              {loading && <tr><td colSpan={9}><div className="empty-state"><div className="empty-text">Carregando...</div></div></td></tr>}
              {!loading && filtered.length === 0 && <tr><td colSpan={9}><div className="empty-state"><div className="empty-text">Nenhum registro encontrado. Confira a semana, tire o filtro ou verifique se existem escalas/tarefas futuras importadas.</div></div></td></tr>}
              {!loading && filtered.slice(0,300).map(i => {
                const st = statusPlanejamento(i);
                return (
                  <tr key={i.key}>
                    <td style={{color:'var(--text-primary)',fontWeight:500,maxWidth:180,overflow:'hidden',textOverflow:'ellipsis'}} title={i.aplicador_nome}>{i.aplicador_nome}<div style={{fontSize:11,color:'var(--text-muted)'}}>{i.cpf || '—'} · {i.cidade || '—'}/{i.uf || '—'}</div></td>
                    <td>{i.ponto_partida || '—'}<div style={{fontSize:11,color:'var(--text-muted)'}}>Base: {i.base_origem_nome}</div></td>
                    <td>{i.vacina_nome}</td>
                    <td className="mono" style={{color:'var(--accent)',fontWeight:700}}>{Number(i.estoque_atual||0).toLocaleString('pt-BR')}</td>
                    <td className="mono" style={{fontWeight:700}}>{Number(i.demanda_futura||0).toLocaleString('pt-BR')}<div style={{fontSize:10,color:'var(--text-muted)'}}>{i.tarefas.length} tarefa(s)</div></td>
                    <td className="mono" style={{fontWeight:700,color:i.saldo_projetado>=0?'var(--success)':'var(--danger)'}}>{i.saldo_projetado>=0?'+':''}{Number(i.saldo_projetado||0).toLocaleString('pt-BR')}</td>
                    <td><span className={`badge ${i.necessidade>0?'badge-yellow':'badge-green'}`}>{i.sugestao}</span></td>
                    <td><span className={`badge ${badgeStatus(st)}`}>{labelStatus(st)}</span></td>
                    <td>
                      {isAdmin && i.aplicador_id ? (
                        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                          <select className="form-select" style={{padding:'6px 8px',fontSize:12,minWidth:150}} value={st} onChange={e=>updateStatus(i,e.target.value)}>
                            <option value="pendente_analise">Pendente análise</option>
                            <option value="nao_enviar_estoque_suficiente">Não enviar</option>
                            <option value="envio_sugerido">Envio sugerido</option>
                            <option value="envio_aprovado">Envio aprovado</option>
                            <option value="em_montagem">Em montagem</option>
                            <option value="montado">Montado</option>
                            <option value="carregado">Carregado</option>
                            <option value="em_rota">Em rota</option>
                            <option value="entregue">Entregue</option>
                            <option value="cancelado">Cancelado</option>
                          </select>
                          {i.necessidade > 0 && <button className="btn btn-primary btn-sm" onClick={()=>aprovarEnvio(i)}>Aprovar envio</button>}
                          {i.necessidade > 0 && <button className="btn btn-secondary btn-sm" onClick={()=>abrirTransferencia(i)}>Transferir</button>}
                          {i.necessidade > 0 && <button className="btn btn-success btn-sm" onClick={()=>gerarMontagem(i)}>Gerar montagem</button>}
                          {i.necessidade > 0 && <button className="btn btn-success btn-sm" onClick={()=>confirmarEntrega(i)}>Confirmar entrega</button>}
                          {i.necessidade <= 0 && i.demanda_futura > 0 && <button className="btn btn-secondary btn-sm" onClick={()=>savePlanning(i,'nao_enviar_estoque_suficiente',{observacao:'Estoque atual cobre a demanda futura.'})}>Confirmar não envio</button>}
                        </div>
                      ) : <span style={{fontSize:12,color:'var(--text-muted)'}}>{!i.aplicador_id ? 'Aguardando escala' : 'Somente ADM'}</span>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {transferModal && (
        <Modal title="Transferência entre aplicadores" onClose={() => setTransferModal(null)}>
          <div style={{fontSize:13,color:'var(--text-secondary)',marginBottom:14}}>
            Destino: <strong style={{color:'var(--text-primary)'}}>{transferModal.destino.aplicador_nome}</strong><br />
            Necessidade: <strong>{Number(transferModal.destino.necessidade || 0).toLocaleString('pt-BR')}</strong> doses · Vacina: {transferModal.destino.vacina_nome}
          </div>
          <div className="form-grid">
            <div className="form-group" style={{gridColumn:'1/-1'}}>
              <label className="form-label">Aplicador origem com sobra</label>
              <select className="form-select" value={transferForm.origem} onChange={e => {
                const donor = transferModal.donors.find(d => d.aplicador_id === e.target.value);
                setTransferForm({ origem: e.target.value, quantidade: String(Math.min(transferModal.destino.necessidade || 0, donor?.saldo_projetado || 0)) });
              }}>
                {transferModal.donors.map(d => (
                  <option key={d.aplicador_id} value={d.aplicador_id}>{d.aplicador_nome} · sobra {Number(d.saldo_projetado || 0).toLocaleString('pt-BR')} doses</option>
                ))}
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">Quantidade</label>
              <input className="form-input" type="number" min="1" value={transferForm.quantidade} onChange={e=>setTransferForm(f=>({...f,quantidade:e.target.value}))} />
            </div>
          </div>
          <div className="modal-actions">
            <button className="btn btn-secondary" onClick={() => setTransferModal(null)}>Cancelar</button>
            <button className="btn btn-primary" onClick={confirmarTransferencia}>Confirmar transferência</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// Modal de informações do tutor/aplicador
function TutorInfoModal({ tutor, onClose }) {
  const [estoque, setEstoque] = useState([]);
  const [tarefaInfo, setTarefaInfo] = useState(null);
  const toast = useContext(ToastContext);

  useEffect(() => {
    if (!tutor) return;
    // Buscar estoque do aplicador
    if (tutor.aplicador_id) {
      sb.from('estoque')
        .select('quantidade, vacinas(nome)')
        .eq('aplicador_id', tutor.aplicador_id)
        .eq('localizacao_tipo', 'aplicador')
        .then(({ data }) => setEstoque(data || []));
    }
    // Buscar particularidades da primeira tarefa
    const codigoTarefa = tutor.tarefas?.[0]?.codigo_tarefa || tutor.codigo_tarefa;
    if (codigoTarefa) {
      sb.from('tarefas')
        .select('codigo, cliente, particularidade, endereco, cidade_campanha, uf_campanha, doses_previstas, doses_aplicadas, vacina')
        .eq('codigo', codigoTarefa)
        .single()
        .then(({ data }) => { if (data) setTarefaInfo(data); });
    }
  }, [tutor]);

  if (!tutor) return null;

  const nomVacina = (v) => {
    const s = String(v||'').toLowerCase();
    if (!s || s === 'gripe' || s.includes('tetrav')) return 'Influenza Tetravalente';
    if (s.includes('triv') || s === 'gripe trivalente') return 'Influenza Trivalente';
    return v;
  };

  const totalEstoque = estoque.reduce((s, e) => s + Number(e.quantidade||0), 0);
  const tarefas = tutor.tarefas || [];
  const totalDoses = tutor.total_doses || tarefas.reduce((s,t) => s + Number(t._doses || t.doses_necessarias || 0), 0);
  const endereco = tutor.endereco || tarefaInfo?.endereco || '';
  const cidade = tutor.cidade || tarefaInfo?.cidade_campanha || '';
  const uf = tutor.uf || tarefaInfo?.uf_campanha || '';
  const endCompleto = [endereco, cidade && uf ? `${cidade}/${uf}` : cidade || uf].filter(Boolean).join(', ');

  return (
    <Modal title="Informações do Aplicador" onClose={onClose}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>

        {/* Identificação */}

        )}

      </div>
    </Modal>
  );
}

// ── Cadastro de Veículos ──
function VeiculosPage() {
  const [items, setItems] = useState([]);
  const [modal, setModal] = useState(null);
  const [bases, setBases] = useState([]);
  const [motoristas, setMotoristas] = useState([]);
  const toast = useContext(ToastContext);

  const load = async () => {
    const { data } = await sb.from('veiculos').select('*, bases(nome), profiles(nome)').eq('ativo', true).order('placa');
    setItems(data || []);
  };
  useEffect(() => {
    load();
    sb.from('bases').select('id, nome').eq('ativa', true).order('nome').then(r => setBases(r.data || []));
    sb.from('profiles').select('id, nome').eq('role', 'motorista').eq('ativo', true).order('nome').then(r => setMotoristas(r.data || []));
  }, []);

  const save = async (form) => {
    const payload = { placa: form.placa?.toUpperCase(), modelo: form.modelo, tipo: form.tipo, capacidade_doses: parseInt(form.capacidade_doses)||10000, base_id: form.base_id||null, motorista_padrao_id: form.motorista_padrao_id||null, observacao: form.observacao||null, ativo: true };
    let res;
    if (form.id) res = await sb.from('veiculos').update(payload).eq('id', form.id);
    else res = await sb.from('veiculos').insert(payload);
    if (res.error) { toast(res.error.message, 'error'); return; }
    toast(form.id ? 'Veículo atualizado!' : 'Veículo cadastrado!', 'success');
    setModal(null); load();
  };

  const remove = async (id) => {
    if (!confirm('Excluir veículo?')) return;
    await sb.from('veiculos').update({ ativo: false }).eq('id', id);
    toast('Veículo removido', 'success'); load();
  };

  const empty = { placa:'', modelo:'', tipo:'van', capacidade_doses:10000, base_id:'', motorista_padrao_id:'', observacao:'' };

  return (
    <div>
      <div className="page-header">
        <div><div className="page-title">Veículos</div><div className="page-subtitle">Cadastro de veículos da frota</div></div>
        <button className="btn btn-primary" onClick={() => setModal(empty)}>+ Novo Veículo</button>
      </div>
      <div className="card">
        <div className="table-wrap">
          <table><thead><tr><th>Placa</th><th>Modelo</th><th>Tipo</th><th>Capacidade</th><th>Base</th><th>Motorista Padrão</th><th>Ações</th></tr></thead>
            <tbody>
              {items.length === 0 && <tr><td colSpan={7}><div className="empty-state"><div className="empty-icon">🚗</div><div className="empty-text">Nenhum veículo cadastrado</div></div></td></tr>}
              {items.map(v => (
                <tr key={v.id}>
                  <td className="mono" style={{fontWeight:600}}>{v.placa}</td>
                  <td>{v.modelo}</td>
                  <td><span className="badge badge-blue">{v.tipo}</span></td>
                  <td className="mono">{v.capacidade_doses?.toLocaleString('pt-BR')}</td>
                  <td>{v.bases?.nome || '—'}</td>
                  <td>{v.profiles?.nome || '—'}</td>
                  <td><div style={{display:'flex',gap:4}}><button className="btn btn-secondary btn-sm" onClick={() => setModal(v)}>Editar</button><button className="btn btn-danger btn-sm" onClick={() => remove(v.id)}>Excluir</button></div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
      {modal && (
        <Modal title={modal.id ? 'Editar Veículo' : 'Novo Veículo'} onClose={() => setModal(null)}>
          <VeiculoForm initial={modal} bases={bases} motoristas={motoristas} onSave={save} onClose={() => setModal(null)} />
        </Modal>
      )}
    </div>
  );
}

function MonitoramentoAoVivo({ onClose }) {
  const [rotas, setRotas] = useState([]);
  const [loading, setLoading] = useState(true);
  const mapRef = React.useRef(null);
  const mapInstanceRef = React.useRef(null);
  const markersRef = React.useRef({});
  const timerRef = React.useRef(null);
  const toast = useContext(ToastContext);

  const loadRotas = async () => {
    const { data, error } = await sb.from('rotas')
      .select('id,codigo,status,veiculo,current_lat,current_lng,current_location_at,current_speed,profiles!rotas_motorista_id_fkey(nome),remessas(status)')
      .in('status', ['em_transito','pronta','montagem'])
      .not('current_lat', 'is', null);

    if (error) {
      toast('Erro ao carregar mapa: ' + error.message, 'error');
      return [];
    }

    setRotas(data || []);
    return data || [];
  };

  const desenhar = (rows) => {
    if (!window.L || !mapInstanceRef.current) return;
    const map = mapInstanceRef.current;
    const bounds = [];

    rows.forEach(r => {
      const lat = Number(r.current_lat);
      const lng = Number(r.current_lng);
      if (Number.isNaN(lat) || Number.isNaN(lng)) return;

      const entregues = (r.remessas || []).filter(x => x.status === 'concluida').length;
      const total = (r.remessas || []).length;
      const nome = r.profiles?.nome || r.codigo || 'Motorista';
      const hora = r.current_location_at ? new Date(r.current_location_at).toLocaleString('pt-BR') : 'Sem horário';

      const popup =
        '<div style="font-family:Arial;min-width:190px">' +
        '<b>🚚 ' + nome + '</b><br>' +
        '<b>Rota:</b> ' + (r.codigo || '—') + '<br>' +
        '<b>Status:</b> ' + (r.status || '—') + '<br>' +
        '<b>Entregas:</b> ' + entregues + '/' + total + '<br>' +
        '<b>Veículo:</b> ' + (r.veiculo || '—') + '<br>' +
        (r.current_speed != null ? '<b>Velocidade:</b> ' + r.current_speed + ' km/h<br>' : '') +
        '<small>' + hora + '</small><br>' +
        '<a target="_blank" href="https://www.google.com/maps?q=' + lat + ',' + lng + '">Abrir no Google Maps</a>' +
        '</div>';

      if (markersRef.current[r.id]) {
        markersRef.current[r.id].setLatLng([lat, lng]).setPopupContent(popup);
      } else {
        markersRef.current[r.id] = L.marker([lat, lng]).addTo(map).bindPopup(popup);
      }

      bounds.push([lat, lng]);
    });

    Object.keys(markersRef.current).forEach(id => {
      if (!rows.find(r => r.id === id)) {
        map.removeLayer(markersRef.current[id]);
        delete markersRef.current[id];
      }
    });

    if (bounds.length) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 13 });
  };

  const atualizar = async () => {
    const rows = await loadRotas();
    desenhar(rows);
  };

  useEffect(() => {
    const iniciar = async () => {
      setLoading(true);

      try {
        if (!window.L) {
          toast('Mapa não carregou. Verifique a internet.', 'error');
          setLoading(false);
          return;
        }

        if (!mapInstanceRef.current && mapRef.current) {
          const map = L.map(mapRef.current).setView([-23.5505, -46.6333], 6);
          mapInstanceRef.current = map;

          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: 'OpenStreetMap'
          }).addTo(map);

          setTimeout(() => map.invalidateSize(), 250);
        }

        await atualizar();
        timerRef.current = setInterval(atualizar, 15000);
      } catch (err) {
        toast('Erro no mapa: ' + (err.message || err), 'error');
      }

      setLoading(false);
    };

    iniciar();

    return () => {
      if (timerRef.current) clearInterval(timerRef.current);
      if (mapInstanceRef.current) {
        try { mapInstanceRef.current.remove(); } catch (_) {}
        mapInstanceRef.current = null;
      }
    };
  }, []);

  const online = rotas.filter(r => r.current_lat && r.current_lng).length;

  return (
    <Modal title="Monitoramento ao Vivo — Mapa" onClose={onClose} large>
      <div style={{display:'grid',gridTemplateColumns:'1fr auto',gap:8,alignItems:'center',marginBottom:12}}>
        <div style={{fontSize:13,color:'var(--text-muted)'}}>
          {online} rota(s) com GPS registrado pelo motorista. Atualiza a cada 15 segundos.
        </div>
        <button className="btn btn-secondary btn-sm" onClick={atualizar}>↻ Atualizar</button>
      </div>

      <div style={{height:520,border:'1px solid var(--border)',borderRadius:'var(--radius)',overflow:'hidden',position:'relative',background:'var(--bg-input)'}}>
        {loading && <div style={{position:'absolute',inset:0,zIndex:500,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(0,0,0,.08)'}}>Carregando mapa...</div>}
        <div ref={mapRef} style={{width:'100%',height:'100%'}}></div>
      </div>

      {online === 0 && !loading && (
        <div style={{marginTop:10,padding:10,borderRadius:'var(--radius-sm)',background:'var(--warning-bg)',color:'var(--warning)',fontSize:12}}>
          Nenhuma rota com GPS ainda. O GPS será atualizado quando o motorista abrir/enviar mensagem no chat.
        </div>
      )}

      <div className="modal-actions">
        <button className="btn btn-secondary" onClick={onClose}>Fechar</button>
      </div>
    </Modal>
  );
}


function ChatRotaModal({ rota, onClose }) {
  const [canalId, setCanalId] = useState(null);
  const [mensagens, setMensagens] = useState([]);
  const [texto, setTexto] = useState('');
  const [loading, setLoading] = useState(true);
  const [enviando, setEnviando] = useState(false);
  const [gps, setGps] = useState(null);
  const [meuId, setMeuId] = useState(null);
  const toast = useContext(ToastContext);
  const bottomRef = React.useRef(null);

  const pedirGps = () => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(async pos => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      setGps({ lat, lng });
      try {
        const userRes = await sb.auth.getUser();
        const uid = userRes?.data?.user?.id || null;
        const rotaMotoristaId = rota.motorista_id || null;

        if (uid && rotaMotoristaId && uid === rotaMotoristaId) {
          await sb.from('rotas').update({
            current_lat: lat,
            current_lng: lng,
            current_location_at: new Date().toISOString(),
            current_speed: pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : null
          }).eq('id', rota.id);
        }
      } catch (_) {}
    }, () => {}, { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 });
  };

  const carregar = async () => {
    setLoading(true);
