      L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', html: '<div style="background:#10b981;color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)">'+p.ordem+'</div>', iconSize:[24,24], iconAnchor:[12,12] }) }).addTo(map).bindPopup('<b>'+p.ordem+'. '+p.nome+'</b><br>'+p.ponto_partida+'<br>'+p.doses+' doses · '+p.tarefas_count+' tarefas'+(p.status_filtro ? '<br><i>Status: '+p.status_filtro+'</i>' : ''));
      bounds.push([p.lat, p.lng]); coords.push([p.lat, p.lng]);
    });
    if (base?.latitude && coords.length > 0) L.polyline([[parseFloat(base.latitude),parseFloat(base.longitude)], ...coords], { color:'#2563eb', weight:3, opacity:0.7, dashArray:'8,8' }).addTo(map);
    else if (coords.length > 1) L.polyline(coords, { color:'#2563eb', weight:3, opacity:0.7, dashArray:'8,8' }).addTo(map);
    if (bounds.length > 0) map.fitBounds(bounds, { padding:[30,30], maxZoom:12 });
    return () => { if (mapInstanceRef.current) { mapInstanceRef.current.remove(); mapInstanceRef.current = null; } };
  }, [paradas, bases, baseOrigemId]);

  return <div ref={mapRef} style={{flex:1,borderRadius:'var(--radius) var(--radius) 0 0',border:'1px solid var(--border)',borderBottom:'none',minHeight:250}} />;
}

function TransferenciaPage() {
  const [bases, setBases] = useState([]);
  const [vacinas, setVacinas] = useState([]);
  const [modo, setModo] = useState('transferencia');
  const [form, setForm] = useState({ vacina_id:'', quantidade:'', lote:'', origem_tipo:'base', origem_id:'', destino_tipo:'aplicador', destino_id:'', observacao:'', tem_danificadas:false, qtd_danificadas:'' });
  const [searchOrig, setSearchOrig] = useState('');
  const [searchDest, setSearchDest] = useState('');
  const [origResults, setOrigResults] = useState([]);
  const [destResults, setDestResults] = useState([]);
  const [saving, setSaving] = useState(false);
  const [tarefaBusca, setTarefaBusca] = useState('');
  const [tarefaResultados, setTarefaResultados] = useState([]);
  const [tarefaSel, setTarefaSel] = useState(null);
  const [historicoDescarte, setHistoricoDescarte] = useState([]);
  const [saldoDevolucao, setSaldoDevolucao] = useState(null);
  const [loadingSaldoDevolucao, setLoadingSaldoDevolucao] = useState(false);
  const toast = useContext(ToastContext);

  useEffect(() => {
    sb.from('bases').select('id, nome').eq('ativa', true).order('nome').then(r => setBases(r.data||[]));
    sb.from('vacinas').select('id, nome, lote, produto_nome').eq('ativa', true).order('nome').then(r => setVacinas(r.data||[]));
    carregarDescarte();
  }, []);

  const carregarDescarte = async () => {
    const { data } = await sb.from('movimentacoes')
      .select('*, vacinas(nome), profiles(nome), aplic_orig:aplicadores!movimentacoes_origem_aplicador_id_fkey(nome)')
      .ilike('observacao', '%DESCARTE%')
      .order('created_at', { ascending: false })
      .limit(50);
    setHistoricoDescarte(data || []);
  };

  const searchAp = async (term, setter) => {
    if (term.length < 2) { setter([]); return; }
    const { data } = await sb.from('aplicadores').select('id, nome, cpf').or(`nome.ilike.%${term}%,cpf.ilike.%${term}%`).eq('ativo', true).limit(10);
    setter(data || []);
  };

  const buscarTarefa = async (term) => {
    if (term.length < 5) { setTarefaResultados([]); return; }
    const { data } = await sb.from('tarefas').select('id, codigo, cliente, cidade_campanha, uf_campanha, doses_previstas').ilike('codigo', `%${term}%`).limit(8);
    setTarefaResultados(data || []);
  };

  const getProdutoNomeByVacinaId = (vacina_id) => {
    const v = vacinas.find(x => String(x.id) === String(vacina_id));
    return (v?.produto_nome || v?.nome || '').trim();
  };

  const buscarEstoquePorProduto = async (vacina_id, localizacao_tipo, local_id) => {
    const produto = getProdutoNomeByVacinaId(vacina_id);
    if (!produto) return [];
    const filter = localizacao_tipo === 'base' ? { base_id: local_id } : { aplicador_id: local_id };
    const { data, error } = await sb.from('estoque')
      .select('id, vacina_id, quantidade, vacinas(nome, produto_nome)')
      .eq('localizacao_tipo', localizacao_tipo)
      .match(filter);
    if (error) throw error;
    return (data || []).filter(r => String(r.vacinas?.produto_nome || r.vacinas?.nome || '').trim() === produto);
  };

  const calcularSaldoProduto = async (vacina_id, localizacao_tipo, local_id) => {
    const rows = await buscarEstoquePorProduto(vacina_id, localizacao_tipo, local_id);
    return rows.reduce((s, r) => s + Number(r.quantidade || 0), 0);
  };

  const debitarEstoque = async (vacina_id, origem_tipo, origem_id, qtd) => {
    const rows = await buscarEstoquePorProduto(vacina_id, origem_tipo, origem_id);
    if (!rows?.length) throw new Error('Origem não encontrada no estoque para este produto');
    const total = rows.reduce((s,r) => s+Number(r.quantidade||0), 0);
    if (total < qtd) throw new Error(`Saldo insuficiente do produto: ${total} disponível, ${qtd} necessário`);
    let restante = qtd;
    for (const row of rows.sort((a,b)=>Number(b.quantidade||0)-Number(a.quantidade||0))) {
      if (restante <= 0) break;
      const deb = Math.min(restante, Number(row.quantidade||0));
      await sb.from('estoque').update({ quantidade: Number(row.quantidade||0) - deb }).eq('id', row.id);
      restante -= deb;
    }
  };

  const creditarEstoque = async (vacina_id, destino_tipo, destino_id, qtd) => {
    const filter = destino_tipo === 'base' ? { base_id: destino_id } : { aplicador_id: destino_id };
    const { data: rows } = await sb.from('estoque').select('id,quantidade').eq('vacina_id', vacina_id).eq('localizacao_tipo', destino_tipo).match(filter);
    if (rows?.length) {
      await sb.from('estoque').update({ quantidade: rows[0].quantidade + qtd }).eq('id', rows[0].id);
    } else {
      const row = { vacina_id, localizacao_tipo: destino_tipo, quantidade: qtd };
      if (destino_tipo === 'base') row.base_id = destino_id; else row.aplicador_id = destino_id;
      await sb.from('estoque').insert(row);
    }
  };

  const loteObs = () => form.lote?.trim() ? `Lote manual: ${form.lote.trim()} | ` : '';

  const executarTransferencia = async () => {
    if (!form.vacina_id || !form.quantidade || !form.lote?.trim() || !form.origem_id || !form.destino_id) { toast('Preencha vacina, lote, quantidade, origem e destino', 'error'); return; }
    setSaving(true);
    const qtd = parseInt(form.quantidade);
    const userId = (await sb.auth.getUser()).data.user.id;
    try {
      const { error } = await sb.rpc('transferir_estoque', { p_vacina_id: form.vacina_id, p_quantidade: qtd, p_origem_tipo: form.origem_tipo, p_origem_id: form.origem_id, p_destino_tipo: form.destino_tipo, p_destino_id: form.destino_id, p_observacao: (loteObs() + (form.observacao||'')).trim() || null });
      if (error) {
        await debitarEstoque(form.vacina_id, form.origem_tipo, form.origem_id, qtd);
        await creditarEstoque(form.vacina_id, form.destino_tipo, form.destino_id, qtd);
        await sb.from('movimentacoes').insert({ tipo: 'transferencia', vacina_id: form.vacina_id, quantidade: qtd, origem_tipo: form.origem_tipo, origem_base_id: form.origem_tipo==='base'?form.origem_id:null, origem_aplicador_id: form.origem_tipo==='aplicador'?form.origem_id:null, destino_tipo: form.destino_tipo, destino_base_id: form.destino_tipo==='base'?form.destino_id:null, destino_aplicador_id: form.destino_tipo==='aplicador'?form.destino_id:null, observacao: (loteObs() + (form.observacao||'')).trim() || null, criado_por: userId });
      }
      toast('Transferência realizada! ✓', 'success');
      setForm(f=>({...f, quantidade:'', lote:'', observacao:''}));
    } catch(err) { toast(err.message, 'error'); }
    setSaving(false);
  };

  const executarEntregaDoses = async () => {
    if (!form.vacina_id || !form.quantidade || !form.lote?.trim() || !form.origem_id || !tarefaSel) { toast('Preencha vacina, lote, quantidade, origem e selecione a tarefa', 'error'); return; }
    setSaving(true);
    const qtd = parseInt(form.quantidade);
    const userId = (await sb.auth.getUser()).data.user.id;
    try {
      await debitarEstoque(form.vacina_id, form.origem_tipo, form.origem_id, qtd);
      await sb.from('movimentacoes').insert({ tipo: 'ajuste', vacina_id: form.vacina_id, quantidade: qtd, origem_tipo: form.origem_tipo, origem_base_id: form.origem_tipo==='base'?form.origem_id:null, origem_aplicador_id: form.origem_tipo==='aplicador'?form.origem_id:null, destino_tipo: form.origem_tipo, destino_base_id: form.origem_tipo==='base'?form.origem_id:null, destino_aplicador_id: form.origem_tipo==='aplicador'?form.origem_id:null, observacao: `Entrega de Doses p/ Tarefa: ${tarefaSel.codigo} | Cliente: ${tarefaSel.cliente} | Lote manual: ${form.lote.trim()} | ${qtd} doses | ${form.observacao||''}`, criado_por: userId });
      toast(`Entrega de ${qtd} doses registrada para ${tarefaSel.codigo} ✓`, 'success');
      setForm(f=>({...f, quantidade:'', lote:'', observacao:''}));
      setTarefaSel(null); setTarefaBusca('');
    } catch(err) { toast(err.message, 'error'); }
    setSaving(false);
  };

  useEffect(() => {
    const loadSaldo = async () => {
      if (modo !== 'devolucao' || !form.vacina_id || !form.origem_id) { setSaldoDevolucao(null); return; }
      setLoadingSaldoDevolucao(true);
      try {
        const saldo = await calcularSaldoProduto(form.vacina_id, 'aplicador', form.origem_id);
        setSaldoDevolucao(saldo);
      } catch (_) {
        setSaldoDevolucao(null);
      } finally {
        setLoadingSaldoDevolucao(false);
      }
    };
    loadSaldo();
  }, [modo, form.vacina_id, form.origem_id, vacinas]);

  const executarDevolucao = async () => {
    if (!form.vacina_id || !form.quantidade || !form.lote?.trim() || !form.origem_id || !form.destino_id) { toast('Preencha vacina, lote, quantidade, aplicador e base destino', 'error'); return; }
    const qtdTotal = parseInt(form.quantidade);
    const qtdDanif = form.tem_danificadas ? parseInt(form.qtd_danificadas||0) : 0;
    const qtdBoa = qtdTotal - qtdDanif;
    if (qtdDanif >= qtdTotal) { toast('Doses danificadas não pode ser maior ou igual ao total', 'error'); return; }
    setSaving(true);
    const userId = (await sb.auth.getUser()).data.user.id;
    try {
      const saldoAtual = await calcularSaldoProduto(form.vacina_id, 'aplicador', form.origem_id);
      if (saldoAtual < qtdTotal) throw new Error(`Saldo insuficiente do aplicador para este produto: ${saldoAtual} disponível, ${qtdTotal} necessário`);
      await debitarEstoque(form.vacina_id, 'aplicador', form.origem_id, qtdTotal);
      if (qtdBoa > 0) {
        await creditarEstoque(form.vacina_id, 'base', form.destino_id, qtdBoa);
        await sb.from('movimentacoes').insert({ tipo: 'devolucao', vacina_id: form.vacina_id, quantidade: qtdBoa, origem_tipo: 'aplicador', origem_aplicador_id: form.origem_id, destino_tipo: 'base', destino_base_id: form.destino_id, observacao: `Devolução: ${qtdBoa} boas + ${qtdDanif} danificadas = ${qtdTotal} total | Lote manual: ${form.lote.trim()} | ${form.observacao||''}`, criado_por: userId });
      }
      if (qtdDanif > 0) {
        await sb.from('movimentacoes').insert({ tipo: 'ajuste', vacina_id: form.vacina_id, quantidade: qtdDanif, origem_tipo: 'aplicador', origem_aplicador_id: form.origem_id, destino_tipo: 'base', destino_base_id: form.destino_id, observacao: `DESCARTE: ${qtdDanif} doses danificadas de ${qtdTotal} devolvidas | Lote manual: ${form.lote.trim()} | ${form.observacao||''}`, criado_por: userId });
      }
      toast(`Devolução: ${qtdBoa} para estoque${qtdDanif>0?` + ${qtdDanif} descartadas`:''} ✓`, 'success');
      setForm(f=>({...f, quantidade:'', lote:'', observacao:'', tem_danificadas:false, qtd_danificadas:''}));
      setSearchOrig('');
      carregarDescarte();
    } catch(err) { toast(err.message, 'error'); }
    setSaving(false);
  };

  const MODOS = [
    { id:'transferencia', label:'↔ Transferência', desc:'Mover doses entre bases e aplicadores' },
    { id:'entrega_doses', label:'📦 Entrega de Doses', desc:'Doses saem do estoque para uma tarefa de cliente' },
    { id:'devolucao', label:'↩ Devolução', desc:'Receber doses de volta de um aplicador' },
  ];

  return (
    <div>
      <div className="page-header"><div><div className="page-title">Transferência de Estoque</div><div className="page-subtitle">Movimentações manuais de doses</div></div></div>

      <div style={{display:'flex',gap:10,marginBottom:16,flexWrap:'wrap'}}>
        {MODOS.map(m => (
          <div key={m.id} onClick={() => setModo(m.id)} style={{flex:1,minWidth:180,padding:'12px 16px',borderRadius:'var(--radius-sm)',border:`2px solid ${modo===m.id?'var(--accent)':'var(--border)'}`,background:modo===m.id?'var(--accent-subtle)':'var(--bg-card)',cursor:'pointer'}}>
            <div style={{fontWeight:600,fontSize:14,color:modo===m.id?'var(--accent)':'var(--text-primary)'}}>{m.label}</div>
            <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>{m.desc}</div>
          </div>
        ))}
      </div>

      {modo==='transferencia' && (
        <div className="card">

// GESTÃO DE USUÁRIOS
// ═══════════════════════════════════════════════
function UsuariosPage() {
  const [usuarios, setUsuarios] = useState([]);
  const [bases, setBases] = useState([]);
  const [modal, setModal] = useState(null); // null | 'novo' | {user}
  const [loading, setLoading] = useState(true);
  const toast = useContext(ToastContext);

  const ROLE_COLORS = { admin:'badge-red', planejador:'badge-blue', montador:'badge-yellow', motorista:'badge-green', aplicador:'badge-cyan' };

  const load = async () => {
    setLoading(true);
    const { data, error } = await sb.from('profiles')
      .select('*, bases(nome)')
      .order('nome');
    if (error) toast(error.message, 'error');
    else setUsuarios(data || []);
    setLoading(false);
  };

  useEffect(() => {
    load();
    sb.from('bases').select('id, nome').eq('ativa', true).order('nome').then(r => setBases(r.data||[]));
  }, []);

  const updatePerfil = async (form) => {
    const { error } = await sb.from('profiles').update({
      nome: form.nome,
      role: form.role,
      base_id: form.base_id || null,
      ativo: form.ativo,
    }).eq('id', form.id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Usuário atualizado!', 'success');
    setModal(null); load();
  };

  const toggleAtivo = async (user) => {
    const { error } = await sb.from('profiles').update({ ativo: !user.ativo }).eq('id', user.id);
    if (error) toast(error.message, 'error');
    else { toast(user.ativo ? 'Usuário desativado' : 'Usuário ativado', 'success'); load(); }
  };

  const criarUsuario = async (form) => {
    // Criar via Auth Admin API não é possível no frontend sem service_role key
    // Instrução: usuário cria a conta, admin promove o perfil
    // Alternativa: usar signUp do lado do cliente
    const { data, error } = await sb.auth.admin ? 
      sb.auth.admin.createUser({ email: form.email, password: form.senha, email_confirm: true }) :
      sb.auth.signUp({ email: form.email, password: form.senha, options: { data: { nome: form.nome } } });
    
    if (error) { toast(error.message, 'error'); return; }
    
    // Aguardar o trigger criar o profile e depois atualizar
    setTimeout(async () => {
      const { data: profile } = await sb.from('profiles').select('id').eq('email', form.email).single();
      if (profile) {
        await sb.from('profiles').update({ nome: form.nome, role: form.role, base_id: form.base_id || null }).eq('id', profile.id);
      }
      toast(`Usuário ${form.email} criado! Ele deve confirmar o e-mail se necessário.`, 'success');
      setModal(null); load();
    }, 1500);
  };

  return (
    <div>
      <div className="page-header">
        <div><div className="page-title">Usuários</div><div className="page-subtitle">{usuarios.length} usuários cadastrados</div></div>
        <button className="btn btn-primary" onClick={() => setModal('novo')}>+ Novo Usuário</button>
      </div>

      <div style={{padding:12,background:'var(--warning-bg)',border:'1px solid rgba(245,158,11,0.3)',borderRadius:'var(--radius-sm)',marginBottom:16,fontSize:13,color:'var(--warning)'}}>
        💡 Para criar usuários, o novo membro deve acessar o sistema e se cadastrar, ou use o painel do Supabase (Authentication → Users → Add User). Aqui você gerencia perfis e permissões.
      </div>

      <div className="card">
        <div className="table-wrap">
          <table>
            <thead>
              <tr><th>Nome</th><th>Email</th><th>Perfil</th><th>Base</th><th>Status</th><th>Ações</th></tr>
            </thead>
            <tbody>
              {usuarios.length === 0 && !loading && (
                <tr><td colSpan={6}><div className="empty-state"><div className="empty-icon">👥</div><div className="empty-text">Nenhum usuário encontrado</div></div></td></tr>
              )}
              {usuarios.map(u => (
                <tr key={u.id}>
                  <td style={{fontWeight:500,color:'var(--text-primary)'}}>{u.nome}</td>
                  <td style={{fontSize:12,color:'var(--text-secondary)'}}>{u.email}</td>
                  <td><span className={`badge ${ROLE_COLORS[u.role]||'badge-gray'}`}>{ROLE_LABELS[u.role]||u.role}</span></td>
                  <td>{u.bases?.nome || '—'}</td>
                  <td>
                    <span className={`badge ${u.ativo ? 'badge-green' : 'badge-red'}`}>
                      {u.ativo ? 'Ativo' : 'Inativo'}
                    </span>
                  </td>
                  <td>
                    <div style={{display:'flex',gap:4}}>
                      <button className="btn btn-secondary btn-sm" onClick={() => setModal(u)}>Editar</button>
                      <button className={`btn btn-sm ${u.ativo ? 'btn-danger' : 'btn-success'}`} onClick={() => toggleAtivo(u)}>
                        {u.ativo ? 'Desativar' : 'Ativar'}
                      </button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {modal === 'novo' && (
        <NovoUsuarioModal bases={bases} onClose={() => setModal(null)} onSave={criarUsuario} />
      )}
      {modal && modal !== 'novo' && (
        <EditarUsuarioModal user={modal} bases={bases} onClose={() => setModal(null)} onSave={updatePerfil} />
      )}
    </div>
  );
}

function NovoUsuarioModal({ bases, onClose, onSave }) {
  const [form, setForm] = useState({ nome:'', email:'', senha:'', role:'aplicador', base_id:'' });
  const [saving, setSaving] = useState(false);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const save = async () => {
    if (!form.email || !form.senha || !form.nome) { return; }
    setSaving(true);
    await onSave(form);
    setSaving(false);
  };

  return (
    <Modal title="Novo Usuário" onClose={onClose}>
      <div className="form-grid">
        <div className="form-group"><label className="form-label">Nome *</label>
          <input className="form-input" value={form.nome} onChange={e=>set('nome',e.target.value)} placeholder="Nome completo" /></div>
        <div className="form-group"><label className="form-label">Email *</label>
          <input className="form-input" type="email" value={form.email} onChange={e=>set('email',e.target.value)} placeholder="email@empresa.com" /></div>
        <div className="form-group"><label className="form-label">Senha provisória *</label>
          <input className="form-input" type="password" value={form.senha} onChange={e=>set('senha',e.target.value)} placeholder="Mínimo 6 caracteres" /></div>
        <div className="form-group"><label className="form-label">Perfil</label>
          <select className="form-select" value={form.role} onChange={e=>set('role',e.target.value)}>
            {Object.entries(ROLE_LABELS).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
          </select></div>
        <div className="form-group"><label className="form-label">Base vinculada</label>
          <select className="form-select" value={form.base_id} onChange={e=>set('base_id',e.target.value)}>
            <option value="">Nenhuma</option>{bases.map(b=><option key={b.id} value={b.id}>{b.nome}</option>)}
          </select></div>
      </div>
      <div style={{marginTop:12,padding:10,background:'var(--info-bg)',borderRadius:'var(--radius-sm)',fontSize:12,color:'var(--info)'}}>
        ℹ O usuário receberá um e-mail de confirmação. Após confirmar, o acesso será liberado com o perfil selecionado.
      </div>
      <div className="modal-actions">
        <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" onClick={save} disabled={saving||!form.email||!form.senha||!form.nome}>
          {saving ? 'Criando...' : 'Criar Usuário'}
        </button>
      </div>
    </Modal>
  );
}

function EditarUsuarioModal({ user, bases, onClose, onSave }) {
  const [form, setForm] = useState({ ...user, base_id: user.base_id||'' });
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  return (
    <Modal title="Editar Usuário" onClose={onClose}>
      <div style={{marginBottom:12,padding:10,background:'var(--bg-input)',borderRadius:'var(--radius-sm)',fontSize:12,color:'var(--text-muted)'}}>
        <strong style={{color:'var(--text-secondary)'}}>ID:</strong> {user.id}<br/>
        <strong style={{color:'var(--text-secondary)'}}>Email:</strong> {user.email}
      </div>
      <div className="form-grid">
        <div className="form-group"><label className="form-label">Nome</label>
          <input className="form-input" value={form.nome} onChange={e=>set('nome',e.target.value)} /></div>
        <div className="form-group"><label className="form-label">Perfil</label>
          <select className="form-select" value={form.role} onChange={e=>set('role',e.target.value)}>
            {Object.entries(ROLE_LABELS).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
          </select></div>
        <div className="form-group"><label className="form-label">Base vinculada</label>
          <select className="form-select" value={form.base_id||''} onChange={e=>set('base_id',e.target.value||null)}>
            <option value="">Nenhuma</option>{bases.map(b=><option key={b.id} value={b.id}>{b.nome}</option>)}
          </select></div>
        <div className="form-group"><label className="form-label">Status</label>
          <select className="form-select" value={form.ativo?'1':'0'} onChange={e=>set('ativo',e.target.value==='1')}>
            <option value="1">Ativo</option><option value="0">Inativo</option>
          </select></div>
      </div>
      <div className="modal-actions">
        <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" onClick={() => onSave(form)}>Salvar</button>
      </div>
    </Modal>
  );
}

// ═══════════════════════════════════════════════
// MÓDULO MONTADOR — FILA DE MONTAGEM + ETIQUETAS
// ═══════════════════════════════════════════════
function MontagemPage() {
  const [rotas, setRotas] = useState([]);
  const [rotaSel, setRotaSel] = useState(null);
  const [remessas, setRemessas] = useState([]);
  const [vacinas, setVacinas] = useState([]);
  const [loadingRemessas, setLoadingRemessas] = useState(false);
  const [etiquetaRem, setEtiquetaRem] = useState(null);
  const [infoTutor, setInfoTutor] = useState(null);
  const toast = useContext(ToastContext);

  const REM_STATUS = {
    planejada:'Planejada', montagem:'Montagem', pronta:'Pronta',
    carregada:'Carregada', em_transito:'Em Trânsito', concluida:'Concluída', cancelada:'Cancelada'
  };
  const REM_BADGE = {
    planejada:'badge-gray', montagem:'badge-yellow', pronta:'badge-green',
    carregada:'badge-cyan', em_transito:'badge-blue', concluida:'badge-gray', cancelada:'badge-red'
  };

  useEffect(() => {
    sb.from('rotas')
      .select('id, codigo, data_prevista, status, tipo, bases!rotas_base_origem_id_fkey(nome), profiles!rotas_motorista_id_fkey(nome), veiculo')
      .in('status', ['montagem','planejada'])
      .order('data_prevista')
      .then(r => setRotas(r.data||[]));
    sb.from('vacinas').select('id, nome, lote').eq('ativa', true).then(r => setVacinas(r.data||[]));
  }, []);

  const selecionarRota = async (rota) => {
    setRotaSel(rota);
    setLoadingRemessas(true);
    const { data } = await sb.from('remessas')
      .select('*, remessa_itens(*, vacinas(nome, lote)), bases(nome, cidade, uf), aplicadores(nome, cpf, cidade, uf, endereco)')
      .eq('rota_id', rota.id)
      .order('ordem_entrega');
    setRemessas(data || []);
    setLoadingRemessas(false);
  };

  const addItem = async (remessaId, vacinaId, quantidade, lote) => {
    if (!vacinaId || quantidade === undefined || quantidade === null || quantidade < 0) return;
    const qtd = parseInt(quantidade);
    // Tentar com coluna lote primeiro, cair para sem lote se coluna não existir
    let error;
    if (lote) {
      const res = await sb.from('remessa_itens').insert({
        remessa_id: remessaId, vacina_id: vacinaId, quantidade: qtd, lote
      });
      error = res.error;
      if (error && error.message && error.message.includes("lote")) {
        // Coluna lote não existe no banco ainda - inserir sem lote
        const res2 = await sb.from('remessa_itens').insert({
          remessa_id: remessaId, vacina_id: vacinaId, quantidade: qtd
        });
        error = res2.error;
        if (!res2.error) toast('Item adicionado (lote salvo localmente — rode migration para persistir)', 'success');
      }
    } else {
      const res = await sb.from('remessa_itens').insert({
        remessa_id: remessaId, vacina_id: vacinaId, quantidade: qtd
      });
      error = res.error;
    }
    if (error) { toast(error.message, 'error'); return; }
    if (!error) toast('Item adicionado!', 'success');
    selecionarRota(rotaSel);
  };

  const removeItem = async (itemId) => {
    const { error } = await sb.from('remessa_itens').delete().eq('id', itemId);
    if (error) toast(error.message, 'error');
    else selecionarRota(rotaSel);
  };

  const marcarPronta = async (rem) => {
    if ((rem.remessa_itens || []).length === 0) {
      toast('Adicione pelo menos um item antes de marcar como pronta', 'error');
      return;
    }
    const { error } = await sb.from('remessas').update({ status: 'pronta' }).eq('id', rem.id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Remessa pronta para envio!', 'success');
    selecionarRota(rotaSel);
  };

  const marcarMontagem = async (remId) => {
    const { error } = await sb.from('remessas').update({ status: 'montagem' }).eq('id', remId);
    if (error) toast(error.message, 'error');
    else selecionarRota(rotaSel);
  };

  const liberarRota = async () => {
    const todasProntas = remessas.every(r => ['pronta','concluida','cancelada'].includes(r.status));
    if (!todasProntas) { toast('Todas as remessas precisam estar prontas antes de liberar a rota', 'error'); return; }
    const { error } = await sb.from('rotas').update({ status: 'pronta' }).eq('id', rotaSel.id);
    if (error) toast(error.message, 'error');
    else {
      toast('Rota liberada para o motorista!', 'success');
      setRotaSel(null); setRemessas([]);
      sb.from('rotas').select('id, codigo, data_prevista, status, tipo, bases!rotas_base_origem_id_fkey(nome), profiles!rotas_motorista_id_fkey(nome), veiculo').in('status', ['montagem','planejada']).order('data_prevista').then(r => setRotas(r.data||[]));
    }
  };


  // Imprimir Recibo / Termo de Entrega e Responsabilidade
  const imprimirRecibo = (rem) => {
    const destNome = rem.destino_tipo==='base' ? rem.bases?.nome : rem.aplicadores?.nome;
    const destCPF = rem.destino_tipo==='aplicador' ? rem.aplicadores?.cpf : null;
    const destCidade = rem.destino_tipo==='base'
      ? (rem.bases?.cidade||'')+'/'+(rem.bases?.uf||'')
      : (rem.aplicadores?.cidade||'')+'/'+(rem.aplicadores?.uf||'');

    let nomeExibir = destNome;
    let cpfExibir = destCPF;
    if (!nomeExibir) {
      const obs = rem.observacao || '';
      const mNome = obs.match(/^([^(|]+)/);
      const mCPF = obs.match(/\(([^)]+)\)/);
      if (mNome) nomeExibir = mNome[1].trim();
      if (mCPF) cpfExibir = mCPF[1].trim();
    }

    const totalDoses = (rem.remessa_itens||[]).reduce((s,i)=>s+i.quantidade,0);
    const dataHoje = new Date().toLocaleDateString('pt-BR');
    const horaAgora = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

    const itensHtml = (rem.remessa_itens||[]).map(it =>
      '<tr><td style="border:1px solid #000;padding:4px 8px;font-size:11px;">' + (it.vacinas?.nome||'—') + '</td>'
      + '<td style="border:1px solid #000;padding:4px 8px;font-size:11px;text-align:center;">' + (it.lote || it.vacinas?.lote || '—') + '</td>'
      + '<td style="border:1px solid #000;padding:4px 8px;font-size:11px;text-align:center;font-weight:700;">' + it.quantidade + '</td></tr>'
    ).join('');

    const reciboHtml = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Recibo ' + rem.codigo_rastreio + '</title>'
      + '<style>'
      + '* { margin:0; padding:0; box-sizing:border-box; }'
      + 'body { font-family:Arial,sans-serif; padding:12mm 15mm; background:#fff; color:#000; font-size:11px; line-height:1.5; }'
      + '@page { size:A4; margin:10mm; }'
      + '@media print { body { padding:0; } }'
      + 'h1 { font-size:14px; text-align:center; margin-bottom:8px; text-transform:uppercase; letter-spacing:1px; }'
      + '.empresa { text-align:center; font-size:10px; color:#444; margin-bottom:12px; }'
      + '.intro { font-size:10px; text-align:justify; margin-bottom:12px; line-height:1.6; }'
      + '.section { margin-bottom:10px; }'
      + '.section-title { font-weight:700; font-size:11px; text-transform:uppercase; border-bottom:1px solid #000; padding-bottom:2px; margin-bottom:6px; }'
      + 'table { width:100%; border-collapse:collapse; margin-bottom:8px; }'
      + 'th { border:1px solid #000; padding:4px 8px; font-size:10px; background:#f0f0f0; text-align:center; }'
      + '.field { margin-bottom:4px; font-size:11px; }'
      + '.field b { font-weight:700; }'
      + '.line { border-bottom:1px solid #000; display:inline-block; min-width:200px; }'
      + '.sig-area { margin-top:30px; text-align:center; }'
      + '.sig-line { border-top:1px solid #000; width:300px; margin:0 auto; padding-top:4px; font-size:10px; }'
      + '.footer-info { display:flex; justify-content:space-between; margin-top:16px; font-size:10px; border-top:1px solid #ccc; padding-top:6px; }'
      + '.checkbox { display:inline-block; width:12px; height:12px; border:1px solid #000; margin-right:4px; vertical-align:middle; }'
      + '</style></head><body>'
      + '<h1>Termo de Entrega e Responsabilidade</h1>'
      + '<div class="empresa">S&A IMUNIZAÇÕES LTDA</div>'
      + '<div class="intro">Pelo presente instrumento, eu, abaixo identificado, declaro ter recebido da S&A IMUNIZAÇÕES LTDA os materiais e imunobiológicos listados, assumindo total responsabilidade pela sua guarda, conservação térmica e uso exclusivo na campanha designada.</div>'

      + '<div class="section">'
      + '<div class="section-title">Dados de Recebimento</div>'
      + '<div class="field"><b>APLICADOR:</b> ' + (nomeExibir||'_____________________________') + '&nbsp;&nbsp;&nbsp;&nbsp;<b>CPF:</b> ' + (cpfExibir||'___________________') + '</div>'
      + '<div class="field"><b>TIPO:</b> <span class="checkbox"></span> ENTREGA &nbsp;&nbsp; <span class="checkbox"></span> DEVOLUÇÃO</div>'
      + '</div>'

      + '<div class="section">'
      + '<div class="section-title">Detalhamento da Carga</div>'
      + '<table><thead><tr><th>Vacina/Doses</th><th>Lote</th><th>Qtd. Doses</th></tr></thead>'
      + '<tbody>' + itensHtml
      + (itensHtml ? '' : '<tr><td style="border:1px solid #000;padding:4px 8px;" colspan="3">—</td></tr>')
      + '</tbody></table>'
      + '<div class="field"><b>Caixa de Insumos:</b> _____ (Qtd. Cx) &nbsp;&nbsp; <b>Coletor Perfuro:</b> _____ (Qtd.) &nbsp;&nbsp; <b>Kit Infantil:</b> <span class="checkbox"></span> Sim <span class="checkbox"></span> Não</div>'
      + '<div class="field"><b>Gelox Reserva:</b> _____ (Qtd.) &nbsp;&nbsp; <b>Termômetro Digital:</b> <span class="checkbox"></span> Sim <span class="checkbox"></span> Não</div>'
      + '<div class="field"><b>Outros:</b> _______________________________________________________________________________________</div>'
      + '<div class="field"><b>Equipamento:</b> ___________________________________________________________________________________</div>'
      + '<div class="field"><b>Nº de Série:</b> ____________________________________________________________________________________</div>'
      + '<div class="field"><b>Estado:</b> <span class="checkbox"></span> Perfeito Estado &nbsp;&nbsp; <span class="checkbox"></span> Com Avaria — Descrever: ________________________________</div>'
      + '</div>'

      + '<div class="section">'
      + '<div class="section-title">Declaração</div>'
      + '<div class="intro">Responsabilizo-me por qualquer dano, perda ou desvio de temperatura por negligência. Comprometo-me a realizar a leitura constante do termômetro e manter a integridade dos frascos.</div>'
      + '</div>'

      + '<div class="footer-info">'
      + '<span>São Paulo, ' + dataHoje + ' &nbsp; Hora: ' + horaAgora + '</span>'
      + '<span>MOTORISTA: ' + (rotaSel.profiles?.nome || '___________________________') + '</span>'
      + '</div>'

      + '<div class="sig-area">'
      + '<div class="sig-line">Assinatura do Profissional Responsável</div>'
      + '</div>'

      + '<div style="margin-top:20px;padding-top:8px;border-top:1px dashed #999;font-size:9px;color:#666;text-align:center;">'
      + 'VacinaLog · Remessa: ' + rem.codigo_rastreio + ' · Rota: ' + rotaSel.codigo + ' · Gerado em ' + dataHoje + ' ' + horaAgora
      + '</div>'

      + '</body></html>';

    const w = window.open('', '_blank', 'width=700,height=900');
    w.document.write(reciboHtml);
    w.document.close();
    w.focus();
    setTimeout(() => w.print(), 600);
  };

  const prontas = remessas.filter(r => r.status === 'pronta').length;
  const total = remessas.length;

  if (!rotaSel) {
    return (
      <div>
        <div className="page-header">
          <div><div className="page-title">Fila de Montagem</div><div className="page-subtitle">Rotas aguardando montagem de caixas</div></div>
        </div>
        {rotas.length === 0 && (
          <div className="card"><div className="empty-state"><div className="empty-icon">📦</div><div className="empty-text">Nenhuma rota em montagem no momento</div></div></div>
        )}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(320px,1fr))',gap:14}}>
          {rotas.map(r => (
            <div key={r.id} className="card" style={{cursor:'pointer',transition:'border-color 0.15s'}}
              onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent)'}
              onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}
              onClick={() => selecionarRota(r)}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                <div style={{fontSize:18,fontWeight:700,color:'var(--accent)',fontFamily:'JetBrains Mono'}}>{r.codigo}</div>
                <span className={`badge ${r.status==='montagem'?'badge-yellow':'badge-blue'}`}>{r.status==='montagem'?'Em Montagem':'Planejada'}</span>
              </div>
              <div style={{fontSize:13,color:'var(--text-secondary)',display:'flex',flexDirection:'column',gap:4}}>
                <div>📅 {r.data_prevista ? new Date(r.data_prevista+'T12:00:00').toLocaleDateString('pt-BR') : '—'}</div>
                <div>🏢 {r.bases?.nome || '—'}</div>
                <div>👤 {r.profiles?.nome || 'Motorista não atribuído'}</div>
                <div>🚚 {r.veiculo || '—'}</div>
              </div>
              <div style={{marginTop:12}}>
                <button className="btn btn-primary" style={{width:'100%'}}>Abrir para Montagem →</button>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="page-header">
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <button className="btn btn-secondary btn-sm" onClick={() => { setRotaSel(null); setRemessas([]); }}>← Voltar</button>
          <div>
            <div className="page-title">Montagem — {rotaSel.codigo}</div>
            <div className="page-subtitle">{rotaSel.bases?.nome} · {rotaSel.profiles?.nome||'—'} · {rotaSel.veiculo||'—'}</div>
          </div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <span style={{fontSize:13,color:prontas===total&&total>0?'var(--success)':'var(--text-muted)'}}>
            {prontas}/{total} prontas
          </span>
          <button className="btn btn-success" onClick={liberarRota} disabled={prontas<total||total===0}>
            ✓ Liberar Rota para Motorista
          </button>
        </div>
      </div>

      {/* Barra de progresso */}
      <div style={{marginBottom:16}}>
        <div className="progress-bar" style={{height:8}}>
          <div className="progress-fill" style={{width: total>0 ? (prontas/total*100)+'%' : '0%', background: prontas===total&&total>0 ? 'var(--success)' : 'var(--accent)'}} />
        </div>
        <div style={{fontSize:11,color:'var(--text-muted)',marginTop:4}}>{prontas} de {total} remessas prontas</div>
      </div>

      {loadingRemessas && <div style={{textAlign:'center',padding:40,color:'var(--text-muted)'}}>Carregando remessas...</div>}

      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        {remessas.map((rem, idx) => {
          const destNome = rem.destino_tipo==='base' ? rem.bases?.nome : rem.aplicadores?.nome;
          const destCidade = rem.destino_tipo==='base' ? (rem.bases?.cidade+'/'+rem.bases?.uf) : (rem.aplicadores?.cidade+'/'+rem.aplicadores?.uf);
          const destCPF = rem.destino_tipo==='aplicador' ? rem.aplicadores?.cpf : null;
          const destEnd = rem.destino_tipo==='aplicador' ? rem.aplicadores?.endereco : null;
          const totalDoses = (rem.remessa_itens||[]).reduce((s,i)=>s+i.quantidade,0);
          const isPronta = rem.status==='pronta';

          // Extrair doses sugeridas da observação (formato: "Nome | 20 doses | ...")
          const dosesMatch = (rem.observacao||'').match(/(\d+)\s*doses/);
          const dosesSugeridas = dosesMatch ? parseInt(dosesMatch[1]) : 0;

          return (
            <div key={rem.id} className="card" style={{borderColor: isPronta ? 'rgba(16,185,129,0.4)' : 'var(--border)'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12,flexWrap:'wrap',gap:8}}>
                <div style={{display:'flex',gap:12,alignItems:'center'}}>
                  <div style={{width:32,height:32,borderRadius:'50%',background:'var(--accent)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:14,flexShrink:0}}>{rem.ordem_entrega}</div>
                  <div>
                    <div style={{fontFamily:'JetBrains Mono',fontSize:13,fontWeight:600,color:'var(--accent)'}}>{rem.codigo_rastreio}</div>
                    <div style={{fontSize:13,fontWeight:500,color:'var(--text-primary)'}}>{destNome}</div>
                    <div style={{fontSize:12,color:'var(--text-muted)'}}>{destCidade}{destCPF && ` · CPF: ${destCPF}`}</div>
                    {destEnd && <div style={{fontSize:11,color:'var(--text-muted)'}}>{destEnd}</div>}
                  </div>
                </div>
                <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
                  <span className={`badge ${REM_BADGE[rem.status]||'badge-gray'}`}>{REM_STATUS[rem.status]||rem.status}</span>
                  <span className="badge badge-cyan">{totalDoses} doses</span>
                  {/* Badge de vacina da remessa */}
                  {(rem.remessa_itens||[]).length > 0 && [...new Set((rem.remessa_itens||[]).map(it => it.vacinas?.nome).filter(Boolean))].map(v => (
                    <span key={v} style={{fontSize:11,fontWeight:600,padding:'2px 8px',borderRadius:4,
                      background:v.toLowerCase().includes('tetrav')?'rgba(37,99,235,0.2)':'rgba(16,185,129,0.2)',
                      color:v.toLowerCase().includes('tetrav')?'var(--accent)':'var(--success)'}}>
                      💉{v.replace('Influenza ','').replace('Influenza','')}
                    </span>
                  ))}
                  {/* Botão info */}
                  <button onClick={() => {
                    // Montar objeto tutor a partir da remessa
                    const obs = rem.observacao || '';
                    const mNome = obs.match(/^([^(|]+)/);
                    const mCPF = obs.match(/\(([^)]+)\)/);
                    const mTarefas = obs.match(/\| (.+)$/);
                    setInfoTutor({
                      nome: destNome || (mNome ? mNome[1].trim() : '—'),
                      cpf: destCPF || (mCPF ? mCPF[1].trim() : '—'),
                      endereco: destEnd || '',
                      cidade: destCidade,
                      aplicador_id: rem.destino_aplicador_id,
                      total_doses: totalDoses || dosesSugeridas,
                      tarefas: (mTarefas ? mTarefas[1].split(',').map(c => ({ codigo_tarefa: c.trim(), _doses: 0 })) : []),
                    });
                  }} style={{background:'none',border:'1px solid var(--border)',borderRadius:'50%',width:22,height:22,cursor:'pointer',fontSize:12,color:'var(--text-muted)',display:'flex',alignItems:'center',justifyContent:'center',padding:0}}
                  title="Ver informações">ⓘ</button>
                  <button className="btn btn-secondary btn-sm" onClick={() => setEtiquetaRem(rem)}>🏷️ Etiqueta</button>
                  <button className="btn btn-secondary btn-sm" onClick={() => imprimirRecibo(rem)}>📋 Recibo</button>
                  {!isPronta && <button className="btn btn-success btn-sm" onClick={() => marcarPronta(rem)}>✓ Marcar Pronta</button>}
                  {isPronta && <button className="btn btn-secondary btn-sm" onClick={() => marcarMontagem(rem.id)}>↩ Reabrir</button>}
                </div>
              </div>

              {/* Observação (tem info da tarefa) */}
              {rem.observacao && (
                <div style={{fontSize:11,color:'var(--text-muted)',background:'var(--bg-input)',padding:'6px 10px',borderRadius:'var(--radius-sm)',marginBottom:10,borderLeft:'3px solid var(--border)'}}>
                  {rem.observacao}
                </div>
              )}

              {/* Itens da remessa */}
              <div style={{marginBottom:10}}>
                {(rem.remessa_itens||[]).length === 0 ? (
                  <div style={{fontSize:12,color:'var(--text-muted)',fontStyle:'italic'}}>Nenhum item adicionado ainda</div>
                ) : (
                  <table style={{width:'100%',borderCollapse:'collapse'}}>
                    <thead>
                      <tr>
                        <th style={{textAlign:'left',fontSize:10,color:'var(--text-muted)',padding:'4px 8px',fontWeight:600}}>VACINA</th>
                        <th style={{textAlign:'left',fontSize:10,color:'var(--text-muted)',padding:'4px 8px',fontWeight:600}}>LOTE</th>
                        <th style={{textAlign:'right',fontSize:10,color:'var(--text-muted)',padding:'4px 8px',fontWeight:600}}>DOSES</th>
                        <th style={{width:30}}></th>
                      </tr>
                    </thead>
                    <tbody>
                      {(rem.remessa_itens||[]).map(it => (
                        <tr key={it.id} style={{borderTop:'1px solid var(--border)'}}>
                          <td style={{padding:'5px 8px'}}>
                            <span style={{
                              fontSize:12, fontWeight:700, padding:'2px 8px', borderRadius:4,
                              background: (it.vacinas?.nome||'').toLowerCase().includes('tetrav') ? 'rgba(37,99,235,0.15)' :
                                          (it.vacinas?.nome||'').toLowerCase().includes('triv') ? 'rgba(16,185,129,0.15)' : 'var(--accent-subtle)',
                              color: (it.vacinas?.nome||'').toLowerCase().includes('tetrav') ? 'var(--accent)' :
                                     (it.vacinas?.nome||'').toLowerCase().includes('triv') ? 'var(--success)' : 'var(--text-primary)'
                            }}>{it.vacinas?.nome||'—'}</span>
                          </td>
                          <td style={{padding:'5px 8px',fontSize:12,fontFamily:'JetBrains Mono',color:'var(--text-muted)'}}>
                            {it.lote ? <span style={{color:'var(--accent)',fontWeight:600}}>{it.lote}</span> : (it.vacinas?.lote||<span style={{color:'var(--danger)',fontSize:11}}>⚠ sem lote</span>)}
                          </td>
                          <td style={{padding:'5px 8px',fontSize:14,fontFamily:'JetBrains Mono',fontWeight:700,textAlign:'right',color:'var(--success)'}}>{it.quantidade}</td>
                          <td style={{padding:'5px 4px'}}>
                            {!isPronta && <button style={{background:'none',border:'none',color:'var(--danger)',cursor:'pointer',fontSize:14,padding:2}} onClick={()=>removeItem(it.id)}>✕</button>}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
              </div>

              {/* Adicionar item */}
              {!isPronta && (
                <AddItemRemessa vacinas={vacinas} dosesSugeridas={dosesSugeridas} onAdd={(vid, qtd, lote) => addItem(rem.id, vid, qtd, lote)} />
              )}
            </div>
          );
        })}
      </div>

      {/* Modal etiqueta */}
      {etiquetaRem && (
        <EtiquetaModal remessa={etiquetaRem} rota={rotaSel} onClose={() => setEtiquetaRem(null)} totalParadas={remessas.length} remessasDaRota={remessas} />
      )}
      {infoTutor && <TutorInfoModal tutor={infoTutor} onClose={() => setInfoTutor(null)} />}
    </div>
  );
}

function AddItemRemessa({ vacinas, onAdd, dosesSugeridas }) {
  const [vacinaId, setVacinaId] = useState('');
  const [quantidade, setQuantidade] = useState(dosesSugeridas >= 0 ? String(dosesSugeridas) : '');
  const [lote, setLote] = useState('');

  // Atualiza sugestão quando muda (ex: troca de remessa)
  useEffect(() => {
    if (dosesSugeridas >= 0 && quantidade === '') setQuantidade(String(dosesSugeridas));
  }, [dosesSugeridas]);

  const add = () => {
    if (!vacinaId) return;
    if (quantidade === '') return;
    const qtd = parseInt(quantidade);
    // Lote obrigatório apenas quando doses > 0
    if (qtd > 0 && !lote.trim()) { alert('Informe o número do lote para continuar.'); return; }
    onAdd(vacinaId, qtd, qtd > 0 ? lote.trim() : '');
    setVacinaId(''); setQuantidade(dosesSugeridas >= 0 ? String(dosesSugeridas) : ''); setLote('');
  };

  return (
    <div style={{display:'flex',gap:8,alignItems:'flex-end',padding:'8px 0',borderTop:'1px solid var(--border)',flexWrap:'wrap'}}>
      <div className="form-group" style={{flex:2,minWidth:150,marginBottom:0}}>
        <label className="form-label">Vacina</label>
        <select className="form-select" style={{padding:'6px 8px',fontSize:12}} value={vacinaId} onChange={e=>setVacinaId(e.target.value)}>
          <option value="">Selecione...</option>
          {vacinas.map(v => <option key={v.id} value={v.id}>{v.nome}</option>)}
        </select>
      </div>
      <div className="form-group" style={{flex:1,minWidth:90,marginBottom:0}}>
        <label className="form-label">Lote <span style={{color:'var(--danger)'}}>*</span></label>
        <input className="form-input sm" value={lote} onChange={e=>setLote(e.target.value)}
          placeholder="Ex: N-15" style={{borderColor: !lote.trim() ? 'rgba(239,68,68,0.4)' : undefined}} />
      </div>
      <div className="form-group" style={{flex:1,minWidth:80,marginBottom:0}}>
        <label className="form-label">
          Doses {dosesSugeridas > 0 && <span style={{color:'var(--accent)',fontSize:10}}>(sug: {dosesSugeridas})</span>}
        </label>
        <input className="form-input sm" type="number" min="0" value={quantidade}
          onChange={e=>setQuantidade(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&add()}
          style={{borderColor: quantidade !== '' && parseInt(quantidade) !== dosesSugeridas && dosesSugeridas > 0 ? 'var(--warning)' : undefined}} />
        {quantidade === '0' && <div style={{fontSize:9,color:'var(--text-muted)',marginTop:2}}>Aplicador já tem estoque</div>}
      </div>
      <button className="btn btn-primary btn-sm" onClick={add} disabled={!vacinaId || quantidade==='' || (parseInt(quantidade||0)>0 && !lote.trim())}>+ Adicionar</button>
    </div>
  );
}

function EtiquetaModal({ remessa, rota, onClose, totalParadas, remessasDaRota }) {
  const [montadorNome, setMontadorNome] = useState('');
  const toast = useContext(ToastContext);

  useEffect(() => {
    sb.auth.getUser().then(({ data }) => {
      if (data?.user) {
        sb.from('profiles').select('nome').eq('id', data.user.id).single()
          .then(({ data: p }) => { if (p) setMontadorNome(p.nome); });
      }
    });
  }, []);

  const origemNome = rota.bases?.nome || '';
  let destNome = remessa.destino_tipo === 'base' ? remessa.bases?.nome : remessa.aplicadores?.nome;
  let destCidade = remessa.destino_tipo === 'base'
    ? (remessa.bases?.cidade || '') + (remessa.bases?.uf ? '/' + remessa.bases.uf : '')
    : (remessa.aplicadores?.cidade || '') + (remessa.aplicadores?.uf ? '/' + remessa.aplicadores.uf : '');
  let destCPF = remessa.destino_tipo === 'aplicador' ? remessa.aplicadores?.cpf : null;

  if (!destNome || destNome === origemNome) {
    const obs = remessa.observacao || '';
    const matchNome = obs.match(/^([^(|]+)/);
    const matchCPF = obs.match(/\(([^)]+)\)/);
    if (matchNome) destNome = matchNome[1].trim();
    if (matchCPF) destCPF = matchCPF[1].trim();
    destCidade = '';
  }

  const totalDoses = (remessa.remessa_itens || []).reduce((s, i) => s + i.quantidade, 0);
  const dosesExibir = totalDoses > 0 ? totalDoses : (() => {
    const m = (remessa.observacao || '').match(/(\d+)\s*doses/);
    return m ? parseInt(m[1]) : 0;
  })();

  const dataRota = rota.data_prevista ? new Date(rota.data_prevista + 'T12:00:00').toLocaleDateString('pt-BR') : '—';
  const dataHoje = new Date().toLocaleDateString('pt-BR');

  const destinoKey = (r) => {
    if (!r) return '';

    if (r.destino_tipo === 'base' && r.destino_base_id) return 'base:' + r.destino_base_id;
    const obs = String(r.observacao || '').trim().toLowerCase();
    const nome = obs.match(/^([^(|]+)/)?.[1]?.trim() || '';
    const cpf = obs.match(/\(([^)]+)\)/)?.[1]?.trim() || '';
    return 'obs:' + (cpf || nome || r.codigo_rastreio || r.id || '');
  };
  const todasCaixasDestino = (remessasDaRota || []).filter(r => destinoKey(r) === destinoKey(remessa));
  const caixasOrdenadas = (todasCaixasDestino.length ? todasCaixasDestino : [remessa]).slice().sort((a,b) => {
    const oa = Number(a.ordem_entrega || 0), ob = Number(b.ordem_entrega || 0);
    if (oa !== ob) return oa - ob;
    return String(a.codigo_rastreio || '').localeCompare(String(b.codigo_rastreio || ''));

  const totalCaixasDestino = Math.max(caixasOrdenadas.length, 1);
  const caixaNumero = Math.max(caixasOrdenadas.findIndex(r => r.id === remessa.id || r.codigo_rastreio === remessa.codigo_rastreio) + 1, 1);

      parada: remessa.ordem_entrega + '/' + totalParadas, caixa: caixaTexto,
      motorista: rota.profiles?.nome || '', data: dataRota, montador: montadorNome,
    });

      + '<div><div class="label">Motorista</div><div class="value-sm">' + (rota.profiles?.nome || '—') + '</div></div>'
      + '</div>'
      + '<div class="row"><div class="label">Destino / Aplicador</div>'
      + '<div class="value">' + (destNome || '—') + '</div>'
      + (destCidade ? '<div class="value-sm">' + destCidade + '</div>' : '')
      + (destCPF ? '<div class="value-sm" style="color:#555">CPF: ' + destCPF + '</div>' : '')

    const w = window.open('', '_blank', 'width=420,height=650');

  return (

// Página de etiquetas e recibos avulsos (busca por rastreio, aplicador e data de montagem)
function EtiquetasPage() {
  const hojeISO = new Date().toISOString().split('T')[0];
  const [filters, setFilters] = useState({ rastreio:'', aplicador:'', data_montagem:'' });
  const [resultados, setResultados] = useState([]);
  const [remessa, setRemessa] = useState(null);
  const [rota, setRota] = useState(null);
  const [totalParadas, setTotalParadas] = useState(0);
  const [remessasRota, setRemessasRota] = useState([]);
  const [loading, setLoading] = useState(false);
  const toast = useContext(ToastContext);

  const setFilter = (k, v) => setFilters(f => ({ ...f, [k]: v }));

  const montarQuery = () => {
    let q = sb.from('remessas')
      .select('*, remessa_itens(*, vacinas(nome, lote)), bases(nome, cidade, uf), aplicadores(nome, cpf, cidade, uf, endereco), rotas(id, codigo, data_prevista, veiculo, base_origem_id, bases!rotas_base_origem_id_fkey(nome), profiles!rotas_motorista_id_fkey(nome))')
      .order('created_at', { ascending: false })
      .limit(80);
    if (filters.rastreio.trim()) q = q.ilike('codigo_rastreio', `%${filters.rastreio.trim()}%`);
    if (filters.data_montagem) {
      q = q.gte('created_at', filters.data_montagem + 'T00:00:00').lt('created_at', filters.data_montagem + 'T23:59:59');

    return q;
  };

}

// MÓDULO MOTORISTA
// ═══════════════════════════════════════════════
function MotoristaPage() {
  const [userId, setUserId] = useState(null);
  const [userRole, setUserRole] = useState(null);
  const [rotas, setRotas] = useState([]);
  const [rotaSel, setRotaSel] = useState(null);
  const [statusFilter, setStatusFilter] = useState('');
  const [motoristas, setMotoristas] = useState([]);
  const [filtroMotorista, setFiltroMotorista] = useState('');
  const toast = useContext(ToastContext);

  const ST = { pronta:'Pronta p/ Saída', em_transito:'Em Trânsito', concluida:'Concluída', planejada:'Planejada', montagem:'Em Montagem' };
  const SB = { pronta:'badge-cyan', em_transito:'badge-green', concluida:'badge-gray', planejada:'badge-blue', montagem:'badge-yellow' };

  useEffect(() => {
    sb.auth.getUser().then(({ data }) => {
      if (!data?.user) return;
      const uid = data.user.id;
      setUserId(uid);
      sb.from('profiles').select('role').eq('id', uid).single().then(({ data: p }) => {
        const role = p?.role;
        setUserRole(role);
        loadRotas(uid, role);
        if (role === 'admin' || role === 'planejador') {
          sb.from('profiles').select('id, nome').in('role', ['motorista','admin']).eq('ativo', true).order('nome')
            .then(r => setMotoristas(r.data||[]));
        }
      });
    });
  }, []);

  const loadRotas = async (uid, role) => {
    let q = sb.from('rotas')
      .select('*, bases!rotas_base_origem_id_fkey(nome, cidade, uf), profiles!rotas_motorista_id_fkey(nome), veiculos(placa, modelo)')
      .order('data_prevista', { ascending: false });

    // Admin/planejador veem todas; motorista vê só as suas
    if (role !== 'admin' && role !== 'planejador') {
      q = q.eq('motorista_id', uid);
      q = q.in('status', ['pronta', 'em_transito', 'concluida']);
    }

    const { data, error } = await q;
    if (error) toast(error.message, 'error');
    setRotas(data || []);
  };

  const reload = () => loadRotas(userId, userRole);

  if (rotaSel) {
    return <MotoristaRota rota={rotaSel} onBack={() => { setRotaSel(null); reload(); }} isAdmin={userRole==='admin'||userRole==='planejador'} />;
  }

  // Filtros
  let filtered = [...rotas];
  if (statusFilter) filtered = filtered.filter(r => r.status === statusFilter);
  if (filtroMotorista) filtered = filtered.filter(r => r.motorista_id === filtroMotorista);

  const isAdmin = userRole === 'admin' || userRole === 'planejador';
  const ativas = filtered.filter(r => r.status !== 'concluida');
  const concluidas = filtered.filter(r => r.status === 'concluida');

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">{isAdmin ? 'Rotas de Entrega' : 'Minhas Rotas'}</div>
          <div className="page-subtitle">{isAdmin ? `${filtered.length} rotas encontradas` : 'Rotas atribuídas a você'}</div>
        </div>
      </div>

      {/* Filtros — só para admin/planejador */}
      {isAdmin && (
        <div className="card" style={{marginBottom:16,padding:14}}>
          <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
            <div className="form-group" style={{marginBottom:0}}>
              <label className="form-label">Status</label>
              <select className="form-select" style={{padding:'6px 8px',fontSize:12}} value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
                <option value="">Todos</option>
                {Object.entries(ST).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
              </select>
            </div>
            <div className="form-group" style={{marginBottom:0}}>
              <label className="form-label">Motorista</label>
              <select className="form-select" style={{padding:'6px 8px',fontSize:12}} value={filtroMotorista} onChange={e=>setFiltroMotorista(e.target.value)}>
                <option value="">Todos</option>
                {motoristas.map(m => <option key={m.id} value={m.id}>{m.nome}</option>)}
              </select>
            </div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap',marginLeft:'auto'}}>
              <span className="badge badge-blue" style={{fontSize:12,alignSelf:'center'}}>{filtered.filter(r=>r.status==='pronta').length} prontas</span>
              <span className="badge badge-green" style={{fontSize:12,alignSelf:'center'}}>{filtered.filter(r=>r.status==='em_transito').length} em trânsito</span>
              <span className="badge badge-gray" style={{fontSize:12,alignSelf:'center'}}>{filtered.filter(r=>r.status==='concluida').length} concluídas</span>
            </div>
          </div>
        </div>
      )}

      {filtered.length === 0 && (
        <div className="card"><div className="empty-state"><div className="empty-icon">🚚</div><div className="empty-text">Nenhuma rota encontrada</div></div></div>
      )}

      {ativas.length > 0 && (
        <>
          <div style={{fontSize:12,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:1,marginBottom:10}}>Ativas</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(300px,1fr))',gap:12,marginBottom:24}}>
            {ativas.map(r => (
              <div key={r.id} className="card" style={{cursor:'pointer',borderColor: r.status==='em_transito'?'rgba(16,185,129,0.4)':'var(--border)',transition:'border-color 0.15s'}}
                onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent)'}
                onMouseLeave={e=>e.currentTarget.style.borderColor=r.status==='em_transito'?'rgba(16,185,129,0.4)':'var(--border)'}
                onClick={() => setRotaSel(r)}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                  <div style={{fontSize:17,fontWeight:700,color:'var(--accent)',fontFamily:'JetBrains Mono'}}>{r.codigo}</div>
                  <span className={`badge ${SB[r.status]||'badge-gray'}`}>{ST[r.status]||r.status}</span>
                </div>
                <div style={{fontSize:13,color:'var(--text-secondary)',display:'flex',flexDirection:'column',gap:4}}>
                  <div>📅 {r.data_prevista ? new Date(r.data_prevista+'T12:00:00').toLocaleDateString('pt-BR') : '—'}</div>
                  <div>🏢 {r.bases?.nome}</div>
                  <div>👤 {r.profiles?.nome || '—'}</div>
                  <div>🚗 {r.veiculos ? r.veiculos.modelo+' · '+r.veiculos.placa : (r.veiculo||'—')}</div>
                </div>
                <button className="btn btn-primary" style={{width:'100%',marginTop:10,fontSize:12}}>
                  {r.status==='pronta' ? 'Ver / Iniciar →' : 'Ver Andamento →'}
                </button>
              </div>
            ))}
          </div>
        </>
      )}

      {concluidas.length > 0 && (
        <>
          <div style={{fontSize:12,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:1,marginBottom:10}}>Concluídas</div>
          <div className="card"><div className="table-wrap"><table><thead>
            <tr><th>Código</th><th>Data</th><th>Base</th><th>Motorista</th><th>Veículo</th><th></th></tr>
          </thead><tbody>
            {concluidas.map(r => (
              <tr key={r.id}>
                <td className="mono" style={{fontWeight:600,color:'var(--accent)'}}>{r.codigo}</td>
                <td>{r.data_prevista ? new Date(r.data_prevista+'T12:00:00').toLocaleDateString('pt-BR') : '—'}</td>
                <td>{r.bases?.nome}</td>
                <td>{r.profiles?.nome || '—'}</td>
                <td>{r.veiculos?.placa || r.veiculo || '—'}</td>
                <td><button className="btn btn-secondary btn-sm" onClick={() => setRotaSel(r)}>Ver</button></td>
              </tr>
            ))}
          </tbody></table></div></div>
        </>
      )}
    </div>
  );
}

// Fallback: transferência direta sem RPC (para quando constraint não existe)
async function transferirEstoqueDireto({ vacina_id, quantidade, origem_base_id, destino_aplicador_id, remessa_id, observacao }) {
  try {
    quantidade = Number(quantidade || 0);
    if (!vacina_id || !origem_base_id || !destino_aplicador_id || quantidade <= 0) {
      console.error('Dados inválidos para transferência', { vacina_id, quantidade, origem_base_id, destino_aplicador_id });
      return false;
    }

    // Transferência atômica no Supabase:
    // debita a base por PRODUTO consolidado, credita o aplicador e grava o extrato.
    // Se qualquer etapa falhar, nada é concluído parcialmente.
    const { data: { user } } = await sb.auth.getUser();
    const { error } = await sb.rpc('transferir_estoque_produto', {
      p_vacina_id: vacina_id,
      p_quantidade: quantidade,
      p_origem_base_id: origem_base_id,
      p_destino_aplicador_id: destino_aplicador_id,
      p_remessa_id: remessa_id,
      p_observacao: observacao,
      p_criado_por: user?.id || null
    });

    if (error) throw error;
    return true;
  } catch (err) {
    console.error('transferirEstoqueDireto error:', err);
    return false;
  }
}



// ── Modal de Detalhes da Entrega (assinatura, local, nome, cpf) ──
function EntregaDetalheModal({ remessa, rota, onClose }) {
  const obs = remessa.observacao || '';

  // Dados do aplicador/destino (sempre disponíveis no banco)
  const destNome = remessa.destino_tipo === 'aplicador' ? remessa.aplicadores?.nome : remessa.bases?.nome;
  const destCPF = remessa.destino_tipo === 'aplicador' ? remessa.aplicadores?.cpf : '';
  const destCidade = remessa.destino_tipo === 'base'
    ? (remessa.bases?.cidade||'')+'/'+(remessa.bases?.uf||'')
    : (remessa.aplicadores?.cidade||'')+'/'+(remessa.aplicadores?.uf||'');
  const destEnd = remessa.destino_tipo === 'aplicador' ? remessa.aplicadores?.endereco : '';
  const doses = (remessa.remessa_itens||[]).reduce((s,i)=>s+i.quantidade,0);

  // Extrair assinatura usando indexOf (mais robusto que regex para base64 longo)
  let temAssinatura = false;
  let horaAssinatura = null;
  let nomeAssinatura = '';
  let cpfAssinatura = '';
  let sigImg = null;
  let entregaLat = null;
  let entregaLng = null;

  const sigStart = obs.indexOf('[ASSINATURA ');
  if (sigStart >= 0) {
    temAssinatura = true;
    // Extrair hora: [ASSINATURA HH:MM:SS]
    const sigBracketEnd = obs.indexOf(']', sigStart);
    if (sigBracketEnd > sigStart) {
      horaAssinatura = obs.substring(sigStart + 12, sigBracketEnd);
    }
    // Extrair nome e CPF: "Recebido por: NOME (CPF: XXX)"
    const recebidoIdx = obs.indexOf('Recebido por: ', sigStart);
    if (recebidoIdx > 0) {
      const afterRecebido = obs.substring(recebidoIdx + 14);
      // Encontrar onde termina o nome: antes de "(CPF:" ou antes de "[SIG_IMG"
      const cpfIdx = afterRecebido.indexOf('(CPF: ');
      const sigImgIdx = afterRecebido.indexOf(' [SIG_IMG:');
      const endOfLine = afterRecebido.indexOf('\n');
      
      if (cpfIdx >= 0 && (cpfIdx < sigImgIdx || sigImgIdx < 0)) {
        nomeAssinatura = afterRecebido.substring(0, cpfIdx).trim();
        const cpfEnd = afterRecebido.indexOf(')', cpfIdx);
        if (cpfEnd > cpfIdx) {
          cpfAssinatura = afterRecebido.substring(cpfIdx + 6, cpfEnd).trim();
        }
      } else if (sigImgIdx >= 0) {
        nomeAssinatura = afterRecebido.substring(0, sigImgIdx).trim();
      } else if (endOfLine >= 0) {
        nomeAssinatura = afterRecebido.substring(0, endOfLine).trim();
      } else {
        nomeAssinatura = afterRecebido.trim();
      }
    }
    // Extrair imagem da assinatura: [SIG_IMG:data:...:END_SIG]
    const imgStart = obs.indexOf('[SIG_IMG:');
    const imgEnd = obs.indexOf(':END_SIG]');
    if (imgStart >= 0 && imgEnd > imgStart) {
      sigImg = obs.substring(imgStart + 9, imgEnd);
    }
  }

  // Extrair localização da entrega
  const localStart = obs.indexOf('[ENTREGA_LOCAL:');
  const localEnd = obs.indexOf(':END_LOCAL]');
  if (localStart >= 0 && localEnd > localStart) {
    const coords = obs.substring(localStart + 15, localEnd).split(',');
    if (coords.length === 2) {
      entregaLat = coords[0];
      entregaLng = coords[1];
    }
  }

  // Fallback: extrair nome/CPF da observação se não veio da assinatura
  let nomeFromObs = '';
  let cpfFromObs = '';
  const mNome = obs.match(/^([^(|]+)/);
  const mCPF = obs.match(/\(([^)]+)\)/);
  if (mNome) nomeFromObs = mNome[1].trim();
  if (mCPF) cpfFromObs = mCPF[1].trim();

  // Usar dados em ordem de prioridade: assinatura > banco > observação
  const nomeRecebedor = nomeAssinatura || destNome || nomeFromObs || '—';
  const cpfRecebedor = cpfAssinatura || destCPF || cpfFromObs || '';

  return (
    <Modal title="Detalhes da Entrega" onClose={onClose} large>
      <div style={{display:'flex',flexDirection:'column',gap:16}}>
        {/* Remessa info */}
        <div style={{padding:12,background:'var(--bg-input)',borderRadius:'var(--radius-sm)',border:'1px solid var(--border)'}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,fontSize:13}}>
            <div><span style={{color:'var(--text-muted)'}}>Remessa:</span> <strong style={{fontFamily:'JetBrains Mono',color:'var(--accent)'}}>{remessa.codigo_rastreio}</strong></div>
            <div><span style={{color:'var(--text-muted)'}}>Rota:</span> <strong>{rota.codigo}</strong></div>
            <div><span style={{color:'var(--text-muted)'}}>Aplicador:</span> <strong>{destNome||'—'}</strong></div>
            <div><span style={{color:'var(--text-muted)'}}>Doses:</span> <strong style={{color:'var(--success)'}}>{doses}</strong></div>
            <div style={{gridColumn:'1/-1'}}><span style={{color:'var(--text-muted)'}}>Local:</span> {destCidade}</div>
          </div>
        </div>

        {/* Dados do recebedor */}
        <div style={{padding:14,background:'var(--success-bg)',border:'1px solid rgba(16,185,129,0.3)',borderRadius:'var(--radius-sm)'}}>
          <div style={{fontSize:12,fontWeight:700,color:'var(--success)',marginBottom:10,textTransform:'uppercase',letterSpacing:1}}>✓ Entrega Confirmada</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,fontSize:13}}>
            <div><span style={{color:'var(--text-muted)'}}>Recebido por:</span> <strong>{nomeRecebedor}</strong></div>
            <div><span style={{color:'var(--text-muted)'}}>CPF:</span> <strong>{cpfRecebedor || '—'}</strong></div>
            {horaAssinatura && <div><span style={{color:'var(--text-muted)'}}>Hora assinatura:</span> <strong>{horaAssinatura}</strong></div>}
            {destEnd && <div style={{gridColumn:'1/-1'}}><span style={{color:'var(--text-muted)'}}>Endereço:</span> {destEnd}</div>}
            {entregaLat && (
              <div>
                <span style={{color:'var(--text-muted)'}}>Local GPS:</span>{' '}
                <button className="btn btn-secondary btn-sm" style={{fontSize:10,padding:'2px 8px'}}
                  onClick={() => window.open('https://www.google.com/maps?q='+entregaLat+','+entregaLng, '_blank')}>
                  📍 Ver no Mapa
                </button>
              </div>
            )}
          </div>
        </div>

        {/* Assinatura */}
        {sigImg && (
          <div>
            <div style={{fontSize:12,fontWeight:600,color:'var(--text-secondary)',marginBottom:6}}>Assinatura do Responsável</div>
            <div style={{background:'#fff',border:'2px solid var(--border)',borderRadius:'var(--radius)',padding:8,textAlign:'center'}}>
              <img src={sigImg} alt="Assinatura" style={{maxWidth:'100%',height:120,objectFit:'contain'}} />
            </div>
          </div>
        )}
        {!sigImg && !temAssinatura && (
          <div style={{padding:12,background:'var(--warning-bg)',borderRadius:'var(--radius-sm)',fontSize:12,color:'var(--warning)'}}>
            ⚠ Assinatura digital não disponível para esta entrega (anterior à funcionalidade). Entregas futuras incluirão assinatura automaticamente.
          </div>
        )}
        {!sigImg && temAssinatura && (
          <div style={{padding:12,background:'var(--info-bg)',borderRadius:'var(--radius-sm)',fontSize:12,color:'var(--info)'}}>
            ℹ Assinatura registrada em texto. A imagem não foi salva nesta entrega.
          </div>
        )}

        {/* Vacinas entregues */}
        {(remessa.remessa_itens||[]).length > 0 && (
          <div>
            <div style={{fontSize:12,fontWeight:600,color:'var(--text-secondary)',marginBottom:6}}>Itens Entregues</div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              {(remessa.remessa_itens||[]).map((it,i) => (
                <span key={i} style={{fontSize:12,padding:'4px 10px',borderRadius:6,fontWeight:600,
                  background:'var(--accent-subtle)',color:'var(--accent)',border:'1px solid rgba(37,99,235,0.2)'}}>
                  💉 {it.vacinas?.nome}: <strong>{it.quantidade}</strong> doses
                </span>
              ))}
            </div>
          </div>

        {/* Localização da entrega no mapa */}
        {entregaLat && (

            <div style={{fontSize:12,fontWeight:600,color:'var(--text-secondary)',marginBottom:6}}>Localização da Entrega</div>
            <div style={{borderRadius:'var(--radius)',overflow:'hidden',border:'1px solid var(--border)',height:200}}>
              <iframe
                title="Mapa da entrega"
                width="100%" height="200" frameBorder="0" style={{border:0}}
                src={'https://www.google.com/maps/embed/v1/place?key=AIzaSyBFw0Qbyq9zTFTd-tUY6dZWTgaQzuU17R8&q='+entregaLat+','+entregaLng+'&zoom=15'}
                allowFullScreen
                onError={(e) => { e.target.style.display='none'; }}
              />
            </div>
            <div style={{fontSize:10,color:'var(--text-muted)',marginTop:4}}>Coordenadas: {entregaLat}, {entregaLng}</div>
          </div>
